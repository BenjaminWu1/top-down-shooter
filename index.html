// ============================================================
// PARTICLES
// ============================================================
function emit(x,y,count,color,sMin=20,sMax=80,life=0.5){
  for(let i=0;i<count;i++){
    if(particles.length > 300) break;
    const a = Math.random()*Math.PI*2;
    const s = rand(sMin, sMax);
    particles.push({
      x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      life: rand(life*0.5, life), maxLife: life,
      color, size: 1 + Math.floor(Math.random()*2)
    });
  }
}

// Combined player move-speed multiplier: SPEED powerup (1.5x) and the X-skill
// sprint buff (1.3x) stack multiplicatively. Used by player movement and by the
// allies that pace themselves to the player.
function playerSpeedMult(){
  let m = 1;
  if(player.speedTime  > 0) m *= 1.5;
  if(player.sprintTime > 0) m *= 1.3;
  return m;
}

// Dispatch a skill by name. Returns true if the skill actually fired
// (so the caller can charge cooldown only on successful use).
function triggerSkill(name, dx, dy, mag){
  if(name === 'sprint'){
    // X skill: +30% move speed for 5s. Re-casting refreshes the timer.
    player.sprintTime = Math.max(player.sprintTime, 5);
    emit(player.x, player.y, 18, '#1abc9c', 40, 130, 0.4);
    emit(player.x, player.y, 8, '#fff', 25, 90, 0.3);
    sfx.teleport();
    return true;
  }
  if(name === 'heal'){
    // F skill: restore 1 HP (capped at maxHp). Only fires — and only charges its
    // cooldown — when there's actually damage to heal.
    if(player.hp >= player.maxHp) return false;
    player.hp = Math.min(player.maxHp, player.hp + 1);
    emit(player.x, player.y, 18, '#2ecc71', 35, 110, 0.5);
    emit(player.x, player.y, 8, '#fff', 25, 90, 0.35);
    sfx.shieldHit();
    return true;
  }
  if(name === 'blast'){
    // B skill: a CIRCLE damage burst centered on the player. Every enemy inside
    // the radius instantly takes normal damage. explode() applies the damage +
    // fire particles + sfx; we add an expanding ring so the circular area of
    // effect is clearly visible.
    const R = 70;
    const bd = 3 * (player.damageMult || 1) * (player.damageTime > 0 ? 2 : 1);
    explode(player.x, player.y, R, bd);
    // Expanding shockwave ring (visual only): grows from the player out to R.
    if(particles.length < 300) particles.push({
      x: player.x, y: player.y, vx: 0, vy: 0,
      life: 0.4, maxLife: 0.4, color: '#7fe9ff',
      ring: true, r0: 8, r1: R
    });
    return true;
  }
  if(name === 'dash'){
    let ax = dx, ay = dy;
    if(mag === 0){ ax = Math.cos(player.angle); ay = Math.sin(player.angle); }
    player.x = clamp(player.x + ax * 60, 8, worldW - 8);
    player.y = clamp(player.y + ay * 60, 8, worldH - 10);
    player.invuln = Math.max(player.invuln, 0.35);
    emit(player.x, player.y, 14, '#f1c40f', 60, 180, 0.35);
    emit(player.x - ax*20, player.y - ay*20, 10, '#fff', 30, 100, 0.3);
    sfx.teleport();
    return true;
  }
  if(name === 'blink'){
    // Teleport directly to the cursor (clamped). Scout's signature.
    // Mouse is in screen space; add camera offset to translate to world coords.
    const tx = clamp(mouse.x + camX, 8, worldW - 8);
    const ty = clamp(mouse.y + camY, 8, worldH - 10);
    emit(player.x, player.y, 12, '#f1c40f', 40, 140, 0.35);
    player.x = tx; player.y = ty;
    player.invuln = Math.max(player.invuln, 0.45);
    emit(player.x, player.y, 18, '#fff', 50, 160, 0.4);
    sfx.teleport();
    return true;
  }
  if(name === 'slowmo'){
    slowMoTime = Math.max(slowMoTime, 3);
    emit(player.x, player.y, 20, '#3498db', 30, 90, 0.5);
    sfx.laser();
    return true;
  }
  if(name === 'wall'){
    // Tank's signature: 4 seconds of full invulnerability.
    player.invuln = Math.max(player.invuln, 4);
    emit(player.x, player.y, 28, '#27ae60', 40, 130, 0.6);
    sfx.shieldHit();
    return true;
  }
  if(name === 'nuke'){
    // Snapshot the enemy list first. killEnemy mutates `entities` (pickup drops,
    // splitter cascade), and iterating the live array re-visits newly-spawned
    // splits and freezes the game for a beat while everything dies at once.
    // Each step also wrapped defensively so a single malformed entity can't
    // strand the entire skill — the Tank's M was reportedly hanging the canvas.
    const targets = [];
    for(let i = 0; i < entities.length; i++){
      const e = entities[i];
      if(e && e.type === 'enemy' && !e.dead) targets.push(e);
    }
    for(const en of targets){
      if(!en || en.dead) continue;
      try {
        en.hp = (typeof en.hp === 'number' ? en.hp : 1) - (en.isBoss ? 12 : 999);
        en.hitFlash = 0.12;
        if(en.hp <= 0) killEnemy(en);
      } catch(err){
        console.error('[shooter] nuke kill error on', en && en.kind, err);
        if(en) en.dead = true;
      }
    }
    for(let i = 0; i < 10; i++){
      emit(rand(0, worldW), rand(0, worldH), 3, '#fff', 40, 160, 0.35);
      emit(rand(0, worldW), rand(0, worldH), 3, '#f39c12', 40, 160, 0.35);
    }
    shakeTime = 0.2; shakeAmt = 3;
    try { sfx.explode(); } catch(err){ /* audio nodes are best-effort */ }
    return true;
  }
  if(name === 'flameburst'){
    // Arm a 3-second ring of fire centered on the player. The per-frame damage
    // and flame particles are emitted in updatePlaying via tickFlameburst().
    player.flameburstTime = Math.max(player.flameburstTime, 3);
    sfx.explode();
    return true;
  }
  if(name === 'summon'){
    // Banish any previous sword ally so only one is active at a time.
    for(const e of entities){
      if(e.type === 'sword_ally' && !e.dead){ e.dead = true; }
    }
    const sa = createSwordAlly(player.x, player.y);
    entities.push(sa);
    emit(sa.x, sa.y, 24, '#f1c40f', 50, 160, 0.55);
    emit(sa.x, sa.y, 12, '#fff', 30, 110, 0.4);
    sfx.teleport();
    return true;
  }
  if(name === 'vsummon'){
    // Tank's V skill: release a sword-knight that swings ~1.5x faster than the
    // X-summoned one (attackRate 0.55s -> ~0.37s). Same one-alive-at-a-time rule
    // as 'summon', so re-casting either X or V replaces the current knight.
    for(const e of entities){
      if(e.type === 'sword_ally' && !e.dead){ e.dead = true; }
    }
    const sa = createSwordAlly(player.x, player.y);
    sa.attackRate /= 1.5;
    entities.push(sa);
    emit(sa.x, sa.y, 26, '#f39c12', 55, 180, 0.6);
    emit(sa.x, sa.y, 12, '#fff', 30, 110, 0.4);
    sfx.teleport();
    return true;
  }
  if(name === 'grenade'){
    // Soldier's signature: lobbed projectile that explodes after a short fuse
    // (or instantly on direct enemy contact).
    const gd = 4 * (player.damageMult || 1);
    entities.push({
      type:'bullet', owner:'player', x:player.x, y:player.y,
      vx:Math.cos(player.angle) * 180, vy:Math.sin(player.angle) * 180,
      angle:player.angle, radius:3,
      sprite:SPR.bullet_rocket,
      dmg:gd, life:0.5, isGrenade:true,
      explosive:true, explodeRadius:34, explodeDmg:gd
    });
    emit(player.x, player.y, 8, '#e67e22', 30, 90, 0.25);
    sfx.rocket();
    return true;
  }
  if(name === 'barrage'){
    // Soldier's V: lob a fan of 5 grenade-style shells with staggered fuses, so
    // the blasts walk across an arc instead of stacking into one giant nuke.
    // Reuses the exact bullet shape from the 'grenade' handler (isGrenade +
    // explosive -> detonates on contact OR at end of fuse).
    const gd = 3 * (player.damageMult || 1);
    for(let i = 0; i < 5; i++){
      const a = player.angle + (i - 2) * 0.16;   // ~9° between shells, ~37° fan
      entities.push({
        type:'bullet', owner:'player', x:player.x, y:player.y,
        vx:Math.cos(a) * 170, vy:Math.sin(a) * 170,
        angle:a, radius:3, sprite:SPR.bullet_rocket,
        dmg:gd, life:rand(0.45, 0.75), isGrenade:true,
        explosive:true, explodeRadius:30, explodeDmg:gd, dead:false
      });
    }
    emit(player.x, player.y, 14, '#e67e22', 40, 130, 0.35);
    shakeTime = 0.18; shakeAmt = 3;
    sfx.rocket();
    return true;
  }
  return false;
}

function explode(x, y, radius, dmg){
  emit(x, y, 22, '#f39c12', 60, 180, 0.6);
  emit(x, y, 12, '#fff', 40, 150, 0.4);
  shakeTime = 0.25; shakeAmt = 5;
  sfx.explode();
  // Snapshot the enemy list — killEnemy can push splitter children into entities,
  // and we don't want this single blast to keep visiting them and cascading.
  const targets = entities.filter(e => e.type === 'enemy' && !e.dead);
  for(const en of targets){
    if(en.dead) continue;
    if(dist2({x,y}, en) < radius*radius){
      en.hp -= dmg;
      en.hitFlash = 0.08;
      if(en.hp <= 0) killEnemy(en);
    }
  }
}

// ============================================================
// SPAWNING & LEVEL FLOW
// ============================================================
function spawnEnemyAtEdge(kind){
  const edge = Math.floor(Math.random()*4);
  const m = 14;
  let x, y;
  if(edge===0){ x = rand(m, worldW-m); y = -m; }
  else if(edge===1){ x = worldW+m; y = rand(m, worldH-m); }
  else if(edge===2){ x = rand(m, worldW-m); y = worldH+m; }
  else { x = -m; y = rand(m, worldH-m); }
  if(kind === 'swarmer'){
    // Swarmers spawn in a cluster of 3 near each other.
    for(let i = 0; i < 3; i++){
      entities.push(createEnemy(kind, x + rand(-8, 8), y + rand(-8, 8)));
    }
  } else {
    entities.push(createEnemy(kind, x, y));
  }
}

function spawnBoss(kind){
  // Spawn the boss centered above the player so they don't have to chase across the larger arena.
  const sx = player ? clamp(player.x, 40, worldW - 40) : worldW / 2;
  const b = createEnemy(kind, sx, -25);
  // Bosses scale per level so the same AI reused at higher levels actually
  // feels harder. HP +7%/level, speed +1.5%/level. At L1 (bruiser) this is a
  // no-op; at L30 (ANNIHILATOR) the nemesis ends up with ~515 HP / ~34 speed
  // (base 170/24), and at L40 (APOCALYPSE) the phantom hits ~448 HP / ~48 speed
  // (base 120/30).
  const hpScale = 1 + levelIdx * 0.07;
  const spdScale = 1 + levelIdx * 0.015;
  b.hp = Math.ceil(b.hp * hpScale);
  b.maxHp = b.hp;
  b.speed = b.speed * spdScale;
  entities.push(b);
  bossSpawnPulse = 1;
  sfx.bossSpawn();
  shakeTime = 0.4; shakeAmt = 5;
}

function startLevel(idx){
  levelIdx = idx;
  levelData = LEVELS[idx];
  spawnTimer = 0.6;
  spawnedCount = 0;
  bossSpawned = false;
  paused = false;
  // World sizing: L1-L13 use the 1x viewport; L14-L24 use a 2x world; L25-L40
  // use a 3x world. View stays at W*H either way — a camera follows the player.
  let worldScale = 1;
  if(idx >= 24) worldScale = 3;
  else if(idx >= 13) worldScale = 2;
  worldW = W * worldScale;
  worldH = H * worldScale;
  camX = 0; camY = 0;
  entities = entities.filter(e => e.type === 'player');
  particles = [];
  if(!player){ player = createPlayer(selectedChar); entities.push(player); }
  else { player.x = worldW/2; player.y = worldH/2; player.invuln = 1.2; }
  // Refresh the chosen assistants each level: keep survivors (full HP), recreate
  // any that died, reposition all beside the player.
  refreshAssistants();
  // Snap camera to centered-on-player so the first frame doesn't lerp from (0,0).
  camX = clamp(player.x - W/2, 0, Math.max(0, worldW - W));
  camY = clamp(player.y - H/2, 0, Math.max(0, worldH - H));
  state = STATE.PLAYING;
  stateTime = 0;
}
// Camera follows the player, clamped so the view never shows past world edges.
// On non-scrolling levels (worldW===W) this collapses to camX=camY=0 — a no-op.
function updateCamera(dt){
  const maxX = Math.max(0, worldW - W);
  const maxY = Math.max(0, worldH - H);
  const targetX = clamp(player.x - W/2, 0, maxX);
  const targetY = clamp(player.y - H/2, 0, maxY);
  // Smooth lerp toward the target so the camera doesn't jitter on every input change.
  const k = Math.min(1, dt * 8);
  camX += (targetX - camX) * k;
  camY += (targetY - camY) * k;
  if(maxX === 0) camX = 0;
  if(maxY === 0) camY = 0;
}

function startGame(){
  initAudio();
  paused = false;
  score = 0;
  player = createPlayer();
  entities = [player];
  allies = [];
  spawnSelectedAssistants();
  particles = [];
  startLevel(0);
}

// Rebuild `allies` from the chosen loadout at the start of each level: reuse any
// that survived the previous level (refilled to full HP), recreate the dead ones,
// and reposition every one beside the player.
function refreshAssistants(){
  const aliveByKey = {};
  for(const a of allies){ if(a && !a.dead) aliveByKey[a.assistKey] = a; }
  allies = [];
  selectedAssistants.forEach((key, idx) => {
    let a = aliveByKey[key];
    if(a){ a.hp = a.maxHp; a.invuln = 1.2; }
    else { a = createAssistant(key); }
    positionAllyByPlayer(a, idx);
    allies.push(a);
    entities.push(a);
  });
}

// ============================================================
// UPDATE
// ============================================================
function update(dt){
  stateTime += dt;
  if(bossSpawnPulse > 0) bossSpawnPulse -= dt;
  if(state === STATE.MENU || state === STATE.HOWTO) handleMenu();
  else if(state === STATE.CHARACTER_SELECT) handleCharacterSelect();
  else if(state === STATE.ASSISTANT_SELECT) handleAssistantSelect();
  else if(state === STATE.LEVEL_COMPLETE) handleLevelComplete();
  else if(state === STATE.GAME_OVER || state === STATE.VICTORY) handleEndScreen();
  else if(state === STATE.PLAYING){ if(!paused) updatePlaying(dt); }
  mouse.clicked = false;
}

function updatePlaying(dt){
  // ---- Decay global & powerup timers ----
  if(slowMoTime > 0) slowMoTime -= dt;
  if(player.speedTime > 0)  player.speedTime  -= dt;
  if(player.sprintTime > 0) player.sprintTime -= dt;
  if(player.damageTime > 0) player.damageTime -= dt;
  if(player.magnetTime > 0) player.magnetTime -= dt;
  if(player.scoreTime > 0)  player.scoreTime  -= dt;

  // ---- Player movement (SPEED powerup + X-skill sprint boost it) ----
  let dx=0, dy=0;
  if(keys['ArrowLeft']||keys['KeyA']) dx -= 1;
  if(keys['ArrowRight']||keys['KeyD']) dx += 1;
  if(keys['ArrowUp']||keys['KeyW']) dy -= 1;
  if(keys['ArrowDown']||keys['KeyS']) dy += 1;
  const mag = Math.hypot(dx, dy);
  if(mag > 0){ dx /= mag; dy /= mag; }
  const speedMult = playerSpeedMult();
  player.x += dx * player.speed * speedMult * dt;
  player.y += dy * player.speed * speedMult * dt;
  player.x = clamp(player.x, 8, worldW-8);
  player.y = clamp(player.y, 8, worldH-10);

  if(mag > 0){
    player.frameT += dt;
    if(player.frameT > 0.12){ player.frameT = 0; player.frame = (player.frame + 1) % 2; }
  } else { player.frame = 0; }

  updateCamera(dt);
  // Aim from the cursor's WORLD position (mouse is in screen coords).
  player.angle = Math.atan2((mouse.y + camY) - player.y, (mouse.x + camX) - player.x);

  // ---- Special skills: X (sprint) / C (class) / F (heal) / B (blast) / V (class) ----
  if(player.skillCd.x > 0) player.skillCd.x -= dt;
  if(player.skillCd.c > 0) player.skillCd.c -= dt;
  if(player.skillCd.v > 0) player.skillCd.v -= dt;
  if(player.skillCd.f > 0) player.skillCd.f -= dt;
  if(player.skillCd.b > 0) player.skillCd.b -= dt;
  if(player.flameburstTime > 0){
    player.flameburstTime -= dt;
    tickFlameburst(dt);
  }
  const charSkills = CHARACTERS[player.char].skills;
  if(keys['KeyX'] && player.skillCd.x <= 0){
    if(triggerSkill(charSkills.x, dx, dy, mag)) player.skillCd.x = player.skillCdMax[charSkills.x];
  }
  if(keys['KeyC'] && player.skillCd.c <= 0){
    if(triggerSkill(charSkills.c, dx, dy, mag)) player.skillCd.c = player.skillCdMax[charSkills.c];
  }
  if(keys['KeyF'] && player.skillCd.f <= 0 && charSkills.f){
    if(triggerSkill(charSkills.f, dx, dy, mag)) player.skillCd.f = player.skillCdMax[charSkills.f];
  }
  if(keys['KeyB'] && player.skillCd.b <= 0 && charSkills.b){
    if(triggerSkill(charSkills.b, dx, dy, mag)) player.skillCd.b = player.skillCdMax[charSkills.b];
  }
  if(keys['KeyV'] && player.skillCd.v <= 0 && charSkills.v){
    if(triggerSkill(charSkills.v, dx, dy, mag)) player.skillCd.v = player.skillCdMax[charSkills.v];
  }

  // ---- Shooting / Weapon dispatch ----
  player.fireCooldown -= dt;
  if(player.spreadTime > 0) player.spreadTime -= dt;
  if(player.rapidTime > 0) player.rapidTime -= dt;
  if(player.laserTime > 0) player.laserTime -= dt;
  if(player.minigunTime > 0) player.minigunTime -= dt;
  if(player.plasmaTime > 0) player.plasmaTime -= dt;
  if(player.homingTime > 0) player.homingTime -= dt;
  if(player.laserCd > 0) player.laserCd -= dt;

  if(mouse.down && player.fireCooldown <= 0){
    const mx = player.x + Math.cos(player.angle) * 9;
    const my = player.y + Math.sin(player.angle) * 9;
    fireWeapon(mx, my);
  }

  // Class RMB resources slowly self-regen (capped at max) so none is fully
  // dependent on pickups: Syed's katana energy regens 0.2/s (2x the others),
  // Benjamin Wu's flamethrower fuel and Xu Yihui's laser power both regen 0.1/s.
  if(player.maxEnergy > 0) player.energy = Math.min(player.maxEnergy, player.energy + 0.2 * dt);
  if(player.maxFuel   > 0) player.fuel   = Math.min(player.maxFuel,   player.fuel   + 0.1 * dt);
  if(player.maxPower  > 0) player.power  = Math.min(player.maxPower,  player.power  + 0.1 * dt);

  // ---- Tank's second normal attack: flamethrower (right mouse) ----
  if(player.char === 'tank' && mouse.rdown && player.fuel > 0){
    player.fuel = Math.max(0, player.fuel - dt);
    fireFlamethrower(dt);
  }
  // ---- Syed's secondary: continuous katana slash (right mouse) ----
  // Very-high-DPS melee swept over a wide obtuse arc; drains `energy` while held.
  // Slowly self-regens (above) + refilled by the 'beverage' pickup (+1 s each).
  if(player.char === 'soldier' && mouse.rdown && player.energy > 0){
    player.energy = Math.max(0, player.energy - dt);
    fireKatana(dt);
  }
  // ---- Scout's secondary: THREE straight-line laser BEAMS (right mouse) ----
  // Instant hitscan beams (NOT travelling projectiles): on each release the mech
  // fires three straight laser beams fanned around the aim. Every enemy lying on a
  // beam's line takes its full damage SIMULTANEOUSLY the instant the beam fires
  // (see fireLaserBeams). Gated behind laserCd (cadence) AND `power` — a ~20-volley
  // pool that costs 1 per volley, self-regens 0.1/s, and is refilled by 'battery'.
  if(player.char === 'scout' && mouse.rdown && player.laserCd <= 0 && player.power >= 1){
    fireLaserBeams();
    player.power = Math.max(0, player.power - 1);
    player.laserCd = 0.22;
  }

  if(player.invuln > 0) player.invuln -= dt;
  if(player.hitFlash > 0) player.hitFlash -= dt;

  // ---- Enemy spawning ----
  if(spawnedCount < levelData.total){
    spawnTimer -= dt;
    if(spawnTimer <= 0){
      spawnEnemyAtEdge(pickWeighted(levelData.mix));
      spawnedCount++;
      spawnTimer = levelData.rate * rand(0.7, 1.3);
    }
  }
  // Spawn boss after all regular enemies have spawned and most are dead
  if(!bossSpawned && spawnedCount >= levelData.total){
    const aliveRegular = entities.filter(e => e.type === 'enemy' && !e.isBoss).length;
    if(aliveRegular <= Math.max(2, Math.floor(levelData.total * 0.2))){
      bossSpawned = true;
      spawnBoss(levelData.boss);
    }
  }

  // ---- Update entities (Slow-Mo powerup scales enemy & enemy-bullet dt) ----
  const enemyDt = dt * (slowMoTime > 0 ? 0.4 : 1);
  for(const e of entities){
    if(e.dead) continue;
    if(e.type === 'enemy') updateEnemy(e, enemyDt);
    else if(e.type === 'bullet'){
      const bdt = (e.owner === 'enemy') ? enemyDt : dt;
      updateBullet(e, bdt);
    }
    else if(e.type === 'pickup') updatePickup(e, dt);
    else if(e.type === 'companion') updateCompanion(e, dt);
    else if(e.type === 'henchman' || e.type === 'nunchaku') updateMeleeAlly(e, dt);
    else if(e.type === 'bomber_ally') updateBomberAlly(e, dt);
    else if(e.type === 'poison_ally') updatePoisonAlly(e, dt);
    else if(e.type === 'sword_ally') updateSwordAlly(e, dt);
    if(e.hitFlash > 0) e.hitFlash -= dt;
  }

  // ---- Collisions ----
  for(const b of entities){
    if(b.type !== 'bullet' || b.dead) continue;
    if(b.owner === 'player'){
      for(const en of entities){
        if(en.type !== 'enemy' || en.dead) continue;
        if(b.hitSet && b.hitSet.has(en)) continue;
        const dr = b.radius + en.radius;
        if(dist2(b, en) < dr*dr){
          en.hp -= b.dmg;
          en.hitFlash = 0.07;
          emit(b.x, b.y, 4, '#fff', 30, 90, 0.25);
          if(b.explosive){
            explode(b.x, b.y, b.explodeRadius, b.dmg);
            b.dead = true;
          } else if(b.pierce){
            b.hitSet.add(en);
            sfx.hit();
          } else {
            b.dead = true;
            sfx.hit();
          }
          if(en.hp <= 0) killEnemy(en);
          if(!b.pierce) break;
        }
      }
    } else {
      // Enemy bullet — can hit the player or any chosen ally.
      if(player.invuln <= 0){
        const dr = b.radius + player.radius;
        if(dist2(b, player) < dr*dr){ b.dead = true; damagePlayer(1); continue; }
      }
      for(const a of entities){
        if(!isAlly(a) || a.dead || a.invuln > 0) continue;
        const dr = b.radius + a.radius;
        if(dist2(b, a) < dr*dr){ b.dead = true; damageAlly(a, 1); break; }
      }
    }
  }
  if(player.invuln <= 0){
    for(const en of entities){
      if(en.type !== 'enemy' || en.dead) continue;
      const dr = player.radius + en.radius;
      if(dist2(en, player) < dr*dr){
        damagePlayer(en.isBoss ? 2 : 1);
        const a = Math.atan2(en.y - player.y, en.x - player.x);
        en.x += Math.cos(a) * 12;
        en.y += Math.sin(a) * 12;
        break;
      }
    }
  }
  // Enemy bodies touching any chosen ally.
  for(const a of entities){
    if(!isAlly(a) || a.dead || a.invuln > 0) continue;
    for(const en of entities){
      if(en.type !== 'enemy' || en.dead) continue;
      const dr = a.radius + en.radius;
      if(dist2(en, a) < dr*dr){
        damageAlly(a, en.isBoss ? 2 : 1);
        const ang = Math.atan2(en.y - a.y, en.x - a.x);
        en.x += Math.cos(ang) * 8;
        en.y += Math.sin(ang) * 8;
        break;
      }
    }
  }
  // Pickups
  for(const p of entities){
    if(p.type !== 'pickup' || p.dead) continue;
    const dr = p.radius + player.radius;
    if(dist2(p, player) < dr*dr){
      applyPickup(p.kind);
      p.dead = true;
      sfx.pickup();
      emit(p.x, p.y, 8, '#fff', 30, 80, 0.4);
    }
  }

  // Particles
  for(const p of particles){
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    p.vx *= 0.92;
    p.vy *= 0.92;
  }
  particles = particles.filter(p => p.life > 0);

  entities = entities.filter(e => !e.dead);

  if(shakeTime > 0) shakeTime -= dt;

  // Win/loss
  const enemiesAlive = entities.some(e => e.type === 'enemy');
  if(spawnedCount >= levelData.total && bossSpawned && !enemiesAlive){
    clearedLevels.add(levelIdx);
    saveCleared();
    lastClearedLevel = levelIdx;
    if(levelIdx >= LEVELS.length - 1){
      state = STATE.VICTORY; stateTime = 0; sfx.victory();
      if(score > highScore){ highScore = score; localStorage.setItem('shooter_high', String(highScore)); }
    } else {
      state = STATE.LEVEL_COMPLETE; stateTime = 0; sfx.levelComplete();
    }
  }
  if(player.hp <= 0){
    state = STATE.GAME_OVER; stateTime = 0; sfx.gameOver();
    shakeTime = 0; shakeAmt = 0;
    if(score > highScore){ highScore = score; localStorage.setItem('shooter_high', String(highScore)); }
  }
}

// ============================================================
// WEAPONS
// ============================================================
// Tank's flamethrower: a cone of damage in the aim direction this frame,
// plus visual flame particles. Called each tick while right-mouse is held
// and fuel remains.
// Tank's B-key flameburst: a 3-second ring of fire centered on the player.
// Called every frame while player.flameburstTime > 0. DPS is tuned so a small
// mob (grunt/runner/swarmer/exploder, hp ≤ ~3) dies in well under a second of
// contact but a Tank enemy needs to sit in the ring for ~2s and bosses survive.
function tickFlameburst(dt){
  const radius = 36;
  const dps = 6 * (player.damageMult || 1) * (player.damageTime > 0 ? 2 : 1);
  // Damage any enemy inside the ring this tick.
  for(const en of entities){
    if(en.type !== 'enemy' || en.dead) continue;
    if(dist2(player, en) < (radius + en.radius) * (radius + en.radius)){
      en.hp -= dps * dt;
      en.hitFlash = 0.06;
      if(en.hp <= 0) killEnemy(en);
    }
  }
  // Spray flame particles along the ring (count scaled by dt so it looks
  // dense at 60fps without overflowing the 300-particle cap).
  const count = Math.max(1, Math.floor(120 * dt));
  for(let i = 0; i < count; i++){
    const a = Math.random() * Math.PI * 2;
    const r = radius * (0.55 + Math.random() * 0.45);
    const px = player.x + Math.cos(a) * r * 0.5;
    const py = player.y + Math.sin(a) * r * 0.5;
    const vx = Math.cos(a) * 70;
    const vy = Math.sin(a) * 70;
    const col = ['#fff', '#f1c40f', '#e67e22', '#e74c3c'][i % 4];
    particles.push({
      x: px, y: py, vx, vy,
      life: 0.18 + Math.random() * 0.12,
      maxLife: 0.3, color: col,
      size: 1 + Math.floor(Math.random() * 2)
    });
  }
  if(particles.length > 300) particles.length = 300;
}

function fireFlamethrower(dt){
  const baseX = player.x + Math.cos(player.angle) * 7;
  const baseY = player.y + Math.sin(player.angle) * 7;
  const range = 210;       // longer reach for the tank's signature attack
  const halfAngle = 0.7;   // ~40° cone (wider than before)
  // The DAMAGE powerup (red explosion icon) now boosts flamethrower DPS too,
  // matching how it boosts bullet damage in fireWeapon.
  const dps = 7 * (player.damageMult || 1) * (player.damageTime > 0 ? 2 : 1);
  // Damage every enemy inside the cone, scaled by dt.
  for(const en of entities){
    if(en.type !== 'enemy' || en.dead) continue;
    const dx = en.x - player.x, dy = en.y - player.y;
    const d = Math.hypot(dx, dy);
    if(d > range + en.radius) continue;
    let diff = Math.atan2(dy, dx) - player.angle;
    while(diff >  Math.PI) diff -= 2 * Math.PI;
    while(diff < -Math.PI) diff += 2 * Math.PI;
    if(Math.abs(diff) > halfAngle) continue;
    en.hp -= dps * dt;
    en.hitFlash = 0.06;
    if(en.hp <= 0) killEnemy(en);
  }
  // Visual flame particles spraying down the cone.
  for(let i = 0; i < 4; i++){
    const jitter = (Math.random() - 0.5) * (halfAngle * 1.6);
    const reach = 20 + Math.random() * (range - 20);
    const px = baseX + Math.cos(player.angle + jitter) * 4;
    const py = baseY + Math.sin(player.angle + jitter) * 4;
    const vx = Math.cos(player.angle + jitter) * (reach * 2);
    const vy = Math.sin(player.angle + jitter) * (reach * 2);
    const col = ['#fff', '#f1c40f', '#e67e22', '#e74c3c'][i % 4];
    particles.push({
      x: px, y: py, vx, vy,
      life: 0.3 + Math.random() * 0.15,
      maxLife: 0.45, color: col,
      size: 1 + Math.floor(Math.random() * 2)
    });
  }
  if(particles.length > 300) particles.length = 300;
}

// Syed's right-mouse secondary: a VERY-high-DPS continuous KATANA slash swept
// across a wide OBTUSE arc in front of the player. Mirrors fireFlamethrower's
// cone-damage loop. The short `energy` pool is the balance lever; the visible
// obtuse cone is drawn in drawPlayer. Range/half-angle are shared constants so
// the damage check and the on-screen arc stay in lock-step.
const KATANA_RANGE = 32;     // long katana reach
const KATANA_HALF  = 0.9;    // ~51.6° half-arc => ~103° total slash — still obtuse,
                             // and 3/4 of the prior 1.2-rad arc (scope cut to 3/4)
function fireKatana(dt){
  const dps = 40 * (player.damageMult || 1) * (player.damageTime > 0 ? 2 : 1);
  for(const en of entities){
    if(en.type !== 'enemy' || en.dead) continue;
    const dx = en.x - player.x, dy = en.y - player.y;
    const d = Math.hypot(dx, dy);
    if(d > KATANA_RANGE + en.radius) continue;
    let diff = Math.atan2(dy, dx) - player.angle;
    while(diff >  Math.PI) diff -= 2 * Math.PI;
    while(diff < -Math.PI) diff += 2 * Math.PI;
    if(Math.abs(diff) > KATANA_HALF) continue;
    en.hp -= dps * dt;
    en.hitFlash = 0.06;
    if(en.hp <= 0) killEnemy(en);
  }
  // Slash visual: bright steel streaks sweeping the obtuse front arc.
  for(let i = 0; i < 3; i++){
    const a = player.angle + (Math.random() - 0.5) * KATANA_HALF * 2;
    const rr = KATANA_RANGE * (0.5 + Math.random() * 0.5);
    particles.push({
      x: player.x + Math.cos(a) * rr, y: player.y + Math.sin(a) * rr,
      vx: Math.cos(a + 1.4) * 40, vy: Math.sin(a + 1.4) * 40,   // tangential streak
      life: 0.1 + Math.random() * 0.06, maxLife: 0.16,
      color: i % 2 ? '#ffffff' : '#cfd8dc', size: 1 + Math.floor(Math.random() * 2)
    });
  }
  if(particles.length > 300) particles.length = 300;
}

// Scout RMB: THREE instant straight-line laser beams. Each beam is a line segment
// from the mech's muzzle out to LASER_BEAM_LEN, fanned at ±LASER_BEAM_SPREAD around
// the aim (plus one dead-center). It is HITSCAN, not a projectile: every enemy
// whose center lies within LASER_BEAM_HALF (+ its radius) of a beam line takes the
// beam's full damage on the same frame it fires (point-to-segment distance test) —
// so all monsters caught in a beam are hit simultaneously. The beam scope (length +
// spread) is unchanged from the old 3-bolt burst this replaces.
const LASER_BEAM_LEN = 147;      // = old bolt speed(420) * life(0.35): scope unchanged
const LASER_BEAM_HALF = 4;       // beam half-thickness used for the hit test
const LASER_BEAM_SPREAD = 0.18;  // fan offset per side (unchanged from old burst)
function fireLaserBeams(){
  const dmg = 3 * (player.damageMult || 1) * (player.damageTime > 0 ? 2 : 1);
  const lx = player.x + Math.cos(player.angle) * 9;
  const ly = player.y + Math.sin(player.angle) * 9;
  for(const off of [-LASER_BEAM_SPREAD, 0, LASER_BEAM_SPREAD]){
    const a = player.angle + off;
    const cx = Math.cos(a), cy = Math.sin(a);
    // Damage every enemy lying on this beam line — all at once, the frame it fires.
    for(const en of entities){
      if(en.type !== 'enemy' || en.dead) continue;
      let t = (en.x - lx) * cx + (en.y - ly) * cy;   // project enemy onto the beam
      t = clamp(t, 0, LASER_BEAM_LEN);
      const px = lx + cx * t, py = ly + cy * t;       // nearest point on the beam
      const dx = en.x - px, dy = en.y - py;
      const reach = LASER_BEAM_HALF + en.radius;
      if(dx*dx + dy*dy <= reach*reach){
        en.hp -= dmg;
        en.hitFlash = 0.08;
        if(en.hp <= 0) killEnemy(en);
      }
    }
    // Beam visual: a straight line from muzzle along the beam, flashing then fading.
    if(particles.length < 300) particles.push({
      beam:true, x:lx, y:ly, angle:a, len:LASER_BEAM_LEN,
      vx:0, vy:0, color:'#4fc3f7', life:0.14, maxLife:0.14
    });
  }
  emit(lx, ly, 6, '#4fc3f7', 40, 150, 0.18);
  sfx.laser();
}

function fireWeapon(mx, my){
  // Priority: rocket > laser > homing > plasma > spread > minigun > default.
  // Rapid halves cooldown; Damage powerup doubles bullet damage (incl. rockets).
  const rapidFactor = player.rapidTime > 0 ? 0.5 : 1;
  const dmgMult = (player.damageTime > 0 ? 2 : 1) * (player.damageMult || 1);

  if(player.rocketAmmo > 0){
    entities.push(createBullet(mx, my, player.angle, 'player', {
      speed: 180, dmg: 2 * dmgMult, explosive: true, explodeRadius: 28,
      sprite: SPR.bullet_rocket, radius: 3, life: 2.2
    }));
    player.rocketAmmo--;
    player.fireCooldown = 0.35 * rapidFactor;
    emit(mx, my, 5, '#e67e22', 30, 80, 0.25);
    sfx.rocket();
    return;
  }

  if(player.laserTime > 0){
    entities.push(createBullet(mx, my, player.angle, 'player', {
      speed: 360, pierce: true, dmg: 1 * dmgMult,
      sprite: SPR.bullet_laser, radius: 2, life: 1.0
    }));
    player.fireCooldown = 0.10 * rapidFactor;
    emit(mx, my, 3, '#27ae60', 30, 100, 0.18);
    sfx.laser();
    return;
  }

  if(player.homingTime > 0){
    entities.push(createBullet(mx, my, player.angle, 'player', {
      speed: 180, dmg: 1.5 * dmgMult, homing: true,
      sprite: SPR.bullet_homing, radius: 2, life: 2.0
    }));
    player.fireCooldown = 0.22 * rapidFactor;
    emit(mx, my, 3, '#e91e63', 30, 100, 0.18);
    sfx.shoot();
    return;
  }

  if(player.plasmaTime > 0){
    // Plasma pierces enemies AND bounces off walls; hitSet clears each bounce.
    entities.push(createBullet(mx, my, player.angle, 'player', {
      speed: 220, dmg: 1.5 * dmgMult, bounces: 2, pierce: true,
      sprite: SPR.bullet_plasma, radius: 2, life: 2.4
    }));
    player.fireCooldown = 0.18 * rapidFactor;
    emit(mx, my, 3, '#3498db', 30, 100, 0.18);
    sfx.laser();
    return;
  }

  if(player.spreadTime > 0){
    const spr = 0.22;
    entities.push(createBullet(mx, my, player.angle - spr, 'player', { dmg: 1 * dmgMult }));
    entities.push(createBullet(mx, my, player.angle,        'player', { dmg: 1 * dmgMult }));
    entities.push(createBullet(mx, my, player.angle + spr, 'player', { dmg: 1 * dmgMult }));
    player.fireCooldown = 0.12 * rapidFactor;
    emit(mx, my, 3, '#f1c40f', 30, 100, 0.18);
    sfx.shoot();
    return;
  }

  if(player.minigunTime > 0){
    // Slight random spread to make it feel chaotic.
    const jitter = (Math.random() - 0.5) * 0.10;
    entities.push(createBullet(mx, my, player.angle + jitter, 'player', { dmg: 1 * dmgMult, speed: 280 }));
    player.fireCooldown = 0.045 * rapidFactor;
    emit(mx, my, 2, '#bdc3c7', 30, 100, 0.15);
    sfx.shoot();
    return;
  }

  // ---- Class default (no powerup active) ----
  if(player.char === 'scout'){
    // Assassin SMG: fast, light, low-damage bullets. High sustained DPS up close,
    // but each shot is weak — rewards landing many hits, punishes spray-at-range.
    // (AoE for Scout comes from the rocket/spread pickups, not the base weapon.)
    entities.push(createBullet(mx, my, player.angle, 'player', {
      dmg: 0.85 * dmgMult, speed: 360, radius: 2, life: 1.0
    }));
    player.fireCooldown = 0.06 * rapidFactor;
    emit(mx, my, 2, '#f1c40f', 30, 110, 0.14);
    sfx.shoot();
    return;
  }
  if(player.char === 'tank'){
    // Heavy slug: 2× base damage, slightly larger and slower projectile, same fire rate
    // as the soldier pistol. Combined with Tank's 1.2 damageMult, each shot lands for 2.4
    // before bullet flags — meaningfully chunkier than the pistol while keeping cadence.
    entities.push(createBullet(mx, my, player.angle, 'player', {
      dmg: 2 * dmgMult, radius: 3, speed: 300, life: 1.6
    }));
    player.fireCooldown = player.fireRate * rapidFactor;
    emit(mx, my, 4, '#e67e22', 30, 100, 0.22);
    sfx.shoot();
    return;
  }
  // Soldier default pistol
  entities.push(createBullet(mx, my, player.angle, 'player', { dmg: 1 * dmgMult }));
  player.fireCooldown = player.fireRate * rapidFactor;
  emit(mx, my, 3, '#f1c40f', 30, 100, 0.18);
  sfx.shoot();
}

function applyPickup(kind){
  // Equipment
  if(kind === 'health')   player.hp = Math.min(player.maxHp, player.hp + 1);
  else if(kind === 'spread') player.spreadTime = Math.max(player.spreadTime, 8);
  else if(kind === 'rapid')  player.rapidTime  = Math.max(player.rapidTime,  8);
  else if(kind === 'laser')  player.laserTime  = Math.max(player.laserTime,  7);
  else if(kind === 'rocket') player.rocketAmmo = Math.min(15, player.rocketAmmo + 6);
  else if(kind === 'shield') player.shieldHp   = player.shieldMax;
  else if(kind === 'armor')  {
    // Extra protective case: raises the shield cap to 5 (regular shield's cap is 3),
    // refills shield to that new cap, and grants a brief invuln on pickup so it
    // doubles as an "oh no" panic button.
    player.shieldMax = Math.max(player.shieldMax, 5);
    player.shieldHp  = player.shieldMax;
    player.invuln    = Math.max(player.invuln, 1.5);
  }
  else if(kind === 'minigun') player.minigunTime = Math.max(player.minigunTime, 8);
  else if(kind === 'plasma')  player.plasmaTime  = Math.max(player.plasmaTime,  8);
  else if(kind === 'homing')  player.homingTime  = Math.max(player.homingTime,  8);
  // Powerups (passive temporary buffs)
  else if(kind === 'speed')   player.speedTime  = Math.max(player.speedTime,  8);
  else if(kind === 'damage')  player.damageTime = Math.max(player.damageTime, 8);
  else if(kind === 'slowmo')  slowMoTime        = Math.max(slowMoTime,        5);
  else if(kind === 'score2x') player.scoreTime  = Math.max(player.scoreTime, 10);
  else if(kind === 'magnet')  player.magnetTime = Math.max(player.magnetTime,10);
  else if(kind === 'fuel')    player.fuel       = Math.min(player.maxFuel, player.fuel + 3);
  else if(kind === 'beverage') player.energy    = Math.min(player.maxEnergy, player.energy + 1);
  else if(kind === 'battery')  player.power     = Math.min(player.maxPower, player.power + 5);
}

// ============================================================
// COMPANION (player's AI assistant)
// ============================================================
function updateCompanion(c, dt){
  if(c.invuln > 0) c.invuln -= dt;
  // Float to a follow-point offset behind the player.
  const target = {
    x: player.x - Math.cos(player.angle) * 14,
    y: player.y - Math.sin(player.angle) * 14
  };
  const dx = target.x - c.x, dy = target.y - c.y;
  const d = Math.hypot(dx, dy);
  const accel = 18;
  if(d > 0.5){
    c.vx += (dx / d) * accel * 60 * dt;
    c.vy += (dy / d) * accel * 60 * dt;
  }
  c.vx *= 0.86; c.vy *= 0.86;
  // Cap the float speed so it can always at least match the player (with a small
  // catch-up margin) — otherwise the old low accel left the drone trailing on the
  // big 2x/3x arenas. Track the SPEED powerup too.
  const pSpeed = player.speed * playerSpeedMult();
  const maxV = Math.max(pSpeed * 1.35, 90);
  const sp = Math.hypot(c.vx, c.vy);
  if(sp > maxV){ c.vx = c.vx / sp * maxV; c.vy = c.vy / sp * maxV; }
  c.x += c.vx * dt; c.y += c.vy * dt;
  // Clamp to the world, not the viewport, so it follows past the screen edge.
  c.x = clamp(c.x, 6, worldW - 6);
  c.y = clamp(c.y, 6, worldH - 8);
  c.frameT += dt;
  if(c.frameT > 0.18){ c.frameT = 0; c.frame = (c.frame + 1) % 2; }

  // Auto-fire at nearest enemy in range.
  c.fireCooldown -= dt;
  // Detection/attack scope doubled from 140 to 280 (companion engages from 2x farther).
  let nearest = null, nd = 280*280;
  for(const en of entities){
    if(en.type !== 'enemy' || en.dead) continue;
    const dd = dist2(c, en);
    if(dd < nd){ nd = dd; nearest = en; }
  }
  if(nearest){
    c.angle = Math.atan2(nearest.y - c.y, nearest.x - c.x);
    if(c.fireCooldown <= 0){
      // Companion bullets are friendly to player (owner='player') so they share collision logic.
      entities.push(createBullet(c.x, c.y, c.angle, 'player', {
        sprite: SPR.bullet_companion, speed: 260, dmg: 3, radius: 2, life: 1.5
      }));
      c.fireCooldown = c.fireRate;
      emit(c.x, c.y, 1, '#aed6f1', 20, 60, 0.15);
    }
  }
}

// Is `e` a friendly ally entity (can be hit by enemy bullets/melee)?
function isAlly(e){
  return e.type === 'companion' || e.type === 'henchman' || e.type === 'nunchaku'
      || e.type === 'bomber_ally' || e.type === 'poison_ally' || e.type === 'sword_ally';
}

// Unified ally damage. Respects per-entity invuln window (`hitInvuln`) and death color.
function damageAlly(a, amount){
  if(a.invuln > 0) return;
  a.hp -= amount;
  a.invuln = a.hitInvuln || 0.5;
  a.hitFlash = 0.15;
  emit(a.x, a.y, 6, '#e74c3c', 30, 90, 0.4);
  sfx.hit();
  if(a.hp <= 0 && !a.dead){
    a.dead = true;
    emit(a.x, a.y, 20, a.deathColor || '#fff', 50, 160, 0.6);
    sfx.enemyDeath();
  }
}

function updateSwordAlly(s, dt){
  if(s.invuln > 0) s.invuln -= dt;
  if(s.swingTime > 0) s.swingTime -= dt;
  if(s.attackCd > 0) s.attackCd -= dt;

  // Pick the nearest enemy.
  let target = null, td = Infinity;
  for(const en of entities){
    if(en.type !== 'enemy' || en.dead) continue;
    const d2 = dist2(s, en);
    if(d2 < td){ td = d2; target = en; }
  }

  if(target){
    const dx = target.x - s.x, dy = target.y - s.y;
    const d = Math.hypot(dx, dy) || 0.001;
    s.angle = Math.atan2(dy, dx);
    // Close to attack range, then stop and swing.
    const stopDist = s.attackRange - 6;
    if(d > stopDist){
      s.vx = (dx / d) * s.moveSpeed;
      s.vy = (dy / d) * s.moveSpeed;
    } else {
      s.vx *= 0.6; s.vy *= 0.6;
      if(s.attackCd <= 0){
        swordAllyAttack(s);
        s.attackCd = s.attackRate;
        s.swingTime = 0.18;
      }
    }
  } else {
    // No enemies — drift toward the player.
    const dx = player.x - s.x, dy = player.y - s.y;
    const d = Math.hypot(dx, dy);
    if(d > 18){
      s.vx = (dx / d) * s.moveSpeed * 0.6;
      s.vy = (dy / d) * s.moveSpeed * 0.6;
    } else {
      s.vx *= 0.5; s.vy *= 0.5;
    }
  }

  s.x = clamp(s.x + s.vx * dt, 6, worldW - 6);
  s.y = clamp(s.y + s.vy * dt, 6, worldH - 8);
  s.frameT += dt;
  if(s.frameT > 0.16){ s.frameT = 0; s.frame = (s.frame + 1) % 2; }
}

function swordAllyAttack(s){
  const half = s.attackArc / 2;
  let hit = false;
  for(const en of entities){
    if(en.type !== 'enemy' || en.dead) continue;
    const dx = en.x - s.x, dy = en.y - s.y;
    const d = Math.hypot(dx, dy);
    if(d > s.attackRange + en.radius) continue;
    let diff = Math.atan2(dy, dx) - s.angle;
    while(diff > Math.PI) diff -= Math.PI * 2;
    while(diff < -Math.PI) diff += Math.PI * 2;
    if(Math.abs(diff) > half) continue;
    en.hp -= s.swingDmg;
    en.hitFlash = 0.08;
    emit(en.x, en.y, 4, '#fff', 30, 90, 0.25);
    if(en.hp <= 0) killEnemy(en);
    hit = true;
  }
  if(hit) sfx.hit();
  // Slash particles in the arc.
  for(let i = 0; i < 6; i++){
    const a = s.angle - half + (i / 5) * s.attackArc;
    const r = s.attackRange * (0.55 + Math.random() * 0.45);
    particles.length < 300 && particles.push({
      x: s.x + Math.cos(a) * r, y: s.y + Math.sin(a) * r,
      vx: Math.cos(a) * 40, vy: Math.sin(a) * 40,
      life: 0.22, maxLife: 0.22, color:'#f1c40f', size: 1
    });
  }
}

// ---- Generic melee ally (henchman, nunchaku) ----
// Chases the nearest enemy within its leash and swings in an arc; otherwise
// escorts the player. Speed tracks the player so it never falls behind.
function updateMeleeAlly(s, dt){
  if(s.invuln > 0) s.invuln -= dt;
  if(s.swingTime > 0) s.swingTime -= dt;
  if(s.attackCd > 0) s.attackCd -= dt;
  const pSpeed = player.speed * playerSpeedMult();
  const moveSpeed = Math.max(s.moveSpeed, pSpeed * 1.15);

  let target = null, td = Infinity;
  for(const en of entities){
    if(en.type !== 'enemy' || en.dead) continue;
    const d2 = dist2(s, en);
    if(d2 < td){ td = d2; target = en; }
  }
  const leash = s.leash || 110;
  if(target && td < leash * leash){
    const dx = target.x - s.x, dy = target.y - s.y;
    const d = Math.hypot(dx, dy) || 0.001;
    s.angle = Math.atan2(dy, dx);
    const stopDist = s.attackRange - 8;
    if(d > stopDist){
      s.vx = (dx / d) * moveSpeed;
      s.vy = (dy / d) * moveSpeed;
    } else {
      s.vx *= 0.6; s.vy *= 0.6;
      if(s.attackCd <= 0){ meleeAllyAttack(s); s.attackCd = s.attackRate; s.swingTime = 0.2; }
    }
  } else {
    const tx = player.x + Math.cos(player.angle + Math.PI / 2) * 16;
    const ty = player.y + Math.sin(player.angle + Math.PI / 2) * 16;
    const dx = tx - s.x, dy = ty - s.y;
    const d = Math.hypot(dx, dy);
    if(d > 6){
      s.angle = Math.atan2(dy, dx);
      const sp = d > 60 ? moveSpeed * 1.3 : moveSpeed;
      s.vx = (dx / d) * sp;
      s.vy = (dy / d) * sp;
    } else { s.vx *= 0.5; s.vy *= 0.5; }
  }
  s.x = clamp(s.x + s.vx * dt, 6, worldW - 6);
  s.y = clamp(s.y + s.vy * dt, 6, worldH - 8);
  s.frameT += dt;
  if(s.frameT > 0.16){ s.frameT = 0; s.frame = (s.frame + 1) % 2; }
}

function meleeAllyAttack(s){
  const half = s.attackArc / 2;
  const col = s.swingColor || '#fff';
  let hit = false;
  for(const en of entities){
    if(en.type !== 'enemy' || en.dead) continue;
    const dx = en.x - s.x, dy = en.y - s.y;
    const d = Math.hypot(dx, dy);
    if(d > s.attackRange + en.radius) continue;
    let diff = Math.atan2(dy, dx) - s.angle;
    while(diff > Math.PI) diff -= Math.PI * 2;
    while(diff < -Math.PI) diff += Math.PI * 2;
    if(Math.abs(diff) > half) continue;
    en.hp -= s.swingDmg;
    en.hitFlash = 0.08;
    emit(en.x, en.y, 4, col, 30, 90, 0.25);
    if(en.hp <= 0) killEnemy(en);
    hit = true;
  }
  if(hit) sfx.hit();
  for(let i = 0; i < 8; i++){
    const a = s.angle - half + (i / 7) * s.attackArc;
    const r = s.attackRange * (0.55 + Math.random() * 0.45);
    particles.length < 300 && particles.push({
      x: s.x + Math.cos(a) * r, y: s.y + Math.sin(a) * r,
      vx: Math.cos(a) * 40, vy: Math.sin(a) * 40,
      life: 0.24, maxLife: 0.24, color: col, size: 1
    });
  }
}

// ---- Bomber ally ----
// Stays near the player (fragile) and lobs a high-damage, large-radius bomb at
// the nearest enemy in range. The bomb explodes on contact OR at end of fuse.
function updateBomberAlly(s, dt){
  if(s.invuln > 0) s.invuln -= dt;
  if(s.fireCooldown > 0) s.fireCooldown -= dt;
  const pSpeed = player.speed * playerSpeedMult();
  const moveSpeed = Math.max(s.moveSpeed, pSpeed * 1.15);
  // Tuck in behind the player.
  const tx = player.x - Math.cos(player.angle) * 18;
  const ty = player.y - Math.sin(player.angle) * 18;
  const dxp = tx - s.x, dyp = ty - s.y;
  const dp = Math.hypot(dxp, dyp);
  if(dp > 6){
    const sp = dp > 60 ? moveSpeed * 1.3 : moveSpeed;
    s.vx = (dxp / dp) * sp; s.vy = (dyp / dp) * sp;
  } else { s.vx *= 0.5; s.vy *= 0.5; }
  s.x = clamp(s.x + s.vx * dt, 6, worldW - 6);
  s.y = clamp(s.y + s.vy * dt, 6, worldH - 8);
  s.frameT += dt;
  if(s.frameT > 0.16){ s.frameT = 0; s.frame = (s.frame + 1) % 2; }

  let target = null, nd = s.fireRange * s.fireRange;
  for(const en of entities){
    if(en.type !== 'enemy' || en.dead) continue;
    const dd = dist2(s, en);
    if(dd < nd){ nd = dd; target = en; }
  }
  if(target){
    s.angle = Math.atan2(target.y - s.y, target.x - s.x);
    if(s.fireCooldown <= 0){
      const dmg = s.bombDmg * (player.damageMult || 1) * (player.damageTime > 0 ? 2 : 1);
      // Raw bullet object (mirrors the Soldier grenade) so isGrenade/explodeDmg stick.
      entities.push({
        type:'bullet', owner:'player', x:s.x, y:s.y,
        vx:Math.cos(s.angle) * s.projSpeed, vy:Math.sin(s.angle) * s.projSpeed,
        angle:s.angle, radius:3, sprite:SPR.bullet_rocket,
        dmg, life:1.1, isGrenade:true, explosive:true,
        explodeRadius:s.explodeRadius, explodeDmg:dmg, dead:false
      });
      s.fireCooldown = s.fireRate;
      emit(s.x, s.y, 4, '#e67e22', 30, 90, 0.25);
      sfx.rocket();
    }
  }
}

// ---- Poison ally ----
// Drifts onto the nearest enemy (else escorts the player) and exudes a wide,
// continuous toxic aura that damages every enemy inside it each tick.
function updatePoisonAlly(s, dt){
  if(s.invuln > 0) s.invuln -= dt;
  const pSpeed = player.speed * playerSpeedMult();
  const moveSpeed = Math.max(s.moveSpeed, pSpeed * 1.1);

  let target = null, td = Infinity;
  for(const en of entities){
    if(en.type !== 'enemy' || en.dead) continue;
    const d2 = dist2(s, en);
    if(d2 < td){ td = d2; target = en; }
  }
  const leash = s.leash || 130;
  if(target && td < leash * leash){
    const dx = target.x - s.x, dy = target.y - s.y;
    const d = Math.hypot(dx, dy) || 0.001;
    s.angle = Math.atan2(dy, dx);
    if(d > s.auraRadius * 0.6){ s.vx = (dx / d) * moveSpeed; s.vy = (dy / d) * moveSpeed; }
    else { s.vx *= 0.6; s.vy *= 0.6; }
  } else {
    const tx = player.x + Math.cos(player.angle + Math.PI / 2) * 18;
    const ty = player.y + Math.sin(player.angle + Math.PI / 2) * 18;
    const dx = tx - s.x, dy = ty - s.y;
    const d = Math.hypot(dx, dy);
    if(d > 6){ const sp = d > 60 ? moveSpeed * 1.3 : moveSpeed; s.vx = (dx / d) * sp; s.vy = (dy / d) * sp; }
    else { s.vx *= 0.5; s.vy *= 0.5; }
  }
  s.x = clamp(s.x + s.vx * dt, 6, worldW - 6);
  s.y = clamp(s.y + s.vy * dt, 6, worldH - 8);
  s.frameT += dt;
  if(s.frameT > 0.18){ s.frameT = 0; s.frame = (s.frame + 1) % 2; }

  const dps = s.dps * (player.damageMult || 1) * (player.damageTime > 0 ? 2 : 1);
  for(const en of entities){
    if(en.type !== 'enemy' || en.dead) continue;
    const rr = s.auraRadius + en.radius;
    if(dist2(s, en) < rr * rr){
      en.hp -= dps * dt;
      en.hitFlash = 0.05;
      if(en.hp <= 0) killEnemy(en);
    }
  }
  // Rising toxic puffs scattered through the aura.
  s.puffT -= dt;
  if(s.puffT <= 0){
    s.puffT = 0.05;
    const a = Math.random() * Math.PI * 2;
    const r = s.auraRadius * Math.sqrt(Math.random());
    particles.length < 300 && particles.push({
      x: s.x + Math.cos(a) * r, y: s.y + Math.sin(a) * r,
      vx: 0, vy: -6, life: 0.5, maxLife: 0.5,
      color: Math.random() < 0.5 ? '#27ae60' : '#2ecc71', size: 1
    });
  }
}

// ============================================================
// COMBAT
// ============================================================
function damagePlayer(amount){
  if(player.shieldHp > 0){
    player.shieldHp -= 1;
    player.invuln = 0.5;
    sfx.shieldHit();
    emit(player.x, player.y, 10, '#1abc9c', 30, 100, 0.4);
    return;
  }
  player.hp -= amount;
  player.invuln = 0.9;
  player.hitFlash = 0.15;
  shakeTime = 0.2; shakeAmt = 4;
  emit(player.x, player.y, 8, '#e74c3c', 40, 130, 0.5);
  sfx.playerHurt();
}

function killEnemy(en){
  // Idempotency guard: killEnemy can be reached from collision + explode in the
  // same frame (a grenade hit + its blast both see the same dying enemy). Without
  // this, splitters cascade twice and the entity count balloons until the tab freezes.
  if(en._killed) return;
  en._killed = true;
  en.dead = true;
  const scoreMult = player.scoreTime > 0 ? 2 : 1;
  score += en.score * scoreMult;
  emit(en.x, en.y, en.isBoss ? 40 : 14,
       en.isBoss ? '#9b59b6' : '#c0392b', 50, 200, en.isBoss ? 0.9 : 0.6);
  if(en.kind === 'tank'){
    shakeTime = 0.25; shakeAmt = 4;
  } else if(en.isBoss){
    shakeTime = 0.7; shakeAmt = 6;
    // Boss death drops a guaranteed special equipment
    const drops = {
      bruiser:'rapid', sniper:'shield', splitter:'spread', summoner:'rocket', overlord:'laser',
      twin:'minigun', reaper:'plasma', bomber:'rocket', phantom:'homing', nemesis:'laser'
    };
    const drop = drops[en.kind] || 'health';
    entities.push(createPickup(en.x, en.y, drop));
    // Plus a health top-up
    entities.push(createPickup(en.x + 12, en.y, 'health'));
  }
  sfx.enemyDeath();
  // Splitter death cascade
  if(en.kind === 'splitter'){
    for(let i=0;i<2;i++){
      const a = (i/2)*Math.PI*2 + Math.random();
      const e2 = createEnemy('splitter_mid', en.x + Math.cos(a)*10, en.y + Math.sin(a)*10);
      e2.vx = Math.cos(a)*40; e2.vy = Math.sin(a)*40;
      entities.push(e2);
    }
  } else if(en.kind === 'splitter_mid'){
    for(let i=0;i<2;i++){
      const a = (i/2)*Math.PI*2 + Math.random();
      const e2 = createEnemy('splitter_mini', en.x + Math.cos(a)*6, en.y + Math.sin(a)*6);
      e2.vx = Math.cos(a)*60; e2.vy = Math.sin(a)*60;
      entities.push(e2);
    }
  }
  // Random drop from non-boss (9 equipment + 5 powerups, weighted)
  if(!en.isBoss && Math.random() < 0.22){
    // Drop pool. Weights MUST sum to 1.0 for the pickWeighted loop below to
    // give every entry its intended share — appending after the sum reaches 1.0
    // means the appended item never drops (the previous fuel bug). Tank uses a
    // dedicated pool so the fuel canister occupies a real slice of the distribution.
    let kinds, weights;
    if(player && player.char === 'tank'){
      // Fuel at HIGH-MEDIUM frequency (0.12, down from 0.20) — the flamethrower
      // now also self-regens 0.1/s. Weights sum to exactly 1.0.
      kinds   = ['health','fuel','spread','rapid','shield','armor','rocket','laser','minigun','plasma','homing','speed','damage','slowmo','score2x','magnet'];
      weights = [ 0.14,   0.12,  0.07,    0.07,    0.06,    0.06,   0.05,    0.05,   0.05,     0.05,    0.05,    0.05,   0.05,    0.04,    0.03,     0.06    ];
    } else if(player && player.char === 'soldier'){
      // Beverage at HIGH-MEDIUM frequency (0.12, down from 0.20) refilling Syed's
      // katana energy, which also self-regens 0.1/s. Weights sum to exactly 1.0.
      kinds   = ['health','beverage','spread','rapid','shield','armor','rocket','laser','minigun','plasma','homing','speed','damage','slowmo','score2x','magnet'];
      weights = [ 0.14,   0.12,      0.07,    0.07,   0.06,    0.06,   0.05,    0.05,   0.05,     0.05,    0.05,    0.05,   0.05,    0.04,    0.03,     0.06    ];
    } else {
      // Scout (the only character reaching this branch). Battery at MEDIUM
      // frequency (0.12) refilling Xu Yihui's laser power, which also self-regens
      // 0.1/s. Weights sum to exactly 1.0 (mirrors the Soldier pool, battery↔beverage).
      kinds   = ['health','battery','spread','rapid','shield','armor','rocket','laser','minigun','plasma','homing','speed','damage','slowmo','score2x','magnet'];
      weights = [ 0.14,   0.12,     0.07,    0.07,   0.06,    0.06,   0.05,    0.05,   0.05,     0.05,    0.05,    0.05,   0.05,    0.04,    0.03,     0.06    ];
    }
    const r = Math.random();
    let acc = 0;
    let pick = 'health';
    for(let i=0;i<kinds.length;i++){ acc += weights[i]; if(r < acc){ pick = kinds[i]; break; } }
    entities.push(createPickup(en.x, en.y, pick));
  }
}

// ============================================================
// ENEMY AI
// ============================================================
function updateEnemy(e, dt){
  if(e.kind === 'bruiser')  return updateBruiser(e, dt);
  if(e.kind === 'sniper')   return updateSniper(e, dt);
  if(e.kind === 'splitter' || e.kind === 'splitter_mid') return updateSplitter(e, dt);
  if(e.kind === 'splitter_mini') return updateSeek(e, dt);
  if(e.kind === 'summoner') return updateSummoner(e, dt);
  if(e.kind === 'overlord') return updateOverlord(e, dt);
  if(e.kind === 'twin')     return updateTwin(e, dt);
  if(e.kind === 'reaper')   return updateReaper(e, dt);
  if(e.kind === 'bomber')   return updateBomber(e, dt);
  if(e.kind === 'phantom')  return updatePhantom(e, dt);
  if(e.kind === 'nemesis')  return updateNemesis(e, dt);
  if(e.kind === 'shooter')  return updateShooter(e, dt);
  if(e.kind === 'charger')  return updateCharger(e, dt);
  if(e.kind === 'exploder') return updateExploder(e, dt);
  if(e.kind === 'swarmer')  return updateSwarmer(e, dt);
  return updateSeek(e, dt);
}

function updateCharger(e, dt){
  // 4 phases: 0=stalk slow, 1=telegraph (lock aim), 2=charge straight, 3=recover
  e.phaseT += dt;
  if(e.phase === 0){
    const a = Math.atan2(player.y - e.y, player.x - e.x);
    e.vx = Math.cos(a) * e.speed * 0.5;
    e.vy = Math.sin(a) * e.speed * 0.5;
    e.x += e.vx * dt; e.y += e.vy * dt;
    if(e.phaseT > 1.2){ e.phase = 1; e.phaseT = 0; e.telegraph = 0.6;
      e.chargeAngle = Math.atan2(player.y - e.y, player.x - e.x);
    }
  } else if(e.phase === 1){
    e.vx = 0; e.vy = 0;
    e.telegraph = Math.max(0, e.telegraph - dt);
    if(e.phaseT > 0.6){ e.phase = 2; e.phaseT = 0; }
  } else if(e.phase === 2){
    const sp = e.speed * 4.5;
    e.vx = Math.cos(e.chargeAngle) * sp;
    e.vy = Math.sin(e.chargeAngle) * sp;
    e.x += e.vx * dt; e.y += e.vy * dt;
    emit(e.x, e.y, 1, '#e74c3c', 10, 40, 0.2);
    if(e.phaseT > 0.55){ e.phase = 3; e.phaseT = 0; }
  } else {
    e.vx *= 0.85; e.vy *= 0.85;
    e.x += e.vx * dt; e.y += e.vy * dt;
    if(e.phaseT > 0.8){ e.phase = 0; e.phaseT = 0; }
  }
  // animation frames
  e.frameT += dt;
  if(e.frameT > 0.12){ e.frameT = 0; e.frame = (e.frame + 1) % 2; }
}

function updateExploder(e, dt){
  const dx = player.x - e.x, dy = player.y - e.y;
  const d = Math.hypot(dx, dy);
  // Pulse faster as it nears the player
  const a = Math.atan2(dy, dx);
  e.vx = Math.cos(a) * e.speed;
  e.vy = Math.sin(a) * e.speed;
  e.x += e.vx * dt; e.y += e.vy * dt;
  if(d < 14){
    // Detonate on contact: blast + die
    explode(e.x, e.y, 26, 2);
    e.dead = true;
    emit(e.x, e.y, 14, '#f39c12', 50, 160, 0.45);
  }
  // Fast animation = "pulsing"
  e.frameT += dt;
  if(e.frameT > (d < 60 ? 0.06 : 0.16)){ e.frameT = 0; e.frame = (e.frame + 1) % 2; }
}

function updateSwarmer(e, dt){
  const dx = player.x - e.x, dy = player.y - e.y;
  const a = Math.atan2(dy, dx);
  // Zig-zag perpendicular to direction
  e.wobble = (e.wobble || 0) + dt * 7;
  const offset = Math.sin(e.wobble) * 0.55;
  const moveA = a + offset;
  e.vx = Math.cos(moveA) * e.speed;
  e.vy = Math.sin(moveA) * e.speed;
  e.x += e.vx * dt; e.y += e.vy * dt;
  e.frameT += dt;
  if(e.frameT > 0.1){ e.frameT = 0; e.frame = (e.frame + 1) % 2; }
}

function updateSeek(e, dt){
  const a = Math.atan2(player.y - e.y, player.x - e.x);
  e.vx = Math.cos(a) * e.speed;
  e.vy = Math.sin(a) * e.speed;
  e.x += e.vx * dt; e.y += e.vy * dt;
  if(Math.abs(e.vx) + Math.abs(e.vy) > 5){
    e.frameT += dt;
    if(e.frameT > 0.18){ e.frameT = 0; e.frame = (e.frame + 1) % 2; }
  }
}

function updateShooter(e, dt){
  const d = Math.hypot(player.x - e.x, player.y - e.y);
  if(d > 110){
    const a = Math.atan2(player.y - e.y, player.x - e.x);
    e.vx = Math.cos(a) * e.speed;
    e.vy = Math.sin(a) * e.speed;
  } else {
    e.vx = 0; e.vy = 0;
    e.fireCooldown -= dt;
    if(e.fireCooldown <= 0){
      const a = Math.atan2(player.y - e.y, player.x - e.x);
      entities.push(createBullet(e.x, e.y, a, 'enemy', {speed:150}));
      e.fireCooldown = 1.6;
      emit(e.x, e.y, 2, '#e74c3c', 20, 60, 0.2);
    }
  }
  e.x += e.vx * dt; e.y += e.vy * dt;
  if(Math.abs(e.vx) + Math.abs(e.vy) > 5){
    e.frameT += dt;
    if(e.frameT > 0.18){ e.frameT = 0; e.frame = (e.frame + 1) % 2; }
  }
}

// BRUISER: chase + periodic charge bursts
function updateBruiser(e, dt){
  e.phaseT += dt;
  const a = Math.atan2(player.y - e.y, player.x - e.x);
  // Charging phase
  if(e.phase === 1){
    e.vx = Math.cos(e.chargeAngle) * e.speed * 3.2;
    e.vy = Math.sin(e.chargeAngle) * e.speed * 3.2;
    if(e.phaseT > 0.9){ e.phase = 0; e.phaseT = 0; e.fireCooldown = 2.4; }
  } else {
    e.vx = Math.cos(a) * e.speed;
    e.vy = Math.sin(a) * e.speed;
    e.fireCooldown -= dt;
    if(e.fireCooldown <= 0){
      // Telegraph then charge
      e.chargeAngle = a;
      e.phase = 1; e.phaseT = 0;
      emit(e.x, e.y, 12, '#f1c40f', 40, 120, 0.3);
    }
    // Periodic 4-bullet cross
    if(Math.floor(e.phaseT*2) % 4 === 3 && !e.firedCross){
      e.firedCross = true;
      for(let i=0;i<4;i++){
        const aa = a + (i/4)*Math.PI*2;
        entities.push(createBullet(e.x, e.y, aa, 'enemy', {speed:120}));
      }
    } else if(Math.floor(e.phaseT*2) % 4 !== 3){
      e.firedCross = false;
    }
  }
  e.x += e.vx * dt; e.y += e.vy * dt;
  e.x = clamp(e.x, 14, worldW-14);
  e.y = clamp(e.y, 14, worldH-16);
}

// SNIPER: maintain distance, aimed fast bullets, teleport occasionally
function updateSniper(e, dt){
  e.phaseT += dt;
  const dx = player.x - e.x, dy = player.y - e.y;
  const d = Math.hypot(dx, dy);
  const a = Math.atan2(dy, dx);
  const ideal = 140;
  if(d < ideal - 20){
    e.vx = -Math.cos(a) * e.speed * 1.2;
    e.vy = -Math.sin(a) * e.speed * 1.2;
  } else if(d > ideal + 20){
    e.vx = Math.cos(a) * e.speed;
    e.vy = Math.sin(a) * e.speed;
  } else {
    // Strafe
    e.vx = -Math.sin(a) * e.speed * 0.6;
    e.vy = Math.cos(a) * e.speed * 0.6;
  }
  e.fireCooldown -= dt;
  if(e.fireCooldown <= 0){
    // Telegraphed shot
    if(!e.telegraphActive){
      e.telegraphActive = true;
      e.telegraphAngle = a;
      e.fireCooldown = 0.5;
    } else {
      entities.push(createBullet(e.x, e.y, e.telegraphAngle, 'enemy', {speed:260}));
      emit(e.x, e.y, 4, '#1abc9c', 20, 80, 0.2);
      e.telegraphActive = false;
      e.fireCooldown = 1.4;
    }
  }
  // Teleport every 6s
  if(e.phaseT > 6){
    e.phaseT = 0;
    emit(e.x, e.y, 18, '#8e44ad', 30, 120, 0.5);
    e.x = rand(40, worldW-40); e.y = rand(40, worldH-40);
    emit(e.x, e.y, 18, '#8e44ad', 30, 120, 0.5);
    e.telegraphActive = false;
    sfx.teleport();
  }
  e.x += e.vx * dt; e.y += e.vy * dt;
  e.x = clamp(e.x, 14, worldW-14);
  e.y = clamp(e.y, 14, worldH-16);
}

// SPLITTER (and splitter_mid): chase + ring bursts
function updateSplitter(e, dt){
  const a = Math.atan2(player.y - e.y, player.x - e.x);
  e.vx = Math.cos(a) * e.speed;
  e.vy = Math.sin(a) * e.speed;
  e.x += e.vx * dt; e.y += e.vy * dt;
  e.x = clamp(e.x, 12, worldW-12);
  e.y = clamp(e.y, 12, worldH-14);
  if(e.kind === 'splitter'){
    e.fireCooldown -= dt;
    if(e.fireCooldown <= 0){
      const n = 10;
      for(let i=0;i<n;i++){
        const aa = (i/n)*Math.PI*2 + e.phaseT;
        entities.push(createBullet(e.x, e.y, aa, 'enemy', {speed:100}));
      }
      e.fireCooldown = 2.4;
    }
    e.phaseT += dt * 0.6;
  }
}

// SUMMONER: keep distance, summon adds, ring blasts
function updateSummoner(e, dt){
  e.phaseT += dt;
  const dx = player.x - e.x, dy = player.y - e.y;
  const d = Math.hypot(dx, dy);
  const a = Math.atan2(dy, dx);
  const ideal = 120;
  if(d < ideal){
    e.vx = -Math.cos(a) * e.speed;
    e.vy = -Math.sin(a) * e.speed;
  } else {
    e.vx = -Math.sin(a) * e.speed * 0.7;
    e.vy = Math.cos(a) * e.speed * 0.7;
  }
  e.fireCooldown -= dt;
  if(e.fireCooldown <= 0){
    // Alternate: summon vs ring blast
    if(e.summonNext){
      const choices = ['runner','shooter','grunt'];
      const k = choices[Math.floor(Math.random()*choices.length)];
      spawnEnemyAtEdge(k);
      emit(e.x, e.y, 8, '#f1c40f', 40, 110, 0.3);
    } else {
      const n = 8;
      for(let i=0;i<n;i++){
        const aa = (i/n)*Math.PI*2 + e.phaseT*0.3;
        entities.push(createBullet(e.x, e.y, aa, 'enemy', {speed:120}));
      }
    }
    e.summonNext = !e.summonNext;
    e.fireCooldown = 2.2;
  }
  e.x += e.vx * dt; e.y += e.vy * dt;
  e.x = clamp(e.x, 16, worldW-16);
  e.y = clamp(e.y, 16, worldH-18);
}

// OVERLORD: 3-phase
function updateOverlord(boss, dt){
  boss.phaseT += dt;
  if(boss.phaseT > 4){
    boss.phaseT = 0;
    boss.phase = (boss.phase + 1) % 3;
    boss.fireCooldown = 0.3;
  }
  const a = Math.atan2(player.y - boss.y, player.x - boss.x);
  let tvx = Math.cos(a) * boss.speed;
  let tvy = Math.sin(a) * boss.speed;
  if(boss.phase === 0){
    boss.fireCooldown -= dt;
    if(boss.fireCooldown <= 0){
      for(let i = 0; i < 12; i++){
        const aa = (i / 12) * Math.PI * 2 + boss.phaseT * 0.5;
        entities.push(createBullet(boss.x, boss.y, aa, 'enemy', {speed:120}));
      }
      boss.fireCooldown = 1.3;
    }
  } else if(boss.phase === 1){
    tvx *= 2.6; tvy *= 2.6;
    boss.fireCooldown -= dt;
    if(boss.fireCooldown <= 0){
      // 3-bullet spread aimed at player
      for(let i=-1;i<=1;i++){
        entities.push(createBullet(boss.x, boss.y, a + i*0.18, 'enemy', {speed:160}));
      }
      boss.fireCooldown = 0.7;
    }
  } else {
    boss.fireCooldown -= dt;
    if(boss.fireCooldown <= 0){
      const k = Math.random() < 0.5 ? 'grunt' : 'shooter';
      spawnEnemyAtEdge(k);
      boss.fireCooldown = 1.2;
    }
  }
  boss.vx = tvx; boss.vy = tvy;
  boss.x += boss.vx * dt;
  boss.y += boss.vy * dt;
  boss.x = clamp(boss.x, 18, worldW - 18);
  boss.y = clamp(boss.y, 18, worldH - 22);
}

// TWIN STRIKER (L6): dual-pattern chaser — alternates dash slash and twin sideshot bursts.
function updateTwin(e, dt){
  e.phaseT += dt;
  const a = Math.atan2(player.y - e.y, player.x - e.x);
  if(e.phase === 1){
    // Dash forward in chargeAngle for ~0.8s
    e.vx = Math.cos(e.chargeAngle) * e.speed * 3.0;
    e.vy = Math.sin(e.chargeAngle) * e.speed * 3.0;
    if(e.phaseT > 0.7){ e.phase = 0; e.phaseT = 0; e.fireCooldown = 1.4; }
  } else {
    // Strafing approach + periodic twin-bullet bursts at perpendicular angles
    e.vx = Math.cos(a) * e.speed * 0.9 - Math.sin(a) * e.speed * 0.4;
    e.vy = Math.sin(a) * e.speed * 0.9 + Math.cos(a) * e.speed * 0.4;
    e.fireCooldown -= dt;
    if(e.fireCooldown <= 0){
      if(Math.random() < 0.45){
        // Charge telegraph then dash
        e.chargeAngle = a;
        e.phase = 1; e.phaseT = 0;
        emit(e.x, e.y, 14, '#e67e22', 40, 130, 0.3);
      } else {
        // Twin-blade burst: two parallel bullets either side of aim
        const off = 0.35;
        for(let k=-1;k<=1;k+=2){
          entities.push(createBullet(e.x + Math.cos(a + Math.PI/2)*k*6, e.y + Math.sin(a + Math.PI/2)*k*6,
                                     a + k*off, 'enemy', {speed:170}));
        }
        e.fireCooldown = 1.0;
      }
    }
  }
  e.x += e.vx * dt; e.y += e.vy * dt;
  e.x = clamp(e.x, 14, worldW - 14);
  e.y = clamp(e.y, 14, worldH - 16);
}

// REAPER (L7): high-speed dasher, leaves slash-arcs behind. Cycle: stalk → dash → cooldown.
function updateReaper(e, dt){
  e.phaseT += dt;
  const a = Math.atan2(player.y - e.y, player.x - e.x);
  if(e.phase === 1){
    // Mid-dash: travel fast and shed sparks
    e.vx = Math.cos(e.chargeAngle) * e.speed * 4.0;
    e.vy = Math.sin(e.chargeAngle) * e.speed * 4.0;
    emit(e.x, e.y, 2, '#27ae60', 20, 60, 0.25);
    if(e.phaseT > 0.55){ e.phase = 2; e.phaseT = 0; }
  } else if(e.phase === 2){
    // Post-dash recovery + ring slash
    e.vx *= 0.85; e.vy *= 0.85;
    if(e.phaseT > 0.2 && !e.slashed){
      e.slashed = true;
      const n = 6;
      for(let i=0;i<n;i++){
        const aa = (i/n)*Math.PI*2 + e.phaseT;
        entities.push(createBullet(e.x, e.y, aa, 'enemy', {speed:130}));
      }
    }
    if(e.phaseT > 0.9){ e.phase = 0; e.phaseT = 0; e.slashed = false; e.fireCooldown = 1.0; }
  } else {
    // Approach in a curve
    e.vx = Math.cos(a) * e.speed * 1.1 + Math.sin(a) * e.speed * 0.5;
    e.vy = Math.sin(a) * e.speed * 1.1 - Math.cos(a) * e.speed * 0.5;
    e.fireCooldown -= dt;
    if(e.fireCooldown <= 0){
      e.chargeAngle = a;
      e.phase = 1; e.phaseT = 0;
      emit(e.x, e.y, 16, '#27ae60', 50, 150, 0.35);
    }
  }
  e.x += e.vx * dt; e.y += e.vy * dt;
  e.x = clamp(e.x, 14, worldW - 14);
  e.y = clamp(e.y, 14, worldH - 16);
}

// BOMBARDIER (L8): slow turret — fires homing missiles (slow-turn) + ring bursts.
function updateBomber(e, dt){
  e.phaseT += dt;
  const dx = player.x - e.x, dy = player.y - e.y;
  const d = Math.hypot(dx, dy);
  const a = Math.atan2(dy, dx);
  // Drift slowly toward center; back off if player gets close
  const cx = worldW/2, cy = worldH/2;
  const ax = Math.atan2(cy - e.y, cx - e.x);
  if(d < 70){ e.vx = -Math.cos(a) * e.speed; e.vy = -Math.sin(a) * e.speed; }
  else      { e.vx = Math.cos(ax) * e.speed * 0.5; e.vy = Math.sin(ax) * e.speed * 0.5; }
  e.fireCooldown -= dt;
  if(e.fireCooldown <= 0){
    if(e.firePhase % 3 === 2){
      // Ring of slow shells
      const n = 12;
      for(let i=0;i<n;i++){
        const aa = (i/n)*Math.PI*2 + e.phaseT*0.4;
        entities.push(createBullet(e.x, e.y, aa, 'enemy', {speed:90}));
      }
    } else {
      // Volley of 3 homing missiles (enemy-side homing)
      for(let i=-1;i<=1;i++){
        entities.push(createBullet(e.x, e.y, a + i*0.4, 'enemy', {
          speed: 110, homing: true, life: 3.5, sprite: SPR.bullet_homing, radius: 2
        }));
      }
      emit(e.x, e.y, 6, '#e67e22', 40, 110, 0.3);
    }
    e.firePhase = (e.firePhase || 0) + 1;
    e.fireCooldown = 1.6;
  }
  e.x += e.vx * dt; e.y += e.vy * dt;
  e.x = clamp(e.x, 16, worldW - 16);
  e.y = clamp(e.y, 16, worldH - 20);
}

// PHANTOM (L9): teleporting summoner of clones. Real boss is darker; clones flicker.
function updatePhantom(e, dt){
  e.phaseT += dt;
  const dx = player.x - e.x, dy = player.y - e.y;
  const d = Math.hypot(dx, dy);
  const a = Math.atan2(dy, dx);
  // Keep distance and strafe
  if(d < 90){ e.vx = -Math.cos(a) * e.speed; e.vy = -Math.sin(a) * e.speed; }
  else { e.vx = -Math.sin(a) * e.speed * 0.7; e.vy = Math.cos(a) * e.speed * 0.7; }
  e.fireCooldown -= dt;
  if(e.fireCooldown <= 0){
    // Spiral spray
    const n = 5;
    for(let i=0;i<n;i++){
      const aa = a + (i - (n-1)/2)*0.22 + Math.sin(e.phaseT*2)*0.3;
      entities.push(createBullet(e.x, e.y, aa, 'enemy', {speed:140}));
    }
    e.fireCooldown = 1.2;
  }
  // Teleport every ~5s, summon a pair of runner adds on arrival
  if(e.phaseT > 5){
    e.phaseT = 0;
    emit(e.x, e.y, 22, '#8e44ad', 30, 130, 0.5);
    e.x = rand(40, worldW - 40); e.y = rand(40, worldH - 40);
    emit(e.x, e.y, 22, '#aed6f1', 30, 130, 0.5);
    sfx.teleport();
    for(let i=0;i<2;i++) spawnEnemyAtEdge('runner');
  }
  e.x += e.vx * dt; e.y += e.vy * dt;
  e.x = clamp(e.x, 14, worldW - 14);
  e.y = clamp(e.y, 14, worldH - 16);
}

// NEMESIS (L10): four-phase final boss.
function updateNemesis(boss, dt){
  boss.phaseT += dt;
  if(boss.phaseT > 4.5){
    boss.phaseT = 0;
    boss.phase = (boss.phase + 1) % 4;
    boss.fireCooldown = 0.3;
  }
  const a = Math.atan2(player.y - boss.y, player.x - boss.x);
  let tvx = Math.cos(a) * boss.speed;
  let tvy = Math.sin(a) * boss.speed;
  if(boss.phase === 0){
    // Phase 0: dense ring blasts
    boss.fireCooldown -= dt;
    if(boss.fireCooldown <= 0){
      for(let i=0;i<16;i++){
        const aa = (i/16)*Math.PI*2 + boss.phaseT*0.4;
        entities.push(createBullet(boss.x, boss.y, aa, 'enemy', {speed:130}));
      }
      boss.fireCooldown = 1.2;
    }
  } else if(boss.phase === 1){
    // Phase 1: charging spread, faster pursuit
    tvx *= 2.6; tvy *= 2.6;
    boss.fireCooldown -= dt;
    if(boss.fireCooldown <= 0){
      for(let i=-2;i<=2;i++){
        entities.push(createBullet(boss.x, boss.y, a + i*0.15, 'enemy', {speed:170}));
      }
      boss.fireCooldown = 0.55;
    }
  } else if(boss.phase === 2){
    // Phase 2: summon adds + homing missiles
    boss.fireCooldown -= dt;
    if(boss.fireCooldown <= 0){
      const k = ['shooter','runner','tank'][Math.floor(Math.random()*3)];
      spawnEnemyAtEdge(k);
      entities.push(createBullet(boss.x, boss.y, a, 'enemy', {
        speed: 120, homing: true, life: 3.5, sprite: SPR.bullet_homing, radius: 2
      }));
      boss.fireCooldown = 1.1;
    }
  } else {
    // Phase 3: spiral barrage, strafing
    tvx = -Math.sin(a) * boss.speed * 1.4;
    tvy = Math.cos(a) * boss.speed * 1.4;
    boss.fireCooldown -= dt;
    if(boss.fireCooldown <= 0){
      for(let i=0;i<3;i++){
        const aa = boss.phaseT * 4 + i * (Math.PI*2/3);
        entities.push(createBullet(boss.x, boss.y, aa, 'enemy', {speed:150}));
      }
      boss.fireCooldown = 0.12;
    }
  }
  boss.vx = tvx; boss.vy = tvy;
  boss.x += boss.vx * dt;
  boss.y += boss.vy * dt;
  boss.x = clamp(boss.x, 20, worldW - 20);
  boss.y = clamp(boss.y, 20, worldH - 24);
}

function updateBullet(b, dt){
  // Homing: steer toward a target each tick. Player bullets seek nearest enemy;
  // enemy bullets seek the player.
  if(b.homing){
    let target = null;
    if(b.owner === 'player'){
      let nd = Infinity;
      for(const en of entities){
        if(en.type !== 'enemy' || en.dead) continue;
        const dd = dist2(b, en);
        if(dd < nd){ nd = dd; target = en; }
      }
    } else {
      target = player;
    }
    if(target){
      const desired = Math.atan2(target.y - b.y, target.x - b.x);
      const cur = Math.atan2(b.vy, b.vx);
      let diff = desired - cur;
      while(diff > Math.PI) diff -= Math.PI * 2;
      while(diff < -Math.PI) diff += Math.PI * 2;
      const turn = clamp(diff, -4 * dt, 4 * dt);
      const ang = cur + turn;
      const sp = Math.hypot(b.vx, b.vy);
      b.vx = Math.cos(ang) * sp;
      b.vy = Math.sin(ang) * sp;
      b.angle = ang;
      // Sparkle trail
      if(Math.random() < 0.3) emit(b.x, b.y, 1, '#e91e63', 10, 30, 0.2);
    }
  }
  b.x += b.vx * dt;
  b.y += b.vy * dt;
  b.life -= dt;
  // Plasma bouncing: reflect off the world edges until bounces are used up.
  if(b.bounces && b.bounces > 0){
    let bounced = false;
    if(b.x < 4){ b.x = 4; b.vx = Math.abs(b.vx); bounced = true; }
    else if(b.x > worldW - 4){ b.x = worldW - 4; b.vx = -Math.abs(b.vx); bounced = true; }
    if(b.y < 4){ b.y = 4; b.vy = Math.abs(b.vy); bounced = true; }
    else if(b.y > worldH - 4){ b.y = worldH - 4; b.vy = -Math.abs(b.vy); bounced = true; }
    if(bounced){
      b.bounces--;
      b.angle = Math.atan2(b.vy, b.vx);
      if(b.hitSet) b.hitSet.clear();
      emit(b.x, b.y, 3, '#aed6f1', 40, 100, 0.18);
    }
  }
  if(b.life <= 0 || b.x < -12 || b.x > worldW+12 || b.y < -12 || b.y > worldH+12){
    if(b.isGrenade && b.life <= 0){
      // Detonate at end of fuse.
      explode(b.x, b.y, b.explodeRadius || 32, b.explodeDmg || 3);
    }
    b.dead = true;
  }
}
function updatePickup(p, dt){
  p.life -= dt;
  if(p.life <= 0) p.dead = true;
  // Magnet powerup pulls nearby pickups toward the player.
  // Radius is 5× the player's diameter — see "pull pickups 10s" in drawHowTo.
  if(player.magnetTime > 0){
    const dx = player.x - p.x, dy = player.y - p.y;
    const d = Math.hypot(dx, dy);
    const magnetRange = player.radius * 10;
    if(d > 1 && d <= magnetRange){
      const pull = 200;
      p.x += (dx/d) * pull * dt;
      p.y += (dy/d) * pull * dt;
    }
  }
}

// MENU HANDLERS
// ============================================================
function handleMenu(){
  if(!mouse.clicked) return;
  if(state === STATE.MENU){
    const gb = guideButtonRect();
    if(clickedRect(gb.x, gb.y, gb.w, gb.h)){
      state = STATE.HOWTO; stateTime = 0;
      return;
    }
    for(let i = 0; i < LEVELS.length; i++){
      const b = levelBoxRect(i);
      if(clickedRect(b.x, b.y, b.w, b.h)){
        selectedLevel = i;
        state = STATE.CHARACTER_SELECT;
        stateTime = 0;
        initAudio();
        return;
      }
    }
  } else if(state === STATE.HOWTO){
    state = STATE.MENU; stateTime = 0;
  }
}
function handleLevelComplete(){
  if(!mouse.clicked || stateTime < 0.4) return;
  const btns = levelCompleteButtons();
  if(clickedRect(btns.leave.x, btns.leave.y, btns.leave.w, btns.leave.h)){
    state = STATE.MENU; stateTime = 0;
    return;
  }
  if(clickedRect(btns.cont.x, btns.cont.y, btns.cont.w, btns.cont.h)){
    if(levelIdx + 1 < LEVELS.length){
      selectedLevel = levelIdx + 1;
      startLevel(levelIdx + 1);
    } else {
      state = STATE.MENU; stateTime = 0;
    }
  }
}
function handleEndScreen(){
  if(mouse.clicked && stateTime > 0.7){ state = STATE.MENU; stateTime = 0; }
}
