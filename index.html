// DRAW
// ============================================================
// ---- Themed level backgrounds ----
const THEMES = {
  menu:   { bg:'#181828', tile:'#1f1f34', border:'#3d3d5c', decor:null,    name:'ARENA' },
  arena:  { bg:'#181828', tile:'#1f1f34', border:'#3d3d5c', decor:'arena', name:'ARENA' },
  lava:   { bg:'#2a0a08', tile:'#3f1410', border:'#7a2c1c', decor:'lava',  name:'LAVA'  },
  ice:    { bg:'#0a2030', tile:'#103044', border:'#2a6688', decor:'ice',   name:'ICE'   },
  forest: { bg:'#0a1e10', tile:'#10301a', border:'#2a5536', decor:'forest',name:'FOREST'},
  void:   { bg:'#10081a', tile:'#1c0d2e', border:'#3d2453', decor:'void',  name:'VOID'  }
};
const THEME_ORDER = ['arena', 'lava', 'ice', 'forest', 'void'];
function themeForLevel(idx){
  return THEMES[THEME_ORDER[Math.min(THEME_ORDER.length - 1, Math.floor(idx / 3))]];
}
// Deterministic pseudo-random for decoration placement; same input -> same output.
function srand(seed){ return ((seed * 9301 + 49297) % 233280) / 233280; }

// `bw`/`bh` are the dims to fill — viewport (W/H) for menus, world (worldW/worldH)
// for active gameplay (so a 2x level paints its full arena, not just the screen).
function drawBackground(theme, idx, bw, bh){
  ctx.fillStyle = theme.bg;
  ctx.fillRect(0, 0, bw, bh);
  ctx.fillStyle = theme.tile;
  for(let x = 0; x < bw; x += 16){
    for(let y = 0; y < bh; y += 16){
      if(((x/16) + (y/16)) % 2 === 0) ctx.fillRect(x, y, 16, 16);
    }
  }
  if(theme.decor) drawDecor(theme.decor, idx, bw, bh);
  ctx.strokeStyle = theme.border;
  ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, bw - 2, bh - 2);
}

function drawDecor(kind, idx, bw, bh){
  const seedBase = idx * 100 + 1;
  // Scale decoration counts with area so a 2x-larger arena doesn't look bare.
  const areaScale = (bw * bh) / (W * H);
  if(kind === 'lava'){
    // Glowing magma blobs at fixed positions, ember specks pulsing.
    const blobs = Math.round(14 * areaScale);
    for(let i = 0; i < blobs; i++){
      const x = srand(seedBase + i*2) * (bw - 20) + 10;
      const y = srand(seedBase + i*2 + 1) * (bh - 20) + 10;
      const r = 3 + srand(seedBase + i*2 + 50) * 3;
      const pulse = 0.55 + 0.45 * Math.sin(stateTime * 1.6 + i);
      ctx.fillStyle = '#7a1c10';
      ctx.fillRect(Math.floor(x - r), Math.floor(y - r), r*2, r*2);
      ctx.globalAlpha = pulse;
      ctx.fillStyle = '#e67e22';
      ctx.fillRect(Math.floor(x - r + 1), Math.floor(y - r + 1), r*2 - 2, r*2 - 2);
      ctx.fillStyle = '#f1c40f';
      ctx.fillRect(Math.floor(x - 1), Math.floor(y - 1), 2, 2);
      ctx.globalAlpha = 1;
    }
    // Ember specks
    const embers = Math.round(60 * areaScale);
    for(let i = 0; i < embers; i++){
      const x = (srand(seedBase + i + 500) * bw) | 0;
      const y = (srand(seedBase + i + 600) * bh) | 0;
      ctx.globalAlpha = 0.35 + 0.35 * Math.sin(stateTime * 2 + i);
      ctx.fillStyle = i % 3 === 0 ? '#f39c12' : '#e74c3c';
      ctx.fillRect(x, y, 1, 1);
    }
    ctx.globalAlpha = 1;
  } else if(kind === 'ice'){
    // Frost crystals at fixed spots
    const crystals = Math.round(20 * areaScale);
    for(let i = 0; i < crystals; i++){
      const x = (srand(seedBase + i*2) * (bw - 16) + 8) | 0;
      const y = (srand(seedBase + i*2 + 1) * (bh - 16) + 8) | 0;
      ctx.fillStyle = '#aed6f1';
      ctx.fillRect(x, y - 2, 1, 5);
      ctx.fillRect(x - 2, y, 5, 1);
      ctx.fillStyle = '#fff';
      ctx.fillRect(x, y, 1, 1);
    }
    // Drifting snow (animated)
    const flakes = Math.round(50 * areaScale);
    for(let i = 0; i < flakes; i++){
      const baseX = srand(seedBase + i + 700) * bw;
      const baseY = srand(seedBase + i + 800) * bh;
      const drift = (stateTime * (10 + (i % 5) * 4)) % bh;
      const x = baseX | 0;
      const y = ((baseY + drift) % bh) | 0;
      ctx.globalAlpha = 0.4 + 0.3 * ((i % 3) / 3);
      ctx.fillStyle = '#fff';
      ctx.fillRect(x, y, 1, 1);
    }
    ctx.globalAlpha = 1;
  } else if(kind === 'forest'){
    // Leaf clusters (small green dot groups)
    const leaves = Math.round(28 * areaScale);
    for(let i = 0; i < leaves; i++){
      const cx = (srand(seedBase + i*2) * (bw - 20) + 10) | 0;
      const cy = (srand(seedBase + i*2 + 1) * (bh - 20) + 10) | 0;
      ctx.fillStyle = '#1e6840';
      ctx.fillRect(cx, cy, 2, 2);
      ctx.fillStyle = '#27ae60';
      ctx.fillRect(cx + 2, cy, 1, 1);
      ctx.fillRect(cx, cy + 2, 1, 1);
      ctx.fillStyle = '#52be80';
      ctx.fillRect(cx + 1, cy + 1, 1, 1);
    }
    // Dark patches / underbrush
    const patches = Math.round(10 * areaScale);
    for(let i = 0; i < patches; i++){
      const x = (srand(seedBase + i + 900) * (bw - 30) + 4) | 0;
      const y = (srand(seedBase + i + 950) * (bh - 30) + 4) | 0;
      ctx.fillStyle = '#081608';
      ctx.fillRect(x, y, 8 + (i % 5), 4 + (i % 3));
    }
  } else if(kind === 'void'){
    // Stars at fixed positions with twinkle
    const stars = Math.round(70 * areaScale);
    for(let i = 0; i < stars; i++){
      const x = (srand(seedBase + i*2) * bw) | 0;
      const y = (srand(seedBase + i*2 + 1) * bh) | 0;
      const tw = 0.3 + 0.7 * Math.abs(Math.sin(stateTime * 1.5 + i * 0.7));
      ctx.globalAlpha = tw;
      ctx.fillStyle = (i % 8 === 0) ? '#bb8fce' : '#fff';
      ctx.fillRect(x, y, 1, 1);
      // Occasional larger sparkle
      if(i % 12 === 0){
        ctx.fillStyle = '#9b59b6';
        ctx.fillRect(x - 1, y, 3, 1);
        ctx.fillRect(x, y - 1, 1, 3);
      }
    }
    ctx.globalAlpha = 1;
  } else if(kind === 'arena'){
    // Subtle blue accent dots
    const dots = Math.round(12 * areaScale);
    for(let i = 0; i < dots; i++){
      const x = (srand(seedBase + i*2) * bw) | 0;
      const y = (srand(seedBase + i*2 + 1) * bh) | 0;
      ctx.globalAlpha = 0.5 + 0.4 * Math.sin(stateTime * 1.2 + i * 0.6);
      ctx.fillStyle = '#5dade2';
      ctx.fillRect(x, y, 1, 1);
    }
    ctx.globalAlpha = 1;
  }
}

// Screen shake disabled per user request — the shakeTime / shakeAmt assignments
// scattered through combat code still run (harmless) but no offset is applied here.
function draw(){
  ctx.save();

  // Game states render the world (entities, particles, themed background) inside a
  // camera-translated transform so 2x-arena levels can scroll. Menus / character
  // select / how-to are pure screen-space, no translation.
  const useGameTheme = state === STATE.PLAYING || state === STATE.LEVEL_COMPLETE
                    || state === STATE.GAME_OVER || state === STATE.VICTORY;

  if(useGameTheme){
    ctx.save();
    ctx.translate(-Math.floor(camX), -Math.floor(camY));
    drawBackground(themeForLevel(levelIdx), levelIdx, worldW, worldH);
    drawGame();
    ctx.restore();
    drawHUD();
    if(state === STATE.LEVEL_COMPLETE) drawLevelComplete();
    else if(state === STATE.GAME_OVER) drawGameOver();
    else if(state === STATE.VICTORY) drawVictory();
    else if(state === STATE.PLAYING && paused) drawPause();
  } else {
    drawBackground(THEMES.menu, 0, W, H);
    if(state === STATE.MENU) drawMenu();
    else if(state === STATE.HOWTO) drawHowTo();
    else if(state === STATE.CHARACTER_SELECT) drawCharacterSelect();
    else if(state === STATE.ASSISTANT_SELECT) drawAssistantSelect();
  }

  ctx.restore();
}

// Dim overlay + banner shown while the game is paused (Space). Screen-space.
function drawPause(){
  ctx.fillStyle = 'rgba(8,8,16,0.62)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#f1c40f';
  ctx.font = 'bold 24px monospace';
  ctx.fillText('PAUSED', W/2, H/2 - 4);
  ctx.fillStyle = '#bdc3c7';
  ctx.font = 'bold 8px monospace';
  ctx.fillText('PRESS SPACE OR CLICK TO RESUME', W/2, H/2 + 16);
  ctx.textAlign = 'left';
}

// World-space drawing only: entities and particles. HUD is screen-space and
// is called by `draw()` after the camera translate is restored.
function drawGame(){
  const list = entities.slice().sort((a,b) => a.y - b.y);
  for(const e of list){
    if(e.dead) continue;
    if(e.type === 'player') drawPlayer(e);
    else if(e.type === 'enemy') drawEnemy(e);
    else if(e.type === 'bullet') drawBulletEntity(e);
    else if(e.type === 'pickup') drawPickupEntity(e);
    else if(e.type === 'companion') drawCompanion(e);
    else if(e.type === 'sword_ally') drawSwordAlly(e);
    else if(e.type === 'henchman') drawHenchman(e);
    else if(e.type === 'nunchaku') drawNunchaku(e);
    else if(e.type === 'bomber_ally') drawBomberAlly(e);
    else if(e.type === 'poison_ally') drawPoisonAlly(e);
  }
  for(const p of particles){
    const a = clamp(p.life / p.maxLife, 0, 1);
    ctx.globalAlpha = a;
    if(p.beam){
      // Scout's straight laser beam: a line from the muzzle along its angle,
      // fading as it ages. Drawn as a translucent wide glow + a bright thin core
      // so the three beams read as solid beams of light, not projectiles.
      const ex = p.x + Math.cos(p.angle) * p.len;
      const ey = p.y + Math.sin(p.angle) * p.len;
      ctx.lineCap = 'round';
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 3;
      ctx.globalAlpha = a * 0.4;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.strokeStyle = '#eaffff';
      ctx.lineWidth = 1;
      ctx.globalAlpha = a;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.lineCap = 'butt';
    } else if(p.ring){
      // Expanding shockwave outline (e.g. the B-blast circle AoE): the radius
      // grows from r0 -> r1 as the particle ages, tracing the damage area.
      const r = p.r0 + (p.r1 - p.r0) * (1 - a);
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      ctx.fillStyle = p.color;
      ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
    }
  }
  ctx.globalAlpha = 1;
}

function drawPlayer(p){
  if(p.invuln > 0 && Math.floor(p.invuln * 18) % 2) return;
  // Syed's katana: render the wide OBTUSE slash arc while RMB held + energy left,
  // so the attack's obtuse angle is visible in-game (drawn under the sprite).
  if(p.char === 'soldier' && mouse.rdown && p.energy > 0){
    ctx.save();
    ctx.fillStyle = 'rgba(232,238,242,0.16)';
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.arc(p.x, p.y, KATANA_RANGE, p.angle - KATANA_HALF, p.angle + KATANA_HALF);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(p.x, p.y, KATANA_RANGE, p.angle - KATANA_HALF, p.angle + KATANA_HALF);
    ctx.stroke();
    ctx.restore();
  }
  const pair = playerSprites(p.char);
  const sp = p.frame === 0 ? pair.a : pair.b;
  if(p.hitFlash > 0){
    drawSpriteTinted(sp, Math.floor(p.x - sp.w/2), Math.floor(p.y - sp.h/2), '#fff');
  } else {
    drawSpriteCentered(sp, p.x, p.y);
  }
  // Gun (color depends on active weapon)
  ctx.save();
  ctx.translate(Math.floor(p.x), Math.floor(p.y));
  ctx.rotate(p.angle);
  let gunCol = '#2c3e50', tipCol = '#95a5a6';
  if(p.rocketAmmo > 0){ gunCol = '#5d4037'; tipCol = '#e67e22'; }
  else if(p.laserTime > 0){ gunCol = '#27ae60'; tipCol = '#f1c40f'; }
  else if(p.homingTime > 0){ gunCol = '#7d3c98'; tipCol = '#e91e63'; }
  else if(p.plasmaTime > 0){ gunCol = '#21618c'; tipCol = '#3498db'; }
  else if(p.spreadTime > 0){ gunCol = '#7d6608'; tipCol = '#f1c40f'; }
  else if(p.minigunTime > 0){ gunCol = '#4a4a4a'; tipCol = '#bdc3c7'; }
  else if(p.rapidTime > 0){ gunCol = '#a04000'; tipCol = '#e67e22'; }
  // Tank firing the flamethrower: dark nozzle + red-orange tip
  if(p.char === 'tank' && mouse.rdown && p.fuel > 0){ gunCol = '#1a1a1a'; tipCol = '#e74c3c'; }
  // Soldier knife slash / Scout laser: light the barrel while RMB held
  if(p.char === 'soldier' && mouse.rdown && p.energy > 0){ gunCol = '#7f8c8d'; tipCol = '#ecf0f1'; }  // steel knife
  if(p.char === 'scout' && mouse.rdown){ gunCol = '#1b4f72'; tipCol = '#4fc3f7'; }  // blue laser barrel
  if(p.damageTime > 0){ tipCol = '#e74c3c'; }  // Damage buff: red barrel tip
  ctx.fillStyle = gunCol;
  ctx.fillRect(0, -1, 8, 3);
  ctx.fillStyle = tipCol;
  ctx.fillRect(6, -1, 3, 3);
  ctx.restore();
  // Shield ring
  if(p.shieldHp > 0){
    ctx.strokeStyle = '#1abc9c';
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(stateTime * 8);
    ctx.beginPath();
    ctx.arc(Math.floor(p.x), Math.floor(p.y), 9, 0, Math.PI*2);
    ctx.stroke();
    ctx.globalAlpha = 1;
    // Shield pips
    ctx.fillStyle = '#1abc9c';
    for(let i=0;i<p.shieldHp;i++){
      const a = -Math.PI/2 + (i - (p.shieldHp-1)/2)*0.35;
      ctx.fillRect(Math.floor(p.x + Math.cos(a)*9) - 1, Math.floor(p.y + Math.sin(a)*9) - 1, 2, 2);
    }
  }
}

function drawEnemy(e){
  let sp;
  switch(e.kind){
    case 'grunt':   sp = e.frame === 0 ? SPR.grunt_a : SPR.grunt_b; break;
    case 'runner':  sp = e.frame === 0 ? SPR.runner_a : SPR.runner_b; break;
    case 'tank':    sp = e.frame === 0 ? SPR.tank_a : SPR.tank_b; break;
    case 'shooter': sp = e.frame === 0 ? SPR.shooter_a : SPR.shooter_b; break;
    case 'charger': sp = e.frame === 0 ? SPR.charger_a : SPR.charger_b; break;
    case 'exploder':sp = e.frame === 0 ? SPR.exploder_a : SPR.exploder_b; break;
    case 'swarmer': sp = e.frame === 0 ? SPR.swarmer_a : SPR.swarmer_b; break;
    case 'bruiser': sp = SPR.bruiser; break;
    case 'sniper':  sp = SPR.sniper; break;
    case 'splitter': sp = SPR.splitter; break;
    case 'splitter_mid': sp = SPR.splitter_mid; break;
    case 'splitter_mini': sp = SPR.splitter_mini; break;
    case 'summoner': sp = SPR.summoner; break;
    case 'overlord': sp = SPR.overlord; break;
    case 'twin':     sp = SPR.twin; break;
    case 'reaper':   sp = SPR.reaper; break;
    case 'bomber':   sp = SPR.bomber; break;
    case 'phantom':  sp = SPR.phantom; break;
    case 'nemesis':  sp = SPR.nemesis; break;
  }
  if(!sp) return;
  // Charger telegraph (phase 1: locked aim flash)
  if(e.kind === 'charger' && e.phase === 1){
    ctx.strokeStyle = '#e74c3c';
    ctx.globalAlpha = 0.5 + 0.4 * Math.sin(stateTime * 28);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(Math.floor(e.x), Math.floor(e.y));
    ctx.lineTo(Math.floor(e.x + Math.cos(e.chargeAngle)*120), Math.floor(e.y + Math.sin(e.chargeAngle)*120));
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // Sniper telegraph
  if(e.kind === 'sniper' && e.telegraphActive){
    ctx.strokeStyle = '#1abc9c';
    ctx.globalAlpha = 0.4 + 0.4 * Math.sin(stateTime * 30);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(Math.floor(e.x), Math.floor(e.y));
    ctx.lineTo(Math.floor(e.x + Math.cos(e.telegraphAngle)*300), Math.floor(e.y + Math.sin(e.telegraphAngle)*300));
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  if(e.hitFlash > 0){
    drawSpriteTinted(sp, Math.floor(e.x - sp.w/2), Math.floor(e.y - sp.h/2), '#fff');
  } else {
    drawSpriteCentered(sp, e.x, e.y);
  }
  // HP bar for multi-HP non-boss
  if(e.maxHp > 1 && e.hp < e.maxHp && !e.isBoss){
    const w = sp.w;
    ctx.fillStyle = '#222';
    ctx.fillRect(Math.floor(e.x - w/2), Math.floor(e.y - sp.h/2) - 3, w, 2);
    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(Math.floor(e.x - w/2), Math.floor(e.y - sp.h/2) - 3, Math.floor(w * (e.hp / e.maxHp)), 2);
  }
}

function drawSwordAlly(s){
  // Slash arc renders behind the sprite.
  if(s.swingTime > 0){
    const half = s.attackArc / 2;
    const t = clamp(s.swingTime / 0.18, 0, 1);
    ctx.save();
    ctx.fillStyle = 'rgba(241, 196, 15, ' + (0.18 + 0.32 * t) + ')';
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.arc(s.x, s.y, s.attackRange, s.angle - half, s.angle + half);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 255, 255, ' + (0.5 * t) + ')';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }
  if(s.invuln > 0 && Math.floor(s.invuln * 20) % 2) return;
  const sp = s.frame === 0 ? SPR.sword_ally_a : SPR.sword_ally_b;
  if(s.hitFlash > 0){
    drawSpriteTinted(sp, Math.floor(s.x - sp.w/2), Math.floor(s.y - sp.h/2), '#fff');
  } else {
    drawSpriteCentered(sp, s.x, s.y);
  }
  // Tiny HP pips above.
  ctx.fillStyle = '#0a0a14';
  ctx.fillRect(Math.floor(s.x) - 5, Math.floor(s.y - sp.h/2) - 3, 11, 2);
  ctx.fillStyle = '#f1c40f';
  ctx.fillRect(Math.floor(s.x) - 5, Math.floor(s.y - sp.h/2) - 3, Math.floor(11 * (s.hp / s.maxHp)), 2);
}

function drawHenchman(s){
  // Wooden swing arc renders behind the sprite.
  if(s.swingTime > 0){
    const half = s.attackArc / 2;
    const t = clamp(s.swingTime / 0.2, 0, 1);
    ctx.save();
    ctx.fillStyle = 'rgba(200, 146, 58, ' + (0.16 + 0.30 * t) + ')';
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.arc(s.x, s.y, s.attackRange, s.angle - half, s.angle + half);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 235, 200, ' + (0.45 * t) + ')';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }
  if(s.invuln > 0 && Math.floor(s.invuln * 20) % 2) return;
  const sp = s.frame === 0 ? SPR.henchman_a : SPR.henchman_b;
  if(s.hitFlash > 0){
    drawSpriteTinted(sp, Math.floor(s.x - sp.w/2), Math.floor(s.y - sp.h/2), '#fff');
  } else {
    drawSpriteCentered(sp, s.x, s.y);
  }
  // HP pips above.
  ctx.fillStyle = '#0a0a14';
  ctx.fillRect(Math.floor(s.x) - 6, Math.floor(s.y - sp.h/2) - 3, 13, 2);
  ctx.fillStyle = '#c0392b';
  ctx.fillRect(Math.floor(s.x) - 6, Math.floor(s.y - sp.h/2) - 3, Math.floor(13 * (s.hp / s.maxHp)), 2);
}

function drawCompanion(c){
  if(c.invuln > 0 && Math.floor(c.invuln * 18) % 2) return;
  const sp = c.frame === 0 ? SPR.companion_a : SPR.companion_b;
  if(c.hitFlash > 0){
    drawSpriteTinted(sp, Math.floor(c.x - sp.w/2), Math.floor(c.y - sp.h/2), '#fff');
  } else {
    drawSpriteCentered(sp, c.x, c.y);
  }
  // Tiny HP pips above
  ctx.fillStyle = '#0a0a14';
  ctx.fillRect(Math.floor(c.x) - 4, Math.floor(c.y - sp.h/2) - 3, 9, 2);
  ctx.fillStyle = '#3498db';
  ctx.fillRect(Math.floor(c.x) - 4, Math.floor(c.y - sp.h/2) - 3, Math.floor(9 * (c.hp / c.maxHp)), 2);
}

// Shared helper: draw an ally sprite (with hit-flash + invuln blink) and an HP bar.
function drawAllySprite(s, sprA, sprB, pipColor, halfW){
  if(s.invuln > 0 && Math.floor(s.invuln * 20) % 2) return;
  const sp = s.frame === 0 ? sprA : sprB;
  if(s.hitFlash > 0){
    drawSpriteTinted(sp, Math.floor(s.x - sp.w/2), Math.floor(s.y - sp.h/2), '#fff');
  } else {
    drawSpriteCentered(sp, s.x, s.y);
  }
  const w = halfW * 2 + 1;
  ctx.fillStyle = '#0a0a14';
  ctx.fillRect(Math.floor(s.x) - halfW, Math.floor(s.y - sp.h/2) - 3, w, 2);
  ctx.fillStyle = pipColor;
  ctx.fillRect(Math.floor(s.x) - halfW, Math.floor(s.y - sp.h/2) - 3, Math.floor(w * (s.hp / s.maxHp)), 2);
}

function drawNunchaku(s){
  // Quick white strike arc behind the sprite.
  if(s.swingTime > 0){
    const half = s.attackArc / 2;
    const t = clamp(s.swingTime / 0.2, 0, 1);
    ctx.save();
    ctx.fillStyle = 'rgba(236, 240, 241, ' + (0.16 + 0.30 * t) + ')';
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.arc(s.x, s.y, s.attackRange, s.angle - half, s.angle + half);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 255, 255, ' + (0.55 * t) + ')';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }
  drawAllySprite(s, SPR.nunchaku_a, SPR.nunchaku_b, '#ecf0f1', 5);
}

function drawBomberAlly(s){
  drawAllySprite(s, SPR.bomber_a, SPR.bomber_b, '#e67e22', 5);
}

function drawPoisonAlly(s){
  // Translucent green aura ring (the actual damage zone).
  if(s.invuln <= 0 || Math.floor(s.invuln * 20) % 2 === 0){
    ctx.save();
    const pulse = 0.10 + 0.05 * Math.sin(stateTime * 4);
    ctx.fillStyle = 'rgba(39, 174, 96, ' + pulse + ')';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.auraRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(46, 204, 113, 0.35)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }
  drawAllySprite(s, SPR.poison_a, SPR.poison_b, '#27ae60', 5);
}

function drawBulletEntity(b){
  ctx.save();
  ctx.translate(Math.floor(b.x), Math.floor(b.y));
  ctx.rotate(b.angle);
  const sp = b.sprite;
  drawSprite(sp, -Math.floor(sp.w/2), -Math.floor(sp.h/2));
  ctx.restore();
  if(b.pierce){
    // glow trail
    ctx.fillStyle = '#27ae60';
    ctx.globalAlpha = 0.4;
    ctx.fillRect(Math.floor(b.x)-1, Math.floor(b.y)-1, 3, 3);
    ctx.globalAlpha = 1;
  }
}

function drawPickupEntity(p){
  if(p.life < 3 && Math.floor(p.life * 6) % 2) return;
  const sprMap = {
    health: SPR.p_health, spread: SPR.p_spread, rapid: SPR.p_rapid,
    shield: SPR.p_shield, rocket: SPR.p_rocket, laser: SPR.p_laser,
    minigun: SPR.p_minigun, plasma: SPR.p_plasma, homing: SPR.p_homing,
    speed: SPR.p_speed,   damage: SPR.p_damage, slowmo: SPR.p_slowmo,
    score2x: SPR.p_score, magnet: SPR.p_magnet,
    fuel: SPR.p_fuel,     armor: SPR.p_armor,
    beverage: SPR.p_beverage, battery: SPR.p_battery
  };
  const sp = sprMap[p.kind];
  if(!sp) return;
  const off = Math.sin(stateTime * 6 + p.x) * 1.2;
  const glowColors = {
    health:'#e74c3c', spread:'#f1c40f', rapid:'#e67e22',
    shield:'#1abc9c', rocket:'#bdc3c7', laser:'#27ae60',
    minigun:'#bdc3c7', plasma:'#3498db', homing:'#e91e63',
    speed:'#e91e63',  damage:'#e74c3c', slowmo:'#3498db',
    score2x:'#f1c40f', magnet:'#e74c3c',
    fuel:'#e67e22',   armor:'#3498db',
    beverage:'#2ecc71', battery:'#19f0ff'
  };
  ctx.fillStyle = glowColors[p.kind] || '#fff';
  ctx.globalAlpha = 0.2 + 0.2 * Math.sin(stateTime * 8);
  ctx.fillRect(Math.floor(p.x) - sp.w/2 - 1, Math.floor(p.y + off) - sp.h/2 - 1, sp.w + 2, sp.h + 2);
  ctx.globalAlpha = 1;
  drawSpriteCentered(sp, p.x, p.y + off);
}

function drawHUD(){
  // HP
  ctx.fillStyle = '#000';
  ctx.fillRect(6, 6, 66, 10);
  ctx.fillStyle = '#3a1010';
  ctx.fillRect(7, 7, 64, 8);
  ctx.fillStyle = '#e74c3c';
  ctx.fillRect(7, 7, Math.floor(64 * (player.hp / player.maxHp)), 8);
  ctx.font = 'bold 8px monospace';
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  ctx.fillText('HP', 9, 14);

  // Shield bar below HP
  if(player.shieldHp > 0){
    ctx.fillStyle = '#000';
    ctx.fillRect(6, 18, 66, 6);
    ctx.fillStyle = '#0f3a35';
    ctx.fillRect(7, 19, 64, 4);
    ctx.fillStyle = '#1abc9c';
    ctx.fillRect(7, 19, Math.floor(64 * (player.shieldHp / player.shieldMax)), 4);
  }
  // Fuel bar (Tank only) — never auto-regens; refilled by fuel pickup.
  if(player.maxFuel > 0){
    const fy = player.shieldHp > 0 ? 26 : 18;
    ctx.fillStyle = '#000';
    ctx.fillRect(6, fy, 66, 6);
    ctx.fillStyle = '#3a1a08';
    ctx.fillRect(7, fy + 1, 64, 4);
    ctx.fillStyle = '#e67e22';
    ctx.fillRect(7, fy + 1, Math.floor(64 * (player.fuel / player.maxFuel)), 4);
    ctx.font = 'bold 6px monospace';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'left';
    ctx.fillText('FUEL', 8, fy + 5);
  }
  // Energy bar (Soldier only) — powers the knife slash; refilled by 'beverage'.
  // Label only, no numeric value (the bar fill conveys the ~6 s charge).
  if(player.maxEnergy > 0){
    const ey = player.shieldHp > 0 ? 26 : 18;
    ctx.fillStyle = '#000';
    ctx.fillRect(6, ey, 66, 6);
    ctx.fillStyle = '#0b2e1a';
    ctx.fillRect(7, ey + 1, 64, 4);
    ctx.fillStyle = '#2ecc71';
    ctx.fillRect(7, ey + 1, Math.floor(64 * (player.energy / player.maxEnergy)), 4);
    ctx.font = 'bold 6px monospace';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'left';
    ctx.fillText('ENERGY', 8, ey + 5);
  }
  // Power bar (Scout only) — fuels the laser beams (~20 volleys); refilled by
  // 'battery'. Label only; slowly self-regens 0.1/s. Shares the slot with FUEL/
  // ENERGY (only one of the three maxes is ever > 0).
  if(player.maxPower > 0){
    const py = player.shieldHp > 0 ? 26 : 18;
    ctx.fillStyle = '#000';
    ctx.fillRect(6, py, 66, 6);
    ctx.fillStyle = '#082a33';
    ctx.fillRect(7, py + 1, 64, 4);
    ctx.fillStyle = '#19f0ff';
    ctx.fillRect(7, py + 1, Math.floor(64 * (player.power / player.maxPower)), 4);
    ctx.font = 'bold 6px monospace';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'left';
    ctx.fillText('POWER', 8, py + 5);
  }

  // Score & level (top-right)
  ctx.font = 'bold 10px monospace';
  ctx.textAlign = 'right';
  ctx.fillStyle = '#f1c40f';
  ctx.fillText('SCORE ' + score, W - 6, 14);
  ctx.fillStyle = '#3498db';
  ctx.fillText('LVL ' + (levelIdx + 1) + '/' + LEVELS.length, W - 6, 26);

  // Active weapon row (bottom-left)
  drawWeaponHUD();

  // Enemies left
  const left = (levelData.total - spawnedCount) + entities.filter(e => e.type === 'enemy' && !e.isBoss).length;
  ctx.font = 'bold 8px monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ecf0f1';
  if(!bossSpawned){
    ctx.fillText('ENEMIES: ' + left, W/2, H - 6);
  }

  // Boss bar
  const boss = entities.find(e => e.isBoss);
  if(boss){
    ctx.fillStyle = '#000';
    ctx.fillRect(W/2 - 90, H - 26, 180, 12);
    ctx.fillStyle = '#3a1338';
    ctx.fillRect(W/2 - 89, H - 25, 178, 10);
    ctx.fillStyle = '#9b59b6';
    ctx.fillRect(W/2 - 89, H - 25, Math.floor(178 * (boss.hp / boss.maxHp)), 10);
    ctx.font = 'bold 8px monospace';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText(levelData.bossName || BOSS_NAMES[boss.kind] || 'BOSS', W/2, H - 17);
  }

  // Boss spawn flash
  if(bossSpawnPulse > 0){
    ctx.globalAlpha = bossSpawnPulse;
    ctx.fillStyle = '#9b59b6';
    ctx.font = 'bold 22px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('!! ' + (levelData.bossName || BOSS_NAMES[levelData.boss] || 'BOSS') + ' !!', W/2, H/2);
    ctx.globalAlpha = 1;
  }
}

function drawWeaponHUD(){
  // Bottom-left strip of active weapons / ammo
  let y = H - 14;
  let x = 6;
  ctx.font = 'bold 7px monospace';
  ctx.textAlign = 'left';
  const draw = (label, sp, t, max, color) => {
    if(sp){ drawSprite(sp, x, y - 7); }
    ctx.fillStyle = '#000';
    ctx.fillRect(x + 7, y - 5, 32, 5);
    ctx.fillStyle = color;
    ctx.fillRect(x + 7, y - 5, Math.floor(32 * clamp(t/max, 0, 1)), 5);
    ctx.fillStyle = '#fff';

  }
  // Passive powerups
  if(player.speedTime > 0)  draw('SPEED', SPR.p_speed,  player.speedTime,  8,  '#e91e63');
  if(player.sprintTime > 0) draw('SPRNT', SPR.p_speed,  player.sprintTime, 5,  '#1abc9c');
  if(player.damageTime > 0) draw('DMG',   SPR.p_damage, player.damageTime, 8,  '#e74c3c');

  if(player.scoreTime > 0)  draw('x2',    SPR.p_score,  player.scoreTime,  10, '#f1c40f');
  if(player.magnetTime > 0) draw('MAG',   SPR.p_magnet, player.magnetTime, 10, '#e74c3c');

  // ---- Skill cooldown row (X / C / M) ----
  drawSkillHUD();
}

function drawSkillHUD(){
  const y = H - 30;
  const ch = CHARACTERS[player.char] || CHARACTERS.soldier;
  const skillColor = { dash:'#f1c40f', blink:'#f1c40f', slowmo:'#3498db', wall:'#27ae60',
                       nuke:'#e74c3c', grenade:'#e67e22', summon:'#f1c40f', vsummon:'#f39c12', flameburst:'#e67e22',
                       barrage:'#e67e22',
                       sprint:'#1abc9c', heal:'#2ecc71', blast:'#e67e22' };
  const skills = [
    { key:'X', label:ch.skillLabels.x, cd:player.skillCd.x, max:player.skillCdMax[ch.skills.x], color:skillColor[ch.skills.x] },
    { key:'C', label:ch.skillLabels.c, cd:player.skillCd.c, max:player.skillCdMax[ch.skills.c], color:skillColor[ch.skills.c] }
  ];
  if(ch.skills.f){
    skills.push({ key:'F', label:ch.skillLabels.f, cd:player.skillCd.f, max:player.skillCdMax[ch.skills.f], color:skillColor[ch.skills.f] });
  }
  if(ch.skills.b){
    skills.push({ key:'B', label:ch.skillLabels.b, cd:player.skillCd.b, max:player.skillCdMax[ch.skills.b], color:skillColor[ch.skills.b] });
  }
  if(ch.skills.v){
    skills.push({ key:'V', label:ch.skillLabels.v, cd:player.skillCd.v, max:player.skillCdMax[ch.skills.v], color:skillColor[ch.skills.v] });
  }
  ctx.textAlign = 'left';
  let x = 6;
  for(const s of skills){
    const ready = s.cd <= 0;
    // Box background
    ctx.fillStyle = ready ? s.color : '#1a1a24';
    ctx.fillRect(x, y, 38, 12);
    ctx.strokeStyle = ready ? '#fff' : '#4a4a5e';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, 37, 11);
    // Cooldown overlay (drains down)
    if(!ready){
      const frac = clamp(s.cd / s.max, 0, 1);
      ctx.fillStyle = '#2c3e50';
      ctx.fillRect(x + 1, y + 1, Math.floor(36 * frac), 10);
    }
    // Key letter
    ctx.font = 'bold 8px monospace';
    ctx.fillStyle = ready ? '#000' : '#bdc3c7';
    ctx.fillText(s.key, x + 2, y + 9);
    // Skill name / cd seconds
    ctx.font = 'bold 7px monospace';
    ctx.fillStyle = ready ? '#000' : '#fff';
    if(ready) ctx.fillText(s.label, x + 11, y + 8);
    else ctx.fillText(s.cd.toFixed(1) + 's', x + 11, y + 8);
    x += 42;
  }
}

function guideButtonRect(){ return { x: W - 64, y: 8, w: 56, h: 16 }; }

// Geometry helper shared by drawMenu + handleMenu so click targets stay in sync.
function levelBoxRect(i){
  // 40 levels in an 8x5 grid. 26x15 boxes still fit above the HIGH SCORE line
  // at y=215; the 8-wide row spans 222px, centered with comfortable margins.
  const cols = 8, rows = 5;
  const bw = 26, bh = 15, gap = 2;
  const totalW = cols * bw + (cols - 1) * gap;
  const xs = Math.floor((W - totalW) / 2);
  const ys = 124;
  const col = i % cols, row = Math.floor(i / cols);
  return { x: xs + col * (bw + gap), y: ys + row * (bh + gap), w: bw, h: bh };
}

function charCardRect(i){

}

function handleCharacterSelect(){
  if(!mouse.clicked) return;

  if(clickedRect(bb.x, bb.y, bb.w, bb.h)){

function handleAssistantSelect(){
  if(!mouse.clicked) return;
  const bb = backButtonRect();
  if(clickedRect(bb.x, bb.y, bb.w, bb.h)){
    state = STATE.CHARACTER_SELECT; stateTime = 0; return;
  }
  for(let i = 0; i < ASSIST_ORDER.length; i++){
    const r = assistCardRect(i);
    if(clickedRect(r.x, r.y, r.w, r.h)){
      const key = ASSIST_ORDER[i];
      const idx = selectedAssistants.indexOf(key);
      if(idx >= 0){
        selectedAssistants.splice(idx, 1);
      } else if(selectedAssistants.length < 2){
        selectedAssistants.push(key);
      } else {
        // Already 2 picked — swap out the oldest so a click always does something.
        selectedAssistants.shift();
        selectedAssistants.push(key);
      }
      if(sfx.pickup) sfx.pickup();
      return;
    }
  }
  const sb = assistStartRect();
  if(selectedAssistants.length === 2 && clickedRect(sb.x, sb.y, sb.w, sb.h)){
    startSelectedRun();
  }
}

function startSelectedRun(){
  initAudio();
  score = 0;
  player = createPlayer(selectedChar);
  entities = [player];
  allies = [];
  spawnSelectedAssistants();
  particles = [];
  startLevel(selectedLevel);
}

// Instantiate the chosen assistants around the player and register them.
function spawnSelectedAssistants(){
  allies = [];
  selectedAssistants.forEach((key, idx) => {
    const a = createAssistant(key);
    positionAllyByPlayer(a, idx);
    allies.push(a);
    entities.push(a);
  });
}

// Place an ally just to the side of the player (alternating left/right).
function positionAllyByPlayer(a, idx){
  const off = idx === 0 ? -16 : 16;
  a.x = (player ? player.x : W / 2) + off;
  a.y = (player ? player.y : H / 2);
}

  return {
    leave: { x: xs, y, w: bw, h: bh },
    cont:  { x: xs + bw + gap, y, w: bw, h: bh }
  };
}

function drawLevelComplete(){
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = 'bold 20px monospace';
  ctx.fillStyle = '#27ae60';
  ctx.fillText('LEVEL ' + (levelIdx + 1) + ' CLEAR!', W/2, H/2 - 24);
  ctx.font = 'bold 10px monospace';
  ctx.fillStyle = '#fff';
  ctx.fillText('SCORE: ' + score, W/2, H/2);
  ctx.fillStyle = '#bdc3c7';
  const nextIdx = levelIdx + 1;
  if(nextIdx < LEVELS.length){
    ctx.fillText('NEXT: LEVEL ' + (nextIdx + 1) + ' — ' + (LEVELS[nextIdx].bossName || BOSS_NAMES[LEVELS[nextIdx].boss] || 'BOSS'), W/2, H/2 + 16);
  }
  // Two buttons
  const btns = levelCompleteButtons();
  const hovL = clickedRect(btns.leave.x, btns.leave.y, btns.leave.w, btns.leave.h);
  const hovC = clickedRect(btns.cont.x, btns.cont.y, btns.cont.w, btns.cont.h);
  ctx.fillStyle = hovL ? '#7f8c8d' : '#34495e';
  ctx.fillRect(btns.leave.x, btns.leave.y, btns.leave.w, btns.leave.h);
  ctx.strokeStyle = '#bdc3c7'; ctx.lineWidth = 1;
  ctx.strokeRect(btns.leave.x + 0.5, btns.leave.y + 0.5, btns.leave.w - 1, btns.leave.h - 1);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 10px monospace';
  ctx.fillText('LEAVE', btns.leave.x + btns.leave.w / 2, btns.leave.y + 15);

  ctx.fillStyle = hovC ? '#27ae60' : '#1e6840';
  ctx.fillRect(btns.cont.x, btns.cont.y, btns.cont.w, btns.cont.h);
  ctx.strokeStyle = '#52be80';
  ctx.strokeRect(btns.cont.x + 0.5, btns.cont.y + 0.5, btns.cont.w - 1, btns.cont.h - 1);
  ctx.fillStyle = '#fff';
  ctx.fillText('CONTINUE', btns.cont.x + btns.cont.w / 2, btns.cont.y + 15);
}

function drawGameOver(){
  ctx.fillStyle = 'rgba(0,0,0,0.78)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = 'bold 26px monospace';
  ctx.fillStyle = '#e74c3c';
  ctx.fillText('GAME OVER', W/2, H/2 - 12);
  ctx.font = 'bold 10px monospace';
  ctx.fillStyle = '#fff';
  ctx.fillText('FINAL SCORE: ' + score, W/2, H/2 + 14);
  ctx.fillText('LEVEL REACHED: ' + (levelIdx + 1) + '/' + LEVELS.length, W/2, H/2 + 30);
  if(score === highScore && score > 0){
    ctx.fillStyle = '#f1c40f';
    ctx.fillText('* NEW HIGH SCORE *', W/2, H/2 + 46);
  }
  if(stateTime > 0.8 && Math.floor(stateTime * 3) % 2 === 0){
    ctx.fillStyle = '#bdc3c7';
    ctx.font = 'bold 8px monospace';
    ctx.fillText('< CLICK TO RETURN TO MENU >', W/2, H/2 + 68);
  }
}

function drawVictory(){
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = 'bold 24px monospace';
  const hue = (stateTime * 60) % 360;
  ctx.fillStyle = 'hsl(' + hue + ', 75%, 60%)';
  ctx.fillText('VICTORY!', W/2, H/2 - 18);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 10px monospace';
  ctx.fillText('All ' + LEVELS.length + ' bosses fell. The arena is yours.', W/2, H/2 + 4);
  ctx.fillText('FINAL SCORE: ' + score, W/2, H/2 + 22);
  if(score === highScore && score > 0){
    ctx.fillStyle = '#f1c40f';
    ctx.fillText('* NEW HIGH SCORE *', W/2, H/2 + 38);
  }
  if(stateTime > 0.8 && Math.floor(stateTime * 3) % 2 === 0){
    ctx.fillStyle = '#bdc3c7';
    ctx.font = 'bold 8px monospace';
    ctx.fillText('< CLICK TO RETURN TO MENU >', W/2, H/2 + 60);
  }
}

// ============================================================
// MAIN LOOP
// ============================================================
let lastT = performance.now();
function loop(t){
  const dt = Math.min(0.033, (t - lastT) / 1000);
  lastT = t;
  // Hard safety cap: if some pathological path explodes the entity list,
  // strip dead entries and clamp to a sane size so the per-frame work stays bounded.
  try {
    if(entities && entities.length > 600){
      console.warn('[shooter] entity count overflow:', entities.length, '— pruning');
      entities = entities.filter(e => !e.dead);
      if(entities.length > 400){
        const keep = entities.filter(e => e.type === 'player' || isAlly(e));
        const rest = entities.filter(e => !(e.type === 'player' || isAlly(e))).slice(-380);
        entities = keep.concat(rest);
      }
    }
  } catch(err){ console.error('[shooter] prune error:', err); }
  // Update and draw are wrapped separately. If update throws (e.g. on an
  // unexpected entity shape), draw still runs so the canvas keeps animating
  // instead of looking dead-frozen.
  try { update(dt); }
  catch(err){ console.error('[shooter] update error:', err); }
  try { draw(); }
  catch(err){ console.error('[shooter] draw error:', err); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
