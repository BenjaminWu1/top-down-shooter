function drawSprite(sp, x, y){
  const rows = sp.rows, pal = sp.pal;
  for(let r=0;r<rows.length;r++){
    const row = rows[r];
    for(let c=0;c<row.length;c++){
      const col = pal[row[c]];
      if(col){ ctx.fillStyle = col; ctx.fillRect(x+c, y+r, 1, 1); }
    }
  }
}
function drawSpriteCentered(sp, x, y){
  drawSprite(sp, Math.floor(x - sp.w/2), Math.floor(y - sp.h/2));
}
function drawSpriteTinted(sp, x, y, tint){
  const rows = sp.rows, pal = sp.pal;
  ctx.fillStyle = tint;
  for(let r=0;r<rows.length;r++){
    const row = rows[r];
    for(let c=0;c<row.length;c++){
      if(pal[row[c]]) ctx.fillRect(x+c, y+r, 1, 1);
    }
  }
}

let audioCtx = null;
function initAudio(){
  if(!audioCtx){
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, dur, type='square', freqEnd=null, gain=0.1){
  if(!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, now);
  if(freqEnd !== null) osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), now + dur);
  g.gain.setValueAtTime(gain, now);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + dur);
}
function noiseHit(dur=0.08, gain=0.15, freq=1200){
  if(!audioCtx) return;
  const now = audioCtx.currentTime;
  const bufSize = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<bufSize;i++) data[i] = Math.random()*2-1;
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(gain, now);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  const filt = audioCtx.createBiquadFilter();
  filt.type = 'bandpass'; filt.frequency.value = freq;
  src.connect(filt).connect(g).connect(audioCtx.destination);
  src.start(now);
}

function dist2(a,b){ const dx=a.x-b.x, dy=a.y-b.y; return dx*dx + dy*dy; }
function rand(a,b){ return a + Math.random()*(b-a); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function pickWeighted(mix){
  const r = Math.random();
  let acc = 0;
  for(const [k,w] of mix){ acc += w; if(r < acc) return k; }
  return mix[mix.length-1][0];
}
function clickedRect(x,y,w,h){ return mouse.x>=x && mouse.x<=x+w && mouse.y>=y && mouse.y<=y+h; }

function createBullet(x,y,angle,owner,opts={}){
  const speed = opts.speed ?? 240;
  return {
    type:'bullet', owner, x, y,
    vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
    angle, radius: opts.radius ?? 2,
    life: opts.life ?? 1.8,
    dmg: opts.dmg ?? 1,
    pierce: opts.pierce ?? false,
    explosive: opts.explosive ?? false,
    explodeRadius: opts.explodeRadius ?? 24,
    sprite: opts.sprite ?? (owner==='player' ? SPR.bullet_p : SPR.bullet_e),
    hitSet: opts.pierce ? new Set() : null,
    dead:false
  };
}

function createPickup(x,y,kind){
  return { type:'pickup', kind, x, y, radius:5, life:11, dead:false };
}

// ============================================================
// PARTICLES
// ============================================================
function emit(x,y,count,color,sMin=20,sMax=80,life=0.5){
  for(let i=0;i<count;i++){
    if(particles.length > 300) break;
    const a = Math.random()*Math.PI*2;
    const s = rand(sMin, sMax);
    particles.push({
      x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      life: rand(life*0.5, life), maxLife: life,
      color, size: 1 + Math.floor(Math.random()*2)
    });
  }
}

function explode(x, y, radius, dmg){
  emit(x, y, 22, '#f39c12', 60, 180, 0.6);
  emit(x, y, 12, '#fff', 40, 150, 0.4);
  shakeTime = 0.25; shakeAmt = 5;
  sfx.explode();
  for(const en of entities){
    if(en.type !== 'enemy' || en.dead) continue;
    if(dist2({x,y}, en) < radius*radius){
      en.hp -= dmg;
      en.hitFlash = 0.08;
      if(en.hp <= 0) killEnemy(en);
    }
  }
}

function spawnEnemyAtEdge(kind){
  const edge = Math.floor(Math.random()*4);
  const m = 14;
  let x, y;
  if(edge===0){ x = rand(m, W-m); y = -m; }
  else if(edge===1){ x = W+m; y = rand(m, H-m); }
  else if(edge===2){ x = rand(m, W-m); y = H+m; }
  else { x = -m; y = rand(m, H-m); }
  entities.push(createEnemy(kind, x, y));
}

function spawnBoss(kind){
  const b = createEnemy(kind, W/2, -25);
  entities.push(b);
  bossSpawnPulse = 1;
  sfx.bossSpawn();
  shakeTime = 0.4; shakeAmt = 5;
}

function startLevel(idx){
  levelIdx = idx;
  levelData = LEVELS[idx];
  spawnTimer = 0.6;
  spawnedCount = 0;
  bossSpawned = false;
  entities = entities.filter(e => e.type === 'player');
  particles = [];
  if(!player){ player = createPlayer(); entities.push(player); }
  else { player.x = W/2; player.y = H/2; player.invuln = 1.2; }
  state = STATE.PLAYING;
  stateTime = 0;
}
function startGame(){
  initAudio();
  score = 0;
  player = createPlayer();
  entities = [player];
  particles = [];
  startLevel(0);
}

// ============================================================
// UPDATE
// ============================================================
function update(dt){
  stateTime += dt;
  if(bossSpawnPulse > 0) bossSpawnPulse -= dt;
  if(state === STATE.MENU || state === STATE.HOWTO) handleMenu();
  else if(state === STATE.LEVEL_COMPLETE) handleLevelComplete();
  else if(state === STATE.GAME_OVER || state === STATE.VICTORY) handleEndScreen();
  else if(state === STATE.PLAYING) updatePlaying(dt);
  mouse.clicked = false;
}

function updatePlaying(dt){
  // ---- Player movement ----
  let dx=0, dy=0;
  if(keys['ArrowLeft']||keys['KeyA']) dx -= 1;
  if(keys['ArrowRight']||keys['KeyD']) dx += 1;
  if(keys['ArrowUp']||keys['KeyW']) dy -= 1;
  if(keys['ArrowDown']||keys['KeyS']) dy += 1;
  const mag = Math.hypot(dx, dy);
  if(mag > 0){ dx /= mag; dy /= mag; }
  player.x += dx * player.speed * dt;
  player.y += dy * player.speed * dt;
  player.x = clamp(player.x, 8, W-8);
  player.y = clamp(player.y, 8, H-10);

  if(mag > 0){
    player.frameT += dt;
    if(player.frameT > 0.12){ player.frameT = 0; player.frame = (player.frame + 1) % 2; }
  } else { player.frame = 0; }

  player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

  // ---- Shooting / Weapon dispatch ----
  player.fireCooldown -= dt;
  if(player.spreadTime > 0) player.spreadTime -= dt;
  if(player.rapidTime > 0) player.rapidTime -= dt;
  if(player.laserTime > 0) player.laserTime -= dt;

  if(mouse.down && player.fireCooldown <= 0){
    const mx = player.x + Math.cos(player.angle) * 9;
    const my = player.y + Math.sin(player.angle) * 9;
    fireWeapon(mx, my);
  }

  if(player.invuln > 0) player.invuln -= dt;
  if(player.hitFlash > 0) player.hitFlash -= dt;

  // ---- Enemy spawning ----
  if(spawnedCount < levelData.total){
    spawnTimer -= dt;
    if(spawnTimer <= 0){
      spawnEnemyAtEdge(pickWeighted(levelData.mix));
      spawnedCount++;
      spawnTimer = levelData.rate * rand(0.7, 1.3);
    }
  }
  // Spawn boss after all regular enemies have spawned and most are dead
  if(!bossSpawned && spawnedCount >= levelData.total){
    const aliveRegular = entities.filter(e => e.type === 'enemy' && !e.isBoss).length;
    if(aliveRegular <= Math.max(2, Math.floor(levelData.total * 0.2))){
      bossSpawned = true;
      spawnBoss(levelData.boss);
    }
  }

  // ---- Update entities ----
  for(const e of entities){
    if(e.dead) continue;
    if(e.type === 'enemy') updateEnemy(e, dt);
    else if(e.type === 'bullet') updateBullet(e, dt);
    else if(e.type === 'pickup') updatePickup(e, dt);
    if(e.hitFlash > 0) e.hitFlash -= dt;
  }

  // ---- Collisions ----
  for(const b of entities){
    if(b.type !== 'bullet' || b.dead) continue;
    if(b.owner === 'player'){
      for(const en of entities){
        if(en.type !== 'enemy' || en.dead) continue;
        if(b.hitSet && b.hitSet.has(en)) continue;
        const dr = b.radius + en.radius;
        if(dist2(b, en) < dr*dr){
          en.hp -= b.dmg;
          en.hitFlash = 0.07;
          emit(b.x, b.y, 4, '#fff', 30, 90, 0.25);
          if(b.explosive){
            explode(b.x, b.y, b.explodeRadius, b.dmg);
            b.dead = true;
          } else if(b.pierce){
            b.hitSet.add(en);
            sfx.hit();
          } else {
            b.dead = true;
            sfx.hit();
          }
          if(en.hp <= 0) killEnemy(en);
          if(!b.pierce) break;
        }
      }
    } else {
      if(player.invuln > 0) continue;
      const dr = b.radius + player.radius;
      if(dist2(b, player) < dr*dr){
        b.dead = true;
        damagePlayer(1);
      }
    }
  }
  if(player.invuln <= 0){
    for(const en of entities){
      if(en.type !== 'enemy' || en.dead) continue;
      const dr = player.radius + en.radius;
      if(dist2(en, player) < dr*dr){
        damagePlayer(en.isBoss ? 2 : 1);
        const a = Math.atan2(en.y - player.y, en.x - player.x);
        en.x += Math.cos(a) * 12;
        en.y += Math.sin(a) * 12;
        break;
      }
    }
  }
  // Pickups
  for(const p of entities){
    if(p.type !== 'pickup' || p.dead) continue;
    const dr = p.radius + player.radius;
    if(dist2(p, player) < dr*dr){
      applyPickup(p.kind);
      p.dead = true;
      sfx.pickup();
      emit(p.x, p.y, 8, '#fff', 30, 80, 0.4);
    }
  }

  // Particles
  for(const p of particles){
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    p.vx *= 0.92;
    p.vy *= 0.92;
  }
  particles = particles.filter(p => p.life > 0);

  entities = entities.filter(e => !e.dead);

  if(shakeTime > 0) shakeTime -= dt;

  // Win/loss
  const enemiesAlive = entities.some(e => e.type === 'enemy');
  if(spawnedCount >= levelData.total && bossSpawned && !enemiesAlive){
    if(levelIdx >= LEVELS.length - 1){
      state = STATE.VICTORY; stateTime = 0; sfx.victory();
      if(score > highScore){ highScore = score; localStorage.setItem('shooter_high', String(highScore)); }
    } else {
      state = STATE.LEVEL_COMPLETE; stateTime = 0; sfx.levelComplete();
    }
  }
  if(player.hp <= 0){
    state = STATE.GAME_OVER; stateTime = 0; sfx.gameOver();
    if(score > highScore){ highScore = score; localStorage.setItem('shooter_high', String(highScore)); }
  }
}

// ============================================================
// WEAPONS
// ============================================================
function fireWeapon(mx, my){
  // Priority: rocket ammo > laser > spread > default. Rapid modifies cooldown.
  const rapidFactor = player.rapidTime > 0 ? 0.5 : 1;

  if(player.rocketAmmo > 0){
    entities.push(createBullet(mx, my, player.angle, 'player', {
      speed: 180, dmg: 2, explosive: true, explodeRadius: 28,
      sprite: SPR.bullet_rocket, radius: 3, life: 2.2
    }));
    player.rocketAmmo--;
    player.fireCooldown = 0.35 * rapidFactor;
    emit(mx, my, 5, '#e67e22', 30, 80, 0.25);
    sfx.rocket();
    return;
  }

  if(player.laserTime > 0){
    entities.push(createBullet(mx, my, player.angle, 'player', {
      speed: 360, pierce: true, dmg: 1,
      sprite: SPR.bullet_laser, radius: 2, life: 1.0
    }));
    player.fireCooldown = 0.10 * rapidFactor;
    emit(mx, my, 3, '#27ae60', 30, 100, 0.18);
    sfx.laser();
    return;
  }

  if(player.spreadTime > 0){
    const spr = 0.22;
    entities.push(createBullet(mx, my, player.angle - spr, 'player'));
    entities.push(createBullet(mx, my, player.angle,        'player'));
    entities.push(createBullet(mx, my, player.angle + spr, 'player'));
    player.fireCooldown = 0.12 * rapidFactor;
    emit(mx, my, 3, '#f1c40f', 30, 100, 0.18);
    sfx.shoot();
    return;
  }

  entities.push(createBullet(mx, my, player.angle, 'player'));
  player.fireCooldown = player.fireRate * rapidFactor;
  emit(mx, my, 3, '#f1c40f', 30, 100, 0.18);
  sfx.shoot();
}

function applyPickup(kind){
  if(kind === 'health')   player.hp = Math.min(player.maxHp, player.hp + 1);
  else if(kind === 'spread') player.spreadTime = Math.max(player.spreadTime, 8);
  else if(kind === 'rapid')  player.rapidTime  = Math.max(player.rapidTime,  8);
  else if(kind === 'laser')  player.laserTime  = Math.max(player.laserTime,  7);
  else if(kind === 'rocket') player.rocketAmmo = Math.min(15, player.rocketAmmo + 6);
  else if(kind === 'shield') player.shieldHp   = player.shieldMax;
}

// ============================================================
// COMBAT
// ============================================================
function damagePlayer(amount){
  if(player.shieldHp > 0){
    player.shieldHp -= 1;
    player.invuln = 0.5;
    sfx.shieldHit();
    emit(player.x, player.y, 10, '#1abc9c', 30, 100, 0.4);
    return;
  }
  player.hp -= amount;
  player.invuln = 0.9;
  player.hitFlash = 0.15;
  shakeTime = 0.2; shakeAmt = 4;
  emit(player.x, player.y, 8, '#e74c3c', 40, 130, 0.5);
  sfx.playerHurt();
}

function killEnemy(en){
  en.dead = true;
  score += en.score;
  emit(en.x, en.y, en.isBoss ? 40 : 14,
       en.isBoss ? '#9b59b6' : '#c0392b', 50, 200, en.isBoss ? 0.9 : 0.6);
  if(en.kind === 'tank'){
    shakeTime = 0.25; shakeAmt = 4;
  } else if(en.isBoss){
    shakeTime = 0.7; shakeAmt = 6;
    // Boss death drops a guaranteed special equipment
    const drops = { bruiser:'rapid', sniper:'shield', splitter:'spread', summoner:'rocket', overlord:'laser' };
    const drop = drops[en.kind] || 'health';
    entities.push(createPickup(en.x, en.y, drop));
    // Plus a health top-up
    entities.push(createPickup(en.x + 12, en.y, 'health'));
  }
  sfx.enemyDeath();
  // Splitter death cascade
  if(en.kind === 'splitter'){
    for(let i=0;i<2;i++){
      const a = (i/2)*Math.PI*2 + Math.random();
      const e2 = createEnemy('splitter_mid', en.x + Math.cos(a)*10, en.y + Math.sin(a)*10);
      e2.vx = Math.cos(a)*40; e2.vy = Math.sin(a)*40;
      entities.push(e2);
    }
  } else if(en.kind === 'splitter_mid'){
    for(let i=0;i<2;i++){
      const a = (i/2)*Math.PI*2 + Math.random();
      const e2 = createEnemy('splitter_mini', en.x + Math.cos(a)*6, en.y + Math.sin(a)*6);
      e2.vx = Math.cos(a)*60; e2.vy = Math.sin(a)*60;
      entities.push(e2);
    }
  }
  // Random drop from non-boss
  if(!en.isBoss && Math.random() < 0.18){
    const kinds = ['health','spread','rapid','shield','rocket','laser'];
    const weights = [0.40, 0.14, 0.14, 0.12, 0.10, 0.10];
    const r = Math.random();
    let acc = 0;
    let pick = 'health';
    for(let i=0;i<kinds.length;i++){ acc += weights[i]; if(r < acc){ pick = kinds[i]; break; } }
    entities.push(createPickup(en.x, en.y, pick));
  }
}

// ============================================================
// ENEMY AI
// ============================================================
function updateEnemy(e, dt){
  if(e.kind === 'bruiser')  return updateBruiser(e, dt);
  if(e.kind === 'sniper')   return updateSniper(e, dt);
  if(e.kind === 'splitter' || e.kind === 'splitter_mid') return updateSplitter(e, dt);
  if(e.kind === 'splitter_mini') return updateSeek(e, dt);
  if(e.kind === 'summoner') return updateSummoner(e, dt);
  if(e.kind === 'overlord') return updateOverlord(e, dt);
  if(e.kind === 'shooter')  return updateShooter(e, dt);
  return updateSeek(e, dt);
}

function updateSeek(e, dt){
  const a = Math.atan2(player.y - e.y, player.x - e.x);
  e.vx = Math.cos(a) * e.speed;
  e.vy = Math.sin(a) * e.speed;
  e.x += e.vx * dt; e.y += e.vy * dt;
  if(Math.abs(e.vx) + Math.abs(e.vy) > 5){
    e.frameT += dt;
    if(e.frameT > 0.18){ e.frameT = 0; e.frame = (e.frame + 1) % 2; }
  }
}

function updateShooter(e, dt){
  const d = Math.hypot(player.x - e.x, player.y - e.y);
  if(d > 110){
    const a = Math.atan2(player.y - e.y, player.x - e.x);
    e.vx = Math.cos(a) * e.speed;
    e.vy = Math.sin(a) * e.speed;
  } else {
    e.vx = 0; e.vy = 0;
    e.fireCooldown -= dt;
    if(e.fireCooldown <= 0){
      const a = Math.atan2(player.y - e.y, player.x - e.x);
      entities.push(createBullet(e.x, e.y, a, 'enemy', {speed:150}));
      e.fireCooldown = 1.6;
      emit(e.x, e.y, 2, '#e74c3c', 20, 60, 0.2);
    }
  }
  e.x += e.vx * dt; e.y += e.vy * dt;
  if(Math.abs(e.vx) + Math.abs(e.vy) > 5){
    e.frameT += dt;
    if(e.frameT > 0.18){ e.frameT = 0; e.frame = (e.frame + 1) % 2; }
  }
}

// BRUISER: chase + periodic charge bursts
function updateBruiser(e, dt){
  e.phaseT += dt;
  const a = Math.atan2(player.y - e.y, player.x - e.x);
  // Charging phase
  if(e.phase === 1){
    e.vx = Math.cos(e.chargeAngle) * e.speed * 3.2;
    e.vy = Math.sin(e.chargeAngle) * e.speed * 3.2;
    if(e.phaseT > 0.9){ e.phase = 0; e.phaseT = 0; e.fireCooldown = 2.4; }
  } else {
    e.vx = Math.cos(a) * e.speed;
    e.vy = Math.sin(a) * e.speed;
    e.fireCooldown -= dt;
    if(e.fireCooldown <= 0){
      // Telegraph then charge
      e.chargeAngle = a;
      e.phase = 1; e.phaseT = 0;
      emit(e.x, e.y, 12, '#f1c40f', 40, 120, 0.3);
    }
    // Periodic 4-bullet cross
    if(Math.floor(e.phaseT*2) % 4 === 3 && !e.firedCross){
      e.firedCross = true;
      for(let i=0;i<4;i++){
        const aa = a + (i/4)*Math.PI*2;
        entities.push(createBullet(e.x, e.y, aa, 'enemy', {speed:120}));
      }
    } else if(Math.floor(e.phaseT*2) % 4 !== 3){
      e.firedCross = false;
    }
  }
  e.x += e.vx * dt; e.y += e.vy * dt;
  e.x = clamp(e.x, 14, W-14);
  e.y = clamp(e.y, 14, H-16);
}

// SNIPER: maintain distance, aimed fast bullets, teleport occasionally
function updateSniper(e, dt){
  e.phaseT += dt;
  const dx = player.x - e.x, dy = player.y - e.y;
  const d = Math.hypot(dx, dy);
  const a = Math.atan2(dy, dx);
  const ideal = 140;
  if(d < ideal - 20){
    e.vx = -Math.cos(a) * e.speed * 1.2;
    e.vy = -Math.sin(a) * e.speed * 1.2;
  } else if(d > ideal + 20){
    e.vx = Math.cos(a) * e.speed;
    e.vy = Math.sin(a) * e.speed;
  } else {
    // Strafe
    e.vx = -Math.sin(a) * e.speed * 0.6;
    e.vy = Math.cos(a) * e.speed * 0.6;
  }
  e.fireCooldown -= dt;
  if(e.fireCooldown <= 0){
    // Telegraphed shot
    if(!e.telegraphActive){
      e.telegraphActive = true;
      e.telegraphAngle = a;
      e.fireCooldown = 0.5;
    } else {
      entities.push(createBullet(e.x, e.y, e.telegraphAngle, 'enemy', {speed:260}));
      emit(e.x, e.y, 4, '#1abc9c', 20, 80, 0.2);
      e.telegraphActive = false;
      e.fireCooldown = 1.4;
    }
  }
  // Teleport every 6s
  if(e.phaseT > 6){
    e.phaseT = 0;
    emit(e.x, e.y, 18, '#8e44ad', 30, 120, 0.5);
    e.x = rand(40, W-40); e.y = rand(40, H-40);
    emit(e.x, e.y, 18, '#8e44ad', 30, 120, 0.5);
    e.telegraphActive = false;
    sfx.teleport();
  }
  e.x += e.vx * dt; e.y += e.vy * dt;
  e.x = clamp(e.x, 14, W-14);
  e.y = clamp(e.y, 14, H-16);
}

// SPLITTER (and splitter_mid): chase + ring bursts
function updateSplitter(e, dt){
  const a = Math.atan2(player.y - e.y, player.x - e.x);
  e.vx = Math.cos(a) * e.speed;
  e.vy = Math.sin(a) * e.speed;
  e.x += e.vx * dt; e.y += e.vy * dt;
  e.x = clamp(e.x, 12, W-12);
  e.y = clamp(e.y, 12, H-14);
  if(e.kind === 'splitter'){
    e.fireCooldown -= dt;
    if(e.fireCooldown <= 0){
      const n = 10;
      for(let i=0;i<n;i++){
        const aa = (i/n)*Math.PI*2 + e.phaseT;
        entities.push(createBullet(e.x, e.y, aa, 'enemy', {speed:100}));
      }
      e.fireCooldown = 2.4;
    }
    e.phaseT += dt * 0.6;
  }
}

// SUMMONER: keep distance, summon adds, ring blasts
function updateSummoner(e, dt){
  e.phaseT += dt;
  const dx = player.x - e.x, dy = player.y - e.y;
  const d = Math.hypot(dx, dy);
  const a = Math.atan2(dy, dx);
  const ideal = 120;
  if(d < ideal){
    e.vx = -Math.cos(a) * e.speed;
    e.vy = -Math.sin(a) * e.speed;
  } else {
    e.vx = -Math.sin(a) * e.speed * 0.7;
    e.vy = Math.cos(a) * e.speed * 0.7;
  }
  e.fireCooldown -= dt;
  if(e.fireCooldown <= 0){
    // Alternate: summon vs ring blast
    if(e.summonNext){
      const choices = ['runner','shooter','grunt'];
      const k = choices[Math.floor(Math.random()*choices.length)];
      spawnEnemyAtEdge(k);
      emit(e.x, e.y, 8, '#f1c40f', 40, 110, 0.3);
    } else {
      const n = 8;
      for(let i=0;i<n;i++){
        const aa = (i/n)*Math.PI*2 + e.phaseT*0.3;
        entities.push(createBullet(e.x, e.y, aa, 'enemy', {speed:120}));
      }
    }
    e.summonNext = !e.summonNext;
    e.fireCooldown = 2.2;
  }
  e.x += e.vx * dt; e.y += e.vy * dt;
  e.x = clamp(e.x, 16, W-16);
  e.y = clamp(e.y, 16, H-18);
}

// OVERLORD: 3-phase
function updateOverlord(boss, dt){
  boss.phaseT += dt;
  if(boss.phaseT > 4){
    boss.phaseT = 0;
    boss.phase = (boss.phase + 1) % 3;
    boss.fireCooldown = 0.3;
  }
  const a = Math.atan2(player.y - boss.y, player.x - boss.x);
  let tvx = Math.cos(a) * boss.speed;
  let tvy = Math.sin(a) * boss.speed;
  if(boss.phase === 0){
    boss.fireCooldown -= dt;
    if(boss.fireCooldown <= 0){
      for(let i = 0; i < 12; i++){
        const aa = (i / 12) * Math.PI * 2 + boss.phaseT * 0.5;
        entities.push(createBullet(boss.x, boss.y, aa, 'enemy', {speed:120}));
      }
      boss.fireCooldown = 1.3;
    }
  } else if(boss.phase === 1){
    tvx *= 2.6; tvy *= 2.6;
    boss.fireCooldown -= dt;
    if(boss.fireCooldown <= 0){
      // 3-bullet spread aimed at player
      for(let i=-1;i<=1;i++){
        entities.push(createBullet(boss.x, boss.y, a + i*0.18, 'enemy', {speed:160}));
      }
      boss.fireCooldown = 0.7;
    }
  } else {
    boss.fireCooldown -= dt;
    if(boss.fireCooldown <= 0){
      const k = Math.random() < 0.5 ? 'grunt' : 'shooter';
      spawnEnemyAtEdge(k);
      boss.fireCooldown = 1.2;
    }
  }
  boss.vx = tvx; boss.vy = tvy;
  boss.x += boss.vx * dt;
  boss.y += boss.vy * dt;
  boss.x = clamp(boss.x, 18, W - 18);
  boss.y = clamp(boss.y, 18, H - 22);
}

function updateBullet(b, dt){
  b.x += b.vx * dt;
  b.y += b.vy * dt;
  b.life -= dt;
  if(b.life <= 0 || b.x < -12 || b.x > W+12 || b.y < -12 || b.y > H+12){
    if(b.explosive && b.life <= 0){
      // No explosion on lifeout — only on hit (simpler)
    }
    b.dead = true;
  }
}
function updatePickup(p, dt){
  p.life -= dt;
  if(p.life <= 0) p.dead = true;
}

// ============================================================
// MENU HANDLERS
// ============================================================
function handleMenu(){
  if(!mouse.clicked) return;
  if(state === STATE.MENU){
    if(clickedRect(W/2-60, 140, 120, 24)) startGame();
    else if(clickedRect(W/2-60, 175, 120, 22)){ state = STATE.HOWTO; stateTime = 0; }
  } else if(state === STATE.HOWTO){
    state = STATE.MENU; stateTime = 0;
  }
}
function handleLevelComplete(){
  if(mouse.clicked && stateTime > 0.4) startLevel(levelIdx + 1);
}
function handleEndScreen(){
  if(mouse.clicked && stateTime > 0.7){ state = STATE.MENU; stateTime = 0; }
}

// ============================================================
// DRAW
// ============================================================
function draw(){
  let sx = 0, sy = 0;
  if(shakeTime > 0){
    sx = (Math.random() - 0.5) * shakeAmt;
    sy = (Math.random() - 0.5) * shakeAmt;
  }
  ctx.save();
  ctx.translate(Math.floor(sx), Math.floor(sy));

  ctx.fillStyle = '#181828';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#1f1f34';
  for(let x = 0; x < W; x += 16){
    for(let y = 0; y < H; y += 16){
      if(((x/16) + (y/16)) % 2 === 0) ctx.fillRect(x, y, 16, 16);
    }
  }
  ctx.strokeStyle = '#3d3d5c';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, W - 2, H - 2);

  if(state === STATE.MENU) drawMenu();
  else if(state === STATE.HOWTO) drawHowTo();
  else if(state === STATE.PLAYING) drawGame();
  else if(state === STATE.LEVEL_COMPLETE){ drawGame(); drawLevelComplete(); }
  else if(state === STATE.GAME_OVER){ drawGame(); drawGameOver(); }
  else if(state === STATE.VICTORY){ drawGame(); drawVictory(); }

  ctx.restore();
}

function drawGame(){
  const list = entities.slice().sort((a,b) => a.y - b.y);
  for(const e of list){
    if(e.dead) continue;
    if(e.type === 'player') drawPlayer(e);
    else if(e.type === 'enemy') drawEnemy(e);
    else if(e.type === 'bullet') drawBulletEntity(e);
    else if(e.type === 'pickup') drawPickupEntity(e);
  }
  for(const p of particles){
    const a = clamp(p.life / p.maxLife, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
  }
  ctx.globalAlpha = 1;
  drawHUD();
}

function drawPlayer(p){
  if(p.invuln > 0 && Math.floor(p.invuln * 18) % 2) return;
  const sp = p.frame === 0 ? SPR.player_a : SPR.player_b;
  if(p.hitFlash > 0){
    drawSpriteTinted(sp, Math.floor(p.x - sp.w/2), Math.floor(p.y - sp.h/2), '#fff');
  } else {
    drawSpriteCentered(sp, p.x, p.y);
  }
  // Gun (color depends on active weapon)
  ctx.save();
  ctx.translate(Math.floor(p.x), Math.floor(p.y));
  ctx.rotate(p.angle);
  let gunCol = '#2c3e50', tipCol = '#95a5a6';
  if(p.rocketAmmo > 0){ gunCol = '#5d4037'; tipCol = '#e67e22'; }
  else if(p.laserTime > 0){ gunCol = '#27ae60'; tipCol = '#f1c40f'; }
  else if(p.spreadTime > 0){ gunCol = '#7d6608'; tipCol = '#f1c40f'; }
  else if(p.rapidTime > 0){ gunCol = '#a04000'; tipCol = '#e67e22'; }
  ctx.fillStyle = gunCol;
  ctx.fillRect(0, -1, 8, 3);
  ctx.fillStyle = tipCol;
  ctx.fillRect(6, -1, 3, 3);
  ctx.restore();
  // Shield ring
  if(p.shieldHp > 0){
    ctx.strokeStyle = '#1abc9c';
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(stateTime * 8);
    ctx.beginPath();
    ctx.arc(Math.floor(p.x), Math.floor(p.y), 9, 0, Math.PI*2);
    ctx.stroke();
    ctx.globalAlpha = 1;
    // Shield pips
    ctx.fillStyle = '#1abc9c';
    for(let i=0;i<p.shieldHp;i++){
      const a = -Math.PI/2 + (i - (p.shieldHp-1)/2)*0.35;
      ctx.fillRect(Math.floor(p.x + Math.cos(a)*9) - 1, Math.floor(p.y + Math.sin(a)*9) - 1, 2, 2);
    }
  }
}

function drawEnemy(e){
  let sp;
  switch(e.kind){
    case 'grunt':   sp = e.frame === 0 ? SPR.grunt_a : SPR.grunt_b; break;
    case 'runner':  sp = e.frame === 0 ? SPR.runner_a : SPR.runner_b; break;
    case 'tank':    sp = e.frame === 0 ? SPR.tank_a : SPR.tank_b; break;
    case 'shooter': sp = e.frame === 0 ? SPR.shooter_a : SPR.shooter_b; break;
    case 'bruiser': sp = SPR.bruiser; break;
    case 'sniper':  sp = SPR.sniper; break;
    case 'splitter': sp = SPR.splitter; break;
    case 'splitter_mid': sp = SPR.splitter_mid; break;
    case 'splitter_mini': sp = SPR.splitter_mini; break;
    case 'summoner': sp = SPR.summoner; break;
    case 'overlord': sp = SPR.overlord; break;
  }
  if(!sp) return;
  // Sniper telegraph
  if(e.kind === 'sniper' && e.telegraphActive){
    ctx.strokeStyle = '#1abc9c';
    ctx.globalAlpha = 0.4 + 0.4 * Math.sin(stateTime * 30);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(Math.floor(e.x), Math.floor(e.y));
    ctx.lineTo(Math.floor(e.x + Math.cos(e.telegraphAngle)*300), Math.floor(e.y + Math.sin(e.telegraphAngle)*300));
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  if(e.hitFlash > 0){
    drawSpriteTinted(sp, Math.floor(e.x - sp.w/2), Math.floor(e.y - sp.h/2), '#fff');
  } else {
    drawSpriteCentered(sp, e.x, e.y);
  }
  // HP bar for multi-HP non-boss
  if(e.maxHp > 1 && e.hp < e.maxHp && !e.isBoss){
    const w = sp.w;
    ctx.fillStyle = '#222';
    ctx.fillRect(Math.floor(e.x - w/2), Math.floor(e.y - sp.h/2) - 3, w, 2);
    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(Math.floor(e.x - w/2), Math.floor(e.y - sp.h/2) - 3, Math.floor(w * (e.hp / e.maxHp)), 2);
  }
}

function drawBulletEntity(b){
  ctx.save();
  ctx.translate(Math.floor(b.x), Math.floor(b.y));
  ctx.rotate(b.angle);
  const sp = b.sprite;
  drawSprite(sp, -Math.floor(sp.w/2), -Math.floor(sp.h/2));
  ctx.restore();
  if(b.pierce){
    // glow trail
    ctx.fillStyle = '#27ae60';
    ctx.globalAlpha = 0.4;
    ctx.fillRect(Math.floor(b.x)-1, Math.floor(b.y)-1, 3, 3);
    ctx.globalAlpha = 1;
  }
}

function drawPickupEntity(p){
  if(p.life < 3 && Math.floor(p.life * 6) % 2) return;
  let sp;
  if(p.kind === 'health') sp = SPR.p_health;
  else if(p.kind === 'spread') sp = SPR.p_spread;
  else if(p.kind === 'rapid') sp = SPR.p_rapid;
  else if(p.kind === 'shield') sp = SPR.p_shield;
  else if(p.kind === 'rocket') sp = SPR.p_rocket;
  else if(p.kind === 'laser') sp = SPR.p_laser;
  if(!sp) return;
  const off = Math.sin(stateTime * 6 + p.x) * 1.2;
  // glow halo
  const glowColors = { health:'#e74c3c', spread:'#f1c40f', rapid:'#e67e22', shield:'#1abc9c', rocket:'#bdc3c7', laser:'#27ae60' };
  ctx.fillStyle = glowColors[p.kind] || '#fff';
  ctx.globalAlpha = 0.2 + 0.2 * Math.sin(stateTime * 8);
  ctx.fillRect(Math.floor(p.x) - sp.w/2 - 1, Math.floor(p.y + off) - sp.h/2 - 1, sp.w + 2, sp.h + 2);
  ctx.globalAlpha = 1;
  drawSpriteCentered(sp, p.x, p.y + off);
}

function drawHUD(){
  // HP
  ctx.fillStyle = '#000';
  ctx.fillRect(6, 6, 66, 10);
  ctx.fillStyle = '#3a1010';
  ctx.fillRect(7, 7, 64, 8);
  ctx.fillStyle = '#e74c3c';
  ctx.fillRect(7, 7, Math.floor(64 * (player.hp / player.maxHp)), 8);
  ctx.font = 'bold 8px monospace';
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  ctx.fillText('HP', 9, 14);

  // Shield bar below HP
  if(player.shieldHp > 0){
    ctx.fillStyle = '#000';
    ctx.fillRect(6, 18, 66, 6);
    ctx.fillStyle = '#0f3a35';
    ctx.fillRect(7, 19, 64, 4);
    ctx.fillStyle = '#1abc9c';
    ctx.fillRect(7, 19, Math.floor(64 * (player.shieldHp / player.shieldMax)), 4);
  }

  // Score & level (top-right)
  ctx.font = 'bold 10px monospace';
  ctx.textAlign = 'right';
  ctx.fillStyle = '#f1c40f';
  ctx.fillText('SCORE ' + score, W - 6, 14);
  ctx.fillStyle = '#3498db';
  ctx.fillText('LVL ' + (levelIdx + 1) + '/5', W - 6, 26);

  // Active weapon row (bottom-left)
  drawWeaponHUD();

  // Enemies left
  const left = (levelData.total - spawnedCount) + entities.filter(e => e.type === 'enemy' && !e.isBoss).length;
  ctx.font = 'bold 8px monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ecf0f1';
  if(!bossSpawned){
    ctx.fillText('ENEMIES: ' + left, W/2, H - 6);
  }

  // Boss bar
  const boss = entities.find(e => e.isBoss);
  if(boss){
    ctx.fillStyle = '#000';
    ctx.fillRect(W/2 - 90, H - 26, 180, 12);
    ctx.fillStyle = '#3a1338';
    ctx.fillRect(W/2 - 89, H - 25, 178, 10);
    ctx.fillStyle = '#9b59b6';
    ctx.fillRect(W/2 - 89, H - 25, Math.floor(178 * (boss.hp / boss.maxHp)), 10);
    ctx.font = 'bold 8px monospace';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText(BOSS_NAMES[boss.kind] || 'BOSS', W/2, H - 17);
  }

  // Boss spawn flash
  if(bossSpawnPulse > 0){
    ctx.globalAlpha = bossSpawnPulse;
    ctx.fillStyle = '#9b59b6';
    ctx.font = 'bold 22px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('!! ' + (BOSS_NAMES[levelData.boss] || 'BOSS') + ' !!', W/2, H/2);
    ctx.globalAlpha = 1;
  }
}

function drawWeaponHUD(){
  // Bottom-left strip of active weapons / ammo
  let y = H - 14;
  let x = 6;
  ctx.font = 'bold 7px monospace';
  ctx.textAlign = 'left';
  const draw = (label, sp, t, max, color) => {
    if(sp){ drawSprite(sp, x, y - 7); }
    ctx.fillStyle = '#000';
    ctx.fillRect(x + 7, y - 5, 32, 5);
    ctx.fillStyle = color;
    ctx.fillRect(x + 7, y - 5, Math.floor(32 * clamp(t/max, 0, 1)), 5);
    ctx.fillStyle = '#fff';
    ctx.fillText(label, x + 7, y - 7);
    x += 48;
  };
  if(player.rapidTime > 0)   draw('RAPID',  SPR.p_rapid,  player.rapidTime,  8, '#e67e22');
  if(player.spreadTime > 0)  draw('SPREAD', SPR.p_spread, player.spreadTime, 8, '#f1c40f');
  if(player.laserTime > 0)   draw('LASER',  SPR.p_laser,  player.laserTime,  7, '#27ae60');
  if(player.rocketAmmo > 0){
    drawSprite(SPR.p_rocket, x, y - 7);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 8px monospace';
    ctx.fillText('x' + player.rocketAmmo, x + 7, y - 1);
    x += 36;
  }
}

function drawMenu(){
  ctx.textAlign = 'center';

  ctx.font = 'bold 32px monospace';
  ctx.fillStyle = '#3d1a4a';
  ctx.fillText('PIXEL', W/2 + 2, 62);
  ctx.fillText('SHOOTER', W/2 + 2, 96);
  ctx.fillStyle = '#e74c3c';
  ctx.fillText('PIXEL', W/2, 60);
  ctx.fillStyle = '#f1c40f';
  ctx.fillText('SHOOTER', W/2, 94);

  ctx.font = 'bold 8px monospace';
  ctx.fillStyle = '#bdc3c7';
  ctx.fillText('5 levels · 5 bosses · 6 weapons', W/2, 115);

  const sh = clickedRect(W/2 - 60, 140, 120, 24);
  ctx.fillStyle = sh ? '#3498db' : '#1f4e6b';
  ctx.fillRect(W/2 - 60, 140, 120, 24);
  ctx.strokeStyle = '#5dade2'; ctx.lineWidth = 1;
  ctx.strokeRect(W/2 - 60 + 0.5, 140.5, 120, 24);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 12px monospace';
  ctx.fillText('START', W/2, 157);

  const hh = clickedRect(W/2 - 60, 175, 120, 22);
  ctx.fillStyle = hh ? '#27ae60' : '#1e4d33';
  ctx.fillRect(W/2 - 60, 175, 120, 22);
  ctx.strokeStyle = '#52be80';
  ctx.strokeRect(W/2 - 60 + 0.5, 175.5, 120, 22);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 9px monospace';
  ctx.fillText('HOW TO PLAY', W/2, 190);

  ctx.font = 'bold 8px monospace';
  ctx.fillStyle = '#95a5a6';
  ctx.fillText('HIGH SCORE: ' + highScore, W/2, 220);

  ctx.fillStyle = '#5d6d7e';
  ctx.font = 'bold 7px monospace';
  ctx.fillText('CLICK TO BEGIN  ·  SOUND ON', W/2, 252);

  ctx.strokeStyle = '#f1c40f';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(mouse.x, mouse.y, 4, 0, Math.PI * 2);
  ctx.stroke();
}

function drawHowTo(){
  ctx.textAlign = 'center';
  ctx.font = 'bold 14px monospace';
  ctx.fillStyle = '#f1c40f';
  ctx.fillText('HOW TO PLAY', W/2, 28);

  ctx.font = 'bold 8px monospace';
  ctx.textAlign = 'left';
  const leftX = 40;
  const lines = [
    ['MOVE',  'WASD / ARROWS'],
    ['AIM',   'MOUSE'],
    ['SHOOT', 'CLICK or HOLD']
  ];
  ctx.fillStyle = '#ecf0f1';
  lines.forEach((l, i) => {
    ctx.fillStyle = '#3498db'; ctx.fillText(l[0], leftX, 50 + i*11);
    ctx.fillStyle = '#fff';    ctx.fillText(l[1], leftX + 50, 50 + i*11);
  });

  // Equipment legend
  ctx.fillStyle = '#f1c40f';
  ctx.font = 'bold 9px monospace';
  ctx.fillText('EQUIPMENT', leftX, 96);

  ctx.font = 'bold 7px monospace';
  const eq = [
    [SPR.p_health, 'HEALTH',  '+1 HP',                       '#e74c3c'],
    [SPR.p_spread, 'SPREAD',  '3-bullet cone for 8 sec',     '#f1c40f'],
    [SPR.p_rapid,  'RAPID',   'half cooldown for 8 sec',     '#e67e22'],
    [SPR.p_shield, 'SHIELD',  'absorbs 3 hits',              '#1abc9c'],
    [SPR.p_rocket, 'ROCKET',  '+6 explosive AOE ammo',       '#bdc3c7'],
    [SPR.p_laser,  'LASER',   'piercing beam for 7 sec',     '#27ae60']
  ];
  eq.forEach((e, i) => {
    const yy = 106 + i*11;
    drawSprite(e[0], leftX, yy - 5);
    ctx.fillStyle = e[3];
    ctx.fillText(e[1], leftX + 9, yy);
    ctx.fillStyle = '#bdc3c7';
    ctx.fillText(e[2], leftX + 60, yy);
  });

  // Bosses legend
  ctx.fillStyle = '#9b59b6';
  ctx.font = 'bold 9px monospace';
  ctx.fillText('BOSSES', leftX + 220, 96);
  ctx.font = 'bold 7px monospace';
  const bosses = [
    ['L1 BRUISER',  'charges & cross bursts'],
    ['L2 NEEDLE',   'teleports, aimed shots'],
    ['L3 HYDRA',    'splits when killed'],
    ['L4 CONJURER', 'summons & ring blasts'],
    ['L5 OVERLORD', '3-phase ultimate boss']
  ];
  bosses.forEach((b, i) => {
    ctx.fillStyle = '#e74c3c'; ctx.fillText(b[0], leftX + 220, 106 + i*11);
    ctx.fillStyle = '#bdc3c7'; ctx.fillText(b[1], leftX + 290, 106 + i*11);
  });

  ctx.textAlign = 'center';
  ctx.fillStyle = '#bdc3c7';
  ctx.font = 'bold 8px monospace';
  ctx.fillText('< CLICK ANYWHERE TO RETURN >', W/2, H - 10);
}

function drawLevelComplete(){
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = 'bold 20px monospace';
  ctx.fillStyle = '#27ae60';
  ctx.fillText('LEVEL ' + (levelIdx + 1) + ' CLEAR!', W/2, H/2 - 24);
  ctx.font = 'bold 10px monospace';
  ctx.fillStyle = '#fff';
  ctx.fillText('SCORE: ' + score, W/2, H/2);
  ctx.fillStyle = '#bdc3c7';
  ctx.fillText('NEXT: LEVEL ' + (levelIdx + 2) + ' — ' + (BOSS_NAMES[LEVELS[levelIdx+1].boss] || 'BOSS'), W/2, H/2 + 16);
  if(stateTime > 0.6 && Math.floor(stateTime * 3) % 2 === 0){
    ctx.fillStyle = '#f1c40f';
    ctx.font = 'bold 9px monospace';
    ctx.fillText('CLICK TO CONTINUE', W/2, H/2 + 42);
  }
}

function drawGameOver(){
  ctx.fillStyle = 'rgba(0,0,0,0.78)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = 'bold 26px monospace';
  ctx.fillStyle = '#e74c3c';
  ctx.fillText('GAME OVER', W/2, H/2 - 12);
  ctx.font = 'bold 10px monospace';
  ctx.fillStyle = '#fff';
  ctx.fillText('FINAL SCORE: ' + score, W/2, H/2 + 14);
  ctx.fillText('LEVEL REACHED: ' + (levelIdx + 1) + '/5', W/2, H/2 + 30);
  if(score === highScore && score > 0){
    ctx.fillStyle = '#f1c40f';
    ctx.fillText('* NEW HIGH SCORE *', W/2, H/2 + 46);
  }
  if(stateTime > 0.8 && Math.floor(stateTime * 3) % 2 === 0){
    ctx.fillStyle = '#bdc3c7';
    ctx.font = 'bold 8px monospace';
    ctx.fillText('< CLICK TO RETURN TO MENU >', W/2, H/2 + 68);
  }
}

function drawVictory(){
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = 'bold 24px monospace';
  const hue = (stateTime * 60) % 360;
  ctx.fillStyle = 'hsl(' + hue + ', 75%, 60%)';
  ctx.fillText('VICTORY!', W/2, H/2 - 18);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 10px monospace';
  ctx.fillText('All 5 bosses fell. The arena is yours.', W/2, H/2 + 4);
  ctx.fillText('FINAL SCORE: ' + score, W/2, H/2 + 22);
  if(score === highScore && score > 0){
    ctx.fillStyle = '#f1c40f';
    ctx.fillText('* NEW HIGH SCORE *', W/2, H/2 + 38);
  }
  if(stateTime > 0.8 && Math.floor(stateTime * 3) % 2 === 0){
    ctx.fillStyle = '#bdc3c7';
    ctx.font = 'bold 8px monospace';
    ctx.fillText('< CLICK TO RETURN TO MENU >', W/2, H/2 + 60);
  }
}

// ============================================================
// MAIN LOOP
// ============================================================
let lastT = performance.now();
function loop(t){
  const dt = Math.min(0.033, (t - lastT) / 1000);
  lastT = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
