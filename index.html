  // player (random angle, mid-range) so the phantom can't blink across the 4x arena.
  if(e.phaseT > 3.8){
    e.phaseT = 0;
    emit(e.x, e.y, 22, '#8e44ad', 30, 130, 0.5);
    const ta = rand(0, TAU), tr = rand(110, 190);
    e.x = clamp(player.x + Math.cos(ta) * tr, 40, worldW - 40);
    e.y = clamp(player.y + Math.sin(ta) * tr, 40, worldH - 40);
    emit(e.x, e.y, 22, '#aed6f1', 30, 130, 0.5);
    sfx.teleport();
    for(let i=0;i<2;i++) spawnEnemyAtEdge('runner');
  }
  e.x += e.vx * dt; e.y += e.vy * dt;
  e.x = clamp(e.x, 14, worldW - 14);
  e.y = clamp(e.y, 14, worldH - 16);
}

// NEMESIS (L10): four-phase final boss.
function updateNemesis(boss, dt){
  boss.phaseT += dt;
  if(levelIdx >= 26) bossGasBomb(boss, dt);            // L27+: poison-gas bombs
  if(levelIdx >= 28) bossSummonExploders(boss, dt, 3); // L29+: exploding-minion packs
  if(boss.phaseT > 3.2){
    boss.phaseT = 0;
    boss.phase = (boss.phase + 1) % 4;
    boss.fireCooldown = 0.3;
  }
  const a = Math.atan2(player.y - boss.y, player.x - boss.x);
  let tvx = Math.cos(a) * boss.speed;
  let tvy = Math.sin(a) * boss.speed;
  if(boss.phase === 0){
    // Phase 0: dense ring blasts
    boss.fireCooldown -= dt;
    if(boss.fireCooldown <= 0){
      for(let i=0;i<16;i++){
        const aa = (i/16)*Math.PI*2 + boss.phaseT*0.4;
        entities.push(createBullet(boss.x, boss.y, aa, 'enemy', {speed:130}));
      }
      boss.fireCooldown = 1.2;
    }
  } else if(boss.phase === 1){
    // Phase 1: charging spread, faster pursuit
    tvx *= 2.6; tvy *= 2.6;
    boss.fireCooldown -= dt;
    if(boss.fireCooldown <= 0){
      for(let i=-2;i<=2;i++){
        entities.push(createBullet(boss.x, boss.y, a + i*0.15, 'enemy', {speed:170}));
      }
      boss.fireCooldown = 0.55;
    }
  } else if(boss.phase === 2){
    // Phase 2: summon adds + homing missiles
    boss.fireCooldown -= dt;
    if(boss.fireCooldown <= 0){
      const k = ['shooter','runner','tank'][Math.floor(Math.random()*3)];
      spawnEnemyAtEdge(k);
      entities.push(createBullet(boss.x, boss.y, a, 'enemy', {
        speed: 120, homing: true, life: 3.5, sprite: SPR.bullet_homing, radius: 2
      }));
      boss.fireCooldown = 1.1;
    }
  } else {
    // Phase 3: spiral barrage, strafing
    tvx = -Math.sin(a) * boss.speed * 1.4;
    tvy = Math.cos(a) * boss.speed * 1.4;
    boss.fireCooldown -= dt;
    if(boss.fireCooldown <= 0){
      for(let i=0;i<3;i++){
        const aa = boss.phaseT * 4 + i * (Math.PI*2/3);
        entities.push(createBullet(boss.x, boss.y, aa, 'enemy', {speed:150}));
      }
      boss.fireCooldown = 0.12;
    }
  }
  boss.vx = tvx; boss.vy = tvy;
  boss.x += boss.vx * dt;
  boss.y += boss.vy * dt;
  boss.x = clamp(boss.x, 20, worldW - 20);
  boss.y = clamp(boss.y, 20, worldH - 24);
}

// WARDEN: mid-range zoning turret — keeps its distance, fires wide aimed fans, blinks
// to reposition, and shields itself (bossInvuln) so it's a stubborn medium boss.
// At L21+ it also lobs telegraphed gas pools. Used as a medium/transitional boss only.
function updateWarden(e, dt){
  e.phaseT += dt;
  bossInvuln(e, dt);
  if(levelIdx >= 20) bossGasBomb(e, dt);
  const dx = player.x - e.x, dy = player.y - e.y;
  const d = Math.hypot(dx, dy), a = Math.atan2(dy, dx);
  const ideal = 110;
  if(d < ideal - 20){ e.vx = -Math.cos(a) * e.speed; e.vy = -Math.sin(a) * e.speed; }
  else if(d > ideal + 20){ e.vx = Math.cos(a) * e.speed; e.vy = Math.sin(a) * e.speed; }
  else { e.vx = -Math.sin(a) * e.speed * 0.7; e.vy = Math.cos(a) * e.speed * 0.7; }
  e.fireCooldown -= dt;
  if(e.fireCooldown <= 0){
    const n = 7;
    for(let i = 0; i < n; i++){
      const aa = a + (i - (n - 1) / 2) * 0.18;
      entities.push(createBullet(e.x, e.y, aa, 'enemy', { speed: 150 }));
    }
    e.fireCooldown = 1.0;
  }
  // Blink-reposition periodically so it can't be cornered.
  if(e.phaseT > 3.5){
    e.phaseT = 0;
    emit(e.x, e.y, 16, '#8e44ad', 24, 110, 0.4);
    const ba = a + rand(-0.6, 0.6), bd = 80;
    e.x = clamp(e.x + Math.cos(ba) * bd, 20, worldW - 20);
    e.y = clamp(e.y + Math.sin(ba) * bd, 20, worldH - 24);
    emit(e.x, e.y, 16, '#5dade2', 24, 110, 0.4);
    sfx.teleport();
  }
  e.x += e.vx * dt; e.y += e.vy * dt;
  e.x = clamp(e.x, 18, worldW - 18); e.y = clamp(e.y, 18, worldH - 22);
}

// HARRIER: fast multi-dash striker — strings together up to 3 dashes (phasing out
// briefly mid-dash), then drops a radial slash burst on recovery. At L24+ it spits
// exploder packs. Used as a medium/transitional boss only.
function updateHarrier(e, dt){
  e.phaseT += dt;
  if(levelIdx >= 24) bossSummonExploders(e, dt, 3);
  const a = Math.atan2(player.y - e.y, player.x - e.x);
  if(e.phase === 1){
    // Dashing: phase out (brief invuln), travel fast; chain up to 3 dashes.
    e.invulnT = Math.max(e.invulnT || 0, 0.15);
    e.vx = Math.cos(e.chargeAngle) * e.speed * 4.2; e.vy = Math.sin(e.chargeAngle) * e.speed * 4.2;
    emit(e.x, e.y, 2, '#f39c12', 18, 55, 0.2);
    if(e.phaseT > 0.4){
      e.dashCount = (e.dashCount || 0) + 1;
      if(e.dashCount < 3){ e.chargeAngle = a; e.phaseT = 0; }
      else { e.phase = 2; e.phaseT = 0; e.dashCount = 0; }
    }
  } else if(e.phase === 2){
    // Recovery: decelerate + one radial slash burst.
    e.vx *= 0.8; e.vy *= 0.8;
    if(!e.slashed){
      e.slashed = true;
      const n = 5;
      for(let i = 0; i < n; i++) entities.push(createBullet(e.x, e.y, (i / n) * Math.PI * 2, 'enemy', { speed: 150 }));
    }
    if(e.phaseT > 0.5){ e.phase = 0; e.phaseT = 0; e.slashed = false; e.fireCooldown = 0.8; }
  } else {
    // Stalk, then telegraph a dash.
    e.vx = Math.cos(a) * e.speed * 1.1; e.vy = Math.sin(a) * e.speed * 1.1;
    e.fireCooldown -= dt;
    if(e.fireCooldown <= 0){ e.chargeAngle = a; e.phase = 1; e.phaseT = 0; emit(e.x, e.y, 12, '#f1c40f', 30, 110, 0.25); }
  }
  e.x += e.vx * dt; e.y += e.vy * dt;
  e.x = clamp(e.x, 14, worldW - 14); e.y = clamp(e.y, 14, worldH - 16);
}

function updateBullet(b, dt){
  // Homing: steer toward a target each tick. Player bullets seek nearest enemy;
  // enemy bullets seek the player.
  if(b.homing){
    let target = null;
    if(b.owner === 'player'){
      let nd = Infinity;
      for(const en of entities){
        if(en.type !== 'enemy' || en.dead) continue;
        const dd = dist2(b, en);
        if(dd < nd){ nd = dd; target = en; }
      }
    } else {
      target = player;
    }
    if(target){
      const desired = Math.atan2(target.y - b.y, target.x - b.x);
      const cur = Math.atan2(b.vy, b.vx);
      let diff = desired - cur;
      while(diff > Math.PI) diff -= Math.PI * 2;
      while(diff < -Math.PI) diff += Math.PI * 2;
      const turn = clamp(diff, -4 * dt, 4 * dt);
      const ang = cur + turn;
      const sp = Math.hypot(b.vx, b.vy);
      b.vx = Math.cos(ang) * sp;
      b.vy = Math.sin(ang) * sp;
      b.angle = ang;
      // Sparkle trail
      if(Math.random() < 0.3) emit(b.x, b.y, 1, '#e91e63', 10, 30, 0.2);
    }
  }
  b.x += b.vx * dt;
  b.y += b.vy * dt;
  b.life -= dt;
  // Plasma bouncing: reflect off the world edges until bounces are used up.
  if(b.bounces && b.bounces > 0){
    let bounced = false;
    if(b.x < 4){ b.x = 4; b.vx = Math.abs(b.vx); bounced = true; }
    else if(b.x > worldW - 4){ b.x = worldW - 4; b.vx = -Math.abs(b.vx); bounced = true; }
    if(b.y < 4){ b.y = 4; b.vy = Math.abs(b.vy); bounced = true; }
    else if(b.y > worldH - 4){ b.y = worldH - 4; b.vy = -Math.abs(b.vy); bounced = true; }
    if(bounced){
      b.bounces--;
      b.angle = Math.atan2(b.vy, b.vx);
      if(b.hitSet) b.hitSet.clear();
      emit(b.x, b.y, 3, '#aed6f1', 40, 100, 0.18);
    }
  }
  if(b.life <= 0 || b.x < -12 || b.x > worldW+12 || b.y < -12 || b.y > worldH+12){
    if(b.isGrenade && b.life <= 0){
      // Detonate at end of fuse. Credit Syed's lifesteal only for his own shells
      // (player-owned, non-ally) — not the bomber ally's bombs or enemy grenades.
      explode(b.x, b.y, b.explodeRadius || 32, b.explodeDmg || 3, b.owner === 'player' && !b.fromAlly);
    }
    // Bio-gun glob that reached max range without hitting: drop its poison cloud.
    if(b.spawnsCloud && b.life <= 0) spawnPoisonCloud(b.x, b.y, b);
    b.dead = true;
  }
}
function updatePickup(p, dt){
  p.life -= dt;
  if(p.life <= 0) p.dead = true;
  // Magnet powerup pulls nearby pickups toward the player.
  // Radius is 5× the player's diameter — see "pull pickups 10s" in drawHowTo.
  if(player.magnetTime > 0){
    const dx = player.x - p.x, dy = player.y - p.y;
    const d = Math.hypot(dx, dy);
    const magnetRange = player.radius * 10;
    if(d > 1 && d <= magnetRange){
      const pull = 200;
      p.x += (dx/d) * pull * dt;
      p.y += (dy/d) * pull * dt;
    }
  }
}

// ============================================================
// MENU HANDLERS
// ============================================================
function handleMenu(){
  if(!mouse.clicked) return;
  if(state === STATE.MENU){
    const gb = guideButtonRect();
    if(clickedRect(gb.x, gb.y, gb.w, gb.h)){
      state = STATE.HOWTO; stateTime = 0;
      return;
    }
    const shb = shopButtonRect();
    if(clickedRect(shb.x, shb.y, shb.w, shb.h)){
      state = STATE.SHOP; stateTime = 0; initAudio();
      return;
    }
    const pb = parametersButtonRect();
    if(clickedRect(pb.x, pb.y, pb.w, pb.h)){
      paramChar = selectedChar || 'soldier';
      state = STATE.PARAMETERS; stateTime = 0;
      return;
    }
    for(let i = 0; i < LEVELS.length; i++){
      const b = levelBoxRect(i);
      if(clickedRect(b.x, b.y, b.w, b.h)){
        selectedLevel = i;
        state = STATE.CHARACTER_SELECT;
        stateTime = 0;
        passiveMenuSlot = -1;
        initAudio();
        return;
      }
    }
  } else if(state === STATE.HOWTO){
    state = STATE.MENU; stateTime = 0;
  }
}
function handleLevelComplete(){
  if(!mouse.clicked || stateTime < 0.4) return;
  const btns = levelCompleteButtons();
  if(clickedRect(btns.leave.x, btns.leave.y, btns.leave.w, btns.leave.h)){
    state = STATE.MENU; stateTime = 0;
    return;
  }
  if(clickedRect(btns.cont.x, btns.cont.y, btns.cont.w, btns.cont.h)){
    if(levelIdx + 1 < LEVELS.length){
      selectedLevel = levelIdx + 1;
      startLevel(levelIdx + 1);
    } else {
      state = STATE.MENU; stateTime = 0;
    }
  }
}
function handleEndScreen(){
  if(mouse.clicked && stateTime > 0.7){ state = STATE.MENU; stateTime = 0; }
}
// VICTORY screen: MENU returns to the menu; CONTINUE = New Game+ — a fully fresh run
// (same character, Level 1) via startSelectedRun, which rebuilds the player with
// createPlayer + applyLevelScaling, so NO run/combat state (HP, secondary pool, shields,
// skill cooldowns, powerup/buff timers, allies) carries over from the finished run. The
// persistent account PROFILE (level/xp/gold/owned skills+assistants/loadout) is untouched.
function handleVictory(){
  if(!mouse.clicked || stateTime < 0.7) return;
  const btns = victoryButtons();
  if(clickedRect(btns.menu.x, btns.menu.y, btns.menu.w, btns.menu.h)){
    state = STATE.MENU; stateTime = 0; return;
  }
  if(clickedRect(btns.cont.x, btns.cont.y, btns.cont.w, btns.cont.h)){
    selectedLevel = 0;            // restart from Level 1
    startSelectedRun();           // fresh player; profile progression preserved
  }
}

// ============================================================
// DRAW
// ============================================================
// ---- Themed level backgrounds ----
const THEMES = {
  menu:   { bg:'#181828', tile:'#1f1f34', border:'#3d3d5c', decor:null,    name:'ARENA' },
  arena:  { bg:'#181828', tile:'#1f1f34', border:'#3d3d5c', decor:'arena', name:'ARENA' },
  lava:   { bg:'#2a0a08', tile:'#3f1410', border:'#7a2c1c', decor:'lava',  name:'LAVA'  },
  ice:    { bg:'#0a2030', tile:'#103044', border:'#2a6688', decor:'ice',   name:'ICE'   },
  forest: { bg:'#0a1e10', tile:'#10301a', border:'#2a5536', decor:'forest',name:'FOREST'},
  void:   { bg:'#10081a', tile:'#1c0d2e', border:'#3d2453', decor:'void',  name:'VOID'  }
};
// One distinct theme per 10-level block: L1-10 FOREST, L11-20 LAVA, L21-30 ICE,
// L31-40 VOID. (Each block also has its own arena size — see startLevel.)
const THEME_ORDER = ['forest', 'lava', 'ice', 'void'];
function themeForLevel(idx){
  return THEMES[THEME_ORDER[Math.min(THEME_ORDER.length - 1, Math.floor(idx / 10))]];
}
// Deterministic pseudo-random for decoration placement; same input -> same output.
function srand(seed){ return ((seed * 9301 + 49297) % 233280) / 233280; }

// `bw`/`bh` are the dims to fill — viewport (W/H) for menus, world (worldW/worldH)
// for active gameplay (so a 2x level paints its full arena, not just the screen).
function drawBackground(theme, idx, bw, bh){
  ctx.fillStyle = theme.bg;
  ctx.fillRect(0, 0, bw, bh);
  ctx.fillStyle = theme.tile;
  for(let x = 0; x < bw; x += 16){
    for(let y = 0; y < bh; y += 16){
      if(((x/16) + (y/16)) % 2 === 0) ctx.fillRect(x, y, 16, 16);
    }
  }
  if(theme.decor) drawDecor(theme.decor, idx, bw, bh);
  ctx.strokeStyle = theme.border;
  ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, bw - 2, bh - 2);
}

function drawDecor(kind, idx, bw, bh){
  const seedBase = idx * 100 + 1;
  // Scale decoration counts with area so a 2x-larger arena doesn't look bare.
  // Capped at 6x so the 4x (16x-area) L31-40 arenas don't draw ~1000 specks/frame.
  const areaScale = Math.min((bw * bh) / (W * H), 6);
  if(kind === 'lava'){
    // Glowing magma blobs at fixed positions, ember specks pulsing.
    const blobs = Math.round(14 * areaScale);
    for(let i = 0; i < blobs; i++){
      const x = srand(seedBase + i*2) * (bw - 20) + 10;
      const y = srand(seedBase + i*2 + 1) * (bh - 20) + 10;
      const r = 3 + srand(seedBase + i*2 + 50) * 3;
      const pulse = 0.55 + 0.45 * Math.sin(stateTime * 1.6 + i);
      ctx.fillStyle = '#7a1c10';
      ctx.fillRect(Math.floor(x - r), Math.floor(y - r), r*2, r*2);
      ctx.globalAlpha = pulse;
      ctx.fillStyle = '#e67e22';
      ctx.fillRect(Math.floor(x - r + 1), Math.floor(y - r + 1), r*2 - 2, r*2 - 2);
      ctx.fillStyle = '#f1c40f';
      ctx.fillRect(Math.floor(x - 1), Math.floor(y - 1), 2, 2);
      ctx.globalAlpha = 1;
    }
    // Ember specks
    const embers = Math.round(60 * areaScale);
    for(let i = 0; i < embers; i++){
      const x = (srand(seedBase + i + 500) * bw) | 0;
      const y = (srand(seedBase + i + 600) * bh) | 0;
      ctx.globalAlpha = 0.35 + 0.35 * Math.sin(stateTime * 2 + i);
      ctx.fillStyle = i % 3 === 0 ? '#f39c12' : '#e74c3c';
      ctx.fillRect(x, y, 1, 1);
    }
    ctx.globalAlpha = 1;
  } else if(kind === 'ice'){
    // Frost crystals at fixed spots
    const crystals = Math.round(20 * areaScale);
    for(let i = 0; i < crystals; i++){
      const x = (srand(seedBase + i*2) * (bw - 16) + 8) | 0;
      const y = (srand(seedBase + i*2 + 1) * (bh - 16) + 8) | 0;
      ctx.fillStyle = '#aed6f1';
      ctx.fillRect(x, y - 2, 1, 5);
      ctx.fillRect(x - 2, y, 5, 1);
      ctx.fillStyle = '#fff';
      ctx.fillRect(x, y, 1, 1);
    }
    // Drifting snow (animated)
    const flakes = Math.round(50 * areaScale);
    for(let i = 0; i < flakes; i++){
      const baseX = srand(seedBase + i + 700) * bw;
      const baseY = srand(seedBase + i + 800) * bh;
      const drift = (stateTime * (10 + (i % 5) * 4)) % bh;
      const x = baseX | 0;
      const y = ((baseY + drift) % bh) | 0;
      ctx.globalAlpha = 0.4 + 0.3 * ((i % 3) / 3);
      ctx.fillStyle = '#fff';
      ctx.fillRect(x, y, 1, 1);
    }
    ctx.globalAlpha = 1;
  } else if(kind === 'forest'){
    // Leaf clusters (small green dot groups)
    const leaves = Math.round(28 * areaScale);
    for(let i = 0; i < leaves; i++){
      const cx = (srand(seedBase + i*2) * (bw - 20) + 10) | 0;
      const cy = (srand(seedBase + i*2 + 1) * (bh - 20) + 10) | 0;
      ctx.fillStyle = '#1e6840';
      ctx.fillRect(cx, cy, 2, 2);
      ctx.fillStyle = '#27ae60';
      ctx.fillRect(cx + 2, cy, 1, 1);
      ctx.fillRect(cx, cy + 2, 1, 1);
      ctx.fillStyle = '#52be80';
      ctx.fillRect(cx + 1, cy + 1, 1, 1);
    }
    // Dark patches / underbrush
    const patches = Math.round(10 * areaScale);
    for(let i = 0; i < patches; i++){
      const x = (srand(seedBase + i + 900) * (bw - 30) + 4) | 0;
      const y = (srand(seedBase + i + 950) * (bh - 30) + 4) | 0;
      ctx.fillStyle = '#081608';
      ctx.fillRect(x, y, 8 + (i % 5), 4 + (i % 3));
    }
  } else if(kind === 'void'){
    // Stars at fixed positions with twinkle
    const stars = Math.round(70 * areaScale);
    for(let i = 0; i < stars; i++){
      const x = (srand(seedBase + i*2) * bw) | 0;
      const y = (srand(seedBase + i*2 + 1) * bh) | 0;
      const tw = 0.3 + 0.7 * Math.abs(Math.sin(stateTime * 1.5 + i * 0.7));
      ctx.globalAlpha = tw;
      ctx.fillStyle = (i % 8 === 0) ? '#bb8fce' : '#fff';
      ctx.fillRect(x, y, 1, 1);
      // Occasional larger sparkle
      if(i % 12 === 0){
        ctx.fillStyle = '#9b59b6';
        ctx.fillRect(x - 1, y, 3, 1);
        ctx.fillRect(x, y - 1, 1, 3);
      }
    }
    ctx.globalAlpha = 1;
  } else if(kind === 'arena'){
    // Subtle blue accent dots
    const dots = Math.round(12 * areaScale);
    for(let i = 0; i < dots; i++){
      const x = (srand(seedBase + i*2) * bw) | 0;
      const y = (srand(seedBase + i*2 + 1) * bh) | 0;
      ctx.globalAlpha = 0.5 + 0.4 * Math.sin(stateTime * 1.2 + i * 0.6);
      ctx.fillStyle = '#5dade2';
      ctx.fillRect(x, y, 1, 1);
    }
    ctx.globalAlpha = 1;
  }
}

// Screen shake has been fully removed: the world is drawn under a plain
// translate(-camX,-camY) camera follow, and drawHUD()/overlays/menus render after the
// restore. The camera and UI stay perfectly stable regardless of combat events.
function draw(){
  ctx.save();

  // Game states render the world (entities, particles, themed background) inside a
  // camera-translated transform so 2x-arena levels can scroll. Menus / character
  // select / how-to are pure screen-space, no translation.
  const useGameTheme = state === STATE.PLAYING || state === STATE.LEVEL_COMPLETE
                    || state === STATE.GAME_OVER || state === STATE.VICTORY;

  if(useGameTheme){
    ctx.save();
    // Integer-snapped camera follow (no shake) — keeps the world pixel-crisp.
    ctx.translate(-Math.floor(camX), -Math.floor(camY));
    drawBackground(themeForLevel(levelIdx), levelIdx, worldW, worldH);
    drawGame();
    ctx.restore();
    drawHUD();
    if(state === STATE.LEVEL_COMPLETE) drawLevelComplete();
    else if(state === STATE.GAME_OVER) drawGameOver();
    else if(state === STATE.VICTORY) drawVictory();
    else if(state === STATE.PLAYING && showStats) drawStats();
    else if(state === STATE.PLAYING && paused) drawPause();
  } else {
    drawBackground(THEMES.menu, 0, W, H);
    if(state === STATE.MENU) drawMenu();
    else if(state === STATE.HOWTO) drawHowTo();
    else if(state === STATE.CHARACTER_SELECT) drawCharacterSelect();
    else if(state === STATE.ASSISTANT_SELECT) drawAssistantSelect();
    else if(state === STATE.SHOP) drawShop();
    else if(state === STATE.PARAMETERS) drawParameters();
    // Persistent level/XP/gold bar overlays every non-game screen (upper-right).
    // The PARAMETERS screen shows the account level itself, so skip the bar there.
    if(state !== STATE.PARAMETERS) drawProfileBar();
  }

  ctx.restore();
}

// Dim overlay + banner shown while the game is paused (Space). Screen-space.
function drawPause(){
  ctx.fillStyle = 'rgba(8,8,16,0.62)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#f1c40f';
  ctx.font = 'bold 24px monospace';
  ctx.fillText('PAUSED', W/2, H/2 - 4);
  ctx.fillStyle = '#bdc3c7';
  ctx.font = 'bold 8px monospace';
  ctx.fillText('PRESS SPACE OR CLICK TO RESUME', W/2, H/2 + 16);
  ctx.fillStyle = '#7fa8c9';
  ctx.font = 'bold 7px monospace';
  ctx.fillText('TAB — CHARACTER STATS', W/2, H/2 + 30);
  ctx.textAlign = 'left';
}

// CHARACTER STATS window (Tab). Screen-space, frozen play behind a dim overlay.
// Shows the character's LIVE basic parameters — every value is read/derived from
// the same data the gameplay uses (CHARACTERS + level scaling + the RMB/regen
// blocks), so it stays correct as those are tuned. Two columns: defence/mobility/
// primary attack on the left, secondary attack + general on the right.
function drawStats(){
  const p = player;
  if(!p) return;
  const ch = CHARACTERS[p.char] || CHARACTERS.soldier;
  // Effective damage multiplier INCLUDING the weapon-tier evolution, so the numbers
  // below match what fireWeapon / the RMB fns actually deal (base x damageMult x tier).
  const tierMul = p.weaponMult || 1;
  const dm = (p.damageMult || 1) * tierMul;
  const fmt = n => isFinite(n) ? String(Math.round(n * 100) / 100) : '∞';

  // --- Primary basic attack (LMB): per-class form, damage, cadence (mirrors fireWeapon) ---
  let primName, primDmg, primCd;
  if(p.char === 'scout'){ primName = 'LASER DOTS'; primDmg = 0.85 * dm; primCd = 0.06; }
  else if(p.char === 'tank'){ primName = 'HEAVY SLUG'; primDmg = 2 * dm; primCd = p.fireRate; }
  else if(p.char === 'bounty_hunter'){ primName = 'SHOTGUN x3'; primDmg = 1.1 * dm; primCd = 0.5; }
  else if(p.char === 'cyborg'){ primName = 'BIO-GUN'; primDmg = 1 * dm; primCd = 0.4; }
  else { primName = 'PISTOL'; primDmg = 1 * dm; primCd = p.fireRate; }
  const primRate = primCd > 0 ? 1 / primCd : 0;   // shots/sec

  // --- Secondary basic attack (RMB): per-class form, damage, pool capacity, regen ---
  let secName, secDmg, capLabel, capVal, regenVal, rmbExtra;
  if(p.char === 'soldier'){
    secName = 'SPEAR';
    secDmg  = fmt(40 * dm) + ' DPS';
    capLabel = 'ENERGY';  capVal = fmt(p.energy) + ' / ' + fmt(p.maxEnergy) + ' s';
    regenVal = '0.2 /s';  rmbExtra = '~103° thrust arc';
  } else if(p.char === 'scout'){
    secName = '3× LASER BEAM';
    secDmg  = fmt(3 * dm) + ' /beam';
    capLabel = 'POWER';   capVal = fmt(p.power) + ' / ' + fmt(p.maxPower) + ' volleys';
    regenVal = '0.6 /s';  rmbExtra = fmt(1 / (0.22 * (p.laserScale || 1))) + ' volley/s';
  } else if(p.char === 'bounty_hunter'){
    secName = 'MACHETE';
    secDmg  = fmt(46 * dm) + ' DPS';
    capLabel = 'FURY';    capVal = fmt(p.fury) + ' / ' + fmt(p.maxFury) + ' s';
    regenVal = '0.2 /s';  rmbExtra = '~103° arc · melee';
  } else if(p.char === 'cyborg'){
    secName = 'GAS GUN';
    secDmg  = fmt(3.4 * dm) + ' /shot';
    capLabel = 'TOXIN';   capVal = fmt(p.toxin) + ' / ' + fmt(p.maxToxin) + ' shots';
    regenVal = '0.6 /s';  rmbExtra = fmt(1 / 0.2) + ' shots/s · fast';
  } else {
    secName = 'FLAMETHROWER';
    secDmg  = fmt(7 * dm) + ' DPS';
    capLabel = 'FUEL';    capVal = fmt(p.fuel) + ' / ' + fmt(p.maxFuel) + ' s';
    regenVal = '0.1 /s';  rmbExtra = '~60° cone · ×1.9 near→×0.4 far';
  }

  // HP regen + lifesteal are now UNIVERSAL equippable passives (live profile values;
  // '—' when not equipped).
  const hpRegenV = passiveValue('hpregen');
  const hpRegen = hpRegenV > 0 ? fmt(Math.round(hpRegenV * 100) / 100) + '/s' : '—';
  const lifestealV = passiveValue('lifesteal');
  const lifesteal = lifestealV > 0 ? PASSIVES.lifesteal.fmt(lifestealV) : '—';
  const baseSpd = p.speed;
  const effSpd  = p.speed * playerSpeedMult();
  const spdVal  = (Math.abs(effSpd - baseSpd) > 0.5)
    ? fmt(Math.round(baseSpd)) + ' (→' + fmt(Math.round(effSpd)) + ')'
    : fmt(Math.round(baseSpd)) + ' px/s';

  // Column row lists. {h:'HEADER'} or [label, value].
  const left = [
    { h:'DEFENCE' },
    ['HP', fmt(Math.round(p.hp * 10) / 10) + ' / ' + p.maxHp],
    ['SHIELD', p.shieldHp + ' / ' + p.shieldMax],
    ['HP REGEN', hpRegen],
    { h:'MOBILITY' },
    ['MOVE SPEED', spdVal],
    { h:'PRIMARY ATTACK (LMB)' },
    ['WEAPON', primName],
    ['DAMAGE', fmt(primDmg) + ' /hit'],
    ['FIRE RATE', fmt(Math.round(primRate * 10) / 10) + ' /s']
  ];
  const right = [
    { h:'SECONDARY ATTACK (RMB)' },
    ['WEAPON', secName],
    ['DAMAGE', secDmg],
    [capLabel + ' CAP.', capVal],
    [capLabel + ' REGEN', regenVal],
    ['CADENCE / NOTE', rmbExtra],
    { h:'GENERAL' },
    ['WEAPON TIER', 'Tier ' + (p.weaponTier || 1) + ' / 5  (×' + fmt(tierMul) + ')'],
    ['DAMAGE MULT', '×' + fmt(Math.round(dm * 100) / 100) + ' (incl. tier)'],
    ['LIFESTEAL', lifesteal],
    ['ACCOUNT LV', String(profile.level || 1)]
  ];

  // --- Panel ---
  ctx.fillStyle = 'rgba(6,8,16,0.86)';
  ctx.fillRect(0, 0, W, H);
  const px = 22, py = 20, pw = W - 44, ph = 210;
  ctx.fillStyle = 'rgba(14,18,30,0.96)';
  ctx.fillRect(px, py, pw, ph);
  ctx.strokeStyle = ch.color || '#4fc3f7';
  ctx.lineWidth = 1;
  ctx.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1);

  // Title bar
  ctx.textAlign = 'left';
  ctx.font = 'bold 11px monospace';
  ctx.fillStyle = ch.color || '#fff';
  ctx.fillText(ch.name, px + 8, py + 14);
  ctx.textAlign = 'right';
  ctx.font = 'bold 8px monospace';
  ctx.fillStyle = '#7f8c9a';
  ctx.fillText('CHARACTER STATS', px + pw - 8, py + 13);
  ctx.strokeStyle = '#33384a';
  ctx.beginPath();
  ctx.moveTo(px + 6, py + 19.5); ctx.lineTo(px + pw - 6, py + 19.5);
  ctx.stroke();

  // Column renderer
  const renderCol = (rows, x0, valX) => {
    let y = py + 32;
    for(const r of rows){
      if(r.h){
        ctx.textAlign = 'left';
        ctx.font = 'bold 8px monospace';
        ctx.fillStyle = ch.color || '#4fc3f7';
        ctx.fillText(r.h, x0, y);
        y += 13;
      } else {
        ctx.textAlign = 'left';
        ctx.font = 'bold 8px monospace';
        ctx.fillStyle = '#8b94a3';
        ctx.fillText(r[0], x0 + 4, y);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#eef2f7';
        ctx.fillText(r[1], valX, y);
        y += 12;
      }
    }
  };
  renderCol(left,  px + 8,  px + pw / 2 - 8);
  renderCol(right, px + pw / 2 + 6, px + pw - 8);

  // EQUIPPED PASSIVES (full-width): the live values of every equipped passive, or a
  // "none" note. (Lifesteal/HP-regen also appear in the columns above; this is the
  // full account-wide readout.) Unequipped passives simply don't appear.
  ctx.strokeStyle = '#33384a'; ctx.beginPath();
  ctx.moveTo(px + 6, py + ph - 38.5); ctx.lineTo(px + pw - 6, py + ph - 38.5); ctx.stroke();
  ctx.textAlign = 'left'; ctx.font = 'bold 8px monospace'; ctx.fillStyle = ch.color || '#4fc3f7';
  ctx.fillText('EQUIPPED PASSIVES (' + (profile.equippedPassives || []).length + '/' + maxPassiveSlots() + ')', px + 8, py + ph - 26);
  const eqp = (profile.equippedPassives || []).filter(k => PASSIVES[k]);
  ctx.font = 'bold 7px monospace'; ctx.fillStyle = '#dfe7f0';
  const passLine = eqp.length
    ? eqp.map(k => PASSIVES[k].label + ' ' + PASSIVES[k].fmt(passiveValue(k))).join('   ·   ')
    : '— none equipped (buy + equip in the SHOP) —';
  ctx.fillText(passLine, px + 8, py + ph - 15);

  // Footer hint
  ctx.textAlign = 'center';
  ctx.font = 'bold 7px monospace';
  ctx.fillStyle = '#5f6b7a';
  ctx.fillText('TAB / ESC / CLICK TO CLOSE', W / 2, py + ph - 5);
  ctx.textAlign = 'left';
}

// World-space drawing only: entities and particles. HUD is screen-space and
// is called by `draw()` after the camera translate is restored.
// Lingering visual-only decals: soft radial scorch / toxic-spill discs that fade their
// alpha over ~10s. Drawn under everything; never touched by physics/collision.
function drawDecals(){
  // Blocky scorch/toxic marks — a flat fading square (no radial gradient).
  for(const d of decals){
    const a = clamp(d.life / d.maxLife, 0, 1);
    const base = d.kind === 'toxic' ? 0.22 : 0.4;
    const s = Math.max(2, Math.round(d.r * 1.3));
    ctx.globalAlpha = base * a;
    ctx.fillStyle = d.color + '1)';   // d.color is 'rgba(r,g,b,' — close it opaque, alpha via globalAlpha
    ctx.fillRect(Math.floor(d.x - s/2), Math.floor(d.y - s/2), s, s);
    ctx.globalAlpha = 1;
  }
}

function drawGame(){
  drawDecals();   // lingering scorch/toxic marks, under everything
  // Boss poison-gas pools: translucent green discs drawn beneath the entities.
  for(const gf of groundFields){
    if(gf.warn > 0){
      // Arming telegraph: pulsing hollow yellow ring (no damage yet) so the player
      // can read the danger zone and step out before the pool goes live.
      ctx.globalAlpha = 0.45 + 0.4 * Math.sin(stateTime * 18);
      ctx.strokeStyle = '#f1c40f';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(Math.floor(gf.x), Math.floor(gf.y), gf.radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
      continue;
    }
    const a = clamp(gf.life / gf.maxLife, 0, 1);
    ctx.globalAlpha = 0.16 + 0.12 * a;
    ctx.fillStyle = '#27ae60';
    ctx.beginPath();
    ctx.arc(Math.floor(gf.x), Math.floor(gf.y), gf.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 0.4 * a;
    ctx.strokeStyle = '#2ecc71';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // Reuse a scratch array (drop dead entries in the same pass) instead of cloning
  // `entities` every frame, then y-sort for painter order.
  _drawList.length = 0;
  for(const e of entities){ if(!e.dead) _drawList.push(e); }
  _drawList.sort((a,b) => a.y - b.y);
  for(const e of _drawList){
    if(e.type === 'player') drawPlayer(e);
    else if(e.type === 'enemy') drawEnemy(e);
    else if(e.type === 'bullet') drawBulletEntity(e);
    else if(e.type === 'pickup') drawPickupEntity(e);
    else if(e.type === 'companion') drawCompanion(e);
    else if(e.type === 'sword_ally') drawSwordAlly(e);
    else if(e.type === 'henchman') drawHenchman(e);
    else if(e.type === 'nunchaku') drawNunchaku(e);
    else if(e.type === 'bomber_ally') drawBomberAlly(e);
    else if(e.type === 'poison_ally') drawPoisonAlly(e);
    else if(e.type === 'poison_cloud') drawPoisonCloud(e);
  }
  let _lastPColor = '';    // cache last fillStyle color to skip redundant CSS color parses
  for(const p of particles){
    const a = clamp(p.life / p.maxLife, 0, 1);
    ctx.globalAlpha = a;
    if(p.beam){
      // Scout's laser beam: a crisp solid line (colored body + white core), no glow.
      const ex = p.x + Math.cos(p.angle) * p.len;
      const ey = p.y + Math.sin(p.angle) * p.len;
      const x0 = Math.floor(p.x), y0 = Math.floor(p.y), x1 = Math.floor(ex), y1 = Math.floor(ey);
      ctx.strokeStyle = p.color; ctx.lineWidth = 2; ctx.globalAlpha = a;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    } else if(p.ring){
      // Expanding shockwave outline (B-blast AoE) — a simple circle stroke.
      const r = p.r0 + (p.r1 - p.r0) * (1 - a);
      ctx.strokeStyle = p.color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(Math.floor(p.x), Math.floor(p.y), r, 0, Math.PI * 2); ctx.stroke();
    } else if(p.smoke){
      // Expanding BLOCKY smoke puff (a growing grey square fading out).
      const r = p.r0 + (p.r1 - p.r0) * (1 - a);
      const s = Math.max(1, Math.round(r));
      ctx.globalAlpha = a * 0.32; ctx.fillStyle = p.color;
      ctx.fillRect(Math.floor(p.x - s/2), Math.floor(p.y - s/2), s, s);
    } else if(p.spark){
      // Spark shard — a crisp little rectangle.
      if(p.color !== _lastPColor){ ctx.fillStyle = p.color; _lastPColor = p.color; }
      ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.w || 2, p.h || 1);
    } else if(p.flash){
      // Muzzle/impact flash — a crisp solid square burst (no star/glow).
      const r = Math.max(2, Math.round(p.r || 6));
      if(p.color !== _lastPColor){ ctx.fillStyle = p.color; _lastPColor = p.color; }
      ctx.fillRect(Math.floor(p.x - r/2), Math.floor(p.y - r/2), r, r);
    } else {
      // Plain mote (incl. former glow embers) — a crisp blocky square.
      const s = p.size || 1;
      if(p.color !== _lastPColor){ ctx.fillStyle = p.color; _lastPColor = p.color; }
      ctx.fillRect(Math.floor(p.x), Math.floor(p.y), s, s);
    }
  }
  ctx.globalAlpha = 1;
}

// Stacked-fillRect "floor plan" character body. Caller is responsible for the
// surrounding ctx.save/translate/rotate/scale — this function only draws rects
// in the character's LOCAL frame (origin at sprite center, +y axis = forward).
// Used by drawPlayer (with rotation tracking the cursor) AND drawCharacterSelect
// (head-up, no rotation). Keep the two render paths in sync via this one body.
function drawCharacterFloorPlan(ctx, charKey){
  // *** Dr. Syed (The Soldier) ***
  if (charKey === 'soldier') {
    ctx.fillStyle = '#0d2b0d'; // Dark Green Fatigues
    ctx.fillRect(-12, -25, 24, 20); // Main Body
    ctx.fillRect(-18, -15, 6, 10);  // Left Shoulder
    ctx.fillRect(12, -15, 6, 10);   // Right Shoulder
    ctx.fillStyle = '#4a2b16'; // Brown Wood Spear
    ctx.fillRect(13, -15, 4, 50);   // Spear Shaft
    ctx.fillStyle = '#808080'; // Grey Metal Tip
    ctx.fillRect(12, 35, 6, 10);    // Spear Tip
    ctx.fillStyle = '#0d2b0d'; // Dark Green Helmet
    ctx.fillRect(-10, -10, 20, 20); // Head
    ctx.fillStyle = '#8a6347'; // Skin Tone
    ctx.fillRect(-6, 6, 12, 4);     // Face visible from above
  }
  // *** Xu Yihui (The Scout) ***
  else if (charKey === 'scout') {
    ctx.fillStyle = '#2a2a2a'; // Dark Grey Suit
    ctx.fillRect(-15, -30, 30, 20); // Body
    ctx.fillStyle = '#ffcc99'; // Skin Tone (Hands)
    ctx.fillRect(-18, -18, 6, 6);   // Left Hand
    ctx.fillRect(12, -18, 6, 6);    // Right Hand
    ctx.fillStyle = '#808080'; // Gunmetal Grey SMG
    ctx.fillRect(13, -18, 5, 25);   // SMG body
    ctx.fillRect(11, 7, 9, 3);      // SMG Stock
    ctx.fillStyle = '#1a1a1a'; // Black Helmet
    ctx.fillRect(-10, -10, 20, 20); // Head
    ctx.fillStyle = '#00ffff'; // Neon Cyan
    ctx.fillRect(-6, 4, 12, 6);     // Visor
  }
  // *** Benjamin Wu (The Tank) ***
  else if (charKey === 'tank') {
    ctx.fillStyle = '#2a2a2a'; // Dark Bluish Gray
    ctx.fillRect(-25, -45, 50, 40); // Wide Body
    ctx.fillStyle = '#ff4500'; // Orange Vents
    ctx.fillRect(-22, -42, 6, 6);   // Left Vent
    ctx.fillRect(16, -42, 6, 6);    // Right Vent
    ctx.fillStyle = '#1a1a1a'; // Dark Grey Helmet
    ctx.fillRect(-15, -15, 30, 30); // Large Head
    ctx.fillStyle = '#ff0000'; // Red Visor
    ctx.fillRect(-10, 8, 20, 5);
    ctx.fillStyle = '#4f4f4f'; // Medium Grey Flamethrower

// ----- IN-GAME POSE -----
// mode: 'shotgun' (default) or 'sword'
// slashT: 0..1 progress of the cleaver swing (only used when mode==='sword')
function drawLeoGame(ctx, x, y, aimAngle, px = 3, mode = 'shotgun', slashT = 0) {
  ctx.save(); ctx.translate(x, y); ctx.imageSmoothingEnabled = false;
  _leoBody(ctx, px);
  if (mode === 'sword') {
    // fast UNIDIRECTIONAL chop: from +1.1rad down to -0.5rad relative to aim
    const ease = 1 - Math.pow(1 - slashT, 3);
    const swing = 1.1 - 1.6*ease;
    ctx.save(); ctx.rotate(aimAngle);
    ctx.fillStyle = 'rgba(230,240,255,0.22)';
    ctx.beginPath(); ctx.arc(2*px, 0, 22*px, swing-0.2, swing+0.7); ctx.lineTo(2*px, 0); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.save(); ctx.translate(4*px, 1*px); ctx.rotate(aimAngle + swing); _leoCleaver(ctx, px); ctx.restore();
  } else {
    ctx.save(); ctx.translate(-7*px, 2*px); ctx.rotate(aimAngle); _leoMacheteHand(ctx, px); ctx.restore();
    ctx.save(); ctx.translate(7*px, 2*px); ctx.rotate(aimAngle); _leoShotgunHand(ctx, px); ctx.restore();
  }
  ctx.restore();
}

  if(p.char === 'soldier' && mouse.rdown && p.energy > 0){
    ctx.save();
    // The spear is in Dr. Syed's left hand (drawn in drawDrSyed at offset
    // (-7*px, +2*px); DR_SYED_PX=1), so the thrust telegraph + afterimages +
    // live spear all originate from (sx, sy) — the spear-hand position —
    // not the player center. Damage in fireKatana pivots around the same
    // point so the gameplay arc and the visual arc stay in lock-step.
    const sx = p.x - 7, sy = p.y + 2;
    // Faint thrust zone (flat low-alpha fan — telegraph only).
    ctx.fillStyle = 'rgba(207,216,220,0.08)';
    ctx.beginPath(); ctx.moveTo(sx, sy);
    ctx.arc(sx, sy, KATANA_RANGE, p.angle - KATANA_HALF, p.angle + KATANA_HALF);
    ctx.closePath(); ctx.fill();
    const reachAt = t => KATANA_RANGE * (0.45 + 0.55 * Math.abs(Math.sin(t * 22)));
    const angAt   = t => p.angle + Math.sin(t * 9) * KATANA_HALF;
    // Crisp white afterimage lines (a few trailing thrust poses) — no glow/curves.
    ctx.strokeStyle = '#e8eef2'; ctx.lineWidth = 1; ctx.globalAlpha = 0.4;
    for(let k = 3; k >= 1; k--){
      const an = angAt(stateTime - k * 0.03), rr = reachAt(stateTime - k * 0.03);
      ctx.beginPath();
      ctx.moveTo(Math.floor(sx + Math.cos(an)*6), Math.floor(sy + Math.sin(an)*6));
      ctx.lineTo(Math.floor(sx + Math.cos(an)*rr), Math.floor(sy + Math.sin(an)*rr));
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // Live wooden spear: brown shaft + crisp grey spearhead triangle.
    const ang = angAt(stateTime), reach = reachAt(stateTime);
    const ca = Math.cos(ang), sa = Math.sin(ang);
    const bx = sx + ca * 3, by = sy + sa * 3;
    const tx = sx + ca * reach, ty = sy + sa * reach;
    const hx = sx + ca * (reach - 5), hy = sy + sa * (reach - 5);
    ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(hx, hy); ctx.stroke();
    const px = -sa, py = ca;
    ctx.fillStyle = '#bdc3c7';
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(hx + px*2.2, hy + py*2.2); ctx.lineTo(hx - px*2.2, hy - py*2.2); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
  }
  // (Leo's old machete wedge visual lived here; the new bespoke drawLeoGame
  //  renderer draws its own slash arc when leoSlashRem > 0, so the wedge is
  //  no longer needed — see the bounty_hunter branch in the renderer chain.)
  // Body: stacked-fillRect "floor plan" view. Each class is hand-laid as a top-down
  // silhouette of head + shoulders + weapons in its OWN local frame (body north of
  // origin, weapons extending south = local +y axis). We rotate by p.angle - PI/2 so
  // that local +y points at the cursor, then ctx.scale(0.4) shrinks the supplied
  // coords to roughly match the recent sprite sizing (others ~14 logical px wide,
  // Tank/Bounty ~20). imageSmoothingEnabled=false (set at top of file) keeps the
  // rects crisp. Hit-flash tint dropped (the post-hit invuln blink above still
  // signals damage). drawPixelSprite + CHARACTERS[*].sprite/pal/px are still used
  // by the character-select card preview, so don't delete them.
  if(p.char === 'soldier'){
    // Dr. Syed has his own renderer — body always head-up, only the Uzi rotates by aim.
    drawDrSyed(ctx, p.x, p.y, p.angle, DR_SYED_PX);
  } else if(p.char === 'scout'){
    // Xu Yihui — same convention: body head-up, weapons rotate by aim.
    drawXuYihui(ctx, p.x, p.y, p.angle, XU_YIHUI_PX);
  } else if(p.char === 'tank'){
    // Benjamin Wu — bespoke renderer. `firing` shows the flame visual at the
    // flamethrower nozzle whenever the RMB flamethrower is actually doing
    // damage (RMB held + has fuel + not in the post-empty lockout).
    const firing = mouse.rdown && p.fuel > 0 && p.rmbLockT <= 0;
    drawBenjaminWu(ctx, p.x, p.y, p.angle, BENJAMIN_WU_PX, firing);
  } else if(p.char === 'bounty_hunter'){
    // Leo — bespoke renderer. Default mode is 'shotgun' (shotgun in right
    // hand + machete in left, both swivel with aim). When a cleaver slash
    // is in progress (leoSlashRem > 0), swap to 'sword' mode and feed it
    // the slash progress 0..1 so the chop animation plays out.
    if(p.leoSlashRem > 0){
      const slashT = 1 - p.leoSlashRem / p.leoSlashTotal;
      drawLeoGame(ctx, p.x, p.y, p.angle, LEO_PX, 'sword', slashT);
    } else {
      drawLeoGame(ctx, p.x, p.y, p.angle, LEO_PX, 'shotgun', 0);
    }
  } else if(p.char === 'cyborg'){
    // Ong — bespoke renderer. Both weapons (pistol LEFT, gas gun RIGHT)
    // swivel with aim; `gasOn` toggles the green gas-puff visual at the gas
    // gun's muzzle. Tied to mouse.down so the puff shows while the player
    // is firing the LMB gas gun.
    drawOngGame(ctx, p.x, p.y, p.angle, ONG_PX, mouse.down);
  } else {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle + Math.PI / 2);   // was p.angle - PI/2; +PI rotates the whole sprite 180°
    ctx.scale(0.4, 0.4);
    drawCharacterFloorPlan(ctx, p.char);
    ctx.restore();
  }
  // Shield ring
  if(p.shieldHp > 0){
    ctx.strokeStyle = '#1abc9c';
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(stateTime * 8);
    ctx.beginPath();
    ctx.arc(Math.floor(p.x), Math.floor(p.y), 9, 0, Math.PI*2);
    ctx.stroke();
    ctx.globalAlpha = 1;
    // Shield pips
    ctx.fillStyle = '#1abc9c';
    for(let i=0;i<p.shieldHp;i++){
      const a = -Math.PI/2 + (i - (p.shieldHp-1)/2)*0.35;
      ctx.fillRect(Math.floor(p.x + Math.cos(a)*9) - 1, Math.floor(p.y + Math.sin(a)*9) - 1, 2, 2);
    }
  }
}

function drawEnemy(e){
  let sp;
  switch(e.kind){
    case 'grunt':   sp = e.frame === 0 ? SPR.grunt_a : SPR.grunt_b; break;
    case 'runner':  sp = e.frame === 0 ? SPR.runner_a : SPR.runner_b; break;
    case 'tank':    sp = e.frame === 0 ? SPR.tank_a : SPR.tank_b; break;
    case 'shooter': sp = e.frame === 0 ? SPR.shooter_a : SPR.shooter_b; break;
    case 'charger': sp = e.frame === 0 ? SPR.charger_a : SPR.charger_b; break;
    case 'exploder':sp = e.frame === 0 ? SPR.exploder_a : SPR.exploder_b; break;
    case 'swarmer': sp = e.frame === 0 ? SPR.swarmer_a : SPR.swarmer_b; break;
    case 'weaver':  sp = e.frame === 0 ? SPR.weaver_a : SPR.weaver_b; break;
    case 'spitter': sp = e.frame === 0 ? SPR.spitter_a : SPR.spitter_b; break;
    case 'bruiser': sp = SPR.bruiser; break;
    case 'sniper':  sp = SPR.sniper; break;
    case 'splitter': sp = SPR.splitter; break;
    case 'splitter_mid': sp = SPR.splitter_mid; break;
    case 'splitter_mini': sp = SPR.splitter_mini; break;
    case 'summoner': sp = SPR.summoner; break;
    case 'overlord': sp = SPR.overlord; break;
    case 'warden':   sp = SPR.warden; break;
    case 'harrier':  sp = SPR.harrier; break;
    case 'twin':     sp = SPR.twin; break;
    case 'reaper':   sp = SPR.reaper; break;
    case 'bomber':   sp = SPR.bomber; break;
    case 'phantom':  sp = SPR.phantom; break;
    case 'nemesis':  sp = SPR.nemesis; break;
  }
  if(!sp) return;
  // Charger telegraph (phase 1: locked aim flash)
  if(e.kind === 'charger' && e.phase === 1){
    ctx.strokeStyle = '#e74c3c';
    ctx.globalAlpha = 0.5 + 0.4 * Math.sin(stateTime * 28);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(Math.floor(e.x), Math.floor(e.y));
    ctx.lineTo(Math.floor(e.x + Math.cos(e.chargeAngle)*120), Math.floor(e.y + Math.sin(e.chargeAngle)*120));
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // Sniper telegraph
  if(e.kind === 'sniper' && e.telegraphActive){
    ctx.strokeStyle = '#1abc9c';
    ctx.globalAlpha = 0.4 + 0.4 * Math.sin(stateTime * 30);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(Math.floor(e.x), Math.floor(e.y));
    ctx.lineTo(Math.floor(e.x + Math.cos(e.telegraphAngle)*300), Math.floor(e.y + Math.sin(e.telegraphAngle)*300));
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // Elite "mini-boss" aura: a pulsing gold ring at the enlarged hit radius.
  if(e.elite){
    ctx.strokeStyle = '#f1c40f';
    ctx.globalAlpha = 0.45 + 0.35 * Math.sin(stateTime * 6);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(Math.floor(e.x), Math.floor(e.y), e.radius + 2, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // Elites draw ~1.5x bigger so the sprite roughly matches the enlarged hitbox.
  // Elites draw ~1.5x bigger; bosses gently "breathe" (subtle scale pulse) so they
  // feel alive without needing a second hand-drawn frame.
  const drawScale = e.elite ? 1.5 : (e.isBoss ? (e.drawScaleRole || 1) * (1 + 0.05 * Math.sin(stateTime * 3)) : 1);
  if(drawScale !== 1){ ctx.save(); ctx.translate(e.x, e.y); ctx.scale(drawScale, drawScale); ctx.translate(-e.x, -e.y); }
  if(e.invulnT > 0 && Math.floor(stateTime * 20) % 2){
    // Brief-invincibility shield: flash the boss blue (it's absorbing all damage).
    drawSpriteTinted(sp, Math.floor(e.x - sp.w/2), Math.floor(e.y - sp.h/2), '#5dade2');
  } else if(e.hitFlash > 0){
    drawSpriteTinted(sp, Math.floor(e.x - sp.w/2), Math.floor(e.y - sp.h/2), '#fff');
  } else {
    drawSpriteCentered(sp, e.x, e.y);
  }
  if(drawScale !== 1) ctx.restore();
  // HP bar for multi-HP non-boss (gold + wider + lifted for elites)
  if(e.maxHp > 1 && e.hp < e.maxHp && !e.isBoss){
    const w = e.elite ? Math.round(sp.w * 1.5) : sp.w;
    const topY = (e.elite ? Math.floor(e.y - (sp.h * 1.5) / 2) : Math.floor(e.y - sp.h / 2)) - 3;
    ctx.fillStyle = '#222';
    ctx.fillRect(Math.floor(e.x - w/2), topY, w, 2);
    ctx.fillStyle = e.elite ? '#f1c40f' : '#e74c3c';
    ctx.fillRect(Math.floor(e.x - w/2), topY, Math.floor(w * (e.hp / e.maxHp)), 2);
  }
}

function drawSwordAlly(s){
  // Slash arc renders behind the sprite.
  if(s.swingTime > 0){
    const half = s.attackArc / 2;
    const t = clamp(s.swingTime / 0.18, 0, 1);
    ctx.save();
    ctx.fillStyle = 'rgba(241, 196, 15, ' + (0.18 + 0.32 * t) + ')';
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.arc(s.x, s.y, s.attackRange, s.angle - half, s.angle + half);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 255, 255, ' + (0.5 * t) + ')';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }
  if(s.invuln > 0 && Math.floor(s.invuln * 20) % 2) return;
  const sp = s.frame === 0 ? SPR.sword_ally_a : SPR.sword_ally_b;
  if(s.hitFlash > 0){
    drawSpriteTinted(sp, Math.floor(s.x - sp.w/2), Math.floor(s.y - sp.h/2), '#fff');
  } else {
    drawSpriteCentered(sp, s.x, s.y);
  }
  // Tiny HP pips above.
  ctx.fillStyle = '#0a0a14';
  ctx.fillRect(Math.floor(s.x) - 5, Math.floor(s.y - sp.h/2) - 3, 11, 2);
  ctx.fillStyle = '#f1c40f';
  ctx.fillRect(Math.floor(s.x) - 5, Math.floor(s.y - sp.h/2) - 3, Math.floor(11 * (s.hp / s.maxHp)), 2);
}

function drawHenchman(s){

    const half = s.attackArc / 2;
    const t = clamp(s.swingTime / 0.2, 0, 1);
    ctx.save();
    ctx.fillStyle = 'rgba(200, 146, 58, ' + (0.16 + 0.30 * t) + ')';
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.arc(s.x, s.y, s.attackRange, s.angle - half, s.angle + half);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 235, 200, ' + (0.45 * t) + ')';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }
  if(s.invuln > 0 && Math.floor(s.invuln * 20) % 2) return;
  const sp = s.frame === 0 ? SPR.henchman_a : SPR.henchman_b;

  }
  // HP pips above.

  ctx.fillRect(Math.floor(s.x) - 6, Math.floor(s.y - sp.h/2) - 3, Math.floor(13 * (s.hp / s.maxHp)), 2);

function drawCompanion(c){
  if(c.invuln > 0 && Math.floor(c.invuln * 18) % 2) return;
  const sp = c.frame === 0 ? SPR.companion_a : SPR.companion_b;
  if(c.hitFlash > 0){
    drawSpriteTinted(sp, Math.floor(c.x - sp.w/2), Math.floor(c.y - sp.h/2), '#fff');
  } else {
    drawSpriteCentered(sp, c.x, c.y);
  }
  // Tiny HP pips above
  ctx.fillStyle = '#0a0a14';
  ctx.fillRect(Math.floor(c.x) - 4, Math.floor(c.y - sp.h/2) - 3, 9, 2);

  ctx.fillRect(Math.floor(c.x) - 4, Math.floor(c.y - sp.h/2) - 3, Math.floor(9 * (c.hp / c.maxHp)), 2);

// Shared helper: draw an ally sprite (with hit-flash + invuln blink) and an HP bar.
function drawAllySprite(s, sprA, sprB, pipColor, halfW){
  if(s.invuln > 0 && Math.floor(s.invuln * 20) % 2) return;
  const sp = s.frame === 0 ? sprA : sprB;
  if(s.hitFlash > 0){
    drawSpriteTinted(sp, Math.floor(s.x - sp.w/2), Math.floor(s.y - sp.h/2), '#fff');
  } else {
    drawSpriteCentered(sp, s.x, s.y);
  }
  const w = halfW * 2 + 1;
  ctx.fillStyle = '#0a0a14';
  ctx.fillRect(Math.floor(s.x) - halfW, Math.floor(s.y - sp.h/2) - 3, w, 2);
  ctx.fillStyle = pipColor;
  ctx.fillRect(Math.floor(s.x) - halfW, Math.floor(s.y - sp.h/2) - 3, Math.floor(w * (s.hp / s.maxHp)), 2);
}

function drawNunchaku(s){
  // Quick white strike arc behind the sprite.
  if(s.swingTime > 0){
    const half = s.attackArc / 2;
    const t = clamp(s.swingTime / 0.2, 0, 1);
    ctx.save();
    ctx.fillStyle = 'rgba(236, 240, 241, ' + (0.16 + 0.30 * t) + ')';
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.arc(s.x, s.y, s.attackRange, s.angle - half, s.angle + half);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 255, 255, ' + (0.55 * t) + ')';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();

  drawAllySprite(s, SPR.nunchaku_a, SPR.nunchaku_b, '#ecf0f1', 5);

function drawBomberAlly(s){
  drawAllySprite(s, SPR.bomber_a, SPR.bomber_b, '#e67e22', 5);
}

function drawPoisonAlly(s){
  // Translucent green aura ring (the actual damage zone).
  if(s.invuln <= 0 || Math.floor(s.invuln * 20) % 2 === 0){
    ctx.save();
    const pulse = 0.10 + 0.05 * Math.sin(stateTime * 4);
    ctx.fillStyle = 'rgba(39, 174, 96, ' + pulse + ')';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.auraRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(46, 204, 113, 0.35)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }
  drawAllySprite(s, SPR.poison_a, SPR.poison_b, '#27ae60', 5);
}

function drawBulletEntity(b){
  // RETRO blocky bullets: no gradients/glow/arcs. Leo's shotgun PELLETS render as a
  // crisp grey-white tracer (a head square + a faint trailing square).
  if(b.kind === 'pellet'){
    const sp = Math.hypot(b.vx, b.vy) || 1;
    const tlx = b.x - (b.vx / sp) * 5, tly = b.y - (b.vy / sp) * 5;
    ctx.globalAlpha = 0.5; ctx.fillStyle = '#cfd8dc';
    ctx.fillRect(Math.floor(tlx) - 1, Math.floor(tly) - 1, 2, 2);
    ctx.globalAlpha = 1; ctx.fillStyle = '#fdfdff';
    ctx.fillRect(Math.floor(b.x) - 1, Math.floor(b.y) - 1, 2, 2);
    return;
  }
  // Everything else: the blocky color-mapped bullet SPRITE, rotated to its heading.
  ctx.save();
  ctx.translate(Math.floor(b.x), Math.floor(b.y));
  ctx.rotate(b.angle);
  const sp = b.sprite;
  if(sp) drawSprite(sp, -Math.floor(sp.w / 2), -Math.floor(sp.h / 2));
  else { ctx.fillStyle = b.glow || '#ffe08a'; ctx.fillRect(-2, -2, 4, 4); }
  ctx.restore();
  if(b.pierce){
    // Crisp green pierce-trail square.
    ctx.globalAlpha = 0.4; ctx.fillStyle = '#27ae60';
    ctx.fillRect(Math.floor(b.x) - 1, Math.floor(b.y) - 1, 3, 3);
    ctx.globalAlpha = 1;
  }
}

function drawPickupEntity(p){
  if(p.life < 3 && Math.floor(p.life * 6) % 2) return;
  const sprMap = {
    health: SPR.p_health, rapid: SPR.p_rapid, pierce: SPR.p_pierce,
    multi: SPR.p_multi,   damage: SPR.p_damage, shield: SPR.p_shield,
    speed: SPR.p_speed,   slowmo: SPR.p_slowmo,
    score2x: SPR.p_score, magnet: SPR.p_magnet,
    fuel: SPR.p_fuel,     armor: SPR.p_armor,
    beverage: SPR.p_beverage, battery: SPR.p_battery,
    protein: SPR.p_protein, isotope: SPR.p_isotope
  };
  const sp = sprMap[p.kind];
  if(!sp) return;
  const off = Math.sin(stateTime * 6 + p.x) * 1.2;
  const glowColors = {
    health:'#e74c3c', rapid:'#e67e22', pierce:'#9b59b6',
    multi:'#1abc9c',  damage:'#e74c3c', shield:'#1abc9c',
    speed:'#e91e63',  slowmo:'#3498db',
    score2x:'#f1c40f', magnet:'#e74c3c',
    fuel:'#e67e22',   armor:'#3498db',
    beverage:'#2ecc71', battery:'#19f0ff',
    protein:'#c0392b', isotope:'#8e44ad'
  };
  ctx.fillStyle = glowColors[p.kind] || '#fff';
  ctx.globalAlpha = 0.2 + 0.2 * Math.sin(stateTime * 8);
  ctx.fillRect(Math.floor(p.x) - sp.w/2 - 1, Math.floor(p.y + off) - sp.h/2 - 1, sp.w + 2, sp.h + 2);
  ctx.globalAlpha = 1;
  drawSpriteCentered(sp, p.x, p.y + off);
}

function drawHUD(){
  // HP
  ctx.fillStyle = '#000';
  ctx.fillRect(6, 6, 66, 10);
  ctx.fillStyle = '#3a1010';
  ctx.fillRect(7, 7, 64, 8);
  ctx.fillStyle = '#e74c3c';
  ctx.fillRect(7, 7, Math.floor(64 * (player.hp / player.maxHp)), 8);
  ctx.font = 'bold 8px monospace';
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  ctx.fillText('HP', 9, 14);

  // Shield bar below HP. hudY is the running top-left cursor so the enhancer chips
  // and the RMB resource bar stack cleanly under HP/shield.
  let hudY = 18;
  if(player.shieldHp > 0){
    ctx.fillStyle = '#000';
    ctx.fillRect(6, hudY, 66, 6);
    ctx.fillStyle = '#0f3a35';
    ctx.fillRect(7, hudY + 1, 64, 4);
    ctx.fillStyle = '#1abc9c';
    ctx.fillRect(7, hudY + 1, Math.floor(64 * (player.shieldHp / player.shieldMax)), 4);
    hudY += 8;
  }
  // Basic-attack ENHANCER chips (RAPID / PIERCE / MULTI / DMG) — drawn just ABOVE the
  // secondary-attack (RMB) resource bar below, so each enhancer sits with the weapon
  // it modifies. These four are the ONLY weapon pickups now (form never changes).
  const enh = [];
  if(player.rapidTime  > 0) enh.push(['RAPID',  player.rapidTime,  8, '#e67e22']);
  if(player.pierceTime > 0) enh.push(['PIERCE', player.pierceTime, 8, '#9b59b6']);
  if(player.multiTime  > 0) enh.push(['MULTI',  player.multiTime,  8, '#1abc9c']);
  if(player.damageTime > 0) enh.push(['DMG',    player.damageTime, 8, '#e74c3c']);
  if(enh.length){
    let ex = 6;
    ctx.font = 'bold 6px monospace';
    ctx.textAlign = 'left';
    for(const e of enh){
      ctx.fillStyle = '#000'; ctx.fillRect(ex, hudY, 38, 7);
      ctx.fillStyle = e[3];   ctx.fillRect(ex + 1, hudY + 1, Math.floor(36 * clamp(e[1] / e[2], 0, 1)), 5);
      ctx.fillStyle = '#fff'; ctx.fillText(e[0], ex + 2, hudY + 6);
      ex += 42;
    }
    hudY += 9;
  }
  // RMB resource bar (Tank FUEL / Soldier ENERGY / Scout POWER). Only one of the
  // three maxes is ever > 0, so they share the one slot at hudY (under the enhancers).
  // The secondary simply can't fire while the pool is too low; it resumes as the pool
  // regenerates (no lockout), so the bar just shows the current fill.
  let rmbBar = null;
  // Tank only: when flameHeldT > 2 (Dangerous Temperature), light up the FUEL bar —
  // bright-red fill + pulsing crimson border + pulsing label — to signal the player
  // that their flamethrower is overheating into the +50% damage state.
  const fuelDanger = player.maxFuel > 0 && player.flameHeldT > 2;
  if(player.maxFuel > 0)        rmbBar = { cur:player.fuel,   max:player.maxFuel,   label:'FUEL',   back: fuelDanger ? '#5a0a08' : '#3a1a08', fill: fuelDanger ? '#ff3030' : '#e67e22', danger: fuelDanger };
  else if(player.maxEnergy > 0) rmbBar = { cur:player.energy, max:player.maxEnergy, label:'ENERGY', back:'#0b2e1a', fill:'#2ecc71' };
  else if(player.maxPower > 0)  rmbBar = { cur:player.power,  max:player.maxPower,  label:'POWER',  back:'#082a33', fill:'#19f0ff' };
  else if(player.maxFury > 0)   rmbBar = { cur:player.fury,   max:player.maxFury,   label:'FURY',   back:'#3a0a0a', fill:'#c0392b' };
  else if(player.maxToxin > 0)  rmbBar = { cur:player.toxin,  max:player.maxToxin,  label:'TOXIN',  back:'#2a0a33', fill:'#8e44ad' };
  if(rmbBar){
    ctx.fillStyle = '#000';
    ctx.fillRect(6, hudY, 66, 6);
    ctx.fillStyle = rmbBar.back;
    ctx.fillRect(7, hudY + 1, 64, 4);
    ctx.fillStyle = rmbBar.fill;
    ctx.fillRect(7, hudY + 1, Math.floor(64 * (rmbBar.cur / rmbBar.max)), 4);
    ctx.font = 'bold 6px monospace';
    // Pulse the label when at Dangerous Temperature so the "skill icon lights up"
    // reads instantly: white -> bright red flashes at ~5 Hz with stateTime.
    ctx.fillStyle = rmbBar.danger && Math.floor(stateTime * 10) % 2 ? '#ffd040' : '#fff';
    ctx.textAlign = 'left';
    ctx.fillText(rmbBar.label, 8, hudY + 5);
    // Danger glow border around the bar so it visibly "lights up" beyond the fill swap.
    if(rmbBar.danger){
      ctx.strokeStyle = '#ff5530';
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(stateTime * 12);
      ctx.strokeRect(6.5, hudY + 0.5, 65, 5);
      ctx.globalAlpha = 1;
    }
  }

  // Score & level (top-right)
  ctx.font = 'bold 10px monospace';
  ctx.textAlign = 'right';
  ctx.fillStyle = '#f1c40f';
  ctx.fillText('SCORE ' + score, W - 6, 14);
  ctx.fillStyle = '#3498db';
  ctx.fillText('LVL ' + (levelIdx + 1) + '/' + LEVELS.length, W - 6, 26);

  // Active weapon row (bottom-left)
  drawWeaponHUD();

  // Boss bar(s) — one per live boss, so the L21-40 twin medium bosses both show.
  // (Reuses _bossList scratch array — no per-frame allocation.)
  _bossList.length = 0;
  for(const e of entities){ if(e.isBoss && !e.dead) _bossList.push(e); }
  if(_bossList.length){
    const barW = _bossList.length > 1 ? 120 : 180;
    const gap = 8;
    const totalW = _bossList.length * barW + (_bossList.length - 1) * gap;
    let bx = Math.floor(W/2 - totalW/2);
    ctx.font = 'bold 8px monospace';
    ctx.textAlign = 'center';
    for(const boss of _bossList){
      ctx.fillStyle = '#000';
      ctx.fillRect(bx, H - 26, barW, 12);
      ctx.fillStyle = '#3a1338';
      ctx.fillRect(bx + 1, H - 25, barW - 2, 10);
      ctx.fillStyle = '#9b59b6';
      ctx.fillRect(bx + 1, H - 25, Math.floor((barW - 2) * (boss.hp / boss.maxHp)), 10);
      // A mid-boss is a different kind than levelData.boss, so label it by its own
      // BOSS_NAMES entry; only the actual end boss gets the level's bossName override.
      const bossLabel = (boss.kind === levelData.boss)
        ? (levelData.bossName || BOSS_NAMES[boss.kind] || 'BOSS')
        : (BOSS_NAMES[boss.kind] || 'BOSS');
      ctx.fillStyle = '#fff';
      ctx.fillText(bossLabel, bx + barW/2, H - 17);
      bx += barW + gap;
    }
  }

  // Boss spawn flash
  if(bossSpawnPulse > 0){
    ctx.globalAlpha = bossSpawnPulse;
    ctx.fillStyle = '#9b59b6';
    ctx.font = 'bold 22px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('!! ' + (bossSpawnName || levelData.bossName || BOSS_NAMES[levelData.boss] || 'BOSS') + ' !!', W/2, H/2);
    ctx.globalAlpha = 1;
  }
}

function drawWeaponHUD(){
  // Bottom-left strip of active weapons / ammo
  let y = H - 14;
  let x = 6;
  ctx.font = 'bold 7px monospace';
  ctx.textAlign = 'left';
  const draw = (label, sp, t, max, color) => {
    if(sp){ drawSprite(sp, x, y - 7); }
    ctx.fillStyle = '#000';
    ctx.fillRect(x + 7, y - 5, 32, 5);
    ctx.fillStyle = color;
    ctx.fillRect(x + 7, y - 5, Math.floor(32 * clamp(t/max, 0, 1)), 5);
    ctx.fillStyle = '#fff';
    ctx.fillText(label, x + 7, y - 7);
    x += 48;
  };
  // NB: the four basic-attack enhancers (RAPID / PIERCE / MULTI / DMG) are drawn in
  // drawHUD, stacked above the RMB resource bar — not here. This bottom strip is now
  // just the movement / utility powerups.
  if(player.speedTime > 0)  draw('SPEED', SPR.p_speed,  player.speedTime,  8,  '#e91e63');
  if(player.sprintTime > 0) draw('SPRNT', SPR.p_speed,  player.sprintTime, 5,  '#1abc9c');
  if(slowMoTime > 0)        draw('SLOW',  SPR.p_slowmo, slowMoTime,        5,  '#3498db');
  if(player.scoreTime > 0)  draw('x2',    SPR.p_score,  player.scoreTime,  10, '#f1c40f');
  if(player.magnetTime > 0) draw('MAG',   SPR.p_magnet, player.magnetTime, 10, '#e74c3c');

  // ---- Skill cooldown row (X / C / M) ----
  drawSkillHUD();
}

function drawSkillHUD(){
  const y = H - 30;
  // Chips come from the LOADOUT (F=heal always; X/C/B/V from player.loadout), label
  // + color pulled from the SKILLS catalog. Unassigned / locked slots are skipped.
  const skills = [];
  for(const [key, slot] of [['F','f'],['X','x'],['C','c'],['B','b'],['V','v']]){
    const id = player.loadout[slot];
    if(!id || !SKILLS[id]) continue;
    skills.push({ key, label:SKILLS[id].label, cd:player.skillCd[slot], max:skillCdFor(id), color:SKILLS[id].color });
  }
  ctx.textAlign = 'left';
  let x = 6;
  for(const s of skills){
    const ready = s.cd <= 0;
    // Box background
    ctx.fillStyle = ready ? s.color : '#1a1a24';
    ctx.fillRect(x, y, 38, 12);
    ctx.strokeStyle = ready ? '#fff' : '#4a4a5e';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, 37, 11);
    // Cooldown overlay (drains down)
    if(!ready){
      const frac = clamp(s.cd / s.max, 0, 1);
      ctx.fillStyle = '#2c3e50';
      ctx.fillRect(x + 1, y + 1, Math.floor(36 * frac), 10);
    }
    // Key letter
    ctx.font = 'bold 8px monospace';
    ctx.fillStyle = ready ? '#000' : '#bdc3c7';
    ctx.fillText(s.key, x + 2, y + 9);
    // Skill name / cd seconds
    ctx.font = 'bold 7px monospace';
    ctx.fillStyle = ready ? '#000' : '#fff';
    if(ready) ctx.fillText(s.label, x + 11, y + 8);
    else ctx.fillText(s.cd.toFixed(1) + 's', x + 11, y + 8);
    x += 42;
  }
}
