<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0f; overflow:hidden; font-family:monospace; color:#fff; }
  body { display:flex; align-items:center; justify-content:center; }
  canvas {
    background:#181828;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: crosshair;
    box-shadow: 0 0 50px rgba(0,0,0,0.7), 0 0 0 2px #2a2a3e;
  }
</style>

// ============================================================
// CONSTANTS & CANVAS
// ============================================================
const W = 480, H = 270;
// PX = number of backing-store pixels per logical world unit.
// Bumping from 1 to 2 doubles the canvas resolution (480x270 -> 960x540 backing)
// while keeping all gameplay math in the original 480x270 logical space.
// Pure pixel-art sprites still look identical; text and sub-pixel geometry render crisper.
const PX = 2;

// World vs viewport: W/H are the on-screen viewport (fixed). worldW/worldH are
// the gameplay arena, which can be larger than the viewport (L14-L20 use 2x).
// camX/camY track the camera's top-left corner in world space. When worldW===W
// the camera stays at 0,0 and there is no scrolling.
let worldW = W, worldH = H;
let camX = 0, camY = 0;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = W * PX; canvas.height = H * PX;
ctx.scale(PX, PX);
ctx.imageSmoothingEnabled = false;

function resize(){
  // CSS scale stays anchored to logical W/H so on-screen size is unchanged.
  const s = Math.max(1, Math.floor(Math.min(window.innerWidth/W, window.innerHeight/H)));
  canvas.style.width = (W*s)+'px';
  canvas.style.height = (H*s)+'px';
}
window.addEventListener('resize', resize); resize();

function drawSprite(sp, x, y){
  const rows = sp.rows, pal = sp.pal;
  for(let r=0;r<rows.length;r++){
    const row = rows[r];
    for(let c=0;c<row.length;c++){
      const col = pal[row[c]];
      if(col){ ctx.fillStyle = col; ctx.fillRect(x+c, y+r, 1, 1); }
    }
  }
}
function drawSpriteCentered(sp, x, y){
  drawSprite(sp, Math.floor(x - sp.w/2), Math.floor(y - sp.h/2));
}
function drawSpriteTinted(sp, x, y, tint){
  const rows = sp.rows, pal = sp.pal;
  ctx.fillStyle = tint;
  for(let r=0;r<rows.length;r++){
    const row = rows[r];
    for(let c=0;c<row.length;c++){
      if(pal[row[c]]) ctx.fillRect(x+c, y+r, 1, 1);
    }
  }
}

// ============================================================
let audioCtx = null;
function initAudio(){
  if(!audioCtx){
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, dur, type='square', freqEnd=null, gain=0.1){
  if(!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, now);
  if(freqEnd !== null) osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), now + dur);
  g.gain.setValueAtTime(gain, now);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + dur);
}
function noiseHit(dur=0.08, gain=0.15, freq=1200){
  if(!audioCtx) return;
  const now = audioCtx.currentTime;
  const bufSize = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<bufSize;i++) data[i] = Math.random()*2-1;
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(gain, now);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  const filt = audioCtx.createBiquadFilter();
  filt.type = 'bandpass'; filt.frequency.value = freq;
  src.connect(filt).connect(g).connect(audioCtx.destination);
  src.start(now);
}

// Gameplay keys must preventDefault so the browser does not handle them
// (focus shifts, page scroll, find-on-page shortcuts, etc.). Without this,
// pressing X / WASD on some browsers can scroll the page and push the HUD
// out of view, even when the body has overflow:hidden — the focused element
// may still scroll itself to bring something into view.
const GAMEPLAY_KEYS = new Set([
  'KeyW','KeyA','KeyS','KeyD',
  'KeyX','KeyC','KeyV','KeyF','KeyB',
  'Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'
]);
window.addEventListener('keydown', e => {
  const wasDown = keys[e.code];
  keys[e.code] = true;
  if(GAMEPLAY_KEYS.has(e.code)) e.preventDefault();
  // Space toggles pause during play (leading edge only — ignore auto-repeat).
  if(e.code === 'Space' && !wasDown && state === STATE.PLAYING){
    paused = !paused;
  }
  // Escape leaves the current run / setup screen and returns to the main menu
  // (the "initial interface"). Leading edge only, from any state except MENU.
  // Intentionally NOT in GAMEPLAY_KEYS: Escape doesn't scroll the page, and we
  // don't want to suppress the browser's fullscreen-exit on Escape.
  if(e.code === 'Escape' && !wasDown && state !== STATE.MENU){
    state = STATE.MENU;
    stateTime = 0;
    paused = false;
  }
});
window.addEventListener('keyup', e => {
  keys[e.code] = false;
  if(GAMEPLAY_KEYS.has(e.code)) e.preventDefault();
});
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (W / r.width);
  mouse.y = (e.clientY - r.top) * (H / r.height);
});
canvas.addEventListener('mousedown', e => {
  initAudio();
  // A click anywhere while paused just resumes — it shouldn't also fire a shot.
  if(state === STATE.PLAYING && paused){ paused = false; return; }
  if(e.button === 2){ mouse.rdown = true; }
  else { mouse.down = true; mouse.clicked = true; }
});
window.addEventListener('mouseup', e => {
  if(e.button === 2){ mouse.rdown = false; }
  else { mouse.down = false; }
});
canvas.addEventListener('contextmenu', e => e.preventDefault());

// Make the canvas focusable and grab focus on click — that way letter keys
// (X / WASD) route to the canvas instead of the body, and the browser never
// tries to scroll the document to "follow" focus or input.
canvas.tabIndex = -1;
canvas.style.outline = 'none';
canvas.addEventListener('mousedown', () => canvas.focus());
window.addEventListener('load', () => canvas.focus());
// Belt-and-suspenders: if anything scrolls the page (browser auto-scroll on
// focus change, virtual keyboard popup, etc.) snap it back so the HUD never
// drifts out of view.
window.addEventListener('scroll', () => window.scrollTo(0, 0), { passive: true });

function dist2(a,b){ const dx=a.x-b.x, dy=a.y-b.y; return dx*dx + dy*dy; }
function rand(a,b){ return a + Math.random()*(b-a); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function pickWeighted(mix){
  const r = Math.random();
  let acc = 0;
  for(const [k,w] of mix){ acc += w; if(r < acc) return k; }
  return mix[mix.length-1][0];
}
function clickedRect(x,y,w,h){ return mouse.x>=x && mouse.x<=x+w && mouse.y>=y && mouse.y<=y+h; }
