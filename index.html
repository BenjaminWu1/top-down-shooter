<title>Pixel Shooter</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0f; overflow:hidden; font-family:monospace; color:#fff; }
  body { display:flex; align-items:center; justify-content:center; }
  canvas {
    background:#181828;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: crosshair;
    box-shadow: 0 0 50px rgba(0,0,0,0.7), 0 0 0 2px #2a2a3e;

</style>

// ============================================================
// CONSTANTS & CANVAS
// ============================================================
const W = 480, H = 270;
// Slight uniform enlargement applied to every world tier (all 4 map sizes) on top
// of the per-block integer scale — 1.15x linear ≈ 1.32x area. Single tuning lever:
// raise/lower to grow/shrink all four arenas together. NOTE: because it makes even
// the 1x (L1-10) arena larger than the W*H viewport, the camera now follows on L1-10
// too (updateCamera no longer collapses to 0,0 there).
const MAP_EXPAND = 1.15;
// PX = number of backing-store pixels per logical world unit.
// Bumping from 1 to 2 doubles the canvas resolution (480x270 -> 960x540 backing)
// while keeping all gameplay math in the original 480x270 logical space.
// Pure pixel-art sprites still look identical; text and sub-pixel geometry render crisper.
const PX = 2;

// World vs viewport: W/H are the on-screen viewport (fixed). worldW/worldH are
// the gameplay arena, which is always larger than the viewport (every tier is at
// least 1x*MAP_EXPAND > W*H, so the camera scrolls on every level now).
// camX/camY track the camera's top-left corner in world space. The worldW===W
// no-scroll case only applies to the pre-level default below (updateCamera still
// collapses to 0,0 whenever maxX/maxY are 0, so it stays correct either way).
let worldW = W, worldH = H;
let camX = 0, camY = 0;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = W * PX; canvas.height = H * PX;
ctx.scale(PX, PX);
// RETRO pixel-art look: smoothing OFF + integer-snapped draw coords keep everything
// crisp and blocky (classic 1990s top-down shooter). Re-enforced after every ctx.save/
// restore is unnecessary — imageSmoothingEnabled persists on the context.
ctx.imageSmoothingEnabled = false;
const TAU = Math.PI * 2;

function resize(){
  // CSS scale stays anchored to logical W/H so on-screen size is unchanged.
  const s = Math.max(1, Math.floor(Math.min(window.innerWidth/W, window.innerHeight/H)));
  canvas.style.width = (W*s)+'px';
  canvas.style.height = (H*s)+'px';
}
window.addEventListener('resize', resize); resize();

function drawSprite(sp, x, y){
  const rows = sp.rows, pal = sp.pal;
  for(let r=0;r<rows.length;r++){
    const row = rows[r];
    for(let c=0;c<row.length;c++){
      const col = pal[row[c]];
      if(col){ ctx.fillStyle = col; ctx.fillRect(x+c, y+r, 1, 1); }
    }
  }
}
function drawSpriteCentered(sp, x, y){
  // Integer-snapped (Math.floor) so the pixel cells stay crisp — no sub-pixel blur.
  drawSprite(sp, Math.floor(x - sp.w/2), Math.floor(y - sp.h/2));
}
function drawSpriteTinted(sp, x, y, tint){
  const rows = sp.rows, pal = sp.pal;
  ctx.fillStyle = tint;
  for(let r=0;r<rows.length;r++){
    const row = rows[r];
    for(let c=0;c<row.length;c++){
      if(pal[row[c]]) ctx.fillRect(x+c, y+r, 1, 1);
    }
  }
}

// ---- RETRO color-mapped pixel-art renderer for the 5 playable characters ----
// A single shared palette (char -> CSS color; '.' = transparent) + a renderer that
// draws an array-of-strings sprite as blocky fillRect cells, ROTATED to face an angle.
// The sprites are designed top-down FACING EAST (front/weapon at the right edge, +x),
// so passing player.angle (0 = east) points the front at the cursor. With
// imageSmoothingEnabled=false + floored coords the cells stay crisp (cardinal angles
// are pixel-perfect; off-axis rotation gets minimal edge stepping). `tint` (optional)
// overrides every non-transparent cell with one colour (the white hit-flash).
const PALETTE = {
  '.': null,            // transparent
  'k': '#15151a',       // near-black
  'd': '#2c2c2c',       // dark suit / shoulders grey
  'g': '#3a5a2a',       // camo dark green
  'G': '#5a7a3a',       // camo mid green
  'o': '#4b5320',       // olive drab
  'b': '#6b4a2a',       // brown (spear shaft / duster dark)
  'B': '#8a5a2a',       // tan brown (duster)
  'f': '#caa472',       // flesh
  's': '#9aa7b0',       // gunmetal grey
  'S': '#c5d0d8',       // bright chrome / silver
  'c': '#00ffff',       // neon cyan (visor)
  't': '#39ff14',       // toxic green (toxin tank)
  'r': '#e67e22',       // orange (vents)
  'w': '#e8eef2',       // white highlight (spearhead)
  '9': '#e74c3c'        // red (optic)
};
const PLAYER_PX = 1.125;  // logical px per sprite cell (12x12 grid ~= 13.5px on screen)
function drawPixelSprite(ctx, map, x, y, size, angle, tint, pal, faceOffset){
  if(!map) return;
  const rows = map.length, cols = map[0].length;
  ctx.save();
  ctx.translate(Math.floor(x), Math.floor(y));
  ctx.rotate((angle || 0) + (faceOffset || 0));
  const ox = -cols * size / 2, oy = -rows * size / 2;   // center the grid on (x,y)
  const cell = Math.ceil(size) + 1;                     // +1 overlap to avoid seams
  for(let r = 0; r < rows; r++){
    const row = map[r];
    for(let c = 0; c < cols; c++){
      const ch  = row[c];
      const col = tint || (pal && pal[ch]) || PALETTE[ch];
      if(col){ ctx.fillStyle = col; ctx.fillRect(Math.floor(ox + c*size), Math.floor(oy + r*size), cell, cell); }
    }
  }
  ctx.restore();
}

let audioCtx = null;
function initAudio(){
  if(!audioCtx){
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, dur, type='square', freqEnd=null, gain=0.1){
  if(!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, now);
  if(freqEnd !== null) osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), now + dur);
  g.gain.setValueAtTime(gain, now);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + dur);
}
// White-noise burst through a biquad filter. `filterType` defaults to 'bandpass'
// (every existing call is unchanged); pass 'lowpass'/'highpass' for muffled/hissy hits.
function noiseHit(dur=0.08, gain=0.15, freq=1200, filterType='bandpass'){
  if(!audioCtx) return;
  const now = audioCtx.currentTime;
  const bufSize = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<bufSize;i++) data[i] = Math.random()*2-1;
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(gain, now);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  const filt = audioCtx.createBiquadFilter();
  filt.type = filterType; filt.frequency.value = freq;
  src.connect(filt).connect(g).connect(audioCtx.destination);
  src.start(now);
}

// ---- Flamethrower CONTINUOUS loop (the only sustained node in the game) ----
// A held, looping white-noise source through a low-pass filter. Started on the first
// flame frame, pitched/opened up in the "Dangerous Temperature" state, and stopped on
// release / empty / pause / death / menu (see the Tank RMB block + the update() guard).
// All three fns no-op when audio isn't initialised (headless: audioCtx null/stub).
let flameLoop = null;   // { src, filter, gain } while sustaining, else null
function flameAudioStart(){
  if(!audioCtx || flameLoop) return;
  try {
    const n = Math.max(1, Math.floor(audioCtx.sampleRate * 1.0));
    const buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = Math.random()*2-1;
    const src = audioCtx.createBufferSource(); src.buffer = buf; src.loop = true;
    const filt = audioCtx.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 700;
    const g = audioCtx.createGain();
    const now = audioCtx.currentTime;
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.12, now + 0.06);
    src.connect(filt).connect(g).connect(audioCtx.destination);
    src.start(now);
    flameLoop = { src, filter: filt, gain: g };
  } catch(e){ flameLoop = null; }
}
function flameAudioSetDanger(danger){
  if(!flameLoop || !audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    flameLoop.filter.frequency.linearRampToValueAtTime(danger ? 2400 : 700, now + 0.08);  // pitch up sharply
    flameLoop.gain.gain.linearRampToValueAtTime(danger ? 0.16 : 0.12, now + 0.08);
  } catch(e){}
}
function flameAudioStop(){
  if(!flameLoop){ return; }
  if(audioCtx){
    try {
      const now = audioCtx.currentTime;
      flameLoop.gain.gain.cancelScheduledValues(now);
      flameLoop.gain.gain.setValueAtTime(flameLoop.gain.gain.value || 0.0001, now);
      flameLoop.gain.gain.linearRampToValueAtTime(0.0001, now + 0.08);
      flameLoop.src.stop(now + 0.12);
    } catch(e){}
  }
  flameLoop = null;
}

// THREE-PHASE difficulty progression across the 40 levels (idx 0..39). The shape is
// deliberately NOT linear: it's gentle early, ramps moderately mid-game, and spikes
// hard at the end so late levels lean on meta-progression upgrades. All three pieces
// are CONTINUOUS at the seams (idx 14->15, 23->24) and STRICTLY INCREASING in idx
// (the headless balance assertions + the "boss HP rises within a tier" check rely on
// monotonicity). To re-tune the whole curve, edit the three slopes / anchors here.
//   Phase 1  L1-15  (idx 0-14): forgiving — introduce mechanics.
//   Phase 2  L16-24 (idx 15-23): moderate, steady ramp.
//   Phase 3  L25-30 (idx 24-29): sharp ramp.
//   Phase 4  L31-40 (idx 30-39): the post-finale SPIKE (steeper still — the late game
//            is meant to be brutal and lean hard on meta-progression upgrades).
// The enemy ramp's per-level delta is capped at <=0.2 by the headless continuity
// assertion, so most of the L31-40 spike is carried by bossHpScale (uncapped) + the
// enemyDmgScale lever below, NOT this ramp.
// `difficultyRamp` is the EXTRA on top of 1.0 (so a multiplier is 1 + ramp).
function difficultyRamp(idx){
  if(idx <= 14) return idx * 0.03;                  // 0.00 .. 0.42
  if(idx <= 23) return 0.42 + (idx - 14) * 0.07;    // 0.49 .. 1.05
  if(idx <= 29) return 1.05 + (idx - 23) * 0.16;    // 1.21 .. 2.01 (idx 29)
  return 2.01 + (idx - 29) * 0.19;                  // 2.20 .. 4.10 (idx 39) — L31-40 spike
}
// Non-boss enemy HP/speed multiplier. ~1.0 @L1, ~1.42 @L15, ~2.05 @L24, ~3.01 @L30, ~5.10 @L40.
function enemyScale(){ return 1 + difficultyRamp(levelIdx); }
// Boss HP multiplier — its own FOUR-phase curve. The phase-1 slope (0.05) is steeper
// than the enemy ramp ON PURPOSE: the smallest boss base HP is 24 (bruiser), and a
// gentler slope would make consecutive within-tier HPs collide after Math.ceil (which
// would fail the "boss HP strictly rises within each tier" assertion). Phase 4 (L31-40)
// is much steeper (0.32) to carry the post-finale spike — no headless delta cap on this
// one, only strict-increase + L1 no-op. Continuous at the seams.
// ~1.0 @L1 (no-op), ~1.70 @L15, ~2.42 @L24, ~3.38 @L30, ~6.58 @L40.
function bossHpScale(idx){
  if(idx <= 14) return 1 + idx * 0.05;              // L1-15 : gentle (strict-after-ceil safe)
  if(idx <= 23) return 1.70 + (idx - 14) * 0.08;    // L16-24: moderate (idx23 -> 2.42)
  if(idx <= 29) return 2.42 + (idx - 23) * 0.16;    // L25-30: sharp    (idx29 -> 3.38)
  return 3.38 + (idx - 29) * 0.32;                  // L31-40: STEEP spike (idx39 -> 6.58)
}
// Boss speed multiplier — shares the enemy ramp shape but flattened so bosses never
// get uncatchable. Bumped (0.16) so late bosses pursue harder. ~1.0 @L1, ~1.66 @L40.
function bossSpdScale(idx){ return 1 + difficultyRamp(idx) * 0.16; }
// Enemy contact / bullet damage multiplier — flat 1.0 through L30, then ramps so the
// L31-40 spike also makes enemy HITS hurt more (HP/speed alone are capped by the headless
// continuity assertion). Applied at the three enemy-sourced damagePlayer sites only.
// Bumped (0.16) as part of the #2 rebalance — fewer enemies, so each one hits harder.
// L31 = 1.16 .. L40 = 2.76.
function enemyDmgScale(idx){
  if(idx <= 29) return 1.0;
  return 1.0 + (idx - 29) * 0.16;
}
// Extra per-enemy HP for the LATE game (#2 rebalance: fewer monsters, but each tougher).
// 1.0 through L20, ramping to ~1.43 by L40. Applied at the gameplay spawn site
// (spawnEnemyAtEdge) for NON-boss enemies — kept OUT of enemyScale()/createEnemy so the
// headless `enemyScale() == 1 + difficultyRamp` and elite-ratio assertions stay exact.
function enemyHpMul(idx){
  if(idx <= 19) return 1.0;
  return 1.0 + (idx - 19) * 0.0215;   // L21 ≈ 1.02 .. L40 ≈ 1.43
}

// (1 tier per 8 levels, capped at 5): weaponTier(L) = min(5, floor((L-1)/8)+1) -> tier
// 1 / 2 / 3 / 4 / 5 unlock at account level 1 / 9 / 17 / 25 / 33. Each tier multiplies
// the basic-attack (LMB + held-RMB) base DAMAGE and projectile SPEED; it stacks
// multiplicatively with the DAMAGE pickup (x2) and is independent of RAPID (which only
// affects cadence). Cached on the player at run start (applyLevelScaling). ----
const WEAPON_TIER_MULT = [1.0, 1.2, 1.5, 1.9, 2.5];   // index = tier-1
function weaponTierFor(level){ return Math.min(5, Math.floor(((level || 1) - 1) / 8) + 1); }
function weaponTierMult(){ return WEAPON_TIER_MULT[(player && player.weaponTier || 1) - 1] || 1; }

function DEFAULT_PROFILE(){
  return { v:1, level:1, xp:0, gold:0,
           ownedSkills:['heal'], ownedAssistants:['drone'],
           assistantLevels:{ drone:1 },
           skillLevels:{ heal:1 },
           passiveLevels:{}, equippedPassives:[],
           loadout:{ x:null, c:null, b:null, v:null },
           defaultAssistant:'drone', equippedAssistants:['drone'] };
}
function loadProfile(){
  const raw = localStorage.getItem('shooter_profile');
  // Headless V8 stubs localStorage as a no-op Proxy (returns a non-string); first
  // run returns null. In both cases fall back to a fresh profile rather than
  // JSON.parse-ing a non-string (which would throw and break the headless run).
  if(typeof raw !== 'string') return DEFAULT_PROFILE();
  let p;
  try { p = JSON.parse(raw); } catch(e){ return DEFAULT_PROFILE(); }
  if(!p || typeof p !== 'object') return DEFAULT_PROFILE();
  const d = DEFAULT_PROFILE();
  const out = {
    v:1,
    level: Math.max(1, Math.floor(p.level) || 1),
    xp: Math.max(0, +p.xp || 0),
    gold: Math.max(0, Math.floor(p.gold) || 0),
    ownedSkills: Array.isArray(p.ownedSkills) ? p.ownedSkills.slice() : d.ownedSkills,
    ownedAssistants: Array.isArray(p.ownedAssistants) ? p.ownedAssistants.slice() : d.ownedAssistants,
    loadout: { x:null, c:null, b:null, v:null },
    defaultAssistant: p.defaultAssistant || 'drone',
    equippedAssistants: Array.isArray(p.equippedAssistants) ? p.equippedAssistants.slice() : d.equippedAssistants
  };
  if(!out.ownedSkills.includes('heal')) out.ownedSkills.unshift('heal');
  if(!out.ownedAssistants.includes('drone')) out.ownedAssistants.unshift('drone');
  const lo = p.loadout || {};   // keep only owned skills (defends a stale older-build save)
  for(const k of ['x','c','b','v']){
    if(lo[k] && out.ownedSkills.includes(lo[k])) out.loadout[k] = lo[k];
  }
  out.equippedAssistants = out.equippedAssistants.filter(k => out.ownedAssistants.includes(k)).slice(0, 2);
  // Per-assistant upgrade level (1..10), kept only for owned assistants.
  const al = (p.assistantLevels && typeof p.assistantLevels === 'object') ? p.assistantLevels : {};
  out.assistantLevels = {};
  for(const k of out.ownedAssistants){
    out.assistantLevels[k] = Math.max(1, Math.min(ASSIST_MAX_LEVEL, Math.floor(al[k]) || 1));
  }
  // Per-skill upgrade tier (1..5), kept only for owned skills. Returning players
  // whose save predates skill tiers simply default every owned skill to tier 1.
  const sl = (p.skillLevels && typeof p.skillLevels === 'object') ? p.skillLevels : {};
  out.skillLevels = {};
  for(const k of out.ownedSkills){
    out.skillLevels[k] = Math.max(1, Math.min(SKILL_MAX_TIER, Math.floor(sl[k]) || 1));
  }
  if(!out.skillLevels.heal) out.skillLevels.heal = 1;
  // Universal passives (clean slate for returning players: only keys actually owned in
  // the save are kept, clamped 1..10; equipped is capped to owned AND the level's slots).
  const ps = (p.passiveLevels && typeof p.passiveLevels === 'object') ? p.passiveLevels : {};
  out.passiveLevels = {};
  for(const k in PASSIVES){
    const lv = Math.floor(ps[k]);
    if(lv >= 1) out.passiveLevels[k] = Math.min(PASSIVE_MAX_LEVEL, lv);
  }
  const maxS = Math.min(5, Math.floor((out.level - 1) / 8) + 1);
  out.equippedPassives = (Array.isArray(p.equippedPassives) ? p.equippedPassives : [])
    .filter(k => PASSIVES[k] && out.passiveLevels[k]).slice(0, maxS);
  return out;
}

  try { localStorage.setItem('shooter_profile', JSON.stringify(profile)); } catch(e){}
}

// XP curve + grant helpers. Stat scaling is applied at RUN START (createPlayer ->
// applyLevelScaling), not mid-run, so a level-up never causes a jarring mid-fight jump.
// XP to advance FROM `level` to the next. Up to XP_HARD_LEVEL it grows by XP_GROWTH;
// at/above XP_HARD_LEVEL the curve is anchored to the L15 requirement and grows by the
// steeper XP_HARD_GROWTH, so leveling up gets markedly harder past level 15. Continuous
// and strictly increasing at the seam (the headless XP-curve assertion relies on that).
function xpToNext(level){
  if(level < XP_HARD_LEVEL) return Math.round(XP_BASE * Math.pow(XP_GROWTH, level - 1));
  const base = XP_BASE * Math.pow(XP_GROWTH, XP_HARD_LEVEL - 1);   // requirement at L15
  return Math.round(base * Math.pow(XP_HARD_GROWTH, level - XP_HARD_LEVEL));
}
function grantXp(amount){
  profile.xp += amount;
  while(profile.level < LEVEL_CAP && profile.xp >= xpToNext(profile.level)){
    profile.xp -= xpToNext(profile.level);
    profile.level++;
    if(sfx && sfx.levelComplete) sfx.levelComplete();
  }
  if(profile.level >= LEVEL_CAP) profile.xp = 0;
  saveProfile();
}
function grantGold(amount){ profile.gold += amount; saveProfile(); }
// Loadout slot gating: +1 equippable skill slot per 5 levels (cap 4 = X/C/B/V).
const SLOT_ORDER = ['x','c','b','v'];
function unlockedSlots(){ return Math.min(4, Math.floor(profile.level / 5)); }

// ---- Assistant level helpers ----
function assistantLevel(key){
  const al = profile.assistantLevels || {};
  return Math.max(1, Math.min(ASSIST_MAX_LEVEL, Math.floor(al[key]) || 1));
}
// Fraction of an assistant's FULL (factory-reference) capability at a given level:
// weak at level 1, full at level 10. This is what "significantly reduces" a fresh
// (level-1) ally and what each upgrade buys back.
function assistLevelFrac(lvl){
  const L = Math.max(1, Math.min(ASSIST_MAX_LEVEL, lvl || 1));
  return 0.35 + (L - 1) / (ASSIST_MAX_LEVEL - 1) * 0.65;   // L1 = 0.35 ... L10 = 1.0
}
// Gold to upgrade from `lvl` to `lvl+1` (rises each level).
function assistUpgradeCost(lvl){
  return Math.round(ASSIST_UPGRADE_BASE * Math.pow(ASSIST_UPGRADE_GROWTH, lvl - 1));
}

// ---- Universal passive helpers ----
// Owned level (1..10) or 0 if the passive is not owned yet.
function passiveLevel(key){
  const pl = profile.passiveLevels || {};
  const v = Math.floor(pl[key]);
  if(!v || v < 1) return 0;
  return Math.min(PASSIVE_MAX_LEVEL, v);
}
function passiveEquipped(key){
  return passiveLevel(key) > 0 && Array.isArray(profile.equippedPassives) && profile.equippedPassives.indexOf(key) >= 0;
}
// The scaled value of an EQUIPPED passive at its current level; 0 when not equipped
// (so every core-loop call site contributes nothing unless the player equipped it).
function passiveValue(key){
  if(!passiveEquipped(key)) return 0;
  return passiveValueAt(key, passiveLevel(key));
}
// The value a passive WOULD have at an explicit level (for shop/stats "current -> next").
function passiveValueAt(key, level){
  const p = PASSIVES[key]; if(!p) return 0;
  const L = Math.max(1, Math.min(PASSIVE_MAX_LEVEL, level || 1));
  return p.a + (p.b - p.a) * (L - 1) / (PASSIVE_MAX_LEVEL - 1);
}
// Gold to BUY (level 0 -> 1) or UPGRADE (lvl -> lvl+1); null when already max level.
function passiveUpgradeCost(key){
  const L = passiveLevel(key);
  if(L >= PASSIVE_MAX_LEVEL) return null;
  return Math.round(PASSIVE_BUY_BASE * Math.pow(PASSIVE_UP_GROWTH, L));
}
// Active passive slots by account level: thresholds 1 / 9 / 17 / 25 / 33 -> 1..5 (cap 5).
function maxPassiveSlots(){ return Math.min(5, Math.floor((profile.level - 1) / 8) + 1); }
// Short formatted effect string for a passive at a given level (shop/stats display).
function passiveBlurb(key, level){
  const p = PASSIVES[key]; if(!p) return '';
  return p.fmt(passiveValueAt(key, level));
}
// Live, level-scaled basic stats for an assistant, for the SHOP / LOADOUT readouts.
// Builds a throwaway entity via createAssistant (which applies the CURRENT
// profile.assistantLevels[key] via applyAssistantLevel), so the numbers shown reflect
// the upgrade level. Returns [[label,value], ...]; never pushed into `entities`.
function assistantStatLines(key){
  const a = createAssistant(key);
  const r0 = n => String(Math.round(n));
  const r1 = n => String(Math.round(n * 10) / 10);
  const rows = [['HP', r0(a.maxHp)]];
  if(a.type === 'companion')        rows.push(['DMG', r1(a.dmg)],      ['RNG', r0(a.detectRange)],   ['ROF', r1(1 / a.fireRate) + '/s']);
  else if(a.type === 'henchman' ||
          a.type === 'nunchaku')    rows.push(['DMG', r1(a.swingDmg)], ['RNG', r0(a.attackRange)],   ['ROF', r1(1 / a.attackRate) + '/s']);
  else if(a.type === 'bomber_ally') rows.push(['DMG', r1(a.bombDmg)],  ['BLAST', r0(a.explodeRadius)],['ROF', r1(1 / a.fireRate) + '/s']);
  else if(a.type === 'poison_ally') rows.push(['DPS', r1(a.dps)],      ['RNG', r0(a.auraRadius)],    ['AURA', 'CONT']);
  return rows;
}
// Short threshold-ability readout for the SHOP / LOADOUT: what an ally's CURRENT
// level (1..10) has unlocked (`now`) and what the NEXT threshold unlocks (`next`).
// L1-3 = base, L4-6 = the secondary ability, L7-10 = the ultimate. Mirrors the
// behaviors wired into the assistant AI update functions.
function assistantEvoBlurb(key, level){
  const E = {
    drone:    ['AoE MISSILES', 'BERSERK x2'],
    henchman: ['GROUND SLAM',  'ENRAGE'],
    nunchaku: ['WHIRLWIND',    'FLURRY x2'],
    bomber:   ['CLUSTER x3',   'CARPET BOMB'],
    poison:   ['SPORE NOVA',   'PLAGUE']
  }[key] || ['', ''];
  const L = level || 1;
  if(L >= 7) return { now: E[1], next: null };
  if(L >= 4) return { now: E[0], next: E[1] + ' @L7' };
  return { now: 'BASE', next: E[0] + ' @L4' };
}

// skills tab fills 4 rows of 5 compact cards.
const SKILL_ORDER = ['heal','sprint','dash','grenade','blast','blink','slowmo','invuln','resummon','refuel','grit','overclock','summon','wall','flameburst','barrage','vsummon','fanfire','biobomb','nuke'];

// ---- Skill-tier helpers (read the player's current tier from profile.skillLevels) ----
function skillTier(id){
  const sl = profile.skillLevels || {};
  return Math.max(1, Math.min(SKILL_MAX_TIER, Math.floor(sl[id]) || 1));
}
// The active tier's param object {cd, ...effect knobs} for a skill id.
function skillStat(id){
  const s = SKILLS[id];
  if(!s || !s.t) return {};
  return s.t[skillTier(id) - 1] || s.t[0];
}
// Per-cast cooldown for a skill at its CURRENT tier (falls back to the player's
// vestigial skillCdMax map, then the tier-1 cd, so a missing entry can never NaN).
function skillCdFor(id){
  const st = skillStat(id);
  if(st && typeof st.cd === 'number') return st.cd;
  if(typeof player !== 'undefined' && player && player.skillCdMax && player.skillCdMax[id] != null) return player.skillCdMax[id];
  return (SKILLS[id] && SKILLS[id].t && SKILLS[id].t[0].cd) || 20;
}
// Gold to upgrade a skill from its current tier to the next (null if already maxed).
// Free skills (heal, cost 0) use SKILL_UP_BASE_MIN so their upgrades aren't free.
function skillUpgradeCost(id){
  const t = skillTier(id);
  if(t >= SKILL_MAX_TIER) return null;
  const base = (SKILLS[id] && SKILLS[id].cost > 0) ? SKILLS[id].cost : SKILL_UP_BASE_MIN;
  return Math.round(base * (SKILL_UP_MUL[t + 1] || 1));
}
// A short human-readable effect string for a given tier (HUD/shop detail panel).
function skillBlurb(id, tier){
  const s = SKILLS[id];
  if(!s || !s.t) return '';
  const T = s.t[Math.max(0, Math.min(s.t.length - 1, (tier || 1) - 1))];
  switch(id){
    case 'sprint':     return '+' + Math.round(T.spd * 100) + '% ' + T.dur + 's';
    case 'heal':       return '+' + T.hp + ' HP';
    case 'blast':      return 'r' + T.r + ' x' + T.dmgMul;
    case 'invuln':
    case 'wall':       return T.dur + 's invuln';
    case 'slowmo':     return 'slow ' + T.dur + 's';
    case 'dash':       return T.dist + 'px ' + T.iframe + 's i';
    case 'blink':      return 'tp ' + T.iframe + 's i';
    case 'flameburst': return T.dur + 's x' + T.dmgMul;
    case 'grenade':    return T.dmg + 'dmg r' + T.radius;
    case 'barrage':    return T.shells + ' shells x' + T.dmgMul;
    case 'summon':
    case 'vsummon':    return 'knight x' + T.dmgMul;
    case 'nuke':       return 'boss ' + T.bossDmg;
    case 'resummon':   return 'revive ' + T.reviveCount + (T.iframe ? ' +' + T.iframe + 's i' : '');
    case 'grit':       return T.shield + ' shld ' + T.iframe + 's i';
    case 'overclock':  return 'rapid ' + T.dur + 's';
    case 'fanfire':    return T.pellets + ' pellets';
    case 'biobomb':    return 'r' + T.radius + ' ' + T.dur + 's';
    case 'refuel':     return '+' + Math.round((T.frac || 0) * 100) + '% pool';
    default:           return '';
  }
}

// Gameplay keys must preventDefault so the browser does not handle them
// (focus shifts, page scroll, find-on-page shortcuts, etc.). Without this,
// pressing X / WASD on some browsers can scroll the page and push the HUD
// out of view, even when the body has overflow:hidden — the focused element
// may still scroll itself to bring something into view.
const GAMEPLAY_KEYS = new Set([
  'KeyW','KeyA','KeyS','KeyD',
  'KeyX','KeyC','KeyV','KeyF','KeyB',
  'Tab',  // toggles the CHARACTER STATS window; preventDefault stops focus-traversal
  'Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'
]);
window.addEventListener('keydown', e => {
  const wasDown = keys[e.code];
  keys[e.code] = true;
  if(GAMEPLAY_KEYS.has(e.code)) e.preventDefault();
  // Space toggles pause during play (leading edge only — ignore auto-repeat).
  if(e.code === 'Space' && !wasDown && state === STATE.PLAYING){
    paused = !paused;
  }
  // Tab toggles the CHARACTER STATS window during play (leading edge only). While
  // it's open the tick is frozen (see update()), so it acts like a stats-pause.
  if(e.code === 'Tab' && !wasDown && state === STATE.PLAYING){
    showStats = !showStats;
  }
  // Escape leaves the current run / setup screen and returns to the main menu
  // (the "initial interface"). Leading edge only, from any state except MENU.
  // Intentionally NOT in GAMEPLAY_KEYS: Escape doesn't scroll the page, and we
  // don't want to suppress the browser's fullscreen-exit on Escape.
  if(e.code === 'Escape' && !wasDown && state !== STATE.MENU){
    // If the stats window is open, Escape just closes it (stay in the run).
    if(state === STATE.PLAYING && showStats){
      showStats = false;
    } else {
      state = STATE.MENU;
      stateTime = 0;
      paused = false;
      showStats = false;
    }
  }
});
window.addEventListener('keyup', e => {
  keys[e.code] = false;
  if(GAMEPLAY_KEYS.has(e.code)) e.preventDefault();
});
canvas.addEventListener('mousemove', e => {

function dist2(a,b){ const dx=a.x-b.x, dy=a.y-b.y; return dx*dx + dy*dy; }

// ---- Uniform spatial grid over live enemies (perf) ----
// Rebuilt once per frame (buildEnemyGrid) so bullet/body collision checks only test
// enemies in the 3x3 cells around a point instead of scanning every entity (was O(n^2)
// and the main cause of frame drops in dense waves). GRID_CELL (48) is larger than the
// biggest possible collision distance (max enemy radius 24 + bullet/body radius), so any
// colliding enemy is guaranteed to sit in the queried 3x3 neighbourhood — no misses.
const GRID_CELL = 48;
const enemyGrid = new Map();
const _nearEnemies = [];
// Reused scratch list for drawGame's y-sort (painter order). Reusing it avoids a fresh
// `entities.slice()` allocation every frame (GC churn that scaled with entity count).
const _drawList = [];
const _allyList = [];     // reused scratch for enemy-bullet→ally collision
const _bossList = [];     // reused scratch for boss HP bars
const _pBullets = [];     // reused scratch for player-bullet collision (avoids iterating
const _eBullets = [];     //   all entities to find bullets in the collision loop)
function buildEnemyGrid(){
  enemyGrid.clear();
  for(const e of entities){
    if(e.type !== 'enemy' || e.dead) continue;
    const k = (Math.floor(e.x / GRID_CELL)) + ',' + (Math.floor(e.y / GRID_CELL));
    let arr = enemyGrid.get(k);
    if(!arr){ arr = []; enemyGrid.set(k, arr); }
    arr.push(e);
  }
}
// Returns a SHARED, reused array of live enemies in the 3x3 cells around (x,y). The
// caller must iterate it before the next call (no nesting of enemiesNear calls).
function enemiesNear(x, y){
  _nearEnemies.length = 0;
  const cx = Math.floor(x / GRID_CELL), cy = Math.floor(y / GRID_CELL);
  for(let gx = cx - 1; gx <= cx + 1; gx++){
    for(let gy = cy - 1; gy <= cy + 1; gy++){
      const arr = enemyGrid.get(gx + ',' + gy);
      if(!arr) continue;
      for(const e of arr){ if(!e.dead) _nearEnemies.push(e); }
    }
  }
  return _nearEnemies;
}
function rand(a,b){ return a + Math.random()*(b-a); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
// In-place array compaction: keeps items where aliveFn(item) is truthy, mutates
// the array in place (no allocation) and sets length. Replaces .filter() in hot
// paths to avoid per-frame GC churn from discarded array objects.
function compact(arr, aliveFn){
  let wi = 0;
  for(let i = 0; i < arr.length; i++){
    if(aliveFn(arr[i])) arr[wi++] = arr[i];
  }
  arr.length = wi;
}
function pickWeighted(mix){
  const r = Math.random();
  let acc = 0;
  for(const [k,w] of mix){ acc += w; if(r < acc) return k; }
  return mix[mix.length-1][0];
}
function clickedRect(x,y,w,h){ return mouse.x>=x && mouse.x<=x+w && mouse.y>=y && mouse.y<=y+h; }

// Resolve the active-skill loadout from the profile. F is always HEAL. Each of
// X/C/B/V is filled only if its slot is unlocked by level AND assigned AND owned.
function resolvePlayerLoadout(){
  const n = unlockedSlots();
  const out = { f:'heal', x:null, c:null, b:null, v:null };
  SLOT_ORDER.forEach((slot, i) => {
    if(i < n){
      const id = profile.loadout[slot];
      if(id && profile.ownedSkills.includes(id) && SKILLS[id]) out[slot] = id;
    }
  });
  return out;
}
// Apply meta-level base-stat scaling at run start: damage, rate-of-fire / attack
// speed (lower LMB cooldown + Scout RMB cadence), max health, and the RMB
// "second basic attack" duration (its fuel/energy/power pool — short at L1, grows).
function applyLevelScaling(p){
  const L = Math.max(0, (profile.level || 1) - 1);
  // 5-tier weapon evolution, derived from the account level + cached for the run.
  p.weaponTier = weaponTierFor(profile.level || 1);
  p.weaponMult = WEAPON_TIER_MULT[p.weaponTier - 1] || 1;
  p.damageMult *= 1 + Math.min(LVL_DMG_CAP, L * LVL_DMG_PER);
  const fireBonus = Math.min(LVL_FIRE_CAP, L * LVL_FIRE_PER);
  p.fireRate *= (1 - fireBonus);
  p.laserScale = (1 - fireBonus);
  p.maxHp += Math.min(LVL_HP_CAP, Math.floor(L / LVL_HP_PER));
  // VITALITY passive: +% max HP at run start when equipped (0 otherwise).
  const vt = passiveValue('vitality');
  if(vt > 0) p.maxHp = Math.round(p.maxHp * (1 + vt));
  p.hp = p.maxHp;
  const rmbMul = RMB_BASE_FRAC * (1 + Math.min(RMB_DUR_CAP, L * RMB_DUR_PER));
  [['maxFuel','fuel'],['maxEnergy','energy'],['maxPower','power'],
   ['maxFury','fury'],['maxToxin','toxin']].forEach(([mx, cur]) => {
    if(p[mx] > 0){ p[mx] = Math.max(1, Math.round(p[mx] * rmbMul)); p[cur] = p[mx]; }
  });
}

function createPlayer(charKey){

  const p = {

    char:charKey || 'soldier',
    damageMult:ch.damageMult || 1,
    fireCooldown:0, fireRate:0.14,
    // Basic-attack ENHANCER timers (powerups never change the attack's form, only
    // enhance it): rapid = faster cadence, pierce = shots punch through enemies,
    // multi = parallel double-shot. (damageTime, below, is the 4th enhancer.)
    rapidTime:0, pierceTime:0, multiTime:0,
    // Tank starts with a higher shield cap (5) so its bigger startShield doesn't
    // immediately get capped down by a regular shield pickup. Other chars stay at 3.
    shieldHp:ch.startShield || 0, shieldMax: charKey === 'tank' ? 5 : 3,
    // Flamethrower fuel (Tank only). No automatic regen — refilled by 'fuel' pickup.
    fuel: charKey === 'tank' ? 12 : 0,

    laserCd:0,

    // (energy/fuel) is drained to empty. Blocks the secondary while > 0; recovery of
    // the pool itself is unaffected.
    rmbLockT:0,
    // Tank only: how long the CURRENT RMB press has been firing the flamethrower.
    // Drives the "Dangerous Temperature" state (deeper-red flame + 1.5x damage +
    // FUEL-bar lights up) — triggers at > 2s of continuous fire. Reset on RMB
    // release, on lockout, and when fuel empties — so the player has to hold a
    // fresh press for 2s+ each time to re-enter danger.
    flameHeldT:0,
    // Bounty Hunter (Leo) only: per-press cleaver-slash animation timer.
    // leoSlashRem > 0 means a slash is in progress; while > 0 the drawLeoGame
    // 'sword' mode renders the chop animation and the dispatch deals melee

    leoSlashRem:0, leoSlashTotal:0.1, leoSlashHits:null,

    energy: charKey === 'soldier' ? 6 : 0,

    power: charKey === 'scout' ? 20 : 0,

    fury: charKey === 'bounty_hunter' ? 6 : 0,

    // Ong's bio-gun TOXIN: ~12 RMB shots (mirrors Scout power): drained 1 per shot,

    toxin: charKey === 'cyborg' ? 12 : 0,

    speedTime:0, damageTime:0, magnetTime:0, scoreTime:0,
    // X-skill sprint buff timer + per-cast speed multiplier (set from the SPRINT

    sprintTime:0, sprintMult:1.3,

    skillCd:{ x:0, c:0, v:0, f:0, b:0 },
    skillCdMax:{ x:4, c:12, blink:5, dash:3.5, wall:18, summon:25, vsummon:25, flameburst:20, barrage:24, sprint:20, heal:20, blast:20, invuln:20, grenade:6, slowmo:18, nuke:60, resummon:22, grit:18, overclock:18, fanfire:24, biobomb:26, refuel:16 },

    laserScale:1,

    loadout: resolvePlayerLoadout(),

    // New bosses (L6-L10) — HP grows with the level number
    case 'twin':    return { ...base, speed:46, hp:70, maxHp:70, radius:10, score:500, isBoss:true, fireCooldown:1.4 };
    case 'reaper':  return { ...base, speed:42, hp:85, maxHp:85, radius:9, score:600, isBoss:true, fireCooldown:2.0 };
    case 'bomber':  return { ...base, speed:14, hp:100, maxHp:100, radius:11, score:720, isBoss:true, fireCooldown:1.6 };
    case 'phantom': return { ...base, speed:30, hp:120, maxHp:120, radius:9, score:850, isBoss:true, fireCooldown:1.5 };
    case 'nemesis': return { ...base, speed:24, hp:170, maxHp:170, radius:15, score:1200, isBoss:true };
  }
  return base;
}

// Factory dispatch used by the selection flow and per-level refresh. The base
// factory stats are the LEVEL-10 reference; applyAssistantLevel scales them down
// for lower-level (un-upgraded) allies so a fresh ally is much weaker.
function createAssistant(key){
  let a;
  switch(key){
    case 'drone':    a = createCompanion();  break;
    case 'henchman': a = createHenchman();   break;
    case 'nunchaku': a = createNunchaku();   break;
    case 'bomber':   a = createBomberAlly(); break;
    case 'poison':   a = createPoisonAlly(); break;
    default:         a = createCompanion();
  }
  applyAssistantLevel(a, key);
  return a;
}

// Scale a freshly-built assistant down toward its upgrade level. At level 1 every
// ally is at ~35% of its reference power (HP, damage, range, attack speed); at
// level 10 it is exactly the factory stats. Capabilities scale harder than range
// so a low-level ally is weak but still functional.
function applyAssistantLevel(a, key){
  const lvl = assistantLevel(key);
  const f = assistLevelFrac(lvl);          // 0.35 .. 1.0
  const rangeF = 0.6 + 0.4 * f;            // ranges shrink less than power
  const rateF  = 0.55 + 0.45 * f;          // attack speed (divisor: <1 => slower)
  a.level = lvl;
  a.maxHp = Math.max(1, Math.round(a.maxHp * f));
  a.hp = a.maxHp;
  switch(a.type){
    case 'companion':
      a.dmg = a.dmg * f;
      a.detectRange = a.detectRange * rangeF;
      a.fireRate = a.fireRate / rateF;
      break;
    case 'henchman':
    case 'nunchaku':
      a.swingDmg = Math.max(1, a.swingDmg * f);
      a.attackRange = a.attackRange * rangeF;
      a.attackRate = a.attackRate / rateF;
      break;
    case 'bomber_ally':
      a.bombDmg = Math.max(1, a.bombDmg * f);
      a.explodeRadius = a.explodeRadius * rangeF;
      a.fireRate = a.fireRate / rateF;
      break;
    case 'poison_ally':
      a.dps = a.dps * f;
      a.auraRadius = a.auraRadius * rangeF;
      break;
  }
}

function createBullet(x,y,angle,owner,opts={}){
  const speed = opts.speed ?? 240;
  return {
    type:'bullet', owner, x, y,
    vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
    angle, radius: opts.radius ?? 2,
    life: opts.life ?? 1.8,
    dmg: opts.dmg ?? 1,
    pierce: opts.pierce ?? false,
    explosive: opts.explosive ?? false,
    explodeRadius: opts.explodeRadius ?? 24,
    sprite: opts.sprite ?? (owner==='player' ? SPR.bullet_p : SPR.bullet_e),
    // Optional render/behaviour tag (e.g. 'pellet' for Leo's shotgun line-tracers).
    kind: opts.kind ?? null,
    // Render colour. For ENERGY bullets it's the glow tint (hot white core -> this,
    // additive); for KINETIC bullets it's the metallic body tint (solid, source-over).
    glow: opts.glow ?? (owner==='enemy' ? '#ff6b6b' : '#ffe08a'),
    // kinetic = a tangible metallic slug (no bloom/glow, source-over); else energy/plasma
    // (radial-gradient bloom under 'lighter'). tracer = a thin sharp air-distortion trail.
    kinetic: opts.kinetic ?? false,
    tracer: opts.tracer ?? false,
    // 5-tier weapon evolution tags: the firing weapon's tier + the class that fired it.
    // (drawBulletEntity's kinetic/energy split is derived from these at fire time; the
    // renderer also reads `tier` to scale the projectile's heft/brightness.)
    tier: opts.tier ?? 1,
    sourceClass: opts.sourceClass ?? null,
    hitSet: opts.pierce ? new Set() : null,
    // `fromAlly` marks an owner:'player' bullet that was actually fired by an ally
    // (drone/bomber), so Syed's lifesteal passive doesn't credit him for it.
    fromAlly: opts.fromAlly ?? false,
    dead:false
  };
}

// ============================================================
// PARTICLES
// ============================================================
// Combat-juice helpers. hitStop briefly freezes updatePlaying while draw keeps running
// (a time pause, NOT a camera move). spawnDecal drops a visual-only ground mark.
// Rate-limited: a freeze can't re-trigger until HIT_STOP_REFRACTORY has elapsed, so a
// fast weapon (Scout laser @0.22s, Tank slug) poured into a tanky/slow boss punches
// occasionally instead of freezing the sim every volley (which read as sustained lag).
function hitStop(ms){
  if(hitStopCd > 0) return;
  hitStopTime = Math.max(hitStopTime, ms / 1000);
  hitStopCd = HIT_STOP_REFRACTORY;
}
function spawnDecal(x, y, r, kind){
  if(decals.length >= DECAL_CAP) decals.shift();
  const life = 10;
  const color = kind === 'toxic' ? 'rgba(39,174,96,' : 'rgba(14,10,8,';
  decals.push({ x, y, r, life, maxLife: life, kind, color });
}

// `glow=true` tags the motes as additive-bloom energy/embers (rendered under
// 'lighter' with a hot white core); plain emits stay simple round dots.
function emit(x,y,count,color,sMin=20,sMax=80,life=0.5,glow=false){
  for(let i=0;i<count;i++){
    if(particles.length > 300) break;
    const a = Math.random()*Math.PI*2;
    const s = rand(sMin, sMax);
    particles.push({
      x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      life: rand(life*0.5, life), maxLife: life,
      color, size: 1 + Math.floor(Math.random()*2), glow
    });
  }
}

// Combined player move-speed multiplier: SPEED powerup (1.5x) and the X-skill
// sprint buff (1.3x) stack multiplicatively. Used by player movement and by the
// allies that pace themselves to the player.
function playerSpeedMult(){
  let m = 1;
  if(player.speedTime  > 0) m *= 1.5;
  // sprintMult is set per-cast from the SPRINT skill's current tier (1 + spd).
  if(player.sprintTime > 0) m *= (player.sprintMult || 1.3);
  // SWIFTNESS passive: permanent +% move speed when equipped (0 otherwise).
  const sw = passiveValue('swiftness');
  if(sw > 0) m *= (1 + sw);
  return m;
}

// Dispatch a skill by name. Returns true if the skill actually fired
// (so the caller can charge cooldown only on successful use).
function triggerSkill(name, dx, dy, mag){
  // T = the effect knobs for this skill at the player's CURRENT tier (from
  // profile.skillLevels). Every magnitude/duration below reads from T, so a
  // higher tier is automatically stronger; cooldowns come from skillCdFor at the
  // dispatch site. `|| {}` keeps a malformed/unknown id from throwing.
  const T = skillStat(name) || {};
  if(name === 'sprint'){
    // X skill: +spd% move speed for dur seconds. Re-casting refreshes the timer.
    player.sprintTime = Math.max(player.sprintTime, T.dur || 5);
    player.sprintMult = 1 + (T.spd || 0.3);
    emit(player.x, player.y, 18, '#1abc9c', 40, 130, 0.4);
    emit(player.x, player.y, 8, '#fff', 25, 90, 0.3);
    sfx.teleport();
    return true;
  }
  if(name === 'refuel'){
    // Refill the player's CURRENT secondary-attack pool (whichever the class uses:
    // fuel/energy/power/fury/toxin) by T.frac of its max. Like heal, it only fires —
    // and only charges its cooldown — when the active pool isn't already full. Clearing
    // the empty-lockout is part of the point, so a drained pool comes straight back.
    const pools = [['maxFuel','fuel'],['maxEnergy','energy'],['maxPower','power'],['maxFury','fury'],['maxToxin','toxin']];
    const hit = pools.find(([mx]) => player[mx] > 0);
    if(!hit) return false;                               // class has no RMB pool
    const [mx, cur] = hit;
    if(player[cur] >= player[mx]) return false;          // already full -> don't waste cd
    player[cur] = Math.min(player[mx], player[cur] + player[mx] * (T.frac || 0.4));
    player.rmbLockT = 0;                                 // lift any empty-lockout immediately
    emit(player.x, player.y, 16, '#f1c40f', 40, 130, 0.45, true);
    emit(player.x, player.y, 8, '#fff', 25, 90, 0.3, true);
    sfx.shieldHit();
    return true;
  }
  if(name === 'heal'){
    // F skill: restore T.hp HP (capped at maxHp). Only fires — and only charges its
    // cooldown — when there's actually damage to heal.
    if(player.hp >= player.maxHp) return false;
    player.hp = Math.min(player.maxHp, player.hp + (T.hp || 1));
    emit(player.x, player.y, 18, '#2ecc71', 35, 110, 0.5);
    emit(player.x, player.y, 8, '#fff', 25, 90, 0.35);
    sfx.shieldHit();
    return true;
  }
  if(name === 'blast'){
    // B skill (Scout/Tank): a CIRCLE damage burst centered on the player. Every
    // enemy inside the radius instantly takes normal damage. explode() applies
    // the damage + fire particles + sfx; we add an expanding ring so the
    // circular area of effect is clearly visible. Radius + damage scale by tier.
    const R = T.r || 70;
    const bd = 3 * (T.dmgMul || 1) * (player.damageMult || 1) * (player.damageTime > 0 ? 2 : 1);
    explode(player.x, player.y, R, bd, true);
    // Expanding shockwave ring (visual only): grows from the player out to R.
    if(particles.length < 300) particles.push({
      x: player.x, y: player.y, vx: 0, vy: 0,
      life: 0.4, maxLife: 0.4, color: '#7fe9ff',
      ring: true, r0: 8, r1: R
    });
    return true;
  }
  if(name === 'invuln'){
    // Dr.Syed's B skill: T.dur seconds of full invincibility. Mirrors the Tank's
    // `wall` but shorter. The player sprite blinks while invuln > 0, so the
    // immunity is visible in-game.
    player.invuln = Math.max(player.invuln, T.dur || 2);
    emit(player.x, player.y, 24, '#7fe9ff', 40, 130, 0.6);
    emit(player.x, player.y, 10, '#fff', 25, 90, 0.4);
    if(particles.length < 300) particles.push({
      x: player.x, y: player.y, vx: 0, vy: 0,
      life: 0.4, maxLife: 0.4, color: '#7fe9ff',
      ring: true, r0: 8, r1: 40
    });
    sfx.shieldHit();
    return true;
  }
  if(name === 'dash'){
    const D = T.dist || 60;
    let ax = dx, ay = dy;
    if(mag === 0){ ax = Math.cos(player.angle); ay = Math.sin(player.angle); }
    player.x = clamp(player.x + ax * D, 8, worldW - 8);
    player.y = clamp(player.y + ay * D, 8, worldH - 10);
    player.invuln = Math.max(player.invuln, T.iframe || 0.35);
    emit(player.x, player.y, 14, '#f1c40f', 60, 180, 0.35);
    emit(player.x - ax*20, player.y - ay*20, 10, '#fff', 30, 100, 0.3);
    sfx.teleport();
    return true;
  }
  if(name === 'blink'){
    // Teleport directly to the cursor (clamped). Scout's signature.
    // Mouse is in screen space; add camera offset to translate to world coords.
    const tx = clamp(mouse.x + camX, 8, worldW - 8);
    const ty = clamp(mouse.y + camY, 8, worldH - 10);
    emit(player.x, player.y, 12, '#f1c40f', 40, 140, 0.35);
    player.x = tx; player.y = ty;
    player.invuln = Math.max(player.invuln, T.iframe || 0.45);
    emit(player.x, player.y, 18, '#fff', 50, 160, 0.4);
    sfx.teleport();
    return true;
  }
  if(name === 'slowmo'){
    slowMoTime = Math.max(slowMoTime, T.dur || 3);
    emit(player.x, player.y, 20, '#3498db', 30, 90, 0.5);
    sfx.laser();
    return true;
  }
  if(name === 'wall'){
    // Tank's signature: T.dur seconds of full invulnerability.
    player.invuln = Math.max(player.invuln, T.dur || 4);
    emit(player.x, player.y, 28, '#27ae60', 40, 130, 0.6);
    sfx.shieldHit();
    return true;
  }
  if(name === 'resummon'){
    // Universal: revive up to T.reviveCount of the run's EQUIPPED assistants that
    // have died (live entries in `allies` marked dead). Picks randomly among the
    // dead; grants the revived ally T.iframe seconds of invuln at higher tiers.
    // Returns false (charging no cooldown) when nothing is dead to revive.
    const dead = [];
    for(let i = 0; i < allies.length; i++){ if(allies[i] && allies[i].dead) dead.push(i); }
    if(!dead.length) return false;
    let revived = 0;
    const want = Math.max(1, T.reviveCount || 1);
    while(revived < want && dead.length && entities.length < 480){
      const pick = dead.splice(Math.floor(Math.random() * dead.length), 1)[0];
      const key = allies[pick].assistKey;
      const a = createAssistant(key);
      positionAllyByPlayer(a, pick);
      a.invuln = Math.max(a.invuln || 0, T.iframe || 0);
      allies[pick] = a;
      entities.push(a);
      emit(a.x, a.y, 22, '#9b59b6', 50, 160, 0.55);
      emit(a.x, a.y, 10, '#fff', 28, 110, 0.4);
      revived++;
    }
    if(!revived) return false;
    sfx.teleport();
    return true;
  }
  if(name === 'nuke'){
    // Snapshot the enemy list first. killEnemy mutates `entities` (pickup drops,
    // splitter cascade), and iterating the live array re-visits newly-spawned
    // splits and freezes the game for a beat while everything dies at once.
    // Each step also wrapped defensively so a single malformed entity can't
    // strand the entire skill — the Tank's M was reportedly hanging the canvas.
    const targets = [];
    for(let i = 0; i < entities.length; i++){
      const e = entities[i];
      if(e && e.type === 'enemy' && !e.dead) targets.push(e);
    }
    for(const en of targets){
      if(!en || en.dead) continue;
      try {
        damageEnemy(en, en.isBoss ? (T.bossDmg || 12) : 999, true);
      } catch(err){
        console.error('[shooter] nuke kill error on', en && en.kind, err);
        if(en) en.dead = true;
      }
    }
    for(let i = 0; i < 10; i++){
      emit(rand(0, worldW), rand(0, worldH), 3, '#fff', 40, 160, 0.35);
      emit(rand(0, worldW), rand(0, worldH), 3, '#f39c12', 40, 160, 0.35);
    }
    try { sfx.explode(); } catch(err){ /* audio nodes are best-effort */ }
    return true;
  }
  if(name === 'flameburst'){
    // Arm a T.dur-second ring of fire centered on the player. The per-frame damage
    // and flame particles are emitted in updatePlaying via tickFlameburst(); the
    // tier's damage multiplier is stashed on the player for tickFlameburst to read.
    player.flameburstTime = Math.max(player.flameburstTime, T.dur || 3);
    player.flameburstMul = T.dmgMul || 1;
    sfx.explode();
    return true;
  }
  if(name === 'summon' || name === 'vsummon'){
    // Summon a sword-knight (one alive at a time). vsummon swings ~1.5x faster than
    // summon (the Tank's signature). Higher tiers scale the knight's HP / damage /
    // swing-speed up (rateMul divides attackRate); cooldown drops via skillCdFor.
    for(const e of entities){
      if(e.type === 'sword_ally' && !e.dead){ e.dead = true; }
    }
    const sa = createSwordAlly(player.x, player.y);
    const base = (name === 'vsummon') ? 1.5 : 1;       // vsummon's inherent speed-up
    sa.attackRate /= (base * (T.rateMul || 1));
    sa.maxHp = Math.max(1, Math.round(sa.maxHp * (T.hpMul || 1))); sa.hp = sa.maxHp;
    sa.swingDmg = sa.swingDmg * (T.dmgMul || 1);
    entities.push(sa);
    const col = (name === 'vsummon') ? '#f39c12' : '#f1c40f';
    emit(sa.x, sa.y, 26, col, 55, 180, 0.6);
    emit(sa.x, sa.y, 12, '#fff', 30, 110, 0.4);
    sfx.teleport();
    return true;
  }
  if(name === 'grenade'){
    // Soldier's signature: lobbed projectile that explodes after a short fuse
    // (or instantly on direct enemy contact). Damage + radius scale by tier.
    const gd = (T.dmg || 4) * (player.damageMult || 1);
    const er = T.radius || 34;
    entities.push({
      type:'bullet', owner:'player', x:player.x, y:player.y,
      vx:Math.cos(player.angle) * 180, vy:Math.sin(player.angle) * 180,
      angle:player.angle, radius:3,
      sprite:SPR.bullet_rocket,
      dmg:gd, life:0.5, isGrenade:true,
      explosive:true, explodeRadius:er, explodeDmg:gd
    });
    emit(player.x, player.y, 8, '#e67e22', 30, 90, 0.25);
    sfx.rocket();
    return true;
  }
  if(name === 'barrage'){
    // Soldier's V: lob a fan of T.shells grenade-style shells with staggered fuses,
    // so the blasts walk across an arc instead of stacking into one giant nuke.
    // Reuses the exact bullet shape from the 'grenade' handler (isGrenade +
    // explosive -> detonates on contact OR at end of fuse). Shell count + damage
    // scale by tier.
    const shells = Math.max(1, T.shells || 5);
    const gd = 3 * (T.dmgMul || 1) * (player.damageMult || 1);
    const mid = (shells - 1) / 2;
    for(let i = 0; i < shells; i++){
      const a = player.angle + (i - mid) * 0.16;   // ~9° between shells
      entities.push({
        type:'bullet', owner:'player', x:player.x, y:player.y,
        vx:Math.cos(a) * 170, vy:Math.sin(a) * 170,
        angle:a, radius:3, sprite:SPR.bullet_rocket,
        dmg:gd, life:rand(0.45, 0.75), isGrenade:true,
        explosive:true, explodeRadius:30, explodeDmg:gd, dead:false
      });
    }
    emit(player.x, player.y, 14, '#e67e22', 40, 130, 0.35);
    sfx.rocket();
    return true;
  }
  if(name === 'grit'){
    // Leo's C (defensive): instant temp shield + brief invuln. Raises the shield cap
    // so the granted points aren't clipped by the base cap. Scales by tier.
    const s = T.shield || 2;
    player.shieldMax = Math.max(player.shieldMax, s);
    player.shieldHp  = Math.max(player.shieldHp, s);
    player.invuln    = Math.max(player.invuln, T.iframe || 0.3);
    emit(player.x, player.y, 22, '#d35400', 40, 130, 0.5);
    emit(player.x, player.y, 10, '#fff', 25, 90, 0.35);
    sfx.shieldHit();
    return true;
  }
  if(name === 'overclock'){
    // Ong's C (utility): self rapid-fire for T.dur seconds (reuses the RAPID enhancer,
    // so it halves the basic-attack cadence). Re-casting refreshes the timer.
    player.rapidTime = Math.max(player.rapidTime, T.dur || 3);
    emit(player.x, player.y, 18, '#9b59b6', 40, 130, 0.4);
    emit(player.x, player.y, 8, '#fff', 25, 90, 0.3);
    sfx.teleport();
    return true;
  }
  if(name === 'fanfire'){
    // Leo's V (ultimate): blast a wide fan of T.pellets high-damage shotgun pellets.
    const n = Math.max(1, T.pellets || 7);
    const gd = (T.dmg || 3) * (player.damageMult || 1) * (player.damageTime > 0 ? 2 : 1);
    const mid = (n - 1) / 2;
    for(let i = 0; i < n; i++){
      const a = player.angle + (i - mid) * (1.4 / Math.max(1, n - 1));
      entities.push(createBullet(player.x + Math.cos(a) * 7, player.y + Math.sin(a) * 7, a, 'player', { dmg: gd, speed: 340, radius: 2, life: 0.5 }));
    }
    emit(player.x, player.y, 16, '#e67e22', 50, 170, 0.4);
    sfx.rocket();
    return true;
  }
  if(name === 'biobomb'){
    // Ong's V (ultimate): drop a big lingering poison cloud on the player (reuses the
    // bio-gun cloud system). Radius / dps / duration scale by tier.
    spawnPoisonCloud(player.x, player.y, { cloudRadius: T.radius || 40, cloudLife: T.dur || 3, cloudDps: T.dps || 6, cloudSlow: 0 });
    if(particles.length < 300) particles.push({ x: player.x, y: player.y, vx:0, vy:0, life:0.4, maxLife:0.4, color:'#27ae60', ring:true, r0:8, r1:(T.radius || 40) });
    emit(player.x, player.y, 16, '#27ae60', 50, 150, 0.45);
    sfx.explode();
    return true;
  }
  return false;
}

// Single chokepoint for ALL damage dealt to enemies. Returns true if the hit was
// fully absorbed — the enemy is already dead/killed, OR its boss `invulnT` shield
// is up (set by bossInvuln) — so the caller may skip follow-up effects. Applies
// the hit-flash, the universal LIFESTEAL passive (only when fromPlayer, so ally
// damage never heals — the `fromPlayer`/`fromAlly` threading still gates it), and
// the kill. Routing every hit through here makes boss brief-invincibility + the
// lifesteal passive work at every damage source.
// `heavy` (default true) marks a DISCRETE heavy hit eligible for hit-stop. Continuous /
// rapid-auto secondaries pass false (the held Scout laser) so they never freeze the sim
// — same exclusion the spear/flame/machete already get for free via the dmg<3 threshold.
function damageEnemy(en, dmg, fromPlayer, heavy = true){
  if(!en || en.dead || en._killed) return true;
  if(en.invulnT > 0){ en.hitFlash = 0.06; return true; }   // invuln boss absorbs it
  en.hp -= dmg;
  en.hitFlash = 0.09;   // brief pure-white pop (drawEnemy white-tints while > 0)
  // Hit-stop on a heavy DISCRETE hit to a boss (dmg threshold excludes the tiny
  // per-frame ticks of continuous weapons like the spear/flame/machete; the refractory
  // in hitStop() stops a fast gun from stacking freezes — only spaced-out shots / skills
  // / big blasts actually freeze it).
  if(heavy && en.isBoss && fromPlayer && dmg >= 3) hitStop(40);
  if(fromPlayer && dmg > 0 && player.hp > 0){
    const ls = passiveValue('lifesteal');
    if(ls > 0) player.hp = Math.min(player.maxHp, player.hp + dmg * ls);
  }
  if(en.hp <= 0) killEnemy(en);
  return false;
}

function explode(x, y, radius, dmg, fromPlayer){
  emit(x, y, 22, '#f39c12', 60, 180, 0.6, true);
  emit(x, y, 12, '#fff', 40, 150, 0.4, true);
  // Explosions read via the bloom particles + scorch decal + sfx (no screen shake).
  spawnDecal(x, y, Math.max(10, radius * 0.9), 'scorch');
  sfx.explode();
  // Snapshot the enemy list — killEnemy can push splitter children into entities,
  // and we don't want this single blast to keep visiting them and cascading.
  const targets = entities.filter(e => e.type === 'enemy' && !e.dead);
  for(const en of targets){
    if(en.dead) continue;
    if(dist2({x,y}, en) < radius*radius){
      damageEnemy(en, dmg, fromPlayer);
    }
  }
}

// ============================================================
// SPAWNING & LEVEL FLOW
// ============================================================
// Occasionally promote a freshly-spawned regular into an ELITE "mini-boss":
// tougher (3x HP), bigger (1.6x radius, ~1.5x sprite), worth 4x score, slightly
// slower. Chance climbs with level (~2% at L1 -> capped 18% from ~L40) so the
// late game is peppered with mini-bosses. Bosses and throwaway swarmers are
// never promoted. drawEnemy renders a pulsing gold halo around elites.
function maybeElite(e){
  if(!e || e.isBoss) return;
  if(Math.random() < Math.min(0.18, 0.02 + levelIdx * 0.004)){
    e.elite = true;
    e.hp = e.maxHp = Math.ceil(e.maxHp * 3);
    e.radius = Math.round(e.radius * 1.6);
    e.score = e.score * 4;
    e.speed *= 0.9;
  }
}

function spawnEnemyAtEdge(kind){
  const edge = Math.floor(Math.random()*4);
  const m = 14;
  let x, y;
  if(edge===0){ x = rand(m, worldW-m); y = -m; }
  else if(edge===1){ x = worldW+m; y = rand(m, worldH-m); }
  else if(edge===2){ x = rand(m, worldW-m); y = worldH+m; }
  else { x = -m; y = rand(m, worldH-m); }
  // Late-game per-enemy HP boost (#2 rebalance) — applied here, not in createEnemy, so
  // the headless enemyScale/elite assertions (which call createEnemy directly) stay exact.
  const hpMul = enemyHpMul(levelIdx);
  const boost = e => { if(hpMul > 1){ e.maxHp = Math.ceil(e.maxHp * hpMul); e.hp = e.maxHp; } return e; };
  if(kind === 'swarmer'){
    // Swarmers spawn in a cluster of 3 near each other.
    for(let i = 0; i < 3; i++){
      entities.push(boost(createEnemy(kind, x + rand(-8, 8), y + rand(-8, 8))));
    }
  } else {
    const e = boost(createEnemy(kind, x, y));
    maybeElite(e);   // elite ×3 now stacks on the boosted HP
    entities.push(e);
  }
}

function spawnBoss(kind){
  // Spawn the boss centered above the player so they don't have to chase across the larger arena.
  const sx = player ? clamp(player.x, 40, worldW - 40) : worldW / 2;
  const b = createEnemy(kind, sx, -25);
  // Bosses scale per level on the same THREE-PHASE curve as enemies (bossHpScale /
  // bossSpdScale), so the same AI reused later actually feels harder — gentle through
  // L15, moderate to L24, sharp past L25. At L1 (bruiser) this is a no-op; e.g. the
  // L30 nemesis ends up ~575 HP and the L40 phantom ~598 HP (vs 24/120 base), with
  // late bosses tuned to demand the meta-progression damage/RMB upgrades.
  b.hp = Math.ceil(b.hp * bossHpScale(levelIdx));
  b.maxHp = b.hp;
  b.speed = b.speed * bossSpdScale(levelIdx);
  // Size by ROLE so the silhouette reads the hierarchy at a glance:
  // end boss > transitional = medium > regular, with a hard CAP so even the final
  // boss still fits/scrolls in the viewport. Per-kind base radii vary a lot (phantom
  // r9 vs warden r12), so role FLOORS — not a flat multiplier — guarantee the order.
  // (trans and medium share the same size band, so role-detection ambiguity between
  // them is harmless.) drawScaleRole keeps the rendered sprite proportional.
  const baseR = b.radius;
  const role = (kind === levelData.boss) ? 'end'
             : (kind === levelData.transBoss) ? 'trans' : 'medium';
  b.bossRole = role;
  const RS = { end:{ floor:18, mul:1.45, cap:24 },
               trans:{ floor:14, mul:1.3, cap:19 },
               medium:{ floor:14, mul:1.3, cap:19 } }[role];
  b.radius = Math.min(RS.cap, Math.max(RS.floor, Math.round(baseR * RS.mul)));
  b.drawScaleRole = b.radius / baseR;
  entities.push(b);
  // Flash the name of the boss that just arrived. The end boss uses the level's
  // bossName override; a mid-boss (different kind) uses its own BOSS_NAMES entry.
  bossSpawnName = (kind === levelData.boss ? (levelData.bossName || BOSS_NAMES[kind]) : BOSS_NAMES[kind]) || 'BOSS';
  bossSpawnPulse = 1;
  sfx.bossSpawn();
  return b;
}
// The medium-boss kinds for a level's Phase-1 wave (1 for L11-20, 2 for L21-40).
// `transBoss` is a separate later phase, so it's NOT included here.
function mediumBossKinds(L){ return [L.midBoss, L.midBoss2].filter(Boolean); }

// ============================================================
// REUSABLE BOSS ABILITIES — layered onto the existing boss AIs, escalating by
// levelIdx. All are no-ops for clones (so a cloned boss can't recursively clone
// / summon / shield and balloon the entity count). They lean on existing
// primitives: damageEnemy's invulnT gate, spawnEnemyAtEdge/createEnemy, emit,
// and the groundFields poison-pool list.
// ============================================================
// Brief invincibility on a cooldown: shrugs off all damage for 1.2s every ~8s.
// damageEnemy absorbs hits while invulnT>0; updateEnemy ticks invulnT down;
// drawEnemy flashes the boss blue. (Set invulnT elsewhere too, e.g. reaper dash.)
function bossInvuln(e, dt){
  if(e.isClone || e.invulnT > 0) return;
  e.invulnCd = (e.invulnCd || 0) - dt;
  if(e.invulnCd <= 0){
    e.invulnT = 1.2;
    e.invulnCd = 5.5;
    emit(e.x, e.y, 16, '#5dade2', 20, 80, 0.5);
    sfx.shieldHit();
  }
}
// Summon a small pack of exploding minions beside the boss (they rush + detonate).
function bossSummonExploders(e, dt, n){
  if(e.isClone) return;
  e.emCd = (e.emCd || 0) - dt;
  if(e.emCd <= 0){
    e.emCd = 3.5;
    if(entities.length < 480){
      for(let i = 0; i < (n || 3); i++){
        const a = Math.random() * Math.PI * 2;
        entities.push(createEnemy('exploder', e.x + Math.cos(a)*18, e.y + Math.sin(a)*18));
      }
      emit(e.x, e.y, 16, '#e67e22', 25, 110, 0.45);
    }
  }
}
// Spawn a weak (25%-HP) NON-boss copy running the same AI. isBoss MUST stay false
// so clones don't pollute the HUD boss-bar / boss loot / win logic. Clones can't
// clone (guarded) and don't use boss abilities (the isClone guards above).
function bossSpawnClone(e){
  if(e.isClone || entities.length >= 480) return;
  const c = createEnemy(e.kind, e.x + rand(-24, 24), e.y + rand(-24, 24));
  c.hp = c.maxHp = Math.max(1, Math.round(e.maxHp * 0.25));
  c.score = Math.round((e.score || 100) * 0.3);
  c.isClone = true;
  c.isBoss = false;
  c.x = clamp(c.x, 14, worldW - 14);
  c.y = clamp(c.y, 14, worldH - 16);
  emit(c.x, c.y, 18, '#8e44ad', 25, 110, 0.5);
  entities.push(c);
}
// Drop a small lingering poison-gas pool at the player's feet (must move out of it).
// The pool spawns ON the player, so it gets a `warn` arming delay: it deals NO damage
// and renders as a pulsing telegraph ring for `warn` seconds, giving the player time
// to step out of the radius before it becomes lethal (no 100%-hit instant chip).
function bossGasBomb(e, dt){
  if(e.isClone) return;
  e.gasCd = (e.gasCd || 0) - dt;
  if(e.gasCd <= 0){
    e.gasCd = 3.5;
    if(groundFields.length < 12){
      groundFields.push({ x: player.x, y: player.y, radius: 34, life: 3, maxLife: 3, warn: 0.5 });
      emit(player.x, player.y, 18, '#27ae60', 20, 70, 0.6);
      sfx.explode();
    }
  }
}
// Self-heal 5% of max HP on a cooldown (green sparkle), capped at maxHp.
function bossHeal(e, dt){
  if(e.isClone) return;
  e.healCd = (e.healCd || 0) - dt;
  if(e.healCd <= 0){
    e.healCd = 4;
    e.hp = Math.min(e.maxHp, e.hp + Math.ceil(e.maxHp * 0.05));
    emit(e.x, e.y, 14, '#2ecc71', 20, 80, 0.5);
  }
}

function startLevel(idx){
  levelIdx = idx;
  levelData = LEVELS[idx];
  spawnTimer = 0.6;
  spawnedCount = 0;
  bossSpawned = false;
  bossPhase = 0;
  midbossSpawned = false;
  midbossRefs = [];
  transBossRef = null;
  midbossDefeated = false;
  bossGapTimer = 0;
  gapSpawnTimer = 0;
  paused = false;
  showStats = false;
  // World sizing by 10-level block — arena AREA GROWS with the block, then every
  // tier is enlarged a further MAP_EXPAND (1.15x linear). Base scales: L1-10 = 1x,
  // L11-20 = 2x, L21-30 = 3x, L31-40 = 4x. The view stays W*H; a camera follows the
  // player whenever worldW > W — which is now ALL tiers (even 1x is > the viewport).
  let worldScale = Math.floor(idx / 10) + 1;
  worldW = Math.round(W * worldScale * MAP_EXPAND);
  worldH = Math.round(H * worldScale * MAP_EXPAND);
  camX = 0; camY = 0;
  entities = entities.filter(e => e.type === 'player');
  particles = [];
  decals = [];
  groundFields = [];
  if(!player){ player = createPlayer(selectedChar); entities.push(player); }
  else { player.x = worldW/2; player.y = worldH/2; player.invuln = 1.2; }
  // Refresh the chosen assistants each level: keep survivors (full HP), recreate
  // any that died, reposition all beside the player.
  refreshAssistants();
  // Snap camera to centered-on-player so the first frame doesn't lerp from (0,0).
  camX = clamp(player.x - W/2, 0, Math.max(0, worldW - W));
  camY = clamp(player.y - H/2, 0, Math.max(0, worldH - H));
  state = STATE.PLAYING;
  stateTime = 0;
}
// Camera follows the player, clamped so the view never shows past world edges.
// On non-scrolling levels (worldW===W) this collapses to camX=camY=0 — a no-op.
function updateCamera(dt){
  const maxX = Math.max(0, worldW - W);
  const maxY = Math.max(0, worldH - H);
  const targetX = clamp(player.x - W/2, 0, maxX);
  const targetY = clamp(player.y - H/2, 0, maxY);
  // Smooth lerp toward the target so the camera doesn't jitter on every input change.
  const k = Math.min(1, dt * 8);
  camX += (targetX - camX) * k;
  camY += (targetY - camY) * k;
  if(maxX === 0) camX = 0;
  if(maxY === 0) camY = 0;
}

function startGame(){
  initAudio();
  paused = false;
  showStats = false;
  score = 0;
  player = createPlayer();
  entities = [player];
  allies = [];
  spawnSelectedAssistants();
  particles = [];
  decals = [];
  groundFields = [];
  startLevel(0);
}

// Rebuild `allies` from the chosen loadout at the start of each level: reuse any
// that survived the previous level (refilled to full HP), recreate the dead ones,
// and reposition every one beside the player.
function refreshAssistants(){
  const aliveByKey = {};
  for(const a of allies){ if(a && !a.dead) aliveByKey[a.assistKey] = a; }
  allies = [];
  selectedAssistants.forEach((key, idx) => {
    let a = aliveByKey[key];
    if(a){ a.hp = a.maxHp; a.invuln = 1.2; }
    else { a = createAssistant(key); }
    positionAllyByPlayer(a, idx);
    allies.push(a);
    entities.push(a);
  });
}

// ============================================================
// UPDATE
// ============================================================
function update(dt){
  stateTime += dt;
  if(bossSpawnPulse > 0) bossSpawnPulse -= dt;
  if(state === STATE.MENU || state === STATE.HOWTO) handleMenu();
  else if(state === STATE.SHOP) handleShop();
  else if(state === STATE.PARAMETERS) handleParameters();
  else if(state === STATE.CHARACTER_SELECT) handleCharacterSelect();
  else if(state === STATE.ASSISTANT_SELECT) handleAssistantSelect();
  else if(state === STATE.LEVEL_COMPLETE) handleLevelComplete();
  else if(state === STATE.GAME_OVER) handleEndScreen();
  else if(state === STATE.VICTORY) handleVictory();
  else if(state === STATE.PLAYING){
    // Hit-stop: a brief freeze on heavy impacts. We still decrement it (real time) and
    // keep draw() running, so the frozen frame reads as a punch of impact. The refractory
    // ticks in real time too (even while frozen) so it gates by wall-clock, not sim time.
    if(hitStopCd > 0) hitStopCd -= dt;
    if(hitSfxCd > 0) hitSfxCd -= dt;   // ticks in real-time so it recovers during hitStop freezes too
    if(hitStopTime > 0) hitStopTime -= dt;
    else if(!paused && !showStats) updatePlaying(dt);
  }
  // Safety net for the sustained flamethrower loop: kill it whenever we're not in
  // active play (pause, Tab-stats, death/menu, level transitions) so it can't drone.
  if(state !== STATE.PLAYING || paused || showStats) flameAudioStop();
  mouse.clicked = false;
  mouse.rclicked = false;
}

function updatePlaying(dt){
  // ---- Decay global & powerup timers ----
  if(slowMoTime > 0) slowMoTime -= dt;
  if(player.speedTime > 0)  player.speedTime  -= dt;
  if(player.sprintTime > 0) player.sprintTime -= dt;
  if(player.damageTime > 0) player.damageTime -= dt;
  if(player.magnetTime > 0) player.magnetTime -= dt;
  if(player.scoreTime > 0)  player.scoreTime  -= dt;
  // Visual-only decals fade over ~10s (no physics/collision).
  if(decals.length){
    for(const d of decals) d.life -= dt;
    compact(decals, d => d.life > 0);
  }

  // ---- Player movement (SPEED powerup + X-skill sprint boost it) ----
  let dx=0, dy=0;
  if(keys['ArrowLeft']||keys['KeyA']) dx -= 1;
  if(keys['ArrowRight']||keys['KeyD']) dx += 1;
  if(keys['ArrowUp']||keys['KeyW']) dy -= 1;
  if(keys['ArrowDown']||keys['KeyS']) dy += 1;
  const mag = Math.hypot(dx, dy);
  if(mag > 0){ dx /= mag; dy /= mag; }
  player.moving = mag > 0;          // used by drawPlayer's Scout walk-bob
  const speedMult = playerSpeedMult();
  player.x += dx * player.speed * speedMult * dt;
  player.y += dy * player.speed * speedMult * dt;
  player.x = clamp(player.x, 8, worldW-8);
  player.y = clamp(player.y, 8, worldH-10);

  if(mag > 0){
    player.frameT += dt;
    if(player.frameT > 0.12){ player.frameT = 0; player.frame = (player.frame + 1) % 2; }
  } else { player.frame = 0; }

  updateCamera(dt);
  // Aim from the cursor's WORLD position (mouse is in screen coords).
  player.angle = Math.atan2((mouse.y + camY) - player.y, (mouse.x + camX) - player.x);

  // ---- Special skills: X (sprint) / C (class) / F (heal) / B (blast) / V (class) ----
  if(player.skillCd.x > 0) player.skillCd.x -= dt;
  if(player.skillCd.c > 0) player.skillCd.c -= dt;
  if(player.skillCd.v > 0) player.skillCd.v -= dt;
  if(player.skillCd.f > 0) player.skillCd.f -= dt;
  if(player.skillCd.b > 0) player.skillCd.b -= dt;
  if(player.flameburstTime > 0){
    player.flameburstTime -= dt;
    tickFlameburst(dt);
  }
  // Skill dispatch from the LOADOUT (not the legacy per-class kit). F is always HEAL;
  // X/C/B/V come from player.loadout (already gated by unlocked slots + ownership in
  // resolvePlayerLoadout). A null slot is simply skipped, so low levels just have HEAL.
  const SKILL_KEYS = [['KeyF','f'],['KeyX','x'],['KeyC','c'],['KeyB','b'],['KeyV','v']];
  for(const [code, slot] of SKILL_KEYS){
    const id = player.loadout[slot];
    if(id && keys[code] && player.skillCd[slot] <= 0){
      if(triggerSkill(id, dx, dy, mag)) player.skillCd[slot] = skillCdFor(id);
    }
  }

  // ---- Shooting / Weapon dispatch ----
  player.fireCooldown -= dt;
  if(player.rapidTime  > 0) player.rapidTime  -= dt;
  if(player.pierceTime > 0) player.pierceTime -= dt;
  if(player.multiTime  > 0) player.multiTime  -= dt;
  if(player.laserCd > 0) player.laserCd -= dt;
  if(player.bioCd > 0) player.bioCd -= dt;
  // 1s firing lockout after Soldier/Tank drain their RMB pool to empty (see RMB blocks
  // below). Ticks down independently of regen — recovery is NOT influenced by it.
  if(player.rmbLockT > 0) player.rmbLockT -= dt;

  if(mouse.down && player.fireCooldown <= 0){
    const a = player.angle;
    if(player.char === 'cyborg'){
      // Ong PRIMARY (swapped to LMB): bio-gun — lobs a glob that bursts into a
      // lingering poison cloud (the toxic DoT). Infinite ammo, NORMAL cadence; the
      // toxin-draining FAST gas-bolt is now the RMB secondary (see the RMB block).
      fireBiogun();
      player.fireCooldown = 0.4 * (player.rapidTime > 0 ? 0.5 : 1);
    } else {
      // Scout (Xu Yihui) fires LMB from his LEFT hand — the slim gun on the north
      // arm of his east-facing sprite. We add a perpendicular offset so the muzzle
      // visibly tracks the gun barrel as the body rotates. Every other class fires
      // from the centerline forward muzzle.
      let mx, my;
      if(player.char === 'scout'){
        const m = xuYihuiMuzzle(XU_YIHUI_PX, player.x, player.y, a);
        mx = m.x; my = m.y;
      } else if(player.char === 'soldier'){
        const m = drSyedMuzzle(DR_SYED_PX, player.x, player.y, a);
        mx = m.x; my = m.y;
      } else if(player.char === 'tank'){
        const m = benjaminWuMuzzle(BENJAMIN_WU_PX, player.x, player.y, a);
        mx = m.x; my = m.y;
      } else if(player.char === 'bounty_hunter'){
        const m = leoMuzzle(LEO_PX, player.x, player.y, a);
        mx = m.x; my = m.y;
      } else {
        mx = player.x + Math.cos(a) * 7;
        my = player.y + Math.sin(a) * 7;
      }
      fireWeapon(mx, my);
    }
  }

  // Class RMB resources slowly self-regen (capped at max) so none is fully dependent
  // on pickups: Syed's katana energy 0.2/s, Benjamin Wu's flamethrower fuel 0.1/s,
  // Xu Yihui's laser power 0.6/s. ALL THREE now regen UNCONDITIONALLY — even while RMB
  // is held — so the pool recovers DURING the 1s `rmbLockT` lockout that every class
  // gets when its pool empties (see the RMB blocks below). The lockout, not a regen
  // pause, is what blocks near-empty stutter-fire: a drained pool can't fire for a full
  // second and only resumes once recovery has put real charge back. (The Scout used to
  // be the exception — released-only regen + no lockout — but it now matches the others.)
  if(player.maxEnergy > 0) player.energy = Math.min(player.maxEnergy, player.energy + 0.2 * dt);
  if(player.maxFuel   > 0) player.fuel   = Math.min(player.maxFuel,   player.fuel   + 0.1 * dt);
  if(player.maxPower  > 0) player.power  = Math.min(player.maxPower,  player.power  + 0.6 * dt);
  if(player.maxFury   > 0) player.fury   = Math.min(player.maxFury,   player.fury   + 0.2 * dt);
  if(player.maxToxin  > 0) player.toxin  = Math.min(player.maxToxin,  player.toxin  + 0.6 * dt);

  // Universal HP REGEN passive (only when equipped; 0 otherwise). Capped at maxHp;
  // never revives a dead player.
  const hpRegen = passiveValue('hpregen');
  if(hpRegen > 0 && player.hp > 0)
    player.hp = Math.min(player.maxHp, player.hp + hpRegen * dt);

  // ---- Tank's second normal attack: flamethrower (right mouse) ----
  // Fires only while there's enough fuel to fully cover this frame's dt cost AND the
  // 1s post-empty lockout isn't running. The instant fuel is drained to empty, a 1s
  // `rmbLockT` lockout starts during which the flamethrower can't fire (fuel recovery
  // is NOT influenced — it keeps regenerating per its own rules).
  if(player.char === 'tank'){
    const firing = mouse.rdown && player.rmbLockT <= 0 && player.fuel >= dt;
    if(firing){
      player.fuel -= dt;
      player.flameHeldT += dt;   // accumulate continuous-press time -> drives danger state
      fireFlamethrower(dt);
      // 100% heat: the instant fuel empties, fire the mechanical beep + pressure-relief
      // hiss, kill the flame loop, arm the 1s no-fire lockout, and reset the heat timer
      // so the next press starts fresh from 0.
      if(player.fuel < dt){
        player.rmbLockT = 1; player.flameHeldT = 0;
        sfx.flameLockout(); flameAudioStop();
      }
    } else {
      player.flameHeldT = 0;   // RMB released or locked out -> heat resets to 0
      if(player.maxFuel > 0) flameAudioStop();   // stop the sustained roar
    }
  }
  // ---- Syed's secondary: continuous katana slash (right mouse) ----
  // Same fuel-style gate on `energy` (refilled by 'beverage' + slow self-regen) plus
  // the same 1s lockout when energy hits empty; no slash / no damage during it.
  if(player.char === 'soldier' && mouse.rdown && player.rmbLockT <= 0 && player.energy >= dt){
    player.energy -= dt;
    fireKatana(dt);
    if(player.energy < dt) player.rmbLockT = 1;  // ran out this frame -> 1s no-fire lockout
  }
  // ---- Scout's secondary: THREE straight-line laser BEAMS (right mouse) ----
  // Instant hitscan beams (NOT travelling projectiles): on each release the mech
  // fires three straight laser beams fanned around the aim. Every enemy lying on a
  // beam's line takes its full damage SIMULTANEOUSLY the instant the beam fires
  // (see fireLaserBeams). Gated behind laserCd (cadence) AND `power` — a ~20-volley
  // pool that costs 1 per volley, self-regens 0.6/s (even while held), and is refilled
  // by 'battery'. Like the Soldier/Tank, the Scout now also gets a 1s `rmbLockT` lockout
  // the instant the pool can't pay for a volley, so an empty bar can't trickle-fire.
  if(player.char === 'scout' && mouse.rdown && player.rmbLockT <= 0 && player.laserCd <= 0 && player.power >= 1){
    fireLaserBeams();
    player.power = Math.max(0, player.power - 1);
    player.laserCd = 0.22 * (player.laserScale || 1);
    if(player.power < 1) player.rmbLockT = 1;   // drained this volley -> 1s no-fire lockout
  }
  // ---- Leo's secondary: COMBO cleaver slash (right mouse, hold to chain) ----
  // Holding RMB auto-fires back-to-back ~6-frame cleaver chops with no gap, so
  // a held button produces a continuous slash chain (combo). Each slash damages
  // every enemy inside the arc; leoSlashHits guarantees each enemy is hit at
  // most once per slash, so an enemy in the arc takes a hit every ~0.1s while
  // the player keeps holding. drawPlayer swaps drawLeoGame into 'sword' mode
  // while leoSlashRem > 0. Replaces the old continuous fireMachete + fury-drain
  // attack (fireMachete + fury + the 1s lockout are now dead-code, left in place).
  if(player.char === 'bounty_hunter'){
    if(mouse.rdown && player.leoSlashRem <= 0){
      player.leoSlashRem = player.leoSlashTotal;
      player.leoSlashHits = new Set();
      if(sfx.macheteSwing) sfx.macheteSwing();
    }
    if(player.leoSlashRem > 0){
      // Damage scan: enemies inside an arc in the player.angle direction.
      // Range DOUBLED from the original 22 -> 44 per user request. The visual
      // arc indicator in drawLeoGame still draws at 22*px (cosmetic only);
      // gameplay reach is the value here.
      const reach = 44;
      const halfArc = 0.9;                                     // ~103° wedge, similar feel to the old MACHETE_HALF
      const dmg = 5 * (player.damageMult || 1) * (player.damageTime > 0 ? 2 : 1);
      for(const en of entities){
        if(en.type !== 'enemy' || en.dead) continue;
        if(player.leoSlashHits.has(en)) continue;
        const dx = en.x - player.x, dy = en.y - player.y;
        const rr = reach + en.radius;
        if(dx*dx + dy*dy > rr*rr) continue;
        let diff = Math.atan2(dy, dx) - player.angle;
        while(diff >  Math.PI) diff -= 2 * Math.PI;
        while(diff < -Math.PI) diff += 2 * Math.PI;
        if(Math.abs(diff) > halfArc) continue;
        damageEnemy(en, dmg, true);
        player.leoSlashHits.add(en);
        if(sfx.macheteHit) sfx.macheteHit();
      }
      player.leoSlashRem -= dt;
      if(player.leoSlashRem <= 0){ player.leoSlashRem = 0; player.leoSlashHits = null; }
    }
  }
  // ---- Ong's secondary (swapped to RMB): FAST gas-bolt, drains toxin ----
  // Per-shot like the Scout's volley: gated by bioCd (FAST cadence) + `toxin` (1 per
  // shot) + the same 1s empty-lockout. The cloud-lobbing bio-gun is now the LMB primary.
  if(player.char === 'cyborg' && mouse.rdown && player.rmbLockT <= 0 && player.bioCd <= 0 && player.toxin >= 1){
    fireGasBolt();
    player.toxin = Math.max(0, player.toxin - 1);
    player.bioCd = 0.2;   // fast cadence (was 0.5 for the slow bio-glob)
    if(player.toxin < 1) player.rmbLockT = 1;   // drained this shot -> 1s no-fire lockout
  }

  if(player.invuln > 0) player.invuln -= dt;
  if(player.hitFlash > 0) player.hitFlash -= dt;

  // ---- Enemy spawning ----
