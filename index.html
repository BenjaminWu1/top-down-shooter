  // A live-enemy CONCURRENCY cap (#2 rebalance) so the late game isn't a wall of
  // monsters all at once: spawning pauses while this many regulars are already alive,
  // spreading the same `total` over time instead of bunching it up. Scales gently with
  // level but stays bounded (≈13 @L1 → 20 @L40).
  // Compute the alive-regular count ONCE per frame (reused in the gap surge check too)
  // instead of calling entities.filter() three separate times.
  const aliveRegular = entities.filter(e => e.type === 'enemy' && !e.isBoss).length;
  if(spawnedCount < levelData.total){
    spawnTimer -= dt;
    const aliveCap = Math.min(20, 12 + Math.floor(levelIdx * 0.22));
    if(spawnTimer <= 0 && aliveRegular < aliveCap){
      spawnEnemyAtEdge(pickWeighted(levelData.mix));
      spawnedCount++;
      spawnTimer = levelData.rate * rand(0.7, 1.3);
    } else if(spawnTimer <= 0){
      spawnTimer = levelData.rate * rand(0.3, 0.6);   // at cap: re-check soon, don't over-delay
    }
  }
  // ---- Staged boss encounters (L11-40) ----
  // L11-20: 1 medium boss @50% -> surge gap -> end boss.
  // L21-30: 2 different medium bosses @50% -> surge gap -> end boss.
  // L31-40: 2 mediums @50% -> surge gap -> 1 transitional boss -> 0s -> end boss.
  // bossPhase tracks where we are; each block keys on a distinct int so advancing the
  // phase falsifies the later blocks' guards in the same frame.
  const meds = mediumBossKinds(levelData);
  const hasMedium = meds.length > 0;
  // PHASE 0 -> 1: release the medium-boss wave at 50% spawn progress.
  if(hasMedium && bossPhase === 0 && spawnedCount >= Math.floor(levelData.total * 0.5)){
    bossPhase = 1;
    midbossSpawned = true;
    midbossRefs = meds.map(k => spawnBoss(k));
    // Two simultaneous mediums: flash both names ("A + B"); spawnBoss already set the
    // second one's name, so overwrite with the combined label.
    if(meds.length > 1) bossSpawnName = meds.map(k => BOSS_NAMES[k] || 'BOSS').join(' + ');
  }
  // PHASE 1 -> 2: ALL current medium bosses dead -> open the surge gap.
  if(bossPhase === 1 && midbossRefs.every(b => !b || b.dead)){
    bossPhase = 2;
    midbossDefeated = true;
    bossGapTimer = rand(10, 15);
    gapSpawnTimer = 0;
    midbossRefs = [];
  }
  // PHASE 2: the SURGE — a DENSE stream of regular monsters fills the gap (not a trickle).
  // These don't count toward `total`, so they never block the win check.
  if(bossPhase === 2 && bossGapTimer > 0){
    bossGapTimer -= dt;
    gapSpawnTimer -= dt;
    // aliveRegular was computed in the spawning block above — reuse it.
    if(gapSpawnTimer <= 0 && aliveRegular < 20 && entities.length < 480){
      spawnEnemyAtEdge(pickWeighted(levelData.mix));
      gapSpawnTimer = levelData.rate * rand(0.4, 0.7);
    }
  }
  // PHASE 2 -> 3 (L31-40) transitional boss, or 2 -> 4 (L11-30) end boss.
  if(bossPhase === 2 && bossGapTimer <= 0){
    if(levelData.transBoss){ bossPhase = 3; transBossRef = spawnBoss(levelData.transBoss); }
    else { bossPhase = 4; bossSpawned = true; spawnBoss(levelData.boss); }
  }
  // PHASE 3 -> 4 (L31-40): transitional boss died -> end boss arrives IMMEDIATELY (0s gap).
  if(bossPhase === 3 && (!transBossRef || transBossRef.dead)){
    bossPhase = 4; bossSpawned = true; spawnBoss(levelData.boss);
  }
  // L1-10 (no medium boss): the original gate — end boss after all regulars spawned + most dead.
  if(!hasMedium && !bossSpawned && spawnedCount >= levelData.total){
    // aliveRegular was computed in the spawning block above — reuse it.
    if(aliveRegular <= Math.max(2, Math.floor(levelData.total * 0.2))){
      bossSpawned = true; bossPhase = 4; spawnBoss(levelData.boss);
    }
  }

  // ---- Build spatial enemy grid for ally AI (will be rebuilt after entity updates ----
  // ---- for accurate collision, see Collisions section below).                    ----
  // Built before entity updates so ally AIs query it instead of scanning all entities;
  // they don't need pixel-perfect accuracy so stale-1-frame positions are fine.
  buildEnemyGrid();

  // ---- Update entities (Slow-Mo powerup scales enemy & enemy-bullet dt) ----
  const enemyDt = dt * (slowMoTime > 0 ? 0.4 : 1);
  for(const e of entities){
    if(e.dead) continue;
    if(e.type === 'enemy') updateEnemy(e, enemyDt);
    else if(e.type === 'bullet'){
      const bdt = (e.owner === 'enemy') ? enemyDt : dt;
      updateBullet(e, bdt);
    }
    else if(e.type === 'pickup') updatePickup(e, dt);
    else if(e.type === 'companion') updateCompanion(e, dt);
    else if(e.type === 'henchman' || e.type === 'nunchaku') updateMeleeAlly(e, dt);
    else if(e.type === 'bomber_ally') updateBomberAlly(e, dt);
    else if(e.type === 'poison_ally') updatePoisonAlly(e, dt);
    else if(e.type === 'poison_cloud') updatePoisonCloud(e, dt);
    else if(e.type === 'sword_ally') updateSwordAlly(e, dt);
    if(e.hitFlash > 0) e.hitFlash -= dt;
  }

  // ---- Boss poison-gas pools: small lingering AoE that drains the player ----
  for(const gf of groundFields){
    // Arming window: pool spawns on the player, so for the first `warn` seconds it
    // does no damage (telegraph only) — time to walk out before it can chip you.
    if(gf.warn > 0){ gf.warn -= dt; continue; }
    gf.life -= dt;
    const rr = gf.radius + player.radius;
    if(player.hp > 0 && player.invuln <= 0 && dist2(gf, player) < rr*rr) damagePlayer(1 * enemyDmgScale(levelIdx));
    if(Math.random() < dt * 10 && particles.length < 300){
      const ga = Math.random() * Math.PI * 2, gr = Math.random() * gf.radius;
      particles.push({ x: gf.x + Math.cos(ga)*gr, y: gf.y + Math.sin(ga)*gr,
                       vx: 0, vy: -12, life: 0.5, maxLife: 0.5, color: '#2ecc71', size: 1 });
    }
  }
  compact(groundFields, g => g.life > 0);

  // ---- Collisions ----
  // Rebuild the spatial grid NOW (after entity updates) so enemiesNear() uses fresh
  // enemy positions for accurate bullet collision. The grid built earlier before entity
  // updates was used by ally AI target scanning (stale-1-frame is fine for AI targeting).
  buildEnemyGrid();
  // Resolve the (tiny: ≤2 equipped + a possible sword_ally) ally list ONCE per frame
  // into a scratch array (no allocation). The enemy-bullet → ally and enemy-body → ally
  // checks below iterate THIS instead of scanning the whole `entities` array per item —
  // a boss fight floods the arena with enemy bullets, so the old per-bullet full scan was
  // O(enemyBullets × entities) and the main cause of sustained boss-fight lag.
  _allyList.length = 0;
  for(const e of entities){ if(isAlly(e) && !e.dead) _allyList.push(e); }
  // Pre-build bullet lists from entities so the collision loops below don't have to
  // re-scan non-bullet entities (saves ~50 skipped iterations/frame during boss fights).
  _pBullets.length = 0; _eBullets.length = 0;
  for(const b of entities){
    if(b.type !== 'bullet' || b.dead) continue;
    if(b.owner === 'player') _pBullets.push(b); else _eBullets.push(b);
  }
  // ---- Player bullets: check against every nearby enemy via the spatial grid ----
  for(const b of _pBullets){
    for(const en of enemiesNear(b.x, b.y)){
        if(b.hitSet && b.hitSet.has(en)) continue;
        const dr = b.radius + en.radius;
        if(dist2(b, en) < dr*dr){
          damageEnemy(en, b.dmg, !b.fromAlly);
          // Hit particles are THROTTLED per-enemy (en.hitFxT): a fast primary on a big
          // boss lands ~16 hits/s, and an un-throttled burst per hit was the boss-lag
          // cause. Damage still applies every hit; only the FX are rate-limited + fewer.
          if((en.hitFxT || 0) <= 0){
            en.hitFxT = 0.05;
            if(b.kind === 'pellet' || b.kinetic){
              // KINETIC impact: sharp spark shards + a grey smoke puff (source-over).
              for(let s = 0; s < 2; s++){
                if(particles.length >= 300) break;
                const a = Math.random() * TAU, sp = 70 + Math.random() * 130;
                particles.push({ spark:true, x: b.x, y: b.y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
                  w: 2 + Math.random()*1.5, h: 1, life: 0.18, maxLife: 0.18, color: Math.random() < 0.5 ? '#ffd24a' : '#ff8c42' });
              }
              if(particles.length < 300)
                particles.push({ smoke:true, x: b.x, y: b.y, vx:(Math.random()-0.5)*20, vy:(Math.random()-0.5)*20,
                  r0: 1, r1: 4 + Math.random()*3, color: '#9aa0a6', life: 0.35, maxLife: 0.35 });
            } else {
              // ENERGY impact: a small additive plasma burst in the bullet's glow colour.
              emit(b.x, b.y, 3, b.glow || '#fff', 30, 110, 0.25, true);
            }
          }
          if(b.explosive){
            explode(b.x, b.y, b.explodeRadius, b.dmg, !b.fromAlly);
            b.dead = true;
          } else if(b.spawnsCloud){
            spawnPoisonCloud(b.x, b.y, b);
            b.dead = true;
            if(hitSfxCd <= 0){ sfx.hit(); hitSfxCd = 0.05; }
          } else if(b.pierce){
            b.hitSet.add(en);
            if(hitSfxCd <= 0){ sfx.hit(); hitSfxCd = 0.05; }
          } else {
            b.dead = true;
            if(hitSfxCd <= 0){ sfx.hit(); hitSfxCd = 0.05; }
          }
          if(!b.pierce) break;
        }
      }
  }
  // ---- Enemy bullets: check against the player and all alive allies ----
  for(const b of _eBullets){
    if(player.invuln <= 0){
      const dr = b.radius + player.radius;
      if(dist2(b, player) < dr*dr){ b.dead = true; damagePlayer(1 * enemyDmgScale(levelIdx)); continue; }
    }
    for(const a of _allyList){
      if(a.dead || a.invuln > 0) continue;
      const dr = b.radius + a.radius;
      if(dist2(b, a) < dr*dr){ b.dead = true; damageAlly(a, 1); break; }
    }
  }
  if(player.invuln <= 0){
    for(const en of enemiesNear(player.x, player.y)){
      const dr = player.radius + en.radius;
      if(dist2(en, player) < dr*dr){
        damagePlayer((en.isBoss ? 2 : 1) * enemyDmgScale(levelIdx));
        const a = Math.atan2(en.y - player.y, en.x - player.x);
        en.x += Math.cos(a) * 12;
        en.y += Math.sin(a) * 12;
        break;
      }
    }
  }
  // Enemy bodies touching any chosen ally (_allyList already includes the summoned
  // sword_ally via isAlly; inner enemy scan uses the grid).
  for(const a of _allyList){
    if(a.dead || a.invuln > 0) continue;
    for(const en of enemiesNear(a.x, a.y)){
      const dr = a.radius + en.radius;
      if(dist2(en, a) < dr*dr){
        damageAlly(a, en.isBoss ? 2 : 1);
        const ang = Math.atan2(en.y - a.y, en.x - a.x);
        en.x += Math.cos(ang) * 8;
        en.y += Math.sin(ang) * 8;
        break;
      }
    }
  }
  // Pickups
  for(const p of entities){
    if(p.type !== 'pickup' || p.dead) continue;
    const dr = p.radius + player.radius;
    if(dist2(p, player) < dr*dr){
      applyPickup(p.kind);
      p.dead = true;
      sfx.pickup();
      emit(p.x, p.y, 8, '#fff', 30, 80, 0.4);
    }
  }

  // Particles
  for(const p of particles){
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    p.vx *= 0.92;
    p.vy *= 0.92;
  }
  compact(particles, p => p.life > 0);

  compact(entities, e => !e.dead);

  // Win/loss
  const enemiesAlive = entities.some(e => e.type === 'enemy');
  const midDone = !mediumBossKinds(levelData).length || midbossSpawned;
  if(spawnedCount >= levelData.total && bossSpawned && midDone && !enemiesAlive){
    clearedLevels.add(levelIdx);
    saveCleared();
    lastClearedLevel = levelIdx;
    const finalWin = levelIdx >= LEVELS.length - 1;
    // Bank the run's accrued kill XP/gold + the level-clear award; resolves level-ups + persists.
    // SCHOLAR/GREED passives scale the clear award too (the per-kill accrual was already scaled).
    grantXp(Math.round((XP_LEVEL_CLEAR + (finalWin ? XP_VICTORY : 0)) * (1 + passiveValue('scholar'))));
    grantGold(Math.round(GOLD_LEVEL_CLEAR * (1 + passiveValue('greed'))));
    if(finalWin){
      state = STATE.VICTORY; stateTime = 0; sfx.victory();
      if(score > highScore){ highScore = score; localStorage.setItem('shooter_high', String(highScore)); }
    } else {
      state = STATE.LEVEL_COMPLETE; stateTime = 0; sfx.levelComplete();
    }
  }
  if(player.hp <= 0){
    state = STATE.GAME_OVER; stateTime = 0; sfx.gameOver();
    grantXp(0);     // resolve + persist the accrued kill XP/gold even on a loss
    if(score > highScore){ highScore = score; localStorage.setItem('shooter_high', String(highScore)); }
  }
}

// ============================================================
// WEAPONS
// ============================================================
// Tank's flamethrower: a cone of damage in the aim direction this frame,
// plus visual flame particles. Called each tick while right-mouse is held
// and fuel remains.
// Tank's B-key flameburst: a 3-second ring of fire centered on the player.
// Called every frame while player.flameburstTime > 0. DPS is tuned so a small
// mob (grunt/runner/swarmer/exploder, hp ≤ ~3) dies in well under a second of
// contact but a Tank enemy needs to sit in the ring for ~2s and bosses survive.
function tickFlameburst(dt){
  const radius = 36;
  // flameburstMul is set per-cast from the NAPALM skill's current tier.
  const dps = 6 * (player.damageMult || 1) * (player.damageTime > 0 ? 2 : 1) * (player.flameburstMul || 1);
  // Damage any enemy inside the ring this tick.
  for(const en of entities){
    if(en.type !== 'enemy' || en.dead) continue;
    if(dist2(player, en) < (radius + en.radius) * (radius + en.radius)){
      damageEnemy(en, dps * dt, true);
    }
  }
  // Spray flame particles along the ring (count scaled by dt so it looks
  // dense at 60fps without overflowing the 300-particle cap).
  const count = Math.max(1, Math.floor(120 * dt));
  for(let i = 0; i < count; i++){
    const a = Math.random() * Math.PI * 2;
    const r = radius * (0.55 + Math.random() * 0.45);
    const px = player.x + Math.cos(a) * r * 0.5;
    const py = player.y + Math.sin(a) * r * 0.5;
    const vx = Math.cos(a) * 70;
    const vy = Math.sin(a) * 70;
    const col = ['#fff', '#f1c40f', '#e67e22', '#e74c3c'][i % 4];
    particles.push({
      x: px, y: py, vx, vy,
      life: 0.18 + Math.random() * 0.12,
      maxLife: 0.3, color: col,
      size: 1 + Math.floor(Math.random() * 2)
    });
  }
  if(particles.length > 300) particles.length = 300;
}

function fireFlamethrower(dt){
  const baseX = player.x + Math.cos(player.angle) * 7;   // emit from the sprite's nozzle/front
  const baseY = player.y + Math.sin(player.angle) * 7;
  const range = 140;       // SHORTER reach — a close-quarters flamethrower now
  const halfAngle = 0.52;  // ~60° cone (tighter than before)
  // HEAT / OVERCHARGE: once the CURRENT RMB press has been firing for more than 2
  // seconds (see player.flameHeldT, accumulated by the RMB dispatch and reset on
  // release/lockout/empty), the flame enters "Dangerous Temperature" — deep crimson
  // particles + 1.5x damage + FUEL bar lights up — until fuel empties and forces
  // the lockout. Heat is per-press, not fuel-based: tap-firing never enters danger.
  const danger = player.flameHeldT > 2;
  // DPS stacks MULTIPLICATIVELY: base 7 x damageMult x DAMAGE-pickup(2) x heat(1.5).
  // (The 1.5 never overrides the others; a future tier mult slots in the same way.)
  const dps = 7 * (player.damageMult || 1) * (player.damageTime > 0 ? 2 : 1) * (danger ? 1.5 : 1) * (player.weaponMult || 1);
  // Damage every enemy inside the cone, scaled by dt AND by distance: the flame is
  // HOTTEST at the nozzle and cools toward the edge of its reach — point-blank enemies
  // take ~1.9x, enemies at max range take ~0.4x (a steep close-up bonus that rewards
  // the high-HP tank for face-tanking). DIST_NEAR/DIST_FAR are the two falloff anchors.
  const DIST_NEAR = 1.9, DIST_FAR = 0.4;
  for(const en of entities){
    if(en.type !== 'enemy' || en.dead) continue;
    const dx = en.x - player.x, dy = en.y - player.y;
    const d = Math.hypot(dx, dy);
    if(d > range + en.radius) continue;
    let diff = Math.atan2(dy, dx) - player.angle;
    while(diff >  Math.PI) diff -= 2 * Math.PI;
    while(diff < -Math.PI) diff += 2 * Math.PI;
    if(Math.abs(diff) > halfAngle) continue;
    const distMult = DIST_NEAR + (DIST_FAR - DIST_NEAR) * Math.min(1, d / range);
    damageEnemy(en, dps * distMult * dt, true);
  }
  // Visual flame particles spraying down the cone.
  for(let i = 0; i < 4; i++){
    const jitter = (Math.random() - 0.5) * (halfAngle * 1.6);
    const reach = 20 + Math.random() * (range - 20);
    const px = baseX + Math.cos(player.angle + jitter) * 4;
    const py = baseY + Math.sin(player.angle + jitter) * 4;
    const vx = Math.cos(player.angle + jitter) * (reach * 2);
    const vy = Math.sin(player.angle + jitter) * (reach * 2);
    // Normal = orange-red; Dangerous Temperature = deep, vibrant crimson.
    const pal = danger ? ['#fff', '#e74c3c', '#c0392b', '#7a1f12'] : ['#fff', '#f1c40f', '#e67e22', '#e74c3c'];
    particles.push({
      x: px, y: py, vx, vy,
      life: 0.3 + Math.random() * 0.15,
      maxLife: 0.45, color: pal[i % 4],
      size: 1 + Math.floor(Math.random() * 2), glow: true
    });
  }
  if(particles.length > 300) particles.length = 300;
  // Continuous filtered white-noise roar (a single sustained node, not bursts). Started
  // here on the first flame frame; pitched up while in the danger state. Stopped by the
  // Tank RMB dispatch (release/empty) + the update() safety net (pause/death/menu).
  flameAudioStart();
  flameAudioSetDanger(danger);
}

// Syed's right-mouse secondary: a VERY-high-DPS continuous KATANA slash swept
// across a wide OBTUSE arc in front of the player. Mirrors fireFlamethrower's
// cone-damage loop. The short `energy` pool is the balance lever; the visible
// obtuse cone is drawn in drawPlayer. Range/half-angle are shared constants so
// the damage check and the on-screen arc stay in lock-step.
const KATANA_RANGE = 32;     // long katana reach
const KATANA_HALF  = 0.9;    // ~51.6° half-arc => ~103° total slash — still obtuse,
                             // and 3/4 of the prior 1.2-rad arc (scope cut to 3/4)
function fireKatana(dt){
  const dps = 40 * (player.damageMult || 1) * (player.damageTime > 0 ? 2 : 1) * (player.weaponMult || 1);
  // The spear is held in Dr. Syed's left hand (drawn at offset (-7*px, +2*px)
  // in drawDrSyed, with DR_SYED_PX=1), so the thrust originates from there
  // instead of player center. The damage scan and the afterimage particle
  // origin both pivot around (sx, sy) per user request: "the attack should
  // begin on the side with the spear".
  const sx = player.x - 7, sy = player.y + 2;
  let hitAny = false, hx = 0, hy = 0;
  for(const en of entities){
    if(en.type !== 'enemy' || en.dead) continue;
    const dx = en.x - sx, dy = en.y - sy;
    const d = Math.hypot(dx, dy);
    if(d > KATANA_RANGE + en.radius) continue;
    let diff = Math.atan2(dy, dx) - player.angle;
    while(diff >  Math.PI) diff -= 2 * Math.PI;
    while(diff < -Math.PI) diff += 2 * Math.PI;
    if(Math.abs(diff) > KATANA_HALF) continue;
    damageEnemy(en, dps * dt, true);
    if(!hitAny){ hitAny = true; hx = en.x; hy = en.y; }
  }
  // Thrust afterimage streaks: fast white/silver lines along the front arc,
  // emanating from the spear-hand origin (sx, sy).
  for(let i = 0; i < 3; i++){
    if(particles.length >= 300) break;
    const a = player.angle + (Math.random() - 0.5) * KATANA_HALF * 2;
    const rr = KATANA_RANGE * (0.5 + Math.random() * 0.5);
    particles.push({
      x: sx + Math.cos(a) * rr, y: sy + Math.sin(a) * rr,
      vx: Math.cos(player.angle) * 60, vy: Math.sin(player.angle) * 60,   // streak forward (thrust)
      life: 0.08 + Math.random() * 0.05, maxLife: 0.14,
      color: i % 2 ? '#ffffff' : '#e8eef2', size: 1 + Math.floor(Math.random() * 2)
    });
  }
  // Whoosh on a fast cadence (runs every frame while held -> throttle to ~10/s).
  player.slashSfxT = (player.slashSfxT || 0) - dt;
  if(player.slashSfxT <= 0){ sfx.spearWhoosh(); player.slashSfxT = 0.1; }
  // Metallic CLANG only on enemy contact, throttled so a continuous hit isn't 60/s.
  if(hitAny){
    player.spearHitT = (player.spearHitT || 0) - dt;
    if(player.spearHitT <= 0){
      sfx.spearClang();
      player.spearHitT = 0.15;
      for(let i = 0; i < 4; i++){
        if(particles.length >= 300) break;
        const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 90;
        particles.push({ spark:true, x: hx, y: hy, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
          w: 2, h: 1, life: 0.18, maxLife: 0.18, color: i % 2 ? '#ffffff' : '#cfd8dc' });
      }
    }
  }
}

// Leo's RMB: a heavy machete — same swept-arc melee as Syed's blade but a bit longer
// reach + higher DPS, drains `fury`. Range/half-angle are shared constants (kept in
// lock-step with the arc drawn in drawPlayer). MACHETE_DPS is the balance lever.
const MACHETE_RANGE = 38, MACHETE_HALF = 0.9, MACHETE_DPS = 46;
function fireMachete(dt){
  const dps = MACHETE_DPS * (player.damageMult || 1) * (player.damageTime > 0 ? 2 : 1) * (player.weaponMult || 1);
  let hitAny = false, hx = 0, hy = 0;
  for(const en of entities){
    if(en.type !== 'enemy' || en.dead) continue;
    const dx = en.x - player.x, dy = en.y - player.y;
    const d = Math.hypot(dx, dy);
    if(d > MACHETE_RANGE + en.radius) continue;
    let diff = Math.atan2(dy, dx) - player.angle;
    while(diff >  Math.PI) diff -= 2 * Math.PI;
    while(diff < -Math.PI) diff += 2 * Math.PI;
    if(Math.abs(diff) > MACHETE_HALF) continue;
    damageEnemy(en, dps * dt, true);
    if(!hitAny){ hitAny = true; hx = en.x; hy = en.y; }
  }
  // Slash visual: orange-red streaks sweeping the front arc.
  for(let i = 0; i < 3; i++){
    if(particles.length >= 300) break;
    const a = player.angle + (Math.random() - 0.5) * MACHETE_HALF * 2;
    const rr = MACHETE_RANGE * (0.5 + Math.random() * 0.5);
    particles.push({
      x: player.x + Math.cos(a) * rr, y: player.y + Math.sin(a) * rr,
      vx: Math.cos(a + 1.4) * 45, vy: Math.sin(a + 1.4) * 45,
      life: 0.1 + Math.random() * 0.06, maxLife: 0.16,
      color: i % 2 ? '#ff6b35' : '#e74c3c', size: 1 + Math.floor(Math.random() * 2)
    });
  }
  // Heavy swing on a fast cadence (throttled ~10/s).
  player.slashSfxT = (player.slashSfxT || 0) - dt;
  if(player.slashSfxT <= 0){ sfx.macheteSwing(); player.slashSfxT = 0.1; }
  // On enemy contact (throttled): muffled thud + a sharp white flash + rectangular sparks.
  if(hitAny){
    player.macheteHitT = (player.macheteHitT || 0) - dt;
    if(player.macheteHitT <= 0){
      sfx.macheteHit();
      player.macheteHitT = 0.15;
      if(particles.length < 300) particles.push({ flash:true, x: hx, y: hy, vx:0, vy:0, angle: Math.random()*Math.PI, r: 7, color: '#ffffff', life: 0.1, maxLife: 0.1 });
      for(let i = 0; i < 6; i++){
        if(particles.length >= 300) break;
        const a = Math.random() * Math.PI * 2, s = 80 + Math.random() * 120;
        particles.push({ spark:true, x: hx, y: hy, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
          w: 3, h: 1, life: 0.35, maxLife: 0.35, color: i % 2 ? '#ffd24a' : '#ff8c42' });
      }
    }
  }
}

// Ong's RMB: bio-gun — lobs a toxic glob (a real projectile, low direct damage) that,
// on hitting an enemy OR reaching max range, deletes itself and drops a lingering
// `poison_cloud` (AoE DoT). Cloud params ride on the bullet so a future tier pass only
// has to bump them. Drains `toxin` (1 per shot, gated by bioCd in updatePlaying).
function fireBiogun(){
  const a = player.angle;
  const tMul = player.weaponMult || 1;   // 5-tier evolution: scales glob dmg/speed + cloud dps
  const mx = player.x + Math.cos(a) * 7, my = player.y + Math.sin(a) * 7;
  const b = createBullet(mx, my, a, 'player', { dmg: 1 * (player.damageMult || 1) * tMul, speed: 260 * tMul, radius: 3, life: 0.8, sprite: SPR.bullet_bio, glow: '#2ecc71', tier: player.weaponTier || 1, sourceClass: 'cyborg' });
  // Cloud is a touch weaker than its old RMB form since the bio-gun is now Ong's
  // INFINITE primary (LMB) — spammable, so each cloud is smaller/shorter/less DPS.
  b.spawnsCloud = true; b.cloudRadius = 20; b.cloudLife = 1.6; b.cloudDps = 4 * tMul; b.cloudSlow = 0;
  entities.push(b);
  emit(mx, my, 4, '#27ae60', 30, 90, 0.2, true);
  sfx.shoot();
}

// Ong's SECONDARY (swapped to RMB): a fast, direct gas-bolt that drains `toxin`.
// Mirrors the old LMB gas-gun shot (dmg 3.4, soft-green energy glow) but on a fast
// cadence + the toxin pool + the 1s empty-lockout (gated in updatePlaying).
function fireGasBolt(){
  const a = player.angle;
  const tMul = player.weaponMult || 1;
  const dmgMult = (player.damageTime > 0 ? 2 : 1) * (player.damageMult || 1) * tMul;
  const m = ongMuzzle(ONG_PX, player.x, player.y, a);
  entities.push(createBullet(m.x, m.y, a, 'player', {
    dmg: 3.4 * dmgMult, radius: 3, speed: 280 * tMul, life: 1.0,
    glow: '#7dff5a', tier: player.weaponTier || 1, sourceClass: 'cyborg'
  }));
  emit(m.x, m.y, 4, '#7dff5a', 28, 100, 0.18, true);
  sfx.shoot();
}

// Spawn a player-owned poison cloud (lingering AoE DoT) from a bullet's cloud* params
// or an explicit param object. Cap-gated against the 480 spawn limit.
function spawnPoisonCloud(x, y, b){
  if(entities.length >= 480) return;
  entities.push({
    type:'poison_cloud', owner:'player', x, y, radius:4,
    auraRadius: b.cloudRadius || 24, dps: b.cloudDps || 6, slow: b.cloudSlow || 0,
    life: b.cloudLife || 2, maxLife: b.cloudLife || 2, puffT:0,
    hitFlash:0, invuln:0, dead:false
  });
}

function updatePoisonCloud(c, dt){
  c.life -= dt;
  if(c.life <= 0){ c.dead = true; spawnDecal(c.x, c.y, c.auraRadius, 'toxic'); return; }
  const dps = c.dps * (player.damageMult || 1) * (player.damageTime > 0 ? 2 : 1);
  for(const en of entities){
    if(en.type !== 'enemy' || en.dead) continue;
    const rr = c.auraRadius + en.radius;
    if(dist2(c, en) < rr * rr) damageEnemy(en, dps * dt, true);
  }
  // Rising toxic puffs scattered through the cloud (cap-guarded).
  c.puffT -= dt;
  if(c.puffT <= 0 && particles.length < 300){
    c.puffT = 0.06;
    const ang = Math.random() * Math.PI * 2, r = c.auraRadius * Math.sqrt(Math.random());
    particles.push({ x: c.x + Math.cos(ang) * r, y: c.y + Math.sin(ang) * r, vx:0, vy:-6, life:0.5, maxLife:0.5, color: Math.random() < 0.5 ? '#27ae60' : '#2ecc71', size:1 });
  }
}

function drawPoisonCloud(c){
  const a = clamp(c.life / c.maxLife, 0, 1);
  ctx.globalAlpha = 0.12 + 0.10 * a;
  ctx.fillStyle = '#16a765';
  ctx.beginPath(); ctx.arc(Math.floor(c.x), Math.floor(c.y), c.auraRadius, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 0.3 * a;
  ctx.strokeStyle = '#2ecc71'; ctx.lineWidth = 1; ctx.stroke();
  ctx.globalAlpha = 1;
}

// Scout RMB: THREE instant straight-line laser beams. Each beam is a line segment
// from the mech's muzzle out to LASER_BEAM_LEN, fanned at ±LASER_BEAM_SPREAD around
// the aim (plus one dead-center). It is HITSCAN, not a projectile: every enemy
// whose center lies within LASER_BEAM_HALF (+ its radius) of a beam line takes the
// beam's full damage on the same frame it fires (point-to-segment distance test) —
// so all monsters caught in a beam are hit simultaneously. The beam scope (length +
// spread) is unchanged from the old 3-bolt burst this replaces.
const LASER_BEAM_LEN = 147;      // = old bolt speed(420) * life(0.35): scope unchanged
const LASER_BEAM_HALF = 4;       // beam half-thickness used for the hit test
const LASER_BEAM_SPREAD = 0.18;  // fan offset per side (unchanged from old burst)
function fireLaserBeams(){
  const dmg = 3 * (player.damageMult || 1) * (player.damageTime > 0 ? 2 : 1) * (player.weaponMult || 1);
  // RMB beams originate at the RIGHT-hand cannon (south arm of the east-facing
  // sprite): forward + right-perpendicular (-sin a, +cos a). Mirrors the LMB
  // left-hand muzzle offset in updatePlaying so each weapon fires from its hand.
  const a = player.angle;
  const lx = player.x + Math.cos(a) * 8 - Math.sin(a) * 8;
  const ly = player.y + Math.sin(a) * 8 + Math.cos(a) * 8;
  for(const off of [-LASER_BEAM_SPREAD, 0, LASER_BEAM_SPREAD]){
    const a = player.angle + off;
    const cx = Math.cos(a), cy = Math.sin(a);
    // Damage every enemy lying on this beam line — all at once, the frame it fires.
    for(const en of entities){
      if(en.type !== 'enemy' || en.dead) continue;
      let t = (en.x - lx) * cx + (en.y - ly) * cy;   // project enemy onto the beam
      t = clamp(t, 0, LASER_BEAM_LEN);
      const px = lx + cx * t, py = ly + cy * t;       // nearest point on the beam
      const dx = en.x - px, dy = en.y - py;
      const reach = LASER_BEAM_HALF + en.radius;
      if(dx*dx + dy*dy <= reach*reach){
        damageEnemy(en, dmg, true, false);   // held auto-fire beam → never hit-stops
      }
    }
    // Beam visual: a straight line from muzzle along the beam, flashing then fading.
    if(particles.length < 300) particles.push({
      beam:true, x:lx, y:ly, angle:a, len:LASER_BEAM_LEN,
      vx:0, vy:0, color:'#4fc3f7', life:0.14, maxLife:0.14
    });
  }
  emit(lx, ly, 6, '#4fc3f7', 40, 150, 0.18, true);
  sfx.laserBeam();
}

function fireWeapon(mx, my){
  // Powerups ONLY ENHANCE the class basic attack — they never change its form:
  //   rapidTime  → faster cadence (×0.5 cooldown)
  //   damageTime → ×2 damage
  //   pierceTime → shots pass through enemies (pierce flag + per-bullet hitSet)
  //   multiTime  → fire a parallel DOUBLE shot (same projectile, ±perp offset)
  // The projectile sprite / speed / sound stay the class default in every case.
  const rapidFactor = player.rapidTime > 0 ? 0.5 : 1;
  // 5-tier weapon evolution: scales base damage + projectile speed. Stacks
  // MULTIPLICATIVELY with the DAMAGE pickup (x2) and account damageMult; independent of
  // RAPID (cadence). tMul is also applied to projectile speed just below.
  const tMul = player.weaponMult || 1;
  const dmgMult = (player.damageTime > 0 ? 2 : 1) * (player.damageMult || 1) * tMul;

  // Per-class basic-attack projectile spec + cadence + muzzle flash + fire sound.
  let opts, cd, flashN, flashCol, flashSpd, flashLife, fireSfx = sfx.shoot;
  if(player.char === 'scout'){
    // Assassin SMG: fast, light, low-damage blue laser dots. High sustained DPS up
    // close; each shot is weak — rewards landing many hits.
    opts = { dmg: 0.85 * dmgMult, speed: 360, radius: 2, life: 1.0, sprite: SPR.bullet_dot_blue, glow: '#4fc3f7' };
    cd = 0.06; flashN = 2; flashCol = '#b3e5fc'; flashSpd = 110; flashLife = 0.14;
  } else if(player.char === 'tank'){
    // Heavy slug: 2× base damage. KINETIC — a gunmetal artillery slug, not a glow orb.
    opts = { dmg: 2 * dmgMult, radius: 3, speed: 300, life: 1.6, kinetic: true, glow: '#b0b6bd' };
    cd = player.fireRate; flashN = 4; flashCol = '#e67e22'; flashSpd = 100; flashLife = 0.22;
  } else if(player.char === 'bounty_hunter'){
    // Shotgun: a 3-pellet spread, short range (low `life`), slow cadence. Heavy burst
    // up close where all pellets land; falls off at range. `spread` is the weapon FORM.
    // KINETIC (pellet tracers — sharp grey lines, no glow).
    opts = { dmg: 1.1 * dmgMult, speed: 340, radius: 2, life: 0.45, spread: [-0.18, 0, 0.18], kind: 'pellet', kinetic: true };
    cd = 0.5; flashN = 5; flashCol = '#e67e22'; flashSpd = 120; flashLife = 0.2; fireSfx = sfx.shotgun;
  } else if(player.char === 'cyborg'){
    // FALLBACK ONLY: Ong's LMB now lobs the bio-gun glob (handled before fireWeapon is
    // called — see the LMB dispatch), and the gas-bolt is the RMB secondary (fireGasBolt).
    // This branch is unreachable in normal play but kept so fireWeapon never mis-fires
    // a cyborg as a soldier; it mirrors the gas-bolt spec.
    opts = { dmg: 3.4 * dmgMult, radius: 3, speed: 280, life: 1.0, glow: '#7dff5a' };
    cd = 0.34; flashN = 4; flashCol = '#7dff5a'; flashSpd = 110; flashLife = 0.2;
  } else {
    // Soldier pistol EVOLVES with weapon tier: a brass KINETIC bullet at Tiers 1-2, then
    // a glowing PLASMA bolt at Tier 3+ (the energy-glow renderer takes over).
    const plasma = (player.weaponTier || 1) >= 3;
    opts = { dmg: 1 * dmgMult, kinetic: !plasma, glow: plasma ? '#b388ff' : '#ffd24a', speed: 240 };
    cd = player.fireRate; flashN = 3; flashCol = plasma ? '#b388ff' : '#f1c40f'; flashSpd = 100; flashLife = 0.18;
  }
  if(player.pierceTime > 0) opts.pierce = true;
  // Tier scales projectile SPEED too (stacks with the damage scaling above), and tags
  // every bullet with the firing tier + class for the renderer's kinetic/energy split.
  opts.speed = (opts.speed ?? 240) * tMul;
  opts.tier = player.weaponTier || 1;
  opts.sourceClass = player.char;

  // Weapon FORM = a list of angle offsets (default single shot; shotgun = a fan). The
  // `spread` is the projectile shape, NOT an enhancer, so it stacks with MULTI below.
  const spread = opts.spread || [0];
  delete opts.spread;
  // MULTI: two parallel shots offset perpendicular to aim; otherwise a single shot.
  const offs = player.multiTime > 0 ? [-3, 3] : [0];
  for(const sa of spread){
    const ang = player.angle + sa;
    const perpX = Math.cos(ang + Math.PI / 2), perpY = Math.sin(ang + Math.PI / 2);
    for(const o of offs){
      entities.push(createBullet(mx + perpX * o, my + perpY * o, ang, 'player', opts));
    }
  }
  player.fireCooldown = cd * rapidFactor;
  emit(mx, my, flashN, flashCol, 30, flashSpd, flashLife, true);
  // Shotgun: a bright muzzle-flash polygon at the barrel tip (a `flash` star particle).
  if(player.char === 'bounty_hunter' && particles.length < 300){
    particles.push({ flash:true, x: mx, y: my, vx:0, vy:0, angle: player.angle, r: 7, color: '#ffd27f', life: 0.07, maxLife: 0.07 });
  }
  fireSfx();
}

function applyPickup(kind){
  // Equipment. The weapon pickups ENHANCE the basic attack (never replace its form):
  //   rapid = faster fire · pierce = shots punch through · multi = double shot.
  if(kind === 'health')   player.hp = Math.min(player.maxHp, player.hp + 1);
  else if(kind === 'rapid')  player.rapidTime  = Math.max(player.rapidTime,  8);
  else if(kind === 'pierce') player.pierceTime = Math.max(player.pierceTime, 8);
  else if(kind === 'multi')  player.multiTime  = Math.max(player.multiTime,  8);
  else if(kind === 'shield') player.shieldHp   = player.shieldMax;
  else if(kind === 'armor')  {
    // Extra protective case: raises the shield cap to 5 (regular shield's cap is 3),
    // refills shield to that new cap, and grants a brief invuln on pickup so it
    // doubles as an "oh no" panic button.
    player.shieldMax = Math.max(player.shieldMax, 5);
    player.shieldHp  = player.shieldMax;
    player.invuln    = Math.max(player.invuln, 1.5);
  }
  // Powerups (passive temporary buffs)
  else if(kind === 'speed')   player.speedTime  = Math.max(player.speedTime,  8);
  else if(kind === 'damage')  player.damageTime = Math.max(player.damageTime, 8);
  else if(kind === 'slowmo')  slowMoTime        = Math.max(slowMoTime,        5);
  else if(kind === 'score2x') player.scoreTime  = Math.max(player.scoreTime, 10);
  else if(kind === 'magnet')  player.magnetTime = Math.max(player.magnetTime,10);
  else if(kind === 'fuel')    player.fuel       = Math.min(player.maxFuel, player.fuel + 3);
  else if(kind === 'beverage') player.energy    = Math.min(player.maxEnergy, player.energy + 1);
  else if(kind === 'battery')  player.power     = Math.min(player.maxPower, player.power + 5);
  else if(kind === 'protein')  player.fury      = Math.min(player.maxFury, player.fury + 2);
  else if(kind === 'isotope')  player.toxin     = Math.min(player.maxToxin, player.toxin + 3);
}

// ============================================================
// COMPANION (player's AI assistant)
// ============================================================
function updateCompanion(c, dt){
  if(c.invuln > 0) c.invuln -= dt;
  // Float to a follow-point offset behind the player.
  const target = {
    x: player.x - Math.cos(player.angle) * 14,
    y: player.y - Math.sin(player.angle) * 14
  };
  const dx = target.x - c.x, dy = target.y - c.y;
  const d = Math.hypot(dx, dy);
  const accel = 18;
  if(d > 0.5){
    c.vx += (dx / d) * accel * 60 * dt;
    c.vy += (dy / d) * accel * 60 * dt;
  }
  c.vx *= 0.86; c.vy *= 0.86;
  // Cap the float speed so it can always at least match the player (with a small
  // catch-up margin) — otherwise the old low accel left the drone trailing on the
  // big 2x/3x arenas. Track the SPEED powerup too.
  const pSpeed = player.speed * playerSpeedMult();
  const maxV = Math.max(pSpeed * 1.35, 90);
  const sp = Math.hypot(c.vx, c.vy);
  if(sp > maxV){ c.vx = c.vx / sp * maxV; c.vy = c.vy / sp * maxV; }
  c.x += c.vx * dt; c.y += c.vy * dt;
  // Clamp to the world, not the viewport, so it follows past the screen edge.
  c.x = clamp(c.x, 6, worldW - 6);
  c.y = clamp(c.y, 6, worldH - 8);
  c.frameT += dt;
  if(c.frameT > 0.18){ c.frameT = 0; c.frame = (c.frame + 1) % 2; }

  // ---- EVOLUTIONS (gated on c.level, set by applyAssistantLevel) ----
  const lvl = c.level || 1;
  // L7-10 BERSERK: every 25s, 5s of doubled attack speed.
  if(lvl >= 7){
    c.berserkCd -= dt;
    if(c.berserkT > 0) c.berserkT -= dt;
    if(c.berserkCd <= 0 && c.berserkT <= 0){
      c.berserkT = 5; c.berserkCd = 25;
      emit(c.x, c.y, 16, '#e74c3c', 50, 150, 0.5);
    }
  }
  const berserk = c.berserkT > 0;

  // Auto-fire at nearest enemy in range. Detection range + bullet damage scale
  // with the drone's upgrade level (see applyAssistantLevel).
  c.fireCooldown -= dt;
  const range = c.detectRange || 280;
  let nearest = null, nd = range*range;
  for(const arr of enemyGrid.values()){
    for(const en of arr){
      if(en.dead) continue;
      const dd = dist2(c, en);
      if(dd < nd){ nd = dd; nearest = en; }
    }
  }
  if(nearest){
    c.angle = Math.atan2(nearest.y - c.y, nearest.x - c.x);
    if(c.fireCooldown <= 0){
      c.shotCount = (c.shotCount || 0) + 1;
      // L4-6+ MISSILES: every 3rd shot is a large-AoE explosive missile instead of
      // a dot (raw explosive bullet, mirrors the bomber bomb; gated by the cap).
      if(lvl >= 4 && c.shotCount % 3 === 0 && entities.length < 480){
        const md = (c.dmg || 3) * 2;
        entities.push({
          type:'bullet', owner:'player', x:c.x, y:c.y,
          vx:Math.cos(c.angle) * 230, vy:Math.sin(c.angle) * 230,
          angle:c.angle, radius:3, sprite:SPR.bullet_rocket,
          dmg:md, life:1.3, isGrenade:true, explosive:true, fromAlly:true,
          explodeRadius:36, explodeDmg:md, dead:false
        });
        emit(c.x, c.y, 4, '#f39c12', 30, 90, 0.25);
        if(sfx.rocket) sfx.rocket();
      } else {
        // Companion bullets are friendly to player (owner='player') so they share collision logic.
        entities.push(createBullet(c.x, c.y, c.angle, 'player', {
          sprite: SPR.bullet_companion, speed: 260, dmg: c.dmg || 3, radius: 2, life: 1.5, fromAlly: true
        }));
        emit(c.x, c.y, 1, '#aed6f1', 20, 60, 0.15);
      }
      c.fireCooldown = berserk ? c.fireRate * 0.5 : c.fireRate;
    }
  }
}

// Is `e` a friendly ally entity (can be hit by enemy bullets/melee)?
function isAlly(e){
  return e.type === 'companion' || e.type === 'henchman' || e.type === 'nunchaku'
      || e.type === 'bomber_ally' || e.type === 'poison_ally' || e.type === 'sword_ally';
}

// Unified ally damage. Respects per-entity invuln window (`hitInvuln`) and death color.
function damageAlly(a, amount){
  if(a.invuln > 0) return;
  a.hp -= amount;
  a.invuln = a.hitInvuln || 0.5;
  a.hitFlash = 0.15;
  emit(a.x, a.y, 6, '#e74c3c', 30, 90, 0.4);
  sfx.hit();
  if(a.hp <= 0 && !a.dead){
    a.dead = true;
    emit(a.x, a.y, 20, a.deathColor || '#fff', 50, 160, 0.6);
    sfx.enemyDeath();
  }
}

function updateSwordAlly(s, dt){
  if(s.invuln > 0) s.invuln -= dt;
  if(s.swingTime > 0) s.swingTime -= dt;
  if(s.attackCd > 0) s.attackCd -= dt;

  // Pick the nearest enemy (uses the spatial grid, not a full entity scan).
  let target = null, td = Infinity;
  for(const arr of enemyGrid.values()){
    for(const en of arr){
      if(en.dead) continue;
      const d2 = dist2(s, en);
      if(d2 < td){ td = d2; target = en; }
    }
  }

  if(target){
    const dx = target.x - s.x, dy = target.y - s.y;
    const d = Math.hypot(dx, dy) || 0.001;
    s.angle = Math.atan2(dy, dx);
    // Close to attack range, then stop and swing.
    const stopDist = s.attackRange - 6;
    if(d > stopDist){
      s.vx = (dx / d) * s.moveSpeed;
      s.vy = (dy / d) * s.moveSpeed;
    } else {
      s.vx *= 0.6; s.vy *= 0.6;
      if(s.attackCd <= 0){
        swordAllyAttack(s);
        s.attackCd = s.attackRate;
        s.swingTime = 0.18;
      }
    }
  } else {
    // No enemies — drift toward the player.
    const dx = player.x - s.x, dy = player.y - s.y;
    const d = Math.hypot(dx, dy);
    if(d > 18){
      s.vx = (dx / d) * s.moveSpeed * 0.6;
      s.vy = (dy / d) * s.moveSpeed * 0.6;
    } else {
      s.vx *= 0.5; s.vy *= 0.5;
    }
  }

  s.x = clamp(s.x + s.vx * dt, 6, worldW - 6);
  s.y = clamp(s.y + s.vy * dt, 6, worldH - 8);
  s.frameT += dt;
  if(s.frameT > 0.16){ s.frameT = 0; s.frame = (s.frame + 1) % 2; }
}

function swordAllyAttack(s){
  const half = s.attackArc / 2;
  let hit = false;
  for(const en of entities){
    if(en.type !== 'enemy' || en.dead) continue;
    const dx = en.x - s.x, dy = en.y - s.y;
    const d = Math.hypot(dx, dy);
    if(d > s.attackRange + en.radius) continue;
    let diff = Math.atan2(dy, dx) - s.angle;
    while(diff > Math.PI) diff -= Math.PI * 2;
    while(diff < -Math.PI) diff += Math.PI * 2;
    if(Math.abs(diff) > half) continue;
    damageEnemy(en, s.swingDmg, false);
    emit(en.x, en.y, 4, '#fff', 30, 90, 0.25);
    hit = true;
  }
  if(hit) sfx.hit();
  // Slash particles in the arc.
  for(let i = 0; i < 6; i++){
    const a = s.angle - half + (i / 5) * s.attackArc;
    const r = s.attackRange * (0.55 + Math.random() * 0.45);
    particles.length < 300 && particles.push({
      x: s.x + Math.cos(a) * r, y: s.y + Math.sin(a) * r,
      vx: Math.cos(a) * 40, vy: Math.sin(a) * 40,
      life: 0.22, maxLife: 0.22, color:'#f1c40f', size: 1
    });
  }
}

// ---- Generic melee ally (henchman, nunchaku) ----
// Chases the nearest enemy within its leash and swings in an arc; otherwise
// escorts the player. Speed tracks the player so it never falls behind.
function updateMeleeAlly(s, dt){
  if(s.invuln > 0) s.invuln -= dt;
  if(s.swingTime > 0) s.swingTime -= dt;
  if(s.attackCd > 0) s.attackCd -= dt;
  const pSpeed = player.speed * playerSpeedMult();
  const moveSpeed = Math.max(s.moveSpeed, pSpeed * 1.15);

  // ---- EVOLUTIONS (gated on s.level). effRate (swing cooldown) and arcMul (swing
  // width) are applied at the attack site below; independent pulses fire on timers. ----
  const lvl = s.level || 1;
  let effRate = s.attackRate, arcMul = 1;
  if(s.assistKey === 'henchman'){
    if(lvl >= 4){                                  // GROUND SLAM (utility): AoE + knockback
      s.slamCd -= dt;
      if(s.slamCd <= 0){ henchmanSlam(s); s.slamCd = 4; }
    }
    if(lvl >= 7){                                  // ENRAGE (offense): faster/wider + self-heal
      s.enrageCd -= dt;
      if(s.enrageT > 0) s.enrageT -= dt;
      if(s.enrageCd <= 0 && s.enrageT <= 0){ s.enrageT = 4; s.enrageCd = 12; emit(s.x, s.y, 16, '#c0392b', 50, 150, 0.5); }
      if(s.enrageT > 0){ effRate = s.attackRate * 0.6; arcMul = 1.3; s.hp = Math.min(s.maxHp, s.hp + s.maxHp * 0.05 * dt); }
    }
  } else if(s.assistKey === 'nunchaku'){
    if(lvl >= 4){                                  // WHIRLWIND (utility): full-circle + bullet clear
      s.spinCd -= dt;
      if(s.spinCd <= 0){ nunchakuWhirl(s); s.spinCd = 3.5; }
    }
    if(lvl >= 7){                                  // FLURRY (offense): double attack speed
      s.flurryCd -= dt;
      if(s.flurryT > 0) s.flurryT -= dt;
      if(s.flurryCd <= 0 && s.flurryT <= 0){ s.flurryT = 3; s.flurryCd = 10; emit(s.x, s.y, 14, '#ecf0f1', 45, 140, 0.4); }
      if(s.flurryT > 0) effRate = s.attackRate * 0.5;
    }
  }

  let target = null, td = Infinity;
  for(const arr of enemyGrid.values()){
    for(const en of arr){
      if(en.dead) continue;
      const d2 = dist2(s, en);
      if(d2 < td){ td = d2; target = en; }
    }
  }
  const leash = s.leash || 110;
  if(target && td < leash * leash){
    const dx = target.x - s.x, dy = target.y - s.y;
    const d = Math.hypot(dx, dy) || 0.001;
    s.angle = Math.atan2(dy, dx);
    const stopDist = s.attackRange - 8;
    if(d > stopDist){
      s.vx = (dx / d) * moveSpeed;
      s.vy = (dy / d) * moveSpeed;
    } else {
      s.vx *= 0.6; s.vy *= 0.6;
      if(s.attackCd <= 0){
        const baseArc = s.attackArc; s.attackArc = baseArc * arcMul;
        meleeAllyAttack(s);
        s.attackArc = baseArc;
        s.attackCd = effRate; s.swingTime = 0.2;
      }
    }
  } else {
    const tx = player.x + Math.cos(player.angle + Math.PI / 2) * 16;
    const ty = player.y + Math.sin(player.angle + Math.PI / 2) * 16;
    const dx = tx - s.x, dy = ty - s.y;
    const d = Math.hypot(dx, dy);
    if(d > 6){
      s.angle = Math.atan2(dy, dx);
      const sp = d > 60 ? moveSpeed * 1.3 : moveSpeed;
      s.vx = (dx / d) * sp;
      s.vy = (dy / d) * sp;
    } else { s.vx *= 0.5; s.vy *= 0.5; }
  }
  s.x = clamp(s.x + s.vx * dt, 6, worldW - 6);
  s.y = clamp(s.y + s.vy * dt, 6, worldH - 8);
  s.frameT += dt;
  if(s.frameT > 0.16){ s.frameT = 0; s.frame = (s.frame + 1) % 2; }
}

function meleeAllyAttack(s){
  const half = s.attackArc / 2;
  const col = s.swingColor || '#fff';
  let hit = false;
  for(const en of entities){
    if(en.type !== 'enemy' || en.dead) continue;
    const dx = en.x - s.x, dy = en.y - s.y;
    const d = Math.hypot(dx, dy);
    if(d > s.attackRange + en.radius) continue;
    let diff = Math.atan2(dy, dx) - s.angle;
    while(diff > Math.PI) diff -= Math.PI * 2;
    while(diff < -Math.PI) diff += Math.PI * 2;
    if(Math.abs(diff) > half) continue;
    damageEnemy(en, s.swingDmg, false);
    emit(en.x, en.y, 4, col, 30, 90, 0.25);
    hit = true;
  }
  if(hit) sfx.hit();
  for(let i = 0; i < 8; i++){
    const a = s.angle - half + (i / 7) * s.attackArc;
    const r = s.attackRange * (0.55 + Math.random() * 0.45);
    particles.length < 300 && particles.push({
      x: s.x + Math.cos(a) * r, y: s.y + Math.sin(a) * r,
      vx: Math.cos(a) * 40, vy: Math.sin(a) * 40,
      life: 0.24, maxLife: 0.24, color: col, size: 1
    });
  }
}

// Brute L4-6 GROUND SLAM: damage every enemy in a radius AND knock them outward
// a few px (a self-contained crowd-control pulse — no enemy-AI changes needed).
function henchmanSlam(s){
  const R = 50;
  let hit = false;
  for(const en of entities){
    if(en.type !== 'enemy' || en.dead || en.isBoss) continue;
    const dx = en.x - s.x, dy = en.y - s.y;
    const d = Math.hypot(dx, dy);
    if(d > R + en.radius) continue;
    damageEnemy(en, s.swingDmg, false);
    const k = 12 / (d || 1);   // knockback strength tapers with distance
    en.x = clamp(en.x + dx * k, 6, worldW - 6);
    en.y = clamp(en.y + dy * k, 6, worldH - 8);
    hit = true;
  }
  if(hit) sfx.hit();
  if(particles.length < 300) particles.push({ x:s.x, y:s.y, vx:0, vy:0, life:0.35, maxLife:0.35, color:'#c8923a', ring:true, r0:8, r1:R });
  emit(s.x, s.y, 8, '#c8923a', 40, 120, 0.3);
}

// Nunchaku L4-6 WHIRLWIND: one full-circle strike (temporarily 360° arc) plus a
// DEFLECT that clears nearby enemy bullets.
function nunchakuWhirl(s){
  const baseArc = s.attackArc, baseAng = s.angle;
  s.attackArc = Math.PI * 2;
  meleeAllyAttack(s);
  s.attackArc = baseArc; s.angle = baseAng;
  const R = 30;
  for(const b of entities){
    if(b.type === 'bullet' && b.owner === 'enemy' && !b.dead && dist2(s, b) < R * R) b.dead = true;
  }
  if(particles.length < 300) particles.push({ x:s.x, y:s.y, vx:0, vy:0, life:0.3, maxLife:0.3, color:'#ecf0f1', ring:true, r0:6, r1:R });
}

// ---- Bomber ally ----
// Stays near the player (fragile) and lobs a high-damage, large-radius bomb at
// the nearest enemy in range. The bomb explodes on contact OR at end of fuse.
function updateBomberAlly(s, dt){
  if(s.invuln > 0) s.invuln -= dt;
  if(s.fireCooldown > 0) s.fireCooldown -= dt;
  const pSpeed = player.speed * playerSpeedMult();
  const moveSpeed = Math.max(s.moveSpeed, pSpeed * 1.15);
  // Tuck in behind the player.
  const tx = player.x - Math.cos(player.angle) * 18;
  const ty = player.y - Math.sin(player.angle) * 18;
  const dxp = tx - s.x, dyp = ty - s.y;
  const dp = Math.hypot(dxp, dyp);
  if(dp > 6){
    const sp = dp > 60 ? moveSpeed * 1.3 : moveSpeed;
    s.vx = (dxp / dp) * sp; s.vy = (dyp / dp) * sp;
  } else { s.vx *= 0.5; s.vy *= 0.5; }
  s.x = clamp(s.x + s.vx * dt, 6, worldW - 6);
  s.y = clamp(s.y + s.vy * dt, 6, worldH - 8);
  s.frameT += dt;
  if(s.frameT > 0.16){ s.frameT = 0; s.frame = (s.frame + 1) % 2; }

  let target = null, nd = s.fireRange * s.fireRange;
  for(const arr of enemyGrid.values()){
    for(const en of arr){
      if(en.dead) continue;
      const dd = dist2(s, en);
      if(dd < nd){ nd = dd; target = en; }
    }
  }
  // ---- EVOLUTIONS (gated on s.level) ----
  const lvl = s.level || 1;
  // L7-10 CARPET BOMB: every ~12s lob a 5-bomb arc barrage (independent of normal fire).
  if(lvl >= 7){
    s.carpetCd -= dt;
    if(s.carpetCd <= 0){
      s.carpetCd = 12;
      for(let i = 0; i < 5; i++) bomberBomb(s, s.angle + (i - 2) * 0.18);
      emit(s.x, s.y, 12, '#e67e22', 45, 140, 0.4);
      if(sfx.rocket) sfx.rocket();
    }
  }
  if(target){
    s.angle = Math.atan2(target.y - s.y, target.x - s.x);
    if(s.fireCooldown <= 0){
      // L4-6+ CLUSTER: 3-bomb spread per volley instead of a single bomb.
      const shots = lvl >= 4 ? 3 : 1;
      for(let i = 0; i < shots; i++) bomberBomb(s, s.angle + (i - (shots - 1) / 2) * 0.12);
      s.fireCooldown = s.fireRate;
      emit(s.x, s.y, 4, '#e67e22', 30, 90, 0.25);
      sfx.rocket();
    }
  }
}

// Spawn one bomber bomb along `angle` (raw bullet mirroring the Soldier grenade so
// isGrenade/explodeDmg stick). Gated by the entity cap so cluster/carpet can't flood.
function bomberBomb(s, angle){
  if(entities.length >= 480) return;
  const dmg = s.bombDmg * (player.damageMult || 1) * (player.damageTime > 0 ? 2 : 1);
  entities.push({
    type:'bullet', owner:'player', x:s.x, y:s.y,
    vx:Math.cos(angle) * s.projSpeed, vy:Math.sin(angle) * s.projSpeed,
    angle, radius:3, sprite:SPR.bullet_rocket,
    dmg, life:1.1, isGrenade:true, explosive:true, fromAlly:true,
    explodeRadius:s.explodeRadius, explodeDmg:dmg, dead:false
  });
}

// ---- Poison ally ----
// Drifts onto the nearest enemy (else escorts the player) and exudes a wide,
// continuous toxic aura that damages every enemy inside it each tick.
function updatePoisonAlly(s, dt){
  if(s.invuln > 0) s.invuln -= dt;
  const pSpeed = player.speed * playerSpeedMult();
  const moveSpeed = Math.max(s.moveSpeed, pSpeed * 1.1);

  let target = null, td = Infinity;
  for(const arr of enemyGrid.values()){
    for(const en of arr){
      if(en.dead) continue;
      const d2 = dist2(s, en);
      if(d2 < td){ td = d2; target = en; }
    }
  }
  const leash = s.leash || 130;
  if(target && td < leash * leash){
    const dx = target.x - s.x, dy = target.y - s.y;
    const d = Math.hypot(dx, dy) || 0.001;
    s.angle = Math.atan2(dy, dx);
    if(d > s.auraRadius * 0.6){ s.vx = (dx / d) * moveSpeed; s.vy = (dy / d) * moveSpeed; }
    else { s.vx *= 0.6; s.vy *= 0.6; }
  } else {
    const tx = player.x + Math.cos(player.angle + Math.PI / 2) * 18;
    const ty = player.y + Math.sin(player.angle + Math.PI / 2) * 18;
    const dx = tx - s.x, dy = ty - s.y;
    const d = Math.hypot(dx, dy);
    if(d > 6){ const sp = d > 60 ? moveSpeed * 1.3 : moveSpeed; s.vx = (dx / d) * sp; s.vy = (dy / d) * sp; }
    else { s.vx *= 0.5; s.vy *= 0.5; }
  }
  s.x = clamp(s.x + s.vx * dt, 6, worldW - 6);
  s.y = clamp(s.y + s.vy * dt, 6, worldH - 8);
  s.frameT += dt;
  if(s.frameT > 0.18){ s.frameT = 0; s.frame = (s.frame + 1) % 2; }

  // ---- EVOLUTIONS (gated on s.level) ----
  const lvl = s.level || 1;
  if(s.plagueBoostT > 0) s.plagueBoostT -= dt;
  if(lvl >= 4){                                  // SPORE NOVA: periodic AoE burst
    s.novaCd -= dt;
    if(s.novaCd <= 0){ s.novaCd = 5; poisonNova(s, s.auraRadius * 1.2, s.dps * 0.8, '#27ae60'); }
  }
  if(lvl >= 7){                                  // PLAGUE: big nova + briefly boosted aura
    s.plagueCd -= dt;
    if(s.plagueCd <= 0){ s.plagueCd = 10; s.plagueBoostT = 3; poisonNova(s, s.auraRadius * 2, s.dps * 1.5, '#2ecc71'); }
  }
  // Aura DPS (boosted while a PLAGUE wave lingers).
  const dps = s.dps * (player.damageMult || 1) * (player.damageTime > 0 ? 2 : 1) * (s.plagueBoostT > 0 ? 1.5 : 1);
  for(const en of entities){
    if(en.type !== 'enemy' || en.dead) continue;
    const rr = s.auraRadius + en.radius;
    if(dist2(s, en) < rr * rr){
      damageEnemy(en, dps * dt, false);
    }
  }
  // Rising toxic puffs scattered through the aura.
  s.puffT -= dt;
  if(s.puffT <= 0){
    s.puffT = 0.05;
    const a = Math.random() * Math.PI * 2;
    const r = s.auraRadius * Math.sqrt(Math.random());
    particles.length < 300 && particles.push({
      x: s.x + Math.cos(a) * r, y: s.y + Math.sin(a) * r,
      vx: 0, vy: -6, life: 0.5, maxLife: 0.5,
      color: Math.random() < 0.5 ? '#27ae60' : '#2ecc71', size: 1
    });
  }
}

// Poison L4-6 SPORE NOVA / L7-10 PLAGUE: a one-frame AoE damage burst around the
// ally, plus an expanding toxic ring so the area reads clearly.
function poisonNova(s, radius, dmg, color){
  for(const en of entities){
    if(en.type !== 'enemy' || en.dead) continue;
    const rr = radius + en.radius;
    if(dist2(s, en) < rr * rr) damageEnemy(en, dmg, false);
  }
  if(particles.length < 300) particles.push({ x:s.x, y:s.y, vx:0, vy:0, life:0.4, maxLife:0.4, color, ring:true, r0:8, r1:radius });
  emit(s.x, s.y, 10, color, 50, 130, 0.4);
}

// ============================================================
// COMBAT
// ============================================================
function damagePlayer(amount){
  if(player.shieldHp > 0){
    player.shieldHp -= 1;
    player.invuln = 0.5;
    sfx.shieldHit();
    emit(player.x, player.y, 10, '#1abc9c', 30, 100, 0.4);
    return;
  }
  player.hp -= amount;
  player.invuln = 0.9;
  player.hitFlash = 0.15;
  emit(player.x, player.y, 8, '#e74c3c', 40, 130, 0.5);
  sfx.playerHurt();
}

function killEnemy(en){
  // Idempotency guard: killEnemy can be reached from collision + explode in the
  // same frame (a grenade hit + its blast both see the same dying enemy). Without
  // this, splitters cascade twice and the entity count balloons until the tab freezes.
  if(en._killed) return;
  en._killed = true;
  en.dead = true;
  // Universal RESOURCE-on-kill passive: refill whichever RMB pool the class actually
  // uses (Tank fuel / Soldier energy / Scout power). Only when equipped (0 otherwise).
  const rk = passiveValue('resource');
  if(rk > 0){
    if(player.maxFuel   > 0) player.fuel   = Math.min(player.maxFuel,   player.fuel   + rk);
    else if(player.maxEnergy > 0) player.energy = Math.min(player.maxEnergy, player.energy + rk);
    else if(player.maxPower  > 0) player.power  = Math.min(player.maxPower,  player.power  + rk);
  }
  const scoreMult = player.scoreTime > 0 ? 2 : 1;
  score += en.score * scoreMult;
  // Meta-progression: accrue XP + gold per kill. NOT saved per-kill (that would be
  // thousands of localStorage writes/run) — banked at the level-transition points.
  // SCHOLAR (+XP) and GREED (+gold) passives scale these when equipped.
  profile.xp   += Math.max(1, Math.ceil(en.score / XP_KILL_DIV * (1 + passiveValue('scholar'))));
  profile.gold += Math.max(0, Math.floor(en.score / GOLD_PER_KILL_DIV * (1 + passiveValue('greed'))));
  emit(en.x, en.y, en.isBoss ? 40 : 14,
       en.isBoss ? '#9b59b6' : '#c0392b', 50, 200, en.isBoss ? 0.9 : 0.6);
  if(en.isBoss){
    // Boss death drops a guaranteed special equipment
    const drops = {
      bruiser:'rapid', sniper:'shield', splitter:'multi', summoner:'damage', overlord:'pierce',
      twin:'rapid', reaper:'pierce', bomber:'damage', phantom:'multi', nemesis:'damage',
      warden:'shield', harrier:'rapid'
    };
    const drop = drops[en.kind] || 'health';
    entities.push(createPickup(en.x, en.y, drop));
    // Plus a health top-up
    entities.push(createPickup(en.x + 12, en.y, 'health'));
  }
  sfx.enemyDeath();
  // Splitter death cascade
  if(en.kind === 'splitter'){
    for(let i=0;i<2;i++){
      const a = (i/2)*Math.PI*2 + Math.random();
      const e2 = createEnemy('splitter_mid', en.x + Math.cos(a)*10, en.y + Math.sin(a)*10);
      e2.vx = Math.cos(a)*40; e2.vy = Math.sin(a)*40;
      entities.push(e2);
    }
  } else if(en.kind === 'splitter_mid'){
    for(let i=0;i<2;i++){
      const a = (i/2)*Math.PI*2 + Math.random();
      const e2 = createEnemy('splitter_mini', en.x + Math.cos(a)*6, en.y + Math.sin(a)*6);
      e2.vx = Math.cos(a)*60; e2.vy = Math.sin(a)*60;
      entities.push(e2);
    }
  }
  // Random drop from non-boss. Drops are sparser AND less varied early (see the
  // level-gate below) and ramp up at L16 / L25. The drop-RATE base is lower in phase 1
  // ("basic and sparse"), then grows; elites always drop generously. The static pool
  // weights still sum to 1.0 (validator C5) — variety is gated by a runtime filter.
  const dropPhaseBase = en.elite ? 0.55 : (levelIdx <= 14 ? 0.16 : levelIdx <= 23 ? 0.22 : 0.26);
  // SCAVENGER passive adds a flat bonus to the drop GATE only (pool weights untouched
  // -> validator C5 stays green); still clamped by DROP_GATE_MAX.
  const dropGate = Math.min(DROP_GATE_MAX, dropPhaseBase + Math.min(DROP_LVL_CAP, (profile.level - 1) * DROP_LVL_PER) + passiveValue('scavenger'));
  if(!en.isBoss && Math.random() < dropGate){
    // Drop pool. Weights MUST sum to 1.0 for the pickWeighted loop below to give
    // every entry its intended share — appending past the cumulative-1.0 mark means
    // the item never drops (the old fuel bug). ONE shared template; slot [1] is the
    // class RMB-resource canister, swapped per character via RES. Because the weights
    // are shared, EVERY class's pool sums to exactly 1.0 (validator C5). The four
    // weapon pickups are now ENHANCERS only — rapid/pierce/multi/damage.
    let kinds   = ['health','battery','rapid','pierce','multi','damage','shield','armor','speed','slowmo','score2x','magnet'];
    let weights = [ 0.14,    0.12,     0.10,   0.10,    0.10,    0.10,    0.07,    0.06,   0.07,    0.04,    0.04,      0.06 ];
    const RES = { tank:'fuel', soldier:'beverage', scout:'battery', bounty_hunter:'protein', cyborg:'isotope' };
    kinds = kinds.slice(); kinds[1] = (player && RES[player.char]) || 'battery';
    // GATED VARIETY by the level being played (kinds[0]=health, kinds[1]=class
    // resource are allowed in every phase so the filtered pool is never empty):
    //   L1-15  : basics only (health, resource, rapid, shield).
    //   L16-24 : + advanced enhancers/utility (pierce, multi, damage, speed, magnet).
    //   L25-40 : full pool (also armor, slowmo, score2x).
    let allow = null;   // null = no filter (full pool)
    if(levelIdx <= 14)      allow = new Set(['health', kinds[1], 'rapid', 'shield']);
    else if(levelIdx <= 23) allow = new Set(['health', kinds[1], 'rapid', 'shield', 'pierce', 'multi', 'damage', 'speed', 'magnet']);
    let fk = kinds, fw = weights;
    if(allow){
      fk = []; fw = [];
      for(let i = 0; i < kinds.length; i++){ if(allow.has(kinds[i])){ fk.push(kinds[i]); fw.push(weights[i]); } }
    }
    // Renormalize the surviving weights (the static arrays summed to 1.0; a filtered
    // subset sums to < 1.0, so scale the roll by the surviving total).
    const total = fw.reduce((a, b) => a + b, 0) || 1;
    const r = Math.random() * total;
    let acc = 0, pick = fk[0] || 'health';
    for(let i = 0; i < fk.length; i++){ acc += fw[i]; if(r < acc){ pick = fk[i]; break; } }
    entities.push(createPickup(en.x, en.y, pick));
  }
}

// ============================================================
// ENEMY AI
// ============================================================
// Keep bosses engaged: bound how far ANY boss may sit from the player. After the
// per-kind AI moves the boss, if it has drifted/teleported beyond BOSS_LEASH we hard-
// clamp it back onto the leash circle, so late-game fights never become multi-second
// cross-arena chases. The AIs still strafe/flee freely WITHIN the leash radius.
const BOSS_LEASH = 300;
function bossLeash(e){
  if(!e || !e.isBoss) return;
  const dx = e.x - player.x, dy = e.y - player.y;
  const d = Math.hypot(dx, dy);
  if(d > BOSS_LEASH){
    const f = BOSS_LEASH / d;
    e.x = player.x + dx * f;
    e.y = player.y + dy * f;
  }
}
function updateEnemy(e, dt){
  if(e.invulnT > 0) e.invulnT -= dt;   // tick down any brief-invincibility shield
  if(e.hitFxT > 0) e.hitFxT -= dt;     // throttle window for per-hit impact particles
  if(e.kind === 'bruiser')  { updateBruiser(e, dt); return bossLeash(e); }
  if(e.kind === 'sniper')   { updateSniper(e, dt); return bossLeash(e); }
  if(e.kind === 'splitter' || e.kind === 'splitter_mid') { updateSplitter(e, dt); return bossLeash(e); }
  if(e.kind === 'splitter_mini') return updateSeek(e, dt);
  if(e.kind === 'summoner') { updateSummoner(e, dt); return bossLeash(e); }
  if(e.kind === 'overlord') { updateOverlord(e, dt); return bossLeash(e); }
  if(e.kind === 'twin')     { updateTwin(e, dt); return bossLeash(e); }
  if(e.kind === 'reaper')   { updateReaper(e, dt); return bossLeash(e); }
  if(e.kind === 'bomber')   { updateBomber(e, dt); return bossLeash(e); }
  if(e.kind === 'phantom')  { updatePhantom(e, dt); return bossLeash(e); }
  if(e.kind === 'nemesis')  { updateNemesis(e, dt); return bossLeash(e); }
  if(e.kind === 'warden')   { updateWarden(e, dt); return bossLeash(e); }
  if(e.kind === 'harrier')  { updateHarrier(e, dt); return bossLeash(e); }
  if(e.kind === 'shooter')  return updateShooter(e, dt);
  if(e.kind === 'charger')  return updateCharger(e, dt);
  if(e.kind === 'exploder') return updateExploder(e, dt);
  if(e.kind === 'swarmer')  return updateSwarmer(e, dt);
  if(e.kind === 'weaver')   return updateWeaver(e, dt);
  if(e.kind === 'spitter')  return updateSpitter(e, dt);
  return updateSeek(e, dt);
}

function updateCharger(e, dt){
  // 4 phases: 0=stalk slow, 1=telegraph (lock aim), 2=charge straight, 3=recover
  e.phaseT += dt;
  if(e.phase === 0){
    const a = Math.atan2(player.y - e.y, player.x - e.x);
    e.vx = Math.cos(a) * e.speed * 0.5;
    e.vy = Math.sin(a) * e.speed * 0.5;
    e.x += e.vx * dt; e.y += e.vy * dt;
    if(e.phaseT > 1.2){ e.phase = 1; e.phaseT = 0; e.telegraph = 0.6;
      e.chargeAngle = Math.atan2(player.y - e.y, player.x - e.x);
    }
  } else if(e.phase === 1){
    e.vx = 0; e.vy = 0;
    e.telegraph = Math.max(0, e.telegraph - dt);
    if(e.phaseT > 0.6){ e.phase = 2; e.phaseT = 0; }
  } else if(e.phase === 2){
    const sp = e.speed * 4.5;
    e.vx = Math.cos(e.chargeAngle) * sp;
    e.vy = Math.sin(e.chargeAngle) * sp;
    e.x += e.vx * dt; e.y += e.vy * dt;
    emit(e.x, e.y, 1, '#e74c3c', 10, 40, 0.2);
    if(e.phaseT > 0.55){ e.phase = 3; e.phaseT = 0; }
  } else {
    e.vx *= 0.85; e.vy *= 0.85;
    e.x += e.vx * dt; e.y += e.vy * dt;
    if(e.phaseT > 0.8){ e.phase = 0; e.phaseT = 0; }
  }
  // animation frames
  e.frameT += dt;
  if(e.frameT > 0.12){ e.frameT = 0; e.frame = (e.frame + 1) % 2; }
}

function updateExploder(e, dt){
  const dx = player.x - e.x, dy = player.y - e.y;
  const d = Math.hypot(dx, dy);
  // Pulse faster as it nears the player
  const a = Math.atan2(dy, dx);
  e.vx = Math.cos(a) * e.speed;
  e.vy = Math.sin(a) * e.speed;
  e.x += e.vx * dt; e.y += e.vy * dt;
  if(d < 14){
    // Detonate on contact: blast + die
    explode(e.x, e.y, 26, 2);
    e.dead = true;
    emit(e.x, e.y, 14, '#f39c12', 50, 160, 0.45);
  }
  // Fast animation = "pulsing"
  e.frameT += dt;
  if(e.frameT > (d < 60 ? 0.06 : 0.16)){ e.frameT = 0; e.frame = (e.frame + 1) % 2; }
}

function updateSwarmer(e, dt){
  const dx = player.x - e.x, dy = player.y - e.y;
  const a = Math.atan2(dy, dx);
  // Zig-zag perpendicular to direction
  e.wobble = (e.wobble || 0) + dt * 7;
  const offset = Math.sin(e.wobble) * 0.55;
  const moveA = a + offset;
  e.vx = Math.cos(moveA) * e.speed;
  e.vy = Math.sin(moveA) * e.speed;
  e.x += e.vx * dt; e.y += e.vy * dt;
  e.frameT += dt;
  if(e.frameT > 0.1){ e.frameT = 0; e.frame = (e.frame + 1) % 2; }
}

// WEAVER: evasive dodger. If a player bullet is bearing down, juke perpendicular to its
// path (away from it); otherwise close in on a weaving sine path so it's hard to lead.
function updateWeaver(e, dt){
  const a = Math.atan2(player.y - e.y, player.x - e.x);
  // Find the nearest incoming player bullet within ~90px.
  let threat = null, nd = 90 * 90;
  for(const b of entities){
    if(b.type !== 'bullet' || b.owner !== 'player' || b.dead) continue;
    const d2 = dist2(b, e);
    if(d2 < nd){ nd = d2; threat = b; }
  }
  let mvx, mvy;
  if(threat){
    // Dodge: step to whichever side of the bullet's velocity line we're already on.
    const ba = Math.atan2(threat.vy, threat.vx);
    const side = ((e.x - threat.x) * Math.sin(ba) - (e.y - threat.y) * Math.cos(ba)) >= 0 ? 1 : -1;
    const da = ba + side * Math.PI / 2;
    mvx = Math.cos(da) * e.speed * 1.4; mvy = Math.sin(da) * e.speed * 1.4;
    e.dodgeCd = 0.25;   // keep juking briefly after the bullet passes
  } else if((e.dodgeCd = (e.dodgeCd || 0) - dt) > 0){
    mvx = Math.cos(a + Math.PI / 2) * e.speed; mvy = Math.sin(a + Math.PI / 2) * e.speed;
  } else {
    e.wobble = (e.wobble || 0) + dt * 5;
    const wa = a + Math.sin(e.wobble) * 0.7;
    mvx = Math.cos(wa) * e.speed; mvy = Math.sin(wa) * e.speed;
  }
  e.vx = mvx; e.vy = mvy;
  e.x += e.vx * dt; e.y += e.vy * dt;
  e.x = clamp(e.x, 6, worldW - 6); e.y = clamp(e.y, 6, worldH - 8);
  e.frameT += dt;
  if(e.frameT > 0.1){ e.frameT = 0; e.frame = (e.frame + 1) % 2; }
}

// SPITTER: hazard-dropper. Keeps mid-range and periodically lays a telegraphed toxic
// ground pool (reuses the boss groundFields system — a warn ring, then lethal AoE).
function updateSpitter(e, dt){
  const a = Math.atan2(player.y - e.y, player.x - e.x);
  const d = Math.hypot(player.x - e.x, player.y - e.y);
  if(d > 90){ e.vx = Math.cos(a) * e.speed; e.vy = Math.sin(a) * e.speed; }
  else { e.vx = -Math.sin(a) * e.speed * 0.6; e.vy = Math.cos(a) * e.speed * 0.6; }
  e.x += e.vx * dt; e.y += e.vy * dt;
  e.x = clamp(e.x, 6, worldW - 6); e.y = clamp(e.y, 6, worldH - 8);
  e.poolCd -= dt;
  if(e.poolCd <= 0 && groundFields.length < 12){
    groundFields.push({ x: e.x, y: e.y, radius: 24, life: 2.5, maxLife: 2.5, warn: 0.6 });
    emit(e.x, e.y, 10, '#27ae60', 16, 60, 0.5);
    e.poolCd = rand(2.0, 3.2);
  }
  e.frameT += dt;
  if(e.frameT > 0.14){ e.frameT = 0; e.frame = (e.frame + 1) % 2; }
}

function updateSeek(e, dt){
  const a = Math.atan2(player.y - e.y, player.x - e.x);
  e.vx = Math.cos(a) * e.speed;
  e.vy = Math.sin(a) * e.speed;
  e.x += e.vx * dt; e.y += e.vy * dt;
  if(Math.abs(e.vx) + Math.abs(e.vy) > 5){
    e.frameT += dt;
    if(e.frameT > 0.18){ e.frameT = 0; e.frame = (e.frame + 1) % 2; }
  }
}

function updateShooter(e, dt){
  const d = Math.hypot(player.x - e.x, player.y - e.y);
  if(d > 110){
    const a = Math.atan2(player.y - e.y, player.x - e.x);
    e.vx = Math.cos(a) * e.speed;
    e.vy = Math.sin(a) * e.speed;
  } else {
    e.vx = 0; e.vy = 0;
    e.fireCooldown -= dt;
    if(e.fireCooldown <= 0){
      const a = Math.atan2(player.y - e.y, player.x - e.x);
      entities.push(createBullet(e.x, e.y, a, 'enemy', {speed:150}));
      e.fireCooldown = 1.6;
      emit(e.x, e.y, 2, '#e74c3c', 20, 60, 0.2);
    }
  }
  e.x += e.vx * dt; e.y += e.vy * dt;
  if(Math.abs(e.vx) + Math.abs(e.vy) > 5){
    e.frameT += dt;
    if(e.frameT > 0.18){ e.frameT = 0; e.frame = (e.frame + 1) % 2; }
  }
}

// BRUISER: chase + periodic charge bursts
function updateBruiser(e, dt){
  e.phaseT += dt;
  const a = Math.atan2(player.y - e.y, player.x - e.x);
  // Charging phase
  if(e.phase === 1){
    e.vx = Math.cos(e.chargeAngle) * e.speed * 3.2;
    e.vy = Math.sin(e.chargeAngle) * e.speed * 3.2;
    if(e.phaseT > 0.9){ e.phase = 0; e.phaseT = 0; e.fireCooldown = 1.6; }
  } else {
    e.vx = Math.cos(a) * e.speed;
    e.vy = Math.sin(a) * e.speed;
    e.fireCooldown -= dt;
    if(e.fireCooldown <= 0){
      // Telegraph then charge
      e.chargeAngle = a;
      e.phase = 1; e.phaseT = 0;
      emit(e.x, e.y, 12, '#f1c40f', 40, 120, 0.3);
    }
    // Periodic 4-bullet cross
    if(Math.floor(e.phaseT*2) % 4 === 3 && !e.firedCross){
      e.firedCross = true;
      for(let i=0;i<4;i++){
        const aa = a + (i/4)*Math.PI*2;
        entities.push(createBullet(e.x, e.y, aa, 'enemy', {speed:120}));
      }
    } else if(Math.floor(e.phaseT*2) % 4 !== 3){
      e.firedCross = false;
    }
  }
  e.x += e.vx * dt; e.y += e.vy * dt;
  e.x = clamp(e.x, 14, worldW-14);
  e.y = clamp(e.y, 14, worldH-16);
}

// SNIPER: maintain distance, aimed fast bullets, teleport occasionally
function updateSniper(e, dt){
  e.phaseT += dt;
  const dx = player.x - e.x, dy = player.y - e.y;
  const d = Math.hypot(dx, dy);
  const a = Math.atan2(dy, dx);
  const ideal = 110;
  if(d < ideal - 20){
    e.vx = -Math.cos(a) * e.speed * 1.2;
    e.vy = -Math.sin(a) * e.speed * 1.2;
  } else if(d > ideal + 20){
    e.vx = Math.cos(a) * e.speed;
    e.vy = Math.sin(a) * e.speed;
  } else {
    // Strafe
    e.vx = -Math.sin(a) * e.speed * 0.6;
    e.vy = Math.cos(a) * e.speed * 0.6;
  }
  e.fireCooldown -= dt;
  if(e.fireCooldown <= 0){
    // Telegraphed shot
    if(!e.telegraphActive){
      e.telegraphActive = true;
      e.telegraphAngle = a;
      e.fireCooldown = 0.35;
    } else {
      entities.push(createBullet(e.x, e.y, e.telegraphAngle, 'enemy', {speed:260}));
      emit(e.x, e.y, 4, '#1abc9c', 20, 80, 0.2);
      e.telegraphActive = false;
      e.fireCooldown = 1.4;
    }
  }
  // Teleport every ~4.5s — but reappear NEAR the player (random angle, mid-range)
  // instead of a random arena cell, so it can't blink off across a 3x/4x map.
  if(e.phaseT > 4.5){
    e.phaseT = 0;
    emit(e.x, e.y, 18, '#8e44ad', 30, 120, 0.5);
    const ta = rand(0, TAU), tr = rand(120, 200);
    e.x = clamp(player.x + Math.cos(ta) * tr, 40, worldW-40);
    e.y = clamp(player.y + Math.sin(ta) * tr, 40, worldH-40);
    emit(e.x, e.y, 18, '#8e44ad', 30, 120, 0.5);
    e.telegraphActive = false;
    sfx.teleport();
  }
  e.x += e.vx * dt; e.y += e.vy * dt;
  e.x = clamp(e.x, 14, worldW-14);
  e.y = clamp(e.y, 14, worldH-16);
}

// SPLITTER (and splitter_mid): chase + ring bursts
function updateSplitter(e, dt){
  const a = Math.atan2(player.y - e.y, player.x - e.x);
  e.vx = Math.cos(a) * e.speed;
  e.vy = Math.sin(a) * e.speed;
  e.x += e.vx * dt; e.y += e.vy * dt;
  e.x = clamp(e.x, 12, worldW-12);
  e.y = clamp(e.y, 12, worldH-14);
  if(e.kind === 'splitter'){
    e.fireCooldown -= dt;
    if(e.fireCooldown <= 0){
      const n = 10;
      for(let i=0;i<n;i++){
        const aa = (i/n)*Math.PI*2 + e.phaseT;
        entities.push(createBullet(e.x, e.y, aa, 'enemy', {speed:100}));
      }
      e.fireCooldown = 2.4;
    }
    e.phaseT += dt * 0.6;
  }
}

// SUMMONER: keep distance, summon adds, ring blasts
function updateSummoner(e, dt){
  e.phaseT += dt;
  const dx = player.x - e.x, dy = player.y - e.y;
  const d = Math.hypot(dx, dy);
  const a = Math.atan2(dy, dx);
  const ideal = 100;
  if(d < ideal){
    e.vx = -Math.cos(a) * e.speed;
    e.vy = -Math.sin(a) * e.speed;
  } else {
    // Strafe with a slight inward bias so it re-approaches rather than orbiting away.
    e.vx = -Math.sin(a) * e.speed * 0.7 + Math.cos(a) * e.speed * 0.25;
    e.vy = Math.cos(a) * e.speed * 0.7 + Math.sin(a) * e.speed * 0.25;
  }
  e.fireCooldown -= dt;
  if(e.fireCooldown <= 0){
    // Alternate: summon vs ring blast
    if(e.summonNext){
      const choices = ['runner','shooter','grunt'];
      const k = choices[Math.floor(Math.random()*choices.length)];
      spawnEnemyAtEdge(k);
      emit(e.x, e.y, 8, '#f1c40f', 40, 110, 0.3);
    } else {
      const n = 8;
      for(let i=0;i<n;i++){
        const aa = (i/n)*Math.PI*2 + e.phaseT*0.3;
        entities.push(createBullet(e.x, e.y, aa, 'enemy', {speed:120}));
      }
    }
    e.summonNext = !e.summonNext;
    e.fireCooldown = 2.2;
  }
  e.x += e.vx * dt; e.y += e.vy * dt;
  e.x = clamp(e.x, 16, worldW-16);
  e.y = clamp(e.y, 16, worldH-18);
}

// OVERLORD: 3-phase
function updateOverlord(boss, dt){
  boss.phaseT += dt;
  if(levelIdx >= 21) bossInvuln(boss, dt);   // L22+: brief invincibility shield
  if(levelIdx >= 23) bossHeal(boss, dt);     // L24+: periodic self-heal
  if(boss.phaseT > 3){
    boss.phaseT = 0;
    boss.phase = (boss.phase + 1) % 3;
    boss.fireCooldown = 0.3;
  }
  const a = Math.atan2(player.y - boss.y, player.x - boss.x);
  let tvx = Math.cos(a) * boss.speed;
  let tvy = Math.sin(a) * boss.speed;
  if(boss.phase === 0){
    boss.fireCooldown -= dt;
    if(boss.fireCooldown <= 0){
      for(let i = 0; i < 12; i++){
        const aa = (i / 12) * Math.PI * 2 + boss.phaseT * 0.5;
        entities.push(createBullet(boss.x, boss.y, aa, 'enemy', {speed:120}));
      }
      boss.fireCooldown = 1.3;
    }
  } else if(boss.phase === 1){
    tvx *= 2.6; tvy *= 2.6;
    boss.fireCooldown -= dt;
    if(boss.fireCooldown <= 0){
      // 3-bullet spread aimed at player
      for(let i=-1;i<=1;i++){
        entities.push(createBullet(boss.x, boss.y, a + i*0.18, 'enemy', {speed:160}));
      }
      boss.fireCooldown = 0.7;
    }
  } else {
    boss.fireCooldown -= dt;
    if(boss.fireCooldown <= 0){
      const k = Math.random() < 0.5 ? 'grunt' : 'shooter';
      spawnEnemyAtEdge(k);
      boss.fireCooldown = 1.2;
    }
  }
  boss.vx = tvx; boss.vy = tvy;
  boss.x += boss.vx * dt;
  boss.y += boss.vy * dt;
  boss.x = clamp(boss.x, 18, worldW - 18);
  boss.y = clamp(boss.y, 18, worldH - 22);
}

// TWIN STRIKER (L6): dual-pattern chaser — alternates dash slash and twin sideshot bursts.
function updateTwin(e, dt){
  e.phaseT += dt;
  const a = Math.atan2(player.y - e.y, player.x - e.x);
  if(e.phase === 1){
    // Dash forward in chargeAngle for ~0.8s
    e.vx = Math.cos(e.chargeAngle) * e.speed * 3.0;
    e.vy = Math.sin(e.chargeAngle) * e.speed * 3.0;
    if(e.phaseT > 0.7){ e.phase = 0; e.phaseT = 0; e.fireCooldown = 1.0; }
  } else {
    // Strafing approach + periodic twin-bullet bursts at perpendicular angles
    e.vx = Math.cos(a) * e.speed * 0.9 - Math.sin(a) * e.speed * 0.4;
    e.vy = Math.sin(a) * e.speed * 0.9 + Math.cos(a) * e.speed * 0.4;
    e.fireCooldown -= dt;
    if(e.fireCooldown <= 0){
      if(Math.random() < 0.45){
        // Charge telegraph then dash
        e.chargeAngle = a;
        e.phase = 1; e.phaseT = 0;
        emit(e.x, e.y, 14, '#e67e22', 40, 130, 0.3);
      } else {
        // Twin-blade burst: two parallel bullets either side of aim
        const off = 0.35;
        for(let k=-1;k<=1;k+=2){
          entities.push(createBullet(e.x + Math.cos(a + Math.PI/2)*k*6, e.y + Math.sin(a + Math.PI/2)*k*6,
                                     a + k*off, 'enemy', {speed:170}));
        }
        e.fireCooldown = 1.0;
      }
    }
  }
  e.x += e.vx * dt; e.y += e.vy * dt;
  e.x = clamp(e.x, 14, worldW - 14);
  e.y = clamp(e.y, 14, worldH - 16);
}

// REAPER (L7): high-speed dasher, leaves slash-arcs behind. Cycle: stalk → dash → cooldown.
function updateReaper(e, dt){
  e.phaseT += dt;
  if(levelIdx >= 30) bossGasBomb(e, dt);     // L31+: poison-gas bombs
  if(levelIdx >= 32){                         // L33+: spawn weak clones of itself
    e.cloneCd = (e.cloneCd || 0) - dt;
    if(e.cloneCd <= 0){ e.cloneCd = 6; bossSpawnClone(e); }
  }
  const a = Math.atan2(player.y - e.y, player.x - e.x);
  if(e.phase === 1){
    // Mid-dash: travel fast, shed sparks, and phase out (brief invincibility).
    e.invulnT = Math.max(e.invulnT || 0, 0.2);
    e.vx = Math.cos(e.chargeAngle) * e.speed * 4.0;
    e.vy = Math.sin(e.chargeAngle) * e.speed * 4.0;
    emit(e.x, e.y, 2, '#27ae60', 20, 60, 0.25);
    if(e.phaseT > 0.55){ e.phase = 2; e.phaseT = 0; }
  } else if(e.phase === 2){
    // Post-dash recovery + ring slash
    e.vx *= 0.85; e.vy *= 0.85;
    if(e.phaseT > 0.2 && !e.slashed){
      e.slashed = true;
      const n = 6;
      for(let i=0;i<n;i++){
        const aa = (i/n)*Math.PI*2 + e.phaseT;
        entities.push(createBullet(e.x, e.y, aa, 'enemy', {speed:130}));
      }
    }
    if(e.phaseT > 0.9){ e.phase = 0; e.phaseT = 0; e.slashed = false; e.fireCooldown = 0.7; }
  } else {
    // Approach in a curve
    e.vx = Math.cos(a) * e.speed * 1.1 + Math.sin(a) * e.speed * 0.5;
    e.vy = Math.sin(a) * e.speed * 1.1 - Math.cos(a) * e.speed * 0.5;
    e.fireCooldown -= dt;
    if(e.fireCooldown <= 0){
      e.chargeAngle = a;
      e.phase = 1; e.phaseT = 0;
      emit(e.x, e.y, 16, '#27ae60', 50, 150, 0.35);
    }
  }
  e.x += e.vx * dt; e.y += e.vy * dt;
  e.x = clamp(e.x, 14, worldW - 14);
  e.y = clamp(e.y, 14, worldH - 16);
}

// BOMBARDIER (L8): slow turret — fires homing missiles (slow-turn) + ring bursts.
function updateBomber(e, dt){
  e.phaseT += dt;
  const dx = player.x - e.x, dy = player.y - e.y;
  const d = Math.hypot(dx, dy);
  const a = Math.atan2(dy, dx);
  // Back off only when point-blank; otherwise advance TOWARD the player (slowly) so the
  // slow turret stays engaged instead of drifting to the (now huge) arena center.
  if(d < 70){ e.vx = -Math.cos(a) * e.speed; e.vy = -Math.sin(a) * e.speed; }
  else      { e.vx = Math.cos(a) * e.speed * 0.5; e.vy = Math.sin(a) * e.speed * 0.5; }
  e.fireCooldown -= dt;
  if(e.fireCooldown <= 0){
    if(e.firePhase % 3 === 2){
      // Ring of slow shells
      const n = 12;
      for(let i=0;i<n;i++){
        const aa = (i/n)*Math.PI*2 + e.phaseT*0.4;
        entities.push(createBullet(e.x, e.y, aa, 'enemy', {speed:90}));
      }
    } else {
      // Volley of 3 homing missiles (enemy-side homing)
      for(let i=-1;i<=1;i++){
        entities.push(createBullet(e.x, e.y, a + i*0.4, 'enemy', {
          speed: 110, homing: true, life: 3.5, sprite: SPR.bullet_homing, radius: 2
        }));
      }
      emit(e.x, e.y, 6, '#e67e22', 40, 110, 0.3);
    }
    e.firePhase = (e.firePhase || 0) + 1;
    e.fireCooldown = 1.2;
  }
  e.x += e.vx * dt; e.y += e.vy * dt;
  e.x = clamp(e.x, 16, worldW - 16);
  e.y = clamp(e.y, 16, worldH - 20);
}

// PHANTOM (L9): teleporting summoner of clones. Real boss is darker; clones flicker.
function updatePhantom(e, dt){
  e.phaseT += dt;
  if(levelIdx >= 36) bossGasBomb(e, dt);            // L37+: poison-gas bombs
  if(levelIdx >= 37) bossHeal(e, dt);               // L38+: self-heal
  if(levelIdx >= 38) bossSummonExploders(e, dt, 3); // L39+: exploding-minion packs
  const dx = player.x - e.x, dy = player.y - e.y;
  const d = Math.hypot(dx, dy);
  const a = Math.atan2(dy, dx);
  // Keep distance and strafe (tighter than before, with an inward bias so it presses in)
  if(d < 75){ e.vx = -Math.cos(a) * e.speed; e.vy = -Math.sin(a) * e.speed; }
  else { e.vx = -Math.sin(a) * e.speed * 0.7 + Math.cos(a) * e.speed * 0.3; e.vy = Math.cos(a) * e.speed * 0.7 + Math.sin(a) * e.speed * 0.3; }
  e.fireCooldown -= dt;
  if(e.fireCooldown <= 0){
    // Spiral spray
    const n = 5;
    for(let i=0;i<n;i++){
      const aa = a + (i - (n-1)/2)*0.22 + Math.sin(e.phaseT*2)*0.3;
      entities.push(createBullet(e.x, e.y, aa, 'enemy', {speed:140}));
    }
    e.fireCooldown = 1.2;
  }
  // Teleport every ~3.8s, summon a pair of runner adds on arrival — reappear NEAR the
