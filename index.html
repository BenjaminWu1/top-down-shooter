function guideButtonRect(){ return { x: 8, y: 8, w: 56, h: 16 }; }

// Geometry helper shared by drawMenu + handleMenu so click targets stay in sync.
function levelBoxRect(i){
  // 40 levels in an 8x5 grid. 26x15 boxes still fit above the HIGH SCORE line
  // at y=215; the 8-wide row spans 222px, centered with comfortable margins.
  const cols = 8, rows = 5;
  const bw = 26, bh = 15, gap = 2;
  const totalW = cols * bw + (cols - 1) * gap;
  const xs = Math.floor((W - totalW) / 2);
  const ys = 124;
  const col = i % cols, row = Math.floor(i / cols);
  return { x: xs + col * (bw + gap), y: ys + row * (bh + gap), w: bw, h: bh };
}

// ============================================================
// PROFILE BAR + SHOP (meta-progression UI)
// ============================================================
// PARAMETERS button: same right edge / width as the profile bar (drawProfileBar uses
// bw=96, x=W-96-8), sitting just BELOW its COINS line (which ends ~y=31).
function parametersButtonRect(){ return { x: W - 96 - 8, y: 34, w: 96, h: 14 }; }
// SHOP button: stacked directly UNDER the PARAMETERS button (same x/width), just below it.
function shopButtonRect(){ return { x: W - 96 - 8, y: 51, w: 96, h: 14 }; }

// Persistent strip flush in the TOP-RIGHT corner on every non-game screen:
// LV + the XP bar (DARK fill = current XP, LIGHT = remaining to next level), with
// the COINS total — a specific number — on its own line just below the XP bar.
// (The GUIDE button now lives in the top-LEFT corner, so this owns the right.)
function drawProfileBar(){
  const bw = 96, x = W - bw - 8, yTop = 7;
  // Level — right-aligned to the bar's right edge (same edge as COINS below).
  ctx.textAlign = 'right';
  ctx.font = 'bold 8px monospace';
  ctx.fillStyle = '#f1c40f';
  ctx.fillText('LV ' + profile.level, x + bw, yTop + 7);
  // XP bar.
  const need = xpToNext(profile.level);
  const frac = profile.level >= LEVEL_CAP ? 1 : clamp(profile.xp / need, 0, 1);
  const by = yTop + 11, bh = 4;
  ctx.fillStyle = '#e8d27a';                            // LIGHT = remaining XP needed
  ctx.fillRect(x, by, bw, bh);
  ctx.fillStyle = '#5a4708';                            // DARK = current XP
  ctx.fillRect(x, by, Math.floor(bw * frac), bh);
  ctx.strokeStyle = '#7a5006';
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, by + 0.5, bw - 1, bh - 1);
  // Coins — specific number — on the line below the XP bar, right-aligned.
  ctx.textAlign = 'right';
  ctx.font = 'bold 8px monospace';
  ctx.fillStyle = '#f5d76e';
  ctx.fillText('COINS: ' + profile.gold, x + bw, by + bh + 9);
  ctx.textAlign = 'center';
}

// ---- SHOP (ARMORY) ----
const ASSISTANT_COST = { drone:0, henchman:200, nunchaku:280, bomber:320, poison:300 };
// Drone is owned by default but listed so it (like the rest) can be UPGRADED here.
const SHOP_ASSIST_ORDER = ['drone','henchman','nunchaku','bomber','poison'];
let shopTab = 'skills';      // 'skills' | 'allies' | 'passives'
let shopMsgUntil = 0;        // stateTime until which the flash shows
let shopMsgText = 'NOT ENOUGH GOLD';  // the flash message (gold / slots)
let shopHoverSkill = null;   // skill id under the cursor (skills tab) -> bottom detail panel
let shopHoverPassive = null; // passive id under the cursor (passives tab) -> bottom detail panel
let paramChar = 'soldier';   // which class the PARAMETERS screen is currently showing

const SHOP_TABS = [['skills','SKILLS'], ['allies','ASSISTANTS'], ['passives','PASSIVES']];
function shopTabRect(i){
  const w = 78, gap = 6, n = SHOP_TABS.length, total = n * w + (n - 1) * gap, xs = Math.floor((W - total) / 2);
  return { x: xs + i * (w + gap), y: 26, w, h: 14 };
}
function shopCardRect(i){
  const cw = 86, ch = 46, gap = 6, cols = 5;
  const totalW = cols * cw + (cols - 1) * gap;
  const xs = Math.floor((W - totalW) / 2);
  const col = i % cols, row = Math.floor(i / cols);
  return { x: xs + col * (cw + gap), y: 52 + row * (ch + 6), w: cw, h: ch };
}
// Assistants tab uses TALLER cards (the 5 allies fit on one row) so each can show its
// level-scaled stat block (HP / DMG / RNG / ROF) above the buy/upgrade price.
function shopAssistCardRect(i){
  const cw = 90, ch = 112, gap = 6, cols = 5;
  const totalW = cols * cw + (cols - 1) * gap;
  const xs = Math.floor((W - totalW) / 2);
  const col = i % cols, row = Math.floor(i / cols);
  return { x: xs + col * (cw + gap), y: 50 + row * (ch + 6), w: cw, h: ch };
}
// Passives tab: 4 cols x 2 rows of medium cards, each with a bottom EQUIP toggle strip.
function shopPassiveCardRect(i){
  const cw = 108, ch = 78, gap = 6, cols = 4;
  const totalW = cols * cw + (cols - 1) * gap;
  const xs = Math.floor((W - totalW) / 2);
  const col = i % cols, row = Math.floor(i / cols);
  return { x: xs + col * (cw + gap), y: 50 + row * (ch + 6), w: cw, h: ch };
}
// The EQUIP/EQUIPPED toggle button = the bottom strip of a passive card (checked first
// in handleShop, so a click there toggles equip instead of buying/upgrading).
function shopPassiveEquipRect(i){ const r = shopPassiveCardRect(i); return { x: r.x + 8, y: r.y + r.h - 15, w: r.w - 16, h: 12 }; }
// The card rect for shop item `i` depends on the active tab.
function shopItemRect(i){
  return shopTab === 'allies' ? shopAssistCardRect(i)
       : shopTab === 'passives' ? shopPassiveCardRect(i)
       : shopCardRect(i);
}

// PASSIVES tab body: 4x2 grid of cards (name / level + bar / current->next effect /
// buy-or-upgrade price / EQUIP toggle), plus the "ACTIVE n/max" slot indicator.
function drawPassiveShop(){
  shopHoverPassive = null;
  const slots = maxPassiveSlots();
  const active = (profile.equippedPassives || []).length;
  for(let i = 0; i < PASSIVE_ORDER.length; i++){
    const id = PASSIVE_ORDER[i], p = PASSIVES[id];
    const r = shopPassiveCardRect(i), eqR = shopPassiveEquipRect(i);
    const lvl = passiveLevel(id);              // 0 = unowned
    const owned = lvl > 0, maxed = lvl >= PASSIVE_MAX_LEVEL, equipped = passiveEquipped(id);
    const cost = owned ? (maxed ? 0 : passiveUpgradeCost(id)) : PASSIVE_BUY_BASE;
    const afford = profile.gold >= cost;
    const hov = clickedRect(r.x, r.y, r.w, r.h);
    if(hov) shopHoverPassive = id;
    const col = p.color;
    ctx.fillStyle = equipped ? '#16241c' : (hov && !maxed && afford ? '#23303f' : '#141822');
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = equipped ? '#2ecc71' : col;
    ctx.lineWidth = hov ? 2 : 1;
    ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);
    ctx.textAlign = 'center';
    ctx.fillStyle = col; ctx.font = 'bold 9px monospace';
    ctx.fillText(p.label, r.x + r.w/2, r.y + 12);
    ctx.font = 'bold 7px monospace';
    if(owned){
      ctx.fillStyle = '#f1c40f';
      ctx.fillText('LV ' + lvl + ' / ' + PASSIVE_MAX_LEVEL, r.x + r.w/2, r.y + 23);
      const bx = r.x + 12, bw2 = r.w - 24, byy = r.y + 27, bhh = 3;
      ctx.fillStyle = '#2a2a30'; ctx.fillRect(bx, byy, bw2, bhh);
      ctx.fillStyle = col; ctx.fillRect(bx, byy, Math.round(bw2 * lvl / PASSIVE_MAX_LEVEL), bhh);
    } else {
      ctx.fillStyle = '#7f8c8d'; ctx.fillText('— NOT OWNED —', r.x + r.w/2, r.y + 23);
    }
    // current -> next effect line
    ctx.font = 'bold 7px monospace'; ctx.fillStyle = '#cfd8e3';
    let effLine;
    if(!owned)      effLine = 'L1: ' + passiveBlurb(id, 1);
    else if(maxed)  effLine = 'MAX: ' + passiveBlurb(id, lvl);
    else            effLine = passiveBlurb(id, lvl) + ' -> ' + passiveBlurb(id, lvl + 1);
    ctx.fillText(effLine, r.x + r.w/2, r.y + 40);
    // price line
    ctx.font = 'bold 8px monospace';
    if(maxed){ ctx.fillStyle = '#2ecc71'; ctx.fillText('MAX LV', r.x + r.w/2, r.y + 52); }
    else { ctx.fillStyle = afford ? '#f5d76e' : '#7d6608'; ctx.fillText((owned ? 'UP  G ' : 'BUY G ') + cost, r.x + r.w/2, r.y + 52); }
    // Equip STATUS (read-only here — equipping is done on the CHARACTER SELECT screen).
    ctx.font = 'bold 7px monospace';
    if(equipped){ ctx.fillStyle = '#2ecc71'; ctx.fillText('✓ EQUIPPED', r.x + r.w/2, eqR.y + 9); }
    else if(owned){ ctx.fillStyle = '#5d6d7e'; ctx.fillText('EQUIP ON CHAR-SEL', r.x + r.w/2, eqR.y + 9); }
  }
  ctx.textAlign = 'center'; ctx.font = 'bold 9px monospace';
  ctx.fillStyle = active >= slots ? '#f5d76e' : '#9fb4c9';
  ctx.fillText('EQUIPPED: ' + active + ' / ' + slots + '  (equip on character select)', W/2, 224);
}

function drawShop(){
  ctx.textAlign = 'center';
  ctx.font = 'bold 14px monospace';
  ctx.fillStyle = '#f1c40f';
  ctx.fillText('ARMORY', W/2, 20);

  // Tabs (SKILLS / ASSISTANTS / PASSIVES)
  for(let i = 0; i < SHOP_TABS.length; i++){
    const r = shopTabRect(i);
    const [tab, label] = SHOP_TABS[i];
    const on = shopTab === tab, hov = clickedRect(r.x, r.y, r.w, r.h);
    ctx.fillStyle = on ? '#1e6840' : (hov ? '#2a3340' : '#1a1f29');
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = on ? '#2ecc71' : '#566573';
    ctx.lineWidth = 1;
    ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 8px monospace';
    ctx.fillText(label, r.x + r.w/2, r.y + 10);
  }

  if(shopTab === 'passives'){ drawPassiveShop(); }
  else {

  const items = shopTab === 'skills' ? SKILL_ORDER : SHOP_ASSIST_ORDER;
  shopHoverSkill = null;
  for(let i = 0; i < items.length; i++){
    const id = items[i];
    const r = shopItemRect(i);
    const isSkill = shopTab === 'skills';
    const meta = isSkill ? SKILLS[id] : ASSISTANTS[id];
    const owned = isSkill ? profile.ownedSkills.includes(id) : profile.ownedAssistants.includes(id);
    const col = meta.color;
    // Skills: current tier (1..5, or 0 if unowned) drives pips + which price to show.
    // Assistants: level (1..10) + the relevant gold price (buy if unowned, else upgrade).
    const sTier = isSkill ? (owned ? skillTier(id) : 0) : 0;
    const sMaxed = isSkill && owned && sTier >= SKILL_MAX_TIER;
    const lvl = isSkill ? 0 : assistantLevel(id);
    const maxed = !isSkill && owned && lvl >= ASSIST_MAX_LEVEL;
    let cost;
    if(isSkill) cost = !owned ? SKILLS[id].cost : (sMaxed ? 0 : (skillUpgradeCost(id) || 0));
    else if(!owned) cost = ASSISTANT_COST[id] || 0;
    else cost = maxed ? 0 : assistUpgradeCost(lvl);
    const afford = profile.gold >= cost;
    // "done" = nothing more to buy here (a maxed-tier skill, or a maxed assistant).
    const done = isSkill ? sMaxed : maxed;
    const hov = clickedRect(r.x, r.y, r.w, r.h);
    if(isSkill && hov) shopHoverSkill = id;
    ctx.fillStyle = done ? '#15241a' : (hov && afford ? '#23303f' : '#141822');
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = done ? '#2ecc71' : col;
    ctx.lineWidth = (hov && !done) ? 2 : 1;
    ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);
    // Name
    ctx.fillStyle = col;
    ctx.font = 'bold 9px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(isSkill ? meta.label : meta.name, r.x + r.w/2, r.y + 13);
    if(isSkill){
      // 5 tier pips (filled up to the owned tier). Centered under the name.
      const pn = SKILL_MAX_TIER, gapP = 8, x0 = r.x + r.w/2 - (pn - 1) * gapP / 2, yP = r.y + 24;
      for(let t = 0; t < pn; t++){
        ctx.fillStyle = t < sTier ? col : '#34404e';
        ctx.beginPath(); ctx.arc(x0 + t * gapP, yP, 2.4, 0, Math.PI * 2); ctx.fill();
      }
    } else {
      // Assistant: level + progress bar (owned) or tags (unowned), then the LEVEL-SCALED
      // stat block (HP/DMG/RNG/ROF) — reflects profile.assistantLevels via assistantStatLines.
      ctx.font = 'bold 6px monospace';
      if(owned){
        ctx.fillStyle = '#f1c40f';
        ctx.fillText('LV ' + lvl + ' / ' + ASSIST_MAX_LEVEL, r.x + r.w/2, r.y + 22);
        const bx = r.x + 12, bw2 = r.w - 24, byy = r.y + 26, bhh = 3;
        ctx.fillStyle = '#2a2a30'; ctx.fillRect(bx, byy, bw2, bhh);
        ctx.fillStyle = col; ctx.fillRect(bx, byy, Math.round(bw2 * lvl / ASSIST_MAX_LEVEL), bhh);
      } else {
        ctx.fillStyle = '#7f8c8d';
        ctx.fillText(meta.tags.join(' '), r.x + r.w/2, r.y + 22);
      }
      const stats = assistantStatLines(id);
      ctx.font = 'bold 7px monospace';
      let sy = r.y + 37;
      for(const [lab, val] of stats){
        ctx.fillStyle = '#8b94a3'; ctx.textAlign = 'left';  ctx.fillText(lab, r.x + 10, sy);
        ctx.fillStyle = '#eef2f7'; ctx.textAlign = 'right'; ctx.fillText(val, r.x + r.w - 10, sy);
        sy += 9;
      }
      // Threshold-ability readout: what this ally's CURRENT level unlocks + what's NEXT.
      // Positioned with a clear gap above the bottom price line (no overlap).
      const evo = assistantEvoBlurb(id, lvl || 1);
      ctx.textAlign = 'center'; ctx.font = 'bold 6px monospace';
      ctx.fillStyle = '#2ecc71'; ctx.fillText('NOW: ' + evo.now, r.x + r.w/2, sy + 6);
      ctx.fillStyle = '#7f8c8d'; ctx.fillText(evo.next ? 'NEXT: ' + evo.next : 'MAXED', r.x + r.w/2, sy + 15);
      ctx.textAlign = 'center';
    }
    // Bottom line: status / price (anchored to the bottom of whichever card height).
    const priceY = isSkill ? r.y + 40 : r.y + r.h - 8;
    ctx.font = 'bold 8px monospace';
    if(done){
      ctx.fillStyle = '#2ecc71';
      ctx.fillText(isSkill ? 'MAX TIER' : 'MAX LV', r.x + r.w/2, priceY);
    } else {
      ctx.fillStyle = afford ? '#f5d76e' : '#7d6608';
      const upgrading = (isSkill ? owned : owned);   // owned -> UPGRADE, unowned -> BUY
      ctx.fillText((upgrading ? 'UP  G ' : 'G ') + cost, r.x + r.w/2, priceY);
    }
  }

  // SKILL DETAIL PANEL (bottom): the hovered skill's CURRENT tier effect, then the
  // NEXT tier's effect in parens (per the requested "Effect (Next: …)" format).
  if(shopTab === 'skills' && shopHoverSkill){
    const id = shopHoverSkill, meta = SKILLS[id];
    const owned = profile.ownedSkills.includes(id);
    const tier = owned ? skillTier(id) : 1;
    ctx.textAlign = 'center';
    ctx.font = 'bold 8px monospace';
    ctx.fillStyle = meta.color;
    const curCd = (meta.t[tier - 1] || {}).cd;
    const head = owned
      ? (meta.label + '  Lv' + tier + '/' + SKILL_MAX_TIER + ': ' + skillBlurb(id, tier) + ', cd ' + curCd + 's')
      : (meta.label + '  (unowned): ' + skillBlurb(id, 1) + ', cd ' + (meta.t[0].cd) + 's');
    ctx.fillText(head, W/2, 218);
    ctx.font = 'bold 7px monospace';
    if(owned && tier < SKILL_MAX_TIER){
      const nx = meta.t[tier];
      ctx.fillStyle = '#bcd2e8';
      ctx.fillText('(Next Lv' + (tier + 1) + ': ' + skillBlurb(id, tier + 1) + ', cd ' + nx.cd + 's)   G ' + (skillUpgradeCost(id) || 0), W/2, 230);
    } else if(owned){
      ctx.fillStyle = '#2ecc71';
      ctx.fillText('MAX TIER', W/2, 230);
    } else {
      ctx.fillStyle = '#bcd2e8';
      ctx.fillText('(Next Lv2: ' + skillBlurb(id, 2) + ', cd ' + meta.t[1].cd + 's)   BUY G ' + meta.cost, W/2, 230);
    }
  }

  }  // end non-passives tab

  // Insufficient-gold / no-slot flash
  if(stateTime < shopMsgUntil){
    ctx.fillStyle = '#e74c3c';
    ctx.font = 'bold 9px monospace';
    ctx.fillText(shopMsgText, W/2, H - 26);
  } else {
    ctx.fillStyle = '#5d6d7e';
    ctx.font = 'bold 7px monospace';
    ctx.fillText(shopTab === 'skills'
      ? 'BUY WITH GOLD  ·  EQUIP IN THE LOADOUT SCREEN'
      : shopTab === 'allies'
      ? 'BUY / UPGRADE WITH GOLD  ·  HIGHER LEVEL = STRONGER ALLY'
      : 'BUY / UPGRADE WITH GOLD  ·  EQUIP ON THE CHARACTER-SELECT SCREEN', W/2, H - 26);
  }

  // Back button
  const bb = backButtonRect();
  const hovB = clickedRect(bb.x, bb.y, bb.w, bb.h);
  ctx.fillStyle = hovB ? '#34495e' : '#1a242f';
  ctx.fillRect(bb.x, bb.y, bb.w, bb.h);
  ctx.strokeStyle = '#7f8c8d';
  ctx.lineWidth = 1;
  ctx.strokeRect(bb.x + 0.5, bb.y + 0.5, bb.w - 1, bb.h - 1);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 8px monospace';
  ctx.fillText('< BACK', bb.x + bb.w/2, bb.y + 11);
}

function handleShop(){
  if(!mouse.clicked) return;
  const bb = backButtonRect();
  if(clickedRect(bb.x, bb.y, bb.w, bb.h)){ state = STATE.MENU; stateTime = 0; return; }
  for(let i = 0; i < SHOP_TABS.length; i++){
    const r = shopTabRect(i);
    if(clickedRect(r.x, r.y, r.w, r.h)){ shopTab = SHOP_TABS[i][0]; return; }
  }
  // PASSIVES tab: BUY / UPGRADE only (equipping moved to the CHARACTER SELECT screen).
  if(shopTab === 'passives'){
    for(let i = 0; i < PASSIVE_ORDER.length; i++){
      const id = PASSIVE_ORDER[i];
      const r = shopPassiveCardRect(i);
      if(!clickedRect(r.x, r.y, r.w, r.h)) continue;
      const lvl = passiveLevel(id);
      if(lvl >= PASSIVE_MAX_LEVEL) return;                            // maxed
      const cost = passiveUpgradeCost(id) || 0;                       // buy (L0) or upgrade
      if(profile.gold < cost){ shopMsgText = 'NOT ENOUGH GOLD'; shopMsgUntil = stateTime + 1.2; return; }
      profile.gold -= cost;
      profile.passiveLevels[id] = lvl + 1;                            // 0->1 buys, else +1
      saveProfile(); if(sfx.pickup) sfx.pickup();
      return;
    }
    return;
  }
  const items = shopTab === 'skills' ? SKILL_ORDER : SHOP_ASSIST_ORDER;
  for(let i = 0; i < items.length; i++){
    const r = shopItemRect(i);
    if(!clickedRect(r.x, r.y, r.w, r.h)) continue;
    const id = items[i];
    if(shopTab === 'skills'){
      // BUY (tier 1) if unowned, else UPGRADE one tier (cost rises non-linearly).
      if(!profile.ownedSkills.includes(id)){
        const cost = SKILLS[id].cost;
        if(profile.gold < cost){ shopMsgText = 'NOT ENOUGH GOLD'; shopMsgUntil = stateTime + 1.2; return; }
        profile.gold -= cost;
        profile.ownedSkills.push(id);
        profile.skillLevels[id] = 1;
        saveProfile();
        if(sfx.pickup) sfx.pickup();
        return;
      }
      const tier = skillTier(id);
      if(tier >= SKILL_MAX_TIER) return;            // already max tier
      const cost = skillUpgradeCost(id) || 0;
      if(profile.gold < cost){ shopMsgText = 'NOT ENOUGH GOLD'; shopMsgUntil = stateTime + 1.2; return; }
      profile.gold -= cost;
      profile.skillLevels[id] = tier + 1;
      saveProfile();
      if(sfx.pickup) sfx.pickup();
      return;
    }
    // Assistants: BUY (unlock at level 1) if unowned, else UPGRADE one level.
    if(!profile.ownedAssistants.includes(id)){
      const cost = ASSISTANT_COST[id] || 0;
      if(profile.gold < cost){ shopMsgText = 'NOT ENOUGH GOLD'; shopMsgUntil = stateTime + 1.2; return; }
      profile.gold -= cost;
      profile.ownedAssistants.push(id);
      profile.assistantLevels[id] = 1;
      saveProfile();
      if(sfx.pickup) sfx.pickup();
      return;
    }
    const lvl = assistantLevel(id);
    if(lvl >= ASSIST_MAX_LEVEL) return;          // already maxed
    const cost = assistUpgradeCost(lvl);
    if(profile.gold < cost){ shopMsgText = 'NOT ENOUGH GOLD'; shopMsgUntil = stateTime + 1.2; return; }
    profile.gold -= cost;
    profile.assistantLevels[id] = lvl + 1;
    saveProfile();
    if(sfx.pickup) sfx.pickup();
    return;
  }
}

// ---- CHARACTER SELECT ----
const CHAR_ORDER = ['soldier', 'scout', 'tank', 'bounty_hunter', 'cyborg'];
function charCardRect(i){
  // 5 cards on one row in the 480-wide screen: narrower cards + tight gap.
  const cw = 88, ch = 160, gap = 5;
  const n = CHAR_ORDER.length;
  const totalW = n * cw + (n - 1) * gap;
  const xs = Math.floor((W - totalW) / 2);
  return { x: xs + i * (cw + gap), y: 52, w: cw, h: ch };
}
// ---- PASSIVE picker (lives on the CHARACTER SELECT screen, below the cards). Each
// equipped passive occupies a slot; the slot count = maxPassiveSlots() (grows with
// account level). Clicking a slot opens a dropdown of OWNED passives to choose from
// (so the player sees + chooses passives every run, before every level). Equipping is
// ONLY here now — the SHOP just buys/upgrades. ----
let passiveMenuSlot = -1;   // which passive slot's dropdown is open (-1 = none)
function passiveSlotRect(i){
  const n = Math.max(1, maxPassiveSlots()), sw = 86, sh = 18, gap = 6;
  const totalW = n * sw + (n - 1) * gap, xs = Math.floor((W - totalW) / 2);
  return { x: xs + i * (sw + gap), y: 226, w: sw, h: sh };
}
// Dropdown options for a slot: a leading "— EMPTY —" (null) + every OWNED passive.
function passiveMenuOptions(){ return [null].concat(PASSIVE_ORDER.filter(k => passiveLevel(k) > 0)); }
function passiveMenuRects(slot){
  const opts = passiveMenuOptions(), base = passiveSlotRect(slot), oh = 12;
  let y0 = base.y - opts.length * oh - 2;          // stack upward over the cards
  if(y0 < 42) y0 = 42;                             // keep below the title
  return opts.map((id, k) => ({ x: base.x, y: y0 + k * oh, w: base.w, h: oh, id: id }));
}
// Set passive slot `i` to `id` (null = clear). Treats equippedPassives as an ordered,
// duplicate-free list capped at maxPassiveSlots(); picking an already-equipped passive
// moves it into this slot.
function setPassiveSlot(i, id){
  let eq = (profile.equippedPassives || []).filter(k => PASSIVES[k] && passiveLevel(k) > 0);
  const old = eq[i];
  eq = eq.filter(k => k !== old && k !== id);      // drop this slot's old occupant + any dup of id
  if(id) eq.splice(Math.min(i, eq.length), 0, id);
  profile.equippedPassives = eq.slice(0, maxPassiveSlots());
  saveProfile();
}
function backButtonRect(){ return { x: 8, y: 8, w: 50, h: 16 }; }

// ---- CHARACTER PARAMETERS screen (reachable from the MENU button) ----
// Compute a class's level-scaled base stats for an ARBITRARY account level — a pure
// mirror of applyLevelScaling()/createPlayer() (base LMB cooldown 0.14, base RMB pools
// 12/6/20), so the screen can show both the current values AND the per-level gain
// (by diffing this at level vs level+1) without needing a live player.
function scaledStatsFor(charKey, level){
  const ch = CHARACTERS[charKey] || CHARACTERS.soldier;
  const L = Math.max(0, (level || 1) - 1);
  const dmgMult = (ch.damageMult || 1) * (1 + Math.min(LVL_DMG_CAP, L * LVL_DMG_PER));
  const fireBonus = Math.min(LVL_FIRE_CAP, L * LVL_FIRE_PER);
  const fireRate = 0.14 * (1 - fireBonus);
  const laserScale = (1 - fireBonus);
  const maxHp = ch.hp + Math.min(LVL_HP_CAP, Math.floor(L / LVL_HP_PER));
  const rmbMul = RMB_BASE_FRAC * (1 + Math.min(RMB_DUR_CAP, L * RMB_DUR_PER));
  const pool = base => base > 0 ? Math.max(1, Math.round(base * rmbMul)) : 0;
  const weaponTier = weaponTierFor(level || 1);
  const weaponMult = WEAPON_TIER_MULT[weaponTier - 1] || 1;
  return {
    ch, dmgMult, fireRate, laserScale, maxHp, weaponTier, weaponMult,
    maxFuel:   pool(charKey === 'tank'    ? 12 : 0),
    maxEnergy: pool(charKey === 'soldier' ?  6 : 0),
    maxPower:  pool(charKey === 'scout'   ? 20 : 0),
    maxFury:   pool(charKey === 'bounty_hunter' ? 6  : 0),
    maxToxin:  pool(charKey === 'cyborg'        ? 12 : 0)
  };
}
// 5 class tabs across the 480 screen (narrower than the old 3-tab layout).
function paramTabRect(i){ return { x: W/2 - 152 + i * 62, y: 28, w: 56, h: 14 }; }

function drawParameters(){
  ctx.fillStyle = '#0c0c18';
  ctx.fillRect(0, 0, W, H);

  const key = paramChar;
  const ch = CHARACTERS[key] || CHARACTERS.soldier;
  const lvl = profile.level || 1;
  const atCap = lvl >= LEVEL_CAP;
  const cur = scaledStatsFor(key, lvl);
  const nxt = scaledStatsFor(key, Math.min(LEVEL_CAP, lvl + 1));  // clamps -> deltas 0 at cap
  const fmt = n => isFinite(n) ? String(Math.round(n * 100) / 100) : '∞';
  // Delta token "(+x)" — gain when you add one level (0 where the stat doesn't scale).
  const dl = d => {
    const r = Math.round(d * 100) / 100;
    return r > 0 ? '(+' + fmt(r) + ')' : (r < 0 ? '(' + fmt(r) + ')' : '(+0)');
  };

  // Per-class basic-attack base values (same constants fireWeapon / the RMB fns use).
  const lmbBase = { scout:0.85, tank:2, bounty_hunter:1.1, cyborg:1 }[key] || 1;
  const lmbName = { scout:'LASER DOTS', tank:'HEAVY SLUG', bounty_hunter:'SHOTGUN(3)', cyborg:'BIO-GUN' }[key] || 'PISTOL';
  // LMB cadence is FIXED (not player.fireRate) for scout/shotgun/bio-gun.
  const FIXED_LMB_CD = { scout:0.06, bounty_hunter:0.5, cyborg:0.4 };
  const lmbCd = FIXED_LMB_CD[key] || null;
  const lmbRate    = lmbCd ? 1 / lmbCd : 1 / cur.fireRate;
  const lmbRateNxt = lmbCd ? 1 / lmbCd : 1 / nxt.fireRate;
  // Attack RANGE in game distance units (px). LMB = projectile reach = bullet speed ×
  // life. RMB = the secondary's reach + its scope.
  const lmbRange = { scout:360, tank:480, bounty_hunter:153, cyborg:208 }[key] || 432;
  const secRange = { soldier:'32 px · ~103° arc', scout:'147 px · 3 beams', tank:'140 px · ~60° cone',
                     bounty_hunter:'38 px · ~103° arc', cyborg:'280 px · fast bolt' }[key] || '';

  let secName, secBase, secUnit, capLabel, capCur, capNxt, capUnit, regenVal;
  if(key === 'soldier'){
    secName = 'SPEAR'; secBase = 40; secUnit = ' DPS';
    capLabel = 'ENERGY'; capCur = cur.maxEnergy; capNxt = nxt.maxEnergy; capUnit = ' s';
    regenVal = '0.2 /s';
  } else if(key === 'scout'){
    secName = '3× LASER BEAM'; secBase = 3; secUnit = ' /beam';
    capLabel = 'POWER'; capCur = cur.maxPower; capNxt = nxt.maxPower; capUnit = ' shots';
    regenVal = '0.6 /s';
  } else if(key === 'bounty_hunter'){
    secName = 'MACHETE'; secBase = 46; secUnit = ' DPS';
    capLabel = 'FURY'; capCur = cur.maxFury; capNxt = nxt.maxFury; capUnit = ' s';
    regenVal = '0.2 /s';
  } else if(key === 'cyborg'){
    secName = 'GAS GUN'; secBase = 3.4; secUnit = ' /shot';
    capLabel = 'TOXIN'; capCur = cur.maxToxin; capNxt = nxt.maxToxin; capUnit = ' shots';
    regenVal = '0.6 /s';
  } else {
    secName = 'FLAMETHROWER'; secBase = 7; secUnit = ' DPS';
    capLabel = 'FUEL'; capCur = cur.maxFuel; capNxt = nxt.maxFuel; capUnit = ' s';
    regenVal = '0.1 /s';
  }
  // HP-regen + lifesteal are now UNIVERSAL equippable passives (account-wide; live
  // profile values, '—' when not equipped) — no longer class-specific.
  const hpRegen = passiveEquipped('hpregen') ? PASSIVES.hpregen.fmt(passiveValue('hpregen')) : '—';
  const secExtra = ['LIFESTEAL', passiveEquipped('lifesteal') ? PASSIVES.lifesteal.fmt(passiveValue('lifesteal')) : '—'];
  const shieldStr = (ch.startShield || 0) + ' / ' + (key === 'tank' ? 5 : 3);

  // Column rows: {h:'HEADER'} or [label, value, deltaTokenOrNull].
  const left = [
    { h:'DEFENCE' },
    ['HP', String(cur.maxHp), dl(nxt.maxHp - cur.maxHp)],
    ['SHIELD', shieldStr, dl(0)],
    ['HP REGEN', hpRegen, dl(0)],
    { h:'MOBILITY' },
    ['MOVE SPEED', fmt(ch.speed) + ' px/s', dl(0)],
    { h:'PRIMARY ATTACK (LMB)' },
    ['WEAPON', lmbName, null],
    ['DAMAGE', fmt(lmbBase * cur.dmgMult * cur.weaponMult) + ' /hit', dl(lmbBase * (nxt.dmgMult*nxt.weaponMult - cur.dmgMult*cur.weaponMult))],
    ['FIRE RATE', fmt(Math.round(lmbRate * 10) / 10) + ' /s', dl(lmbRateNxt - lmbRate)],
    ['RANGE', fmt(lmbRange) + ' px', dl(0)]
  ];
  const right = [
    { h:'SECONDARY ATTACK (RMB)' },
    ['WEAPON', secName, null],
    ['DAMAGE', fmt(secBase * cur.dmgMult * cur.weaponMult) + secUnit, dl(secBase * (nxt.dmgMult*nxt.weaponMult - cur.dmgMult*cur.weaponMult))],
    ['RANGE', secRange, null],
    [capLabel + ' CAP.', fmt(capCur) + capUnit, dl(capNxt - capCur)],
    [capLabel + ' REGEN', regenVal, dl(0)],
    { h:'GENERAL' },
    ['WEAPON EVOLUTION', 'Tier ' + cur.weaponTier + ' / 5  (×' + fmt(cur.weaponMult) + ')', dl(nxt.weaponMult - cur.weaponMult)],
    ['DAMAGE MULT', '×' + fmt(cur.dmgMult * cur.weaponMult) + ' (incl. tier)', dl(nxt.dmgMult*nxt.weaponMult - cur.dmgMult*cur.weaponMult)],
    [secExtra[0], secExtra[1], dl(0)]
  ];

  // Title + account level
  ctx.textAlign = 'center';
  ctx.font = 'bold 13px monospace';
  ctx.fillStyle = ch.color || '#fff';
  ctx.fillText('CHARACTER PARAMETERS', W/2, 16);
  ctx.font = 'bold 8px monospace';
  ctx.fillStyle = atCap ? '#f1c40f' : '#bdc3c7';
  ctx.fillText('ACCOUNT LV ' + lvl + (atCap ? '  (MAX)' : ''), W/2, 25);

  // Character tabs (5 across — 7px so the longest name fits the 56px tab).
  CHAR_ORDER.forEach((k, i) => {
    const r = paramTabRect(i);
    const on = k === key;
    const hov = clickedRect(r.x, r.y, r.w, r.h);
    ctx.fillStyle = on ? (CHARACTERS[k].color || '#3498db') : (hov ? '#2a3340' : '#1a222c');
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = CHARACTERS[k].color || '#7f8c8d';
    ctx.lineWidth = 1;
    ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);
    ctx.fillStyle = on ? '#0c0c18' : '#cdd6df';
    ctx.font = 'bold 7px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(CHARACTERS[k].name, r.x + r.w/2, r.y + 10);
  });

  // Hint: explain the parentheses
  ctx.textAlign = 'center';
  ctx.font = 'bold 7px monospace';
  ctx.fillStyle = '#7fd1a0';
  ctx.fillText('( + ) = GAIN PER ACCOUNT LEVEL', W/2, 52);

  // Two columns
  const renderCol = (rows, labelX, valX) => {
    let y = 68;
    for(const r of rows){
      if(r.h){
        ctx.textAlign = 'left';
        ctx.font = 'bold 8px monospace';
        ctx.fillStyle = ch.color || '#4fc3f7';
        ctx.fillText(r.h, labelX, y);
        y += 14;
      } else {
        ctx.textAlign = 'left';
        ctx.font = 'bold 8px monospace';
        ctx.fillStyle = '#8b94a3';
        ctx.fillText(r[0], labelX + 4, y);
        ctx.textAlign = 'right';
        if(r[2]){
          ctx.fillStyle = r[2] === '(+0)' ? '#5f6b7a' : '#7fd1a0';
          ctx.fillText(r[2], valX, y);
          const dw = ctx.measureText(r[2]).width;
          ctx.fillStyle = '#eef2f7';
          ctx.fillText(r[1], valX - dw - 4, y);
        } else {
          ctx.fillStyle = '#eef2f7';
          ctx.fillText(r[1], valX, y);
        }
        y += 13;
      }
    }
  };
  renderCol(left,  16,      W/2 - 12);
  renderCol(right, W/2 + 8, W - 14);

  // Distance-unit legend (condensed to one line to make room for the passive readout).
  ctx.textAlign = 'center';
  ctx.font = 'bold 7px monospace';
  ctx.fillStyle = '#7f8c99';
  ctx.fillText('px = game pixels (480x270 world)  ·  MOVE SPEED px/s  ·  RANGE = reach', W/2, 224);

  // EQUIPPED PASSIVES (account-wide): all 8 with their live value, or '—' when not
  // equipped. Two rows of four. (HP-regen + lifesteal also appear in the columns.)
  ctx.fillStyle = '#7fd1a0'; ctx.font = 'bold 8px monospace';
  ctx.fillText('EQUIPPED PASSIVES  ' + (profile.equippedPassives || []).length + ' / ' + maxPassiveSlots(), W/2, 238);
  ctx.font = 'bold 7px monospace'; ctx.fillStyle = '#9fb4c9';

function drawCharacterSelect(){
  ctx.fillStyle = '#0c0c18';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = 'bold 14px monospace';
  ctx.fillStyle = '#f1c40f';
  ctx.fillText('LEVEL ' + (selectedLevel + 1) + ' — CHOOSE YOUR CHARACTER', W/2, 36);

  // Meta-level bonuses (shown on the cards so the player sees their scaled stats).
  const Llv = Math.max(0, (profile.level || 1) - 1);
  const rmbMul = RMB_BASE_FRAC * (1 + Math.min(RMB_DUR_CAP, Llv * RMB_DUR_PER));
  const hpBonus = Math.min(LVL_HP_CAP, Math.floor(Llv / LVL_HP_PER));

  for(let i = 0; i < CHAR_ORDER.length; i++){
    const key = CHAR_ORDER[i];
    const ch = CHARACTERS[key];
    const r = charCardRect(i);
    const hov = clickedRect(r.x, r.y, r.w, r.h);
    ctx.fillStyle = hov ? '#1c2433' : '#141822';
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = ch.color;
    ctx.lineWidth = hov ? 2 : 1;
    ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);

    // Class name (11px so the longest name fits the 88px card)
    ctx.fillStyle = ch.color;
    ctx.font = 'bold 11px monospace';
    ctx.fillText(ch.name, r.x + r.w / 2, r.y + 17);

    if(key === 'soldier'){
      // Dr. Syed — card-ONLY renderer with a different pose: spear slung on
      // the BACK and AK-47 slung across the CHEST on opposite diagonals.
      // In-game still uses drawDrSyed (Uzi + spear in hands, both swivel
      // with aim) — only the card image changes.
      drawDrSyedCard(ctx, r.x + r.w / 2, r.y + 46, DR_SYED_PX);
    } else if(key === 'scout'){
      // Xu Yihui — card-ONLY renderer with a fixed pose (both arms angled
      // ~30° from straight-down toward the legs; laser cannon's muzzle
      // pulses brighter). In-game still uses drawXuYihui (both weapons
      // swivel together with aim) — only the card image changes.
      drawXuYihuiCard(ctx, r.x + r.w / 2, r.y + 46, XU_YIHUI_PX);
    } else if(key === 'tank'){
      // Benjamin Wu — card-ONLY renderer with a different pose: backpack
      // flamethrower TANK on the back + machine gun across the chest.
      // The in-game drawBenjaminWu (flamethrower in left hand + handgun in
      // right hand, both swivel with aim) is NOT used here per the user's
      // "the image of Wu in the game do not change".
      drawBenjaminWuCard(ctx, r.x + r.w / 2, r.y + 46, BENJAMIN_WU_PX);
    } else if(key === 'bounty_hunter'){
      // Leo — bespoke card pose: shotgun across the chest + machete on the
      // back. In-game uses drawLeoGame (different pose: shotgun right hand,
      // machete left hand + cleaver chop on RMB).
      drawLeoCard(ctx, r.x + r.w / 2, r.y + 46, LEO_PX);
    } else if(key === 'cyborg'){
      // Ong — bespoke card pose: gas gun slung across chest + pistol
      // holstered at waist. In-game uses drawOngGame (both weapons in
      // hand, both swivel with aim, gas puff at muzzle while firing).
      drawOngCard(ctx, r.x + r.w / 2, r.y + 46, ONG_PX);
    } else {
      // Floor-plan preview: same renderer as in-game (drawCharacterFloorPlan), drawn
      // head-up — no rotation needed since the sprite's local frame already has the
      // body north of origin / weapons extending south. Scale matches the in-game 0.4
      // so the card preview reads at the same size the character will play at.
      ctx.save();
      ctx.translate(r.x + r.w / 2, r.y + 46);
      ctx.rotate(Math.PI);   // mirror the in-game 180° rotation so card matches gameplay
      ctx.scale(0.4, 0.4);
      drawCharacterFloorPlan(ctx, key);
      ctx.restore();
    }

    // Stats — laid out sequentially so optional rows (DMG/SHIELD/pool) never overlap.
    ctx.font = 'bold 7px monospace';
    ctx.textAlign = 'left';
    const stats = [['HP   : ' + (ch.hp + hpBonus), '#bdc3c7'], ['SPEED: ' + ch.speed, '#bdc3c7']];
    if(ch.damageMult > 1) stats.push(['DMG  : x' + ch.damageMult, '#bdc3c7']);
    if(ch.startShield)    stats.push(['SHIELD: ' + ch.startShield, '#bdc3c7']);
    if(key === 'tank')          stats.push(['FUEL : ' + Math.max(1, Math.round(12 * rmbMul)) + ' RMB', '#e67e22']);
    if(key === 'soldier')       stats.push(['ENGY : ' + Math.max(1, Math.round(6 * rmbMul)) + ' RMB', '#2ecc71']);
    if(key === 'scout')         stats.push(['POWER: ' + Math.max(1, Math.round(20 * rmbMul)) + ' RMB', '#19f0ff']);
    if(key === 'bounty_hunter') stats.push(['FURY : ' + Math.max(1, Math.round(6 * rmbMul)) + ' RMB', '#e74c3c']);
    if(key === 'cyborg')        stats.push(['TOXIN: ' + Math.max(1, Math.round(12 * rmbMul)) + ' RMB', '#bb8fce']);
    let sy = r.y + 68;
    for(const st of stats){ ctx.fillStyle = st[1]; ctx.fillText(st[0], r.x + 6, sy); sy += 9; }

    // Class identity: LMB + held-RMB are fixed per class; the active X/C/B/V skills
    // are now chosen in the LOADOUT screen (the old per-class kit is retired).
    sy += 3;
    ctx.fillStyle = '#7f8c8d';
    ctx.fillText('WEAPONS', r.x + 6, sy); sy += 9;
    ctx.fillStyle = '#fff';
    const lmbN = { soldier:'PISTOL', scout:'SMG', tank:'SLUG', bounty_hunter:'SHOTGUN', cyborg:'BIO-GUN' }[key] || 'GUN';
    const rmbN = { soldier:'SPEAR', scout:'3xLASER', tank:'FLAME', bounty_hunter:'MACHETE', cyborg:'GAS GUN' }[key] || 'RMB';
    ctx.fillText('LMB ' + lmbN, r.x + 6, sy); sy += 8;
    ctx.fillText('RMB ' + rmbN, r.x + 6, sy); sy += 8;
    ctx.fillStyle = '#5dade2';
    ctx.fillText('SKILLS: LOADOUT', r.x + 6, sy); sy += 8;
    // Passives are universal + account-wide — chosen in the shared bar below the cards.
    ctx.fillStyle = '#2ecc71';
    ctx.fillText('PASSIVES BELOW', r.x + 6, sy);

    ctx.textAlign = 'center';
  }

  // Shared PASSIVE picker bar (below the cards). Slot count = maxPassiveSlots(); each
  // slot shows its equipped passive + LEVEL (the progress), or "+ EMPTY".
  drawCharacterSelectPassives();

  // Back button
  const bb = backButtonRect();
  const hov = clickedRect(bb.x, bb.y, bb.w, bb.h);
  ctx.fillStyle = hov ? '#34495e' : '#1a242f';
  ctx.fillRect(bb.x, bb.y, bb.w, bb.h);
  ctx.strokeStyle = '#7f8c8d';
  ctx.lineWidth = 1;
  ctx.strokeRect(bb.x + 0.5, bb.y + 0.5, bb.w - 1, bb.h - 1);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 8px monospace';
  ctx.fillText('< BACK', bb.x + bb.w / 2, bb.y + 11);

  ctx.font = 'bold 7px monospace';
  ctx.fillStyle = '#5d6d7e';
  ctx.fillText('PICK PASSIVES BELOW  ·  CLICK A CHARACTER TO SET YOUR LOADOUT', W/2, H - 8);
}

// The shared passive-slot bar + its click-to-choose dropdown (drawn on top of the cards).
function drawCharacterSelectPassives(){
  const slots = maxPassiveSlots();
  const eq = (profile.equippedPassives || []).filter(k => PASSIVES[k] && passiveLevel(k) > 0);
  ctx.textAlign = 'center'; ctx.font = 'bold 8px monospace';
  ctx.fillStyle = eq.length >= slots ? '#f5d76e' : '#9fb4c9';
  ctx.fillText('PASSIVES  ' + eq.length + ' / ' + slots + '   (click a slot to choose)', W/2, 218);
  for(let i = 0; i < slots; i++){
    const s = passiveSlotRect(i), id = eq[i];
    const open = i === passiveMenuSlot, hov = clickedRect(s.x, s.y, s.w, s.h) || open;
    ctx.fillStyle = id ? '#16241c' : (hov ? '#23303f' : '#141822');
    ctx.fillRect(s.x, s.y, s.w, s.h);
    ctx.strokeStyle = id ? PASSIVES[id].color : '#566573';
    ctx.lineWidth = hov ? 2 : 1;
    ctx.strokeRect(s.x + 0.5, s.y + 0.5, s.w - 1, s.h - 1);
    ctx.font = 'bold 7px monospace'; ctx.textAlign = 'center';
    if(id){
      const lvl = passiveLevel(id);
      ctx.fillStyle = PASSIVES[id].color;
      // Manifest the EFFECT value (e.g. "+1.1%"), not the level number; the bar below
      // still conveys level/progress visually.
      ctx.fillText(PASSIVES[id].label + '  ' + PASSIVES[id].fmt(passiveValueAt(id, lvl)), s.x + s.w/2, s.y + 8);
      const bx = s.x + 8, bw = s.w - 16, by = s.y + 12, bh = 2;
      ctx.fillStyle = '#2a2a30'; ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = PASSIVES[id].color; ctx.fillRect(bx, by, Math.round(bw * lvl / PASSIVE_MAX_LEVEL), bh);
    } else {
      ctx.fillStyle = '#7f8c8d';
      ctx.fillText('+ EMPTY', s.x + s.w/2, s.y + 11);
    }
  }
  // Dropdown overlay (on top), if a slot is open.
  if(passiveMenuSlot >= 0 && passiveMenuSlot < slots){
    const equippedNow = profile.equippedPassives || [];
    for(const o of passiveMenuRects(passiveMenuSlot)){
      const hov = clickedRect(o.x, o.y, o.w, o.h);
      ctx.fillStyle = hov ? '#2c3a4c' : '#0f1622';
      ctx.fillRect(o.x, o.y, o.w, o.h);
      ctx.strokeStyle = '#46586c'; ctx.lineWidth = 1;
      ctx.strokeRect(o.x + 0.5, o.y + 0.5, o.w - 1, o.h - 1);
      ctx.textAlign = 'left'; ctx.font = 'bold 7px monospace';
      if(o.id){
        const lvl = passiveLevel(o.id);
        ctx.fillStyle = PASSIVES[o.id].color;
        ctx.fillText(PASSIVES[o.id].label + ' L' + lvl + (equippedNow.indexOf(o.id) >= 0 ? ' ✓' : ''), o.x + 5, o.y + 9);
        ctx.textAlign = 'right'; ctx.fillStyle = '#cfd8e3';
        ctx.fillText(PASSIVES[o.id].fmt(passiveValueAt(o.id, lvl)), o.x + o.w - 5, o.y + 9);
      } else {
        ctx.fillStyle = '#9fb4c9';
        ctx.fillText('— EMPTY —', o.x + 5, o.y + 9);
      }
    }
  }
  ctx.textAlign = 'center';
}

function handleCharacterSelect(){
  if(!mouse.clicked) return;
  const bb = backButtonRect();
  if(clickedRect(bb.x, bb.y, bb.w, bb.h)){
    state = STATE.MENU; stateTime = 0; passiveMenuSlot = -1; return;
  }
  // PASSIVE picker (handled before card selection so a slot/dropdown click never
  // proceeds to the loadout screen).
  if(passiveMenuSlot >= 0){
    for(const o of passiveMenuRects(passiveMenuSlot)){
      if(clickedRect(o.x, o.y, o.w, o.h)){
        setPassiveSlot(passiveMenuSlot, o.id);
        passiveMenuSlot = -1; if(sfx.pickup) sfx.pickup();
        return;
      }
    }
    passiveMenuSlot = -1;   // click outside the open dropdown → close, don't proceed
    return;
  }
  for(let i = 0; i < maxPassiveSlots(); i++){
    const s = passiveSlotRect(i);
    if(clickedRect(s.x, s.y, s.w, s.h)){ passiveMenuSlot = i; return; }
  }
  for(let i = 0; i < CHAR_ORDER.length; i++){
    const r = charCardRect(i);
    if(clickedRect(r.x, r.y, r.w, r.h)){
      selectedChar = CHAR_ORDER[i];
      // Character chosen → pick assistants next.
      state = STATE.ASSISTANT_SELECT; stateTime = 0; loadoutMenuSlot = -1; passiveMenuSlot = -1;
      return;
    }
  }
}

// ---- Assistant selection screen (pick exactly 2 of the 5-strong roster) ----
// Owned assistants in stable roster order (only these appear on the loadout screen;
// the rest are bought in the shop).
function ownedAssistantList(){ return ASSIST_ORDER.filter(k => profile.ownedAssistants.includes(k)); }
function assistCardRect(i, n){
  const cw = 84, ch = 96, gap = 6;
  n = n || ownedAssistantList().length || 1;
  const totalW = n * cw + (n - 1) * gap;
  const xs = Math.floor((W - totalW) / 2);
  return { x: xs + i * (cw + gap), y: 38, w: cw, h: ch };
}
// Five skill-loadout slot boxes (F + X/C/B/V) below the assistant area.
function loadoutSlotRect(i){
  const sw = 64, sh = 42, gap = 8, n = 5;
  const totalW = n * sw + (n - 1) * gap;
  const xs = Math.floor((W - totalW) / 2);
  return { x: xs + i * (sw + gap), y: 150, w: sw, h: sh };
}
function assistStartRect(){ const w = 120, h = 22; return { x: Math.floor((W - w) / 2), y: H - 30, w, h }; }
// Owned non-heal skills (for the loadout picker), preceded by null (= empty slot).
function cycleSkillList(){ return [null, ...profile.ownedSkills.filter(s => s !== 'heal' && SKILLS[s])]; }

// Which X/C/B/V slot's skill-pick dropdown is open (slotKeys index 1..4, -1 = none).
// Driven by mouse hover in handleAssistantSelect, rendered in drawAssistantSelect.
let loadoutMenuSlot = -1;
// Per-option rects for the dropdown under loadout slot `i` (1=X..4=V). Anchored just
// below the slot, shifted up if it would run off the bottom of the 270px screen.
function loadoutMenuRects(i){
  const opts = cycleSkillList();                 // [null, ...owned non-heal]
  const slot = loadoutSlotRect(i);
  const ih = 13, iw = slot.w;
  const listH = opts.length * ih;
  const x = slot.x;
  // Anchor flush to the slot's bottom (no gap) so moving the cursor from the slot
  // onto the list never crosses dead space that would close the menu.
  let y = slot.y + slot.h;
  if(y + listH > H - 2) y = Math.max(2, H - 2 - listH);
  return opts.map((id, k) => ({ x, y: y + k * ih, w: iw, h: ih, id }));
}

function drawAssistantSelect(){
  ctx.fillStyle = '#0c0c18';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = 'bold 13px monospace';
  ctx.fillStyle = '#f1c40f';
  ctx.fillText('LOADOUT', W / 2, 16);
  ctx.font = 'bold 7px monospace';
  ctx.fillStyle = '#bdc3c7';
  ctx.fillText('ASSISTANTS  ·  TAP TO EQUIP / UNEQUIP (UP TO 2)  ·  ' + profile.equippedAssistants.length + '/2 EQUIPPED', W / 2, 30);

  const owned = ownedAssistantList();
  for(let i = 0; i < owned.length; i++){
    const key = owned[i];
    const a = ASSISTANTS[key];
    const r = assistCardRect(i, owned.length);
    const chosen = profile.equippedAssistants.includes(key);
    const hov = clickedRect(r.x, r.y, r.w, r.h);
    ctx.fillStyle = chosen ? '#16261a' : (hov ? '#1c2433' : '#141822');
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = chosen ? '#2ecc71' : a.color;
    ctx.lineWidth = (chosen || hov) ? 2 : 1;
    ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);

    ctx.fillStyle = a.color;
    ctx.font = 'bold 9px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(a.name, r.x + r.w / 2, r.y + 12);
    drawSpriteCentered(a.sprite(), r.x + r.w / 2, r.y + 28);
    // LEVEL-SCALED stat block (two compact rows of two stats) — reflects this ally's
    // current profile.assistantLevels via assistantStatLines (same readout as the SHOP).
    const st = assistantStatLines(key);
    ctx.font = 'bold 6px monospace';
    ctx.fillStyle = '#cdd6df';
    const pair = (a0, a1) => a0[0] + ' ' + a0[1] + '   ' + a1[0] + ' ' + a1[1];
    ctx.fillText(pair(st[0], st[1]), r.x + r.w / 2, r.y + 45);
    ctx.fillText(pair(st[2], st[3]), r.x + r.w / 2, r.y + 54);
    // Upgrade level (set/raised in the SHOP).
    ctx.fillStyle = '#f1c40f';
    ctx.font = 'bold 7px monospace';
    ctx.fillText('LV ' + assistantLevel(key) + ' / ' + ASSIST_MAX_LEVEL, r.x + r.w / 2, r.y + 68);
    ctx.fillStyle = chosen ? '#2ecc71' : '#566573';
    ctx.font = 'bold 8px monospace';
    ctx.fillText(chosen ? 'EQUIPPED ✓' : 'TAP TO EQUIP', r.x + r.w / 2, r.y + r.h - 6);
  }

  // ---- Skill loadout strip ----
  ctx.fillStyle = '#bdc3c7';
  ctx.font = 'bold 7px monospace';
  ctx.fillText('SKILLS  ·  F = HEAL  ·  +1 SLOT EVERY 5 LEVELS  ·  HOVER A SLOT TO PICK', W / 2, 144);
  const slotKeys = [['F','f'],['X','x'],['C','c'],['B','b'],['V','v']];
  const unlocked = unlockedSlots();
  for(let i = 0; i < slotKeys.length; i++){
    const [keyLabel, slot] = slotKeys[i];
    const r = loadoutSlotRect(i);
    const isHeal = slot === 'f';
    const slotIdx = isHeal ? -1 : SLOT_ORDER.indexOf(slot);   // 0..3
    const locked = !isHeal && slotIdx >= unlocked;
    const id = isHeal ? 'heal' : profile.loadout[slot];
    const sk = (id && SKILLS[id]) ? SKILLS[id] : null;
    const hov = !locked && !isHeal && (clickedRect(r.x, r.y, r.w, r.h) || i === loadoutMenuSlot);
    ctx.fillStyle = locked ? '#15151c' : (hov ? '#23303f' : '#141822');
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = isHeal ? '#2ecc71' : (locked ? '#3a3a44' : (sk ? sk.color : '#566573'));
    ctx.lineWidth = 1;
    ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);
    ctx.fillStyle = '#7f8c8d';
    ctx.font = 'bold 7px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(keyLabel, r.x + 4, r.y + 10);
    ctx.textAlign = 'center';
    if(locked){
      ctx.fillStyle = '#566573'; ctx.font = 'bold 7px monospace';
      ctx.fillText('LOCKED', r.x + r.w / 2, r.y + 24);
      ctx.fillStyle = '#46505e'; ctx.font = 'bold 6px monospace';
      ctx.fillText('LV ' + ((slotIdx + 1) * 5), r.x + r.w / 2, r.y + 34);
    } else if(sk){
      ctx.fillStyle = isHeal ? '#2ecc71' : sk.color; ctx.font = 'bold 9px monospace';
      ctx.fillText(sk.label, r.x + r.w / 2, r.y + 26);
      if(isHeal){ ctx.fillStyle = '#7f8c8d'; ctx.font = 'bold 6px monospace'; ctx.fillText('DEFAULT', r.x + r.w / 2, r.y + 36); }
    } else {
      ctx.fillStyle = '#566573'; ctx.font = 'bold 8px monospace';
      ctx.fillText('EMPTY', r.x + r.w / 2, r.y + 26);
    }
  }

  // START button — always allowed (0..2 assistants; empty loadout = just HEAL).
  const sb = assistStartRect();
  const hovS = clickedRect(sb.x, sb.y, sb.w, sb.h);
  ctx.fillStyle = hovS ? '#27ae60' : '#1e6840';
  ctx.fillRect(sb.x, sb.y, sb.w, sb.h);
  ctx.strokeStyle = '#2ecc71';
  ctx.lineWidth = 1;
  ctx.strokeRect(sb.x + 0.5, sb.y + 0.5, sb.w - 1, sb.h - 1);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px monospace';
  ctx.fillText('START', sb.x + sb.w / 2, sb.y + 15);

  // Back button
  const bb = backButtonRect();
  const hovB = clickedRect(bb.x, bb.y, bb.w, bb.h);
  ctx.fillStyle = hovB ? '#34495e' : '#1a242f';
  ctx.fillRect(bb.x, bb.y, bb.w, bb.h);
  ctx.strokeStyle = '#7f8c8d';
  ctx.lineWidth = 1;
  ctx.strokeRect(bb.x + 0.5, bb.y + 0.5, bb.w - 1, bb.h - 1);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 8px monospace';
  ctx.fillText('< BACK', bb.x + bb.w / 2, bb.y + 11);

  // ---- Skill-pick dropdown — shown on top while hovering an unlocked X/C/B/V slot.
  // Click an entry to assign it (or "— EMPTY —" to clear); replaces the old cycle.
  if(loadoutMenuSlot >= 1){
    const slot = ['f','x','c','b','v'][loadoutMenuSlot];
    const rects = loadoutMenuRects(loadoutMenuSlot);
    const first = rects[0], last = rects[rects.length - 1];
    const panelH = (last.y + last.h) - first.y;
    ctx.fillStyle = '#0a0d14';
    ctx.fillRect(first.x - 1, first.y - 1, first.w + 2, panelH + 2);
    ctx.strokeStyle = '#aeb6bf';
    ctx.lineWidth = 1;
    ctx.strokeRect(first.x - 0.5, first.y - 0.5, first.w + 1, panelH + 1);
    for(const rr of rects){
      const sk = rr.id ? SKILLS[rr.id] : null;
      const cur = (profile.loadout[slot] || null) === rr.id;
      const hov = clickedRect(rr.x, rr.y, rr.w, rr.h);
      ctx.fillStyle = hov ? '#2a3a4d' : (cur ? '#16261a' : '#0f1622');
      ctx.fillRect(rr.x, rr.y, rr.w, rr.h);
      ctx.fillStyle = sk ? sk.color : '#7f8c8d';
      ctx.font = 'bold 7px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(sk ? sk.label : '— EMPTY —', rr.x + rr.w / 2, rr.y + 9);
    }
  }
}

function handleAssistantSelect(){
  const unlocked = unlockedSlots();
  // ---- Hover: open the skill-pick dropdown for the unlocked X/C/B/V slot under the
  // cursor; keep it open while the cursor is over that slot OR its dropdown; else close.
  // An already-open menu wins so a long (shifted-up) list can't flicker between slots.
  const overOpenMenu = loadoutMenuSlot >= 1 &&
    loadoutMenuRects(loadoutMenuSlot).some(rr => clickedRect(rr.x, rr.y, rr.w, rr.h));
  if(!overOpenMenu){
    let hoverSlot = -1;
    for(let i = 1; i < 5; i++){                         // skip F (index 0, locked to HEAL)
      const slot = ['f','x','c','b','v'][i];
      if(SLOT_ORDER.indexOf(slot) >= unlocked) continue; // locked by level
      const r = loadoutSlotRect(i);
      if(clickedRect(r.x, r.y, r.w, r.h)){ hoverSlot = i; break; }
    }
    loadoutMenuSlot = hoverSlot;                         // -1 when over neither slot nor menu
  }

  if(!mouse.clicked) return;
  const bb = backButtonRect();
  if(clickedRect(bb.x, bb.y, bb.w, bb.h)){
    state = STATE.CHARACTER_SELECT; stateTime = 0; loadoutMenuSlot = -1; passiveMenuSlot = -1; return;
  }
  // Dropdown pick (takes priority — it's drawn on top of everything else).
  if(loadoutMenuSlot >= 1){
    const slot = ['f','x','c','b','v'][loadoutMenuSlot];
    for(const rr of loadoutMenuRects(loadoutMenuSlot)){
      if(!clickedRect(rr.x, rr.y, rr.w, rr.h)) continue;
      const next = rr.id;                              // null = clear the slot
      // No duplicate skill across keys: clear any other slot already holding `next`.
      if(next){ for(const s of SLOT_ORDER){ if(s !== slot && profile.loadout[s] === next) profile.loadout[s] = null; } }
      profile.loadout[slot] = next;
      saveProfile();
      if(sfx.pickup) sfx.pickup();
      loadoutMenuSlot = -1;
      return;
    }
  }
  // Assistant equip toggles (0..2 from owned; the default is removable).
  const owned = ownedAssistantList();
  for(let i = 0; i < owned.length; i++){
    const r = assistCardRect(i, owned.length);
    if(clickedRect(r.x, r.y, r.w, r.h)){
      const key = owned[i];
      const idx = profile.equippedAssistants.indexOf(key);
      if(idx >= 0) profile.equippedAssistants.splice(idx, 1);
      else if(profile.equippedAssistants.length < 2) profile.equippedAssistants.push(key);
      else { profile.equippedAssistants.shift(); profile.equippedAssistants.push(key); }
      saveProfile();
      if(sfx.pickup) sfx.pickup();
      return;
    }
  }
  // START — always allowed (an empty loadout is just HEAL; 0 assistants is fine).
  const sb = assistStartRect();
  if(clickedRect(sb.x, sb.y, sb.w, sb.h)){ loadoutMenuSlot = -1; startSelectedRun(); }
}

function startSelectedRun(){
  initAudio();
  score = 0;
  selectedAssistants = profile.equippedAssistants.slice();  // seed the run from the profile
  player = createPlayer(selectedChar);
  entities = [player];
  allies = [];
  spawnSelectedAssistants();
  particles = [];
  startLevel(selectedLevel);
}

// Instantiate the chosen assistants around the player and register them.
function spawnSelectedAssistants(){
  allies = [];
  selectedAssistants.forEach((key, idx) => {
    const a = createAssistant(key);
    positionAllyByPlayer(a, idx);
    allies.push(a);
    entities.push(a);
  });
}

// Place an ally just to the side of the player (alternating left/right).
function positionAllyByPlayer(a, idx){
  const off = idx === 0 ? -16 : 16;
  a.x = (player ? player.x : W / 2) + off;
  a.y = (player ? player.y : H / 2);
}

function levelCompleteButtons(){
  const bw = 96, bh = 22, gap = 10;
  const y = H / 2 + 36;
  const xs = Math.floor((W - (bw * 2 + gap)) / 2);
  return {
    leave: { x: xs, y, w: bw, h: bh },
    cont:  { x: xs + bw + gap, y, w: bw, h: bh }
  };
}

function drawLevelComplete(){
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = 'bold 20px monospace';
  ctx.fillStyle = '#27ae60';
  ctx.fillText('LEVEL ' + (levelIdx + 1) + ' CLEAR!', W/2, H/2 - 24);
  ctx.font = 'bold 10px monospace';
  ctx.fillStyle = '#fff';
  ctx.fillText('SCORE: ' + score, W/2, H/2);
  ctx.fillStyle = '#bdc3c7';
  const nextIdx = levelIdx + 1;
  if(nextIdx < LEVELS.length){
    ctx.fillText('NEXT: LEVEL ' + (nextIdx + 1) + ' — ' + (LEVELS[nextIdx].bossName || BOSS_NAMES[LEVELS[nextIdx].boss] || 'BOSS'), W/2, H/2 + 16);
  }
  // Two buttons
  const btns = levelCompleteButtons();
  const hovL = clickedRect(btns.leave.x, btns.leave.y, btns.leave.w, btns.leave.h);
  const hovC = clickedRect(btns.cont.x, btns.cont.y, btns.cont.w, btns.cont.h);

  ctx.font = 'bold 10px monospace';
  ctx.fillText('LEAVE', btns.leave.x + btns.leave.w / 2, btns.leave.y + 15);

  ctx.fillStyle = hovC ? '#27ae60' : '#1e6840';
  ctx.fillRect(btns.cont.x, btns.cont.y, btns.cont.w, btns.cont.h);
  ctx.strokeStyle = '#52be80';

  ctx.fillStyle = '#fff';

}

}

// ============================================================
// MAIN LOOP
// ============================================================
let lastT = performance.now();
function loop(t){
  const dt = Math.min(0.033, (t - lastT) / 1000);
  lastT = t;
  // Hard safety cap: if some pathological path explodes the entity list,
  // strip dead entries and clamp to a sane size so the per-frame work stays bounded.
  try {
    if(entities && entities.length > 600){
      console.warn('[shooter] entity count overflow:', entities.length, '— pruning');
      entities = entities.filter(e => !e.dead);
      if(entities.length > 400){
        const keep = entities.filter(e => e.type === 'player' || isAlly(e));
        const rest = entities.filter(e => !(e.type === 'player' || isAlly(e))).slice(-380);
        entities = keep.concat(rest);
      }
    }
  } catch(err){ console.error('[shooter] prune error:', err); }
  // Update and draw are wrapped separately. If update throws (e.g. on an
  // unexpected entity shape), draw still runs so the canvas keeps animating
  // instead of looking dead-frozen.
  try { update(dt); }
  catch(err){ console.error('[shooter] update error:', err); }
  try { draw(); }
  catch(err){ console.error('[shooter] draw error:', err); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
